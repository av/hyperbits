<!doctype html>
<html lang="en" data-composition-variables='[{"id":"title","type":"string","label":"Title","default":"hyperbits"},{"id":"color","type":"color","label":"Text color","default":"#f8fafc"},{"id":"background","type":"color","label":"Background","default":"#020617"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="public/hyperbits.iife.js" data-hyperbits-src="public/hyperbits.iife.js" data-hyperbits-local="public/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #020617;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #020617;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        z-index: 2;
      }
      #hero-title {
        color: #f8fafc;
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 1.05;
        font-size: 10vmin;
      }
      #hero-sub {
        color: #94a3b8;
        margin-top: 0.35em;
        font-weight: 500;
        font-size: 3.2vmin;
      }
      .scene-label {
        color: #f8fafc;
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 1;
        font-size: 10vmin;
        text-shadow: 0 0.06em 0.28em rgba(2, 6, 23, 0.55);
      }
      #scene3d-label-wrap {
        position: absolute;
        top: 6%;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
        pointer-events: none;
      }
      .word-plane {
        color: #f8fafc;
        font-weight: 800;
        letter-spacing: 0.06em;
        white-space: nowrap;
        font-size: 8vmin;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      #code-panel {
        width: 70%;
        background-color: #0b1220;
        border: 1px solid #1f2937;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      .hyperbits-code {
        margin: 0;
        color: #e5e7eb;
        white-space: pre;
      }
      .hyperbits-code-line {
        display: block;
      }
      .hyperbits-code-gutter {
        display: inline-block;
        width: 3em;
        color: #64748b;
      }
      .token.keyword { color: #c084fc; }
      .token.function { color: #38bdf8; }
      .token.string { color: #86efac; }
      .token.boolean { color: #fbbf24; }
      #chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        width: 78%;
      }
      .chip {
        background-color: #1e293b;
        color: #e2e8f0;
        border-radius: 999px;
        font-weight: 700;
        font-size: 4vmin;
        border: 2px solid #38bdf8;
      }
      #cta {
        font-weight: 800;
        font-size: 3.4vmin;
        margin-top: 0.8em;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="feature-showcase"
      data-start="0"
      data-duration="38"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="38" style="position:absolute;inset:0;background-color:#020617"></div>
      <div id="text-scene" class="scene clip" data-start="0" data-duration="6">
        <div class="stack">
          <h1 id="hero-title">hyperbits</h1>
          <p id="hero-sub">Ready-made motion for HyperFrames</p>
        </div>
      </div>
      <div id="gradient-scene" class="scene clip" data-start="6" data-duration="6">
        <h2 id="gradient-label" class="scene-label">gradient</h2>
      </div>
      <div id="particles-scene" class="scene clip" data-start="12" data-duration="6">
        <canvas id="stage"></canvas>
        <h2 id="particles-label" class="scene-label">particles</h2>
      </div>
      <div id="scene" class="scene clip" data-start="18" data-duration="8">
        <div id="scene3d-label-wrap">
          <h2 id="scene3d-label" class="scene-label">scene3d</h2>
        </div>
      </div>
      <div id="code-scene" class="scene clip" data-start="26" data-duration="6">
        <div class="stack" style="width:100%">
          <h2 id="code-label" class="scene-label">code</h2>
          <div id="code-panel"></div>
        </div>
      </div>
      <div id="chips-scene" class="scene clip" data-start="32" data-duration="6">
        <div class="stack">
          <div id="chips">
            <div class="chip">text</div>
            <div class="chip">stagger</div>
            <div class="chip">gradient</div>
            <div class="chip">particles</div>
            <div class="chip">scene3d</div>
            <div class="chip">code</div>
          </div>
          <p id="cta">npx hyperbits add fade-in</p>
        </div>
      </div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const title = document.getElementById("hero-title");
        const sub = document.getElementById("hero-sub");
        const gradientLabel = document.getElementById("gradient-label");
        const particlesLabel = document.getElementById("particles-label");
        const scene3dLabel = document.getElementById("scene3d-label");
        const codeLabel = document.getElementById("code-label");
        const panel = document.getElementById("code-panel");
        const cta = document.getElementById("cta");
        const scene = document.getElementById("scene");
        const canvas = document.getElementById("stage");
        const chips = Array.from(document.querySelectorAll(".chip"));

        document.documentElement.style.backgroundColor = vars.background;
        document.body.style.backgroundColor = vars.background;
        bg.style.backgroundColor = vars.background;

        title.textContent = vars.title;
        title.style.color = vars.color;
        title.style.fontSize = view.vmin * 10 + "px";
        sub.style.fontSize = view.vmin * 3.2 + "px";

        const labels = [gradientLabel, particlesLabel, scene3dLabel, codeLabel];
        for (let i = 0; i < labels.length; i += 1) {
          labels[i].style.color = vars.color;
          labels[i].style.fontSize = view.vmin * 10 + "px";
        }

        const chipsWrap = document.getElementById("chips");
        chipsWrap.style.gap = view.vmin * 1.8 + "px";
        for (let i = 0; i < chips.length; i += 1) {
          chips[i].style.color = vars.color;
          chips[i].style.borderColor = vars.color;
          chips[i].style.fontSize = view.vmin * 4 + "px";
          chips[i].style.padding = view.vmin * 1.8 + "px " + view.vmin * 3.4 + "px";
        }
        cta.style.color = vars.color;
        cta.style.fontSize = view.vmin * 3.4 + "px";
        cta.style.marginTop = view.vmin * 3.2 + "px";

        panel.style.padding = view.vmin * 3.4 + "px " + view.vmin * 4.2 + "px";
        panel.style.marginTop = view.vmin * 2.4 + "px";
        const sample = "const view = hyperbits.viewport(root);\nconst chars = hyperbits.splitText(title, \"chars\");\nhyperbits.stagger(chars, {\n  opacity: [0, 1],\n  y: [40, 0],\n  duration: 0.5,\n  stagger: 0.04\n}, timeline);";
        const block = hyperbits.createCodeBlock(panel, {
          code: sample,
          language: "javascript",
          showLineNumbers: true,
        });
        block.style.fontSize = view.vmin * 2.6 + "px";
        block.style.lineHeight = "1.55";
        block.style.textAlign = "left";

        canvas.width = view.width;
        canvas.height = view.height;
        const simulator = hyperbits.createParticles({
          fps: 30,
          spawners: [{
            id: "field",
            rate: 1.4,
            burst: 72,
            delayFrame: 12 * 30,
            startFrame: 50,
            max: 180,
            position: { x: view.width / 2, y: view.height / 2 },
            area: { width: view.width, height: view.height },
            velocity: { x: 0, y: -1.1, varianceX: 1.6, varianceY: 0.9 },
            lifespan: 90,
            lifespanVariance: 24,
          }],
          behaviors: [
            { id: "wiggle", handler: hyperbits.createWiggle(1.8, 0.2, 0.7) },
            { id: "drag", handler: hyperbits.createDrag(0.99) },
            { id: "fade", handler: hyperbits.createOpacityOverLife([0, 1, 0]) },
            { id: "scale", handler: hyperbits.createScaleOverLife(0.55, 1.25, 0.2, 0.25) },
          ],
        });

        const wordList = ["MOTION", "DEPTH", "SCALE", "LIGHT", "TIME", "SPACE", "FRAME", "SEEK"];
        const wordElements = [];
        for (let i = 0; i < wordList.length; i += 1) {
          const node = document.createElement("div");
          node.className = "word-plane";
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          node.textContent = wordList[i];
          node.style.color = vars.color;
          node.style.fontSize = view.vmin * hyperbits.randomFloat("fs-" + i, 7, 11) + "px";
          wordElements.push({
            element: node,
            x: hyperbits.randomFloat("x-" + i, -view.vmin * 44, view.vmin * 44),
            y: hyperbits.randomFloat("y-" + i, -view.vmin * 26, view.vmin * 26),
            z: hyperbits.randomFloat("z-" + i, -view.vmin * 18, view.vmin * 96),
            rotateY: hyperbits.randomFloat("ry-" + i, -28, 28),
          });
        }
        const scene3d = hyperbits.createScene3D(scene, {
          perspective: 1100,
          transitionDuration: 1.7,
          easing: "easeInOutCubic",
          steps: [
            { id: "wait", duration: 18, rotateY: -22, rotateX: 8, z: view.vmin * -8 },
            { id: "fly", duration: 2.7, rotateY: 26, rotateX: -8, z: view.vmin * 52 },
            { id: "close", duration: 2.7, rotateY: -16, rotateX: 14, z: view.vmin * 18 },
            { id: "settle", duration: 2.6, rotateY: 10, rotateX: 4, z: view.vmin * 30 },
          ],
          elements: wordElements,
        });
        scene.style.position = "absolute";
        scene.style.inset = "0";
        scene3d.canvas.style.zIndex = "0";

        const gradientFrom = "linear-gradient(155deg, " + vars.background + " 0%, #1e3a8a 48%, #0f172a 100%)";
        const gradientTo = "linear-gradient(25deg, #38bdf8 0%, #7c3aed 52%, " + vars.color + " 100%)";
        const gradient = hyperbits.gradientProxy(bg, [gradientFrom, gradientTo]);

        const timeline = gsap.timeline({ paused: true });

        const chars = hyperbits.splitText(title, "chars");
        hyperbits.stagger(
          chars,
          {
            opacity: [0, 1],
            y: [view.vmin * 3.2, 0],
            duration: 0.55,
            stagger: 0.04,
            ease: "power3.out",
            at: 0,
          },
          timeline,
        );
        const subTl = gsap.timeline();
        const subWords = hyperbits.splitText(sub, "words");
        hyperbits.stagger(
          subWords,
          {
            opacity: [0, 1],
            y: [view.vmin * 1.6, 0],
            duration: 0.45,
            stagger: 0.08,
            ease: "power2.out",
            at: 0,
          },
          subTl,
        );
        timeline.add(subTl, 0.85);
        timeline.to(title, { y: -view.vmin * 1.4, duration: 4.6, ease: "sine.inOut" }, 1.4);

        timeline.fromTo(
          gradient.proxy,
          { progress: 0 },
          { progress: 1, duration: 6, ease: "sine.inOut", immediateRender: false },
          6,
        );
        timeline.fromTo(
          gradientLabel,
          { opacity: 0, y: view.vmin * 4, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" },
          6.05,
        );
        timeline.to(gradientLabel, { y: -view.vmin * 2.2, scale: 1.05, duration: 5.1, ease: "sine.inOut" }, 6.9);

        timeline.fromTo(
          particlesLabel,
          { opacity: 0, y: view.vmin * 4, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.75, ease: "power3.out" },
          12.05,
        );
        timeline.to(particlesLabel, { y: -view.vmin * 2, duration: 5.1, ease: "sine.inOut" }, 12.85);

        timeline.fromTo(
          scene3dLabel,
          { opacity: 0, y: view.vmin * 4, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" },
          18.05,
        );
        timeline.to(scene3dLabel, { y: -view.vmin * 1.6, duration: 7.1, ease: "sine.inOut" }, 18.9);

        timeline.fromTo(
          codeLabel,
          { opacity: 0, y: view.vmin * 3 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          26.05,
        );
        timeline.fromTo(
          panel,
          { opacity: 0, y: view.vmin * 3.5 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          26.2,
        );
        timeline.to(panel, { y: -view.vmin * 1.2, duration: 5.1, ease: "sine.inOut" }, 27);

        const chipTl = gsap.timeline();
        hyperbits.stagger(
          chips,
          {
            opacity: [0, 1],
            y: [view.vmin * 5.5, 0],
            scale: [0.82, 1],
            duration: 0.55,
            stagger: 0.1,
            ease: "power3.out",
          },
          chipTl,
        );
        timeline.add(chipTl, 32.1);
        timeline.fromTo(
          cta,
          { opacity: 0, y: view.vmin * 2 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
          33.1,
        );
        timeline.to(chips, { y: -view.vmin * 1.1, duration: 4.4, ease: "sine.inOut", stagger: 0.06 }, 33.4);

        hyperbits.bind(timeline, canvas, simulator, {
          color: vars.color,
          size: view.vmin * 1.5,
          glow: 2.4,
          shape: "circle",
        });
        scene3d.bind(timeline);

        const previousUpdate = timeline.eventCallback("onUpdate");
        timeline.eventCallback("onUpdate", function () {
          if (typeof previousUpdate === "function") previousUpdate.call(timeline);
          const t = timeline.time();
          if (t >= 6 && t < 12) {
            gradient.apply();
          } else {
            bg.style.background = "";
            bg.style.backgroundImage = "none";
            bg.style.backgroundColor = vars.background;
          }
          hyperbits.applyLineReveal(panel, t, { duration: 0.32, stagger: 0.14, delay: 26.35 });
        });

        timeline.to({}, { duration: 38 }, 0);
        registerTimeline("feature-showcase", timeline);

      })();
    </script>
  </body>
</html>
