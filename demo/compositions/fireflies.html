<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Firefly color","default":"#ccff00"},{"id":"background","type":"color","label":"Background","default":"#100f0f"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="public/hyperbits.iife.js" data-hyperbits-src="public/hyperbits.iife.js" data-hyperbits-local="public/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #ccff00;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="fireflies"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;width:100%;height:100%;z-index:1"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const simulator = hyperbits.createParticles({
          fps: 30,
          spawners: [{
            id: "spawner-0",
            rate: 0.2,
            max: 200,
            position: { x: view.width / 2, y: view.height / 2 },
            area: { width: view.width, height: view.height },
            velocity: { x: 0.5, y: 0.5, varianceX: 1, varianceY: 1 },
            lifespan: 100,
          }],
          behaviors: [
            { id: "wiggle", handler: hyperbits.createWiggle(2, 0.1, 1) },
            { id: "fade", handler: hyperbits.createOpacityOverLife([0, 1, 0]) },
          ],
        });
        const timeline = gsap.timeline({ paused: true });
        hyperbits.bind(timeline, canvas, simulator, {
          color: vars.color,
          size: view.vmin,
          glow: 5,
          glowStops: [[0, 0.55], [0.43, 0.3], [0.71, 0.1], [1, 0]],
          shape: "circle",
        });
        timeline.to({}, { duration: 10 }, 0);
        registerTimeline("fireflies", timeline);

      })();
    </script>
  </body>
</html>
