<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Accent","default":"#3b82f6"},{"id":"background","type":"color","label":"Background","default":"#0f172a"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="public/hyperbits.iife.js" data-hyperbits-src="public/hyperbits.iife.js" data-hyperbits-local="public/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0f172a;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3vmin;
        position: relative;
        z-index: 1;
      }
      .box {
        width: 32vmin;
        height: 32vmin;
        border-radius: 2vmin;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="staggered-fade-in"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="3" style="position:absolute;inset:0;background-color:#0f172a"></div>
      <div id="row" class="clip" data-start="0" data-duration="3">
        <div class="box" data-color="#3b82f6"></div>
        <div class="box" data-color="#ef4444"></div>
        <div class="box" data-color="#10b981"></div>
        <div class="box" data-color="#f59e0b"></div>
        <div class="box" data-color="#8b5cf6"></div>
      </div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const row = document.getElementById("row");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        row.style.gap = view.vmin * 3 + "px";
        const boxes = Array.from(row.querySelectorAll(".box"));
        for (let index = 0; index < boxes.length; index += 1) {
          const box = boxes[index];
          box.style.width = view.vmin * 32 + "px";
          box.style.height = view.vmin * 32 + "px";
          box.style.borderRadius = view.vmin * 1.6 + "px";
          box.style.backgroundColor = index === 0 ? vars.color : box.getAttribute("data-color");
        }
        const timeline = gsap.timeline({ paused: true });
        hyperbits.stagger(boxes, { opacity: [0, 1], y: [view.vmin * 10, 0], duration: 1, stagger: 5 / 30, ease: "easeOutCubic" }, timeline);
        registerTimeline("staggered-fade-in", timeline);

      })();
    </script>
  </body>
</html>
