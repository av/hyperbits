<!doctype html>
<html lang="en" data-composition-variables='[{"id":"text","type":"string","label":"First word","default":"Control"},{"id":"color","type":"color","label":"Text color","default":"#f8fafc"},{"id":"background","type":"color","label":"Background","default":"#0f172a"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="public/hyperbits.iife.js" data-hyperbits-src="public/hyperbits.iife.js" data-hyperbits-local="public/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0f172a;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .step {
        color: #f8fafc;
        font-weight: 800;
        letter-spacing: -0.04em;
        white-space: nowrap;
        line-height: 1;
        font-size: 14vmin;
      }
      .step[data-step-active="false"] {
        opacity: 0;
      }
      .step[data-step-active="true"] {
        opacity: 1;
      }
      .panel {
        background-color: #f8fafc;
        color: #0f172a;
        padding: 0.12em 0.42em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="3d-basic"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="5" style="position:absolute;inset:0;background-color:#0f172a"></div>
      <div id="scene"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const sceneEl = document.getElementById("scene");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        bg.setAttribute("data-color", vars.color);

        function heading(text, className) {
          const node = document.createElement("h1");
          node.className = className || "step";
          node.textContent = text;
          node.style.fontSize = view.vmin * 14 + "px";
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          return node;
        }

        const one = heading(String(vars.text));
        one.style.color = vars.color;
        const two = heading("Camera", "step panel");
        two.style.color = "#0f172a";
        const three = heading("Action");
        three.style.color = vars.color;

        const scene = hyperbits.createScene3D(sceneEl, {
          perspective: 1000,
          transitionDuration: 1.4,
          stepDuration: 1.7,
          easing: "easeInOutCubic",
          steps: [
            { id: "1", x: 0, y: 0, z: 0, duration: 1.7, element: one },
            { id: "2", x: 0, y: view.vmin * 8, z: view.vmin * 80, duration: 1.7, element: two },
            { id: "3", x: 0, y: view.vmin * 16, z: view.vmin * 160, duration: 1.6, element: three },
          ],
        });
        sceneEl.style.position = "absolute";
        sceneEl.style.inset = "0";
        sceneEl.style.zIndex = "1";

        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        timeline.to({}, { duration: 5 }, 0);
        registerTimeline("3d-basic", timeline);

      })();
    </script>
  </body>
</html>
