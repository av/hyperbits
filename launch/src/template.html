<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>hyperbits — launch</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="public/hyperbits.iife.js"></script>
    <style>
      @font-face { font-family: "Geist"; font-weight: 500; src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.3.0/files/geist-sans-latin-500-normal.woff2) format("woff2"); }
      @font-face { font-family: "Geist"; font-weight: 600; src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.3.0/files/geist-sans-latin-600-normal.woff2) format("woff2"); }
      @font-face { font-family: "Geist"; font-weight: 700; src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.3.0/files/geist-sans-latin-700-normal.woff2) format("woff2"); }
      @font-face { font-family: "Geist"; font-weight: 800; src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.3.0/files/geist-sans-latin-800-normal.woff2) format("woff2"); }
      @font-face { font-family: "Geist Mono"; font-weight: 400; src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.3.0/files/geist-mono-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "Geist Mono"; font-weight: 500; src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.3.0/files/geist-mono-latin-500-normal.woff2) format("woff2"); }
      :root {
        --ink: #fffcf0;
        --muted: #878580;
        --black: #100f0f;
        --surface: #1c1b1a;
        --line: #343331;
        --accent: #ec8b49;
        --inspect: #4385be;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background-color: #100f0f; }
      #launch-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Geist", sans-serif; color: #fffcf0; }
      #launch-bg { position: absolute; inset: 0; background-color: #100f0f; background-image: radial-gradient(ellipse 70% 60% at 50% 50%, #1c1b1a 0%, #100f0f 100%); }
      #launch-stage { position: absolute; inset: 0; perspective: 1200px; perspective-origin: 50% 50%; overflow: hidden; }
      #launch-world { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
      #launch-world > * { position: absolute; transform-style: preserve-3d; backface-visibility: hidden; }
      .lv-tile { left: -240px; top: -135px; width: 480px; height: 270px; }
      .lv-screen { position: absolute; inset: 0; overflow: hidden; border-radius: 12px; border: 6px solid #343331; background-color: #100f0f; }
      .lv-poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .lv-host { position: absolute; left: -6px; top: -6px; width: 1920px; height: 1080px; transform: scale(0.25); transform-origin: 0 0; }
      .lv-shade { position: absolute; inset: 0; background-color: #100f0f; opacity: 0; }
      .lv-tint { position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen; }
      .lv-inspect { position: absolute; inset: -10px; opacity: 0; }
      .lv-outline { position: absolute; inset: 0; border: 4px solid #4385be; background-color: rgba(67, 133, 190, 0.16); border-radius: 14px; }
      .lv-tag { position: absolute; left: 0; bottom: 100%; margin-bottom: 8px; padding: 6px 12px; border-radius: 6px; background-color: #4385be; color: #fffcf0; font: 500 26px/1 "Geist Mono", monospace; white-space: nowrap; }
      .lv-tag b { font-weight: 500; color: #100f0f; margin-right: 12px; }
      .lv-dims { position: absolute; right: 0; top: 100%; margin-top: 8px; padding: 5px 10px; border-radius: 6px; background-color: #100f0f; color: #fffcf0; font: 400 22px/1 "Geist Mono", monospace; white-space: nowrap; }
      .lv-wordmark { left: 0; top: 0; width: 0; height: 0; }
      .lv-glyph { position: absolute; font-weight: 700; color: #fffcf0; line-height: 1; white-space: pre; }
      .lv-shape { position: absolute; }
      .lv-terminal { left: -650px; top: -410px; width: 1300px; height: 820px; border-radius: 28px; background-color: #1c1b1a; border: 3px solid #343331; overflow: hidden; }
      .lv-terminal .lv-bar { height: 76px; display: flex; align-items: center; gap: 14px; padding: 0 30px; border-bottom: 3px solid #282726; font: 500 26px/1 "Geist Mono", monospace; color: #878580; }
      .lv-terminal .lv-dot { width: 20px; height: 20px; border-radius: 50%; background-color: #403e3c; }
      .lv-terminal .lv-title { margin-left: 18px; }
      .lv-terminal .lv-body { padding: 36px 44px; font: 400 36px/1.5 "Geist Mono", monospace; color: #cecdc3; white-space: pre; }
      .lv-terminal .lv-line { height: 54px; }
      .lv-terminal .lv-prompt { color: #ec8b49; }
      .lv-terminal .lv-call { color: #fffcf0; }
      .lv-terminal .lv-call i { font-style: normal; color: #3aa99f; }
      .lv-terminal .lv-dim { color: #878580; }
      .lv-terminal .lv-hit { color: #fffcf0; }
      .lv-terminal .lv-ok { color: #879a39; }
      .lv-cursor { display: inline-block; width: 0.6em; height: 1.1em; vertical-align: -0.2em; background-color: #ec8b49; }
      .lv-lockup-outline { left: 0; top: 0; overflow: visible; }
      #launch-hud { position: absolute; inset: 0; pointer-events: none; }
      #launch-hud > * { position: absolute; }
      .lv-hook { left: 0; right: 0; top: 50%; text-align: center; font-weight: 800; font-size: 150px; letter-spacing: -0.045em; line-height: 1; transform: translateY(-50%); perspective: 900px; }
      .lv-hook span { display: inline-block; transform-origin: 50% 80%; }
      .lv-hook .lv-em { color: #ec8b49; }
      .lv-sub { font: 500 46px/1.2 "Geist", sans-serif; color: #b7b5ac; letter-spacing: -0.01em; }
      .lv-headline { left: 0; right: 0; text-align: center; font-weight: 700; font-size: 84px; letter-spacing: -0.035em; line-height: 1.05; }
      .lv-headline .lv-em { color: #ec8b49; }
      .lv-legend { left: 50%; bottom: 56px; width: 1500px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 18px; transform: translateX(-50%); }
      .lv-legend .lv-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-radius: 999px; background-color: rgba(28, 27, 26, 0.92); border: 2px solid #343331; font: 500 26px/1 "Geist", sans-serif; white-space: nowrap; }
      .lv-legend .lv-swatch { width: 16px; height: 16px; border-radius: 4px; }
      .lv-legend .lv-count { font-family: "Geist Mono", monospace; color: #878580; }
      .lv-total { left: 50%; top: 70px; transform: translateX(-50%); font-weight: 700; font-size: 64px; letter-spacing: -0.03em; white-space: nowrap; }
      .lv-total .lv-num { font-family: "Geist Mono", monospace; font-weight: 500; color: #ec8b49; }
      .lv-dive-label { left: 72px; bottom: 64px; display: flex; align-items: center; gap: 18px; padding: 16px 26px; border-radius: 16px; background-color: rgba(16, 15, 15, 0.86); font: 500 36px/1 "Geist Mono", monospace; white-space: nowrap; }
      .lv-dive-label .lv-swatch { width: 20px; height: 20px; border-radius: 5px; }
      .lv-dive-label .lv-cat { font-family: "Geist", sans-serif; color: #b7b5ac; }
      .lv-chips { left: 0; right: 0; bottom: 70px; display: flex; justify-content: center; gap: 24px; }
      .lv-chip { padding: 18px 30px; border-radius: 999px; background-color: #1c1b1a; border: 2px solid #403e3c; font: 500 34px/1 "Geist Mono", monospace; white-space: nowrap; }
      .lv-chip i { font-style: normal; color: #ec8b49; margin-right: 12px; }
      .lv-cta { left: 0; right: 0; text-align: center; }
      .lv-cta .lv-url { font: 600 58px/1 "Geist", sans-serif; color: #ec8b49; letter-spacing: -0.02em; }
      .lv-cta .lv-repo { margin-top: 18px; font: 500 34px/1 "Geist Mono", monospace; color: #cecdc3; }
      .lv-cta .lv-meta { margin-top: 26px; font: 500 26px/1 "Geist", sans-serif; color: #878580; }
      .lv-scrim-top { left: 0; right: 0; top: 0; height: 300px; background-image: linear-gradient(180deg, rgba(16, 15, 15, 0.92) 0%, rgba(16, 15, 15, 0.6) 55%, rgba(16, 15, 15, 0) 100%); }
      .lv-scrim-bottom { left: 0; right: 0; bottom: 0; height: 320px; background-image: linear-gradient(0deg, rgba(16, 15, 15, 0.92) 0%, rgba(16, 15, 15, 0.6) 55%, rgba(16, 15, 15, 0) 100%); }
      .lv-wordrow { display: flex; white-space: pre; font-weight: 700; font-size: 300px; letter-spacing: -0.045em; line-height: 1; }
      .lv-wordsub { margin-top: 26px; padding-left: 14px; font: 500 60px/1.2 "Geist", sans-serif; color: #b7b5ac; letter-spacing: -0.01em; white-space: nowrap; }
      .lv-vignette { inset: 0; background-image: radial-gradient(ellipse 60% 45% at 50% 50%, rgba(16, 15, 15, 0.82) 0%, rgba(16, 15, 15, 0) 100%); }
    </style>
  </head>
  <body>
    <div id="launch-root" data-composition-id="launch" data-start="0" data-duration="38" data-width="1920" data-height="1080" data-fps="60">
      <div id="launch-bg" class="clip" data-start="0" data-duration="38"></div>
      <div id="launch-stage" class="clip" data-start="0" data-duration="38">
        <div id="launch-world">
        <!--TILES-->
          <div class="lv-wordmark" id="wordmark"></div>
          <svg class="lv-lockup-outline" id="lockup-outline" width="1" height="1" viewBox="0 0 1 1"></svg>
          <div class="lv-terminal" id="terminal">
            <div class="lv-bar"><span class="lv-dot"></span><span class="lv-dot"></span><span class="lv-dot"></span><span class="lv-title">agent — ~/my-launch-video</span></div>
            <div class="lv-body" id="terminal-body"></div>
          </div>
        </div>
      </div>
      <div id="launch-hud" class="clip" data-start="0" data-duration="38">
        <div class="lv-vignette" id="vignette"></div>
        <div class="lv-scrim-top" id="scrim-top"></div>
        <div class="lv-scrim-bottom" id="scrim-bottom"></div>
        <div class="lv-hook" id="hook"></div>
        <div class="lv-total" id="total"></div>
        <div class="lv-legend" id="legend"></div>
        <div class="lv-headline" id="inspect-headline" style="top: 64px"></div>
        <div class="lv-dive-label" id="dive-label"><span class="lv-swatch"></span><span class="lv-name"></span><span class="lv-cat"></span></div>
        <div class="lv-headline" id="agent-headline" style="top: 64px"></div>
        <div class="lv-chips" id="chips"></div>
        <div class="lv-cta" id="cta" style="bottom: 70px"></div>
      </div>
    </div>
    <script>
      /*LAUNCH_DATA*/
    </script>
    <script>
/*LAUNCH_SCRIPT*/
    </script>
  </body>
</html>
