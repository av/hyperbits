<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #000000;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #000000;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #000000;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { background-color: #000000; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="conic-gradient"
      data-start="0"
      data-duration="2"
      data-width="1920"
      data-height="1080"
    >

    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const root = document.getElementById("root");
        const proxy = hyperbits.gradientProxy(
          root,
          ["conic-gradient(from 0deg, #000000, #009900)", "conic-gradient(from 359deg, #000000, #009900)"],
          { shortestAngle: false },
        );
        const timeline = gsap.timeline({ paused: true });
        timeline.fromTo(proxy.proxy, { progress: 0 }, { progress: 1, duration: 2, ease: "none", onUpdate: proxy.apply }, 0);
        registerTimeline("conic-gradient", timeline);

      })();
    </script>
  </body>
</html>
