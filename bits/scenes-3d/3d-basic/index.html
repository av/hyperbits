<!doctype html>
<html lang="en" data-composition-variables='[{"id":"text","type":"string","label":"First word","default":"Control"},{"id":"color","type":"color","label":"Text color","default":"#fcc192"},{"id":"background","type":"color","label":"Background","default":"#100f0f"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #fcc192;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Geist Sans", Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .step {
        color: #fcc192;
        font-weight: 700;
        white-space: nowrap;
        font-size: 8vmin;
        opacity: 0;
      }
      .panel {
        background-color: #ffffff;
        color: #000000;
        padding: 1vmin 4vmin;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="3d-basic"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="5" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <div id="scene"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const sceneEl = document.getElementById("scene");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;

        function heading(text, className) {
          const node = document.createElement("h1");
          node.className = className || "step";
          node.textContent = text;
          node.style.fontSize = view.vmin * 8 + "px";
          node.style.opacity = "0";
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          return node;
        }

        const one = heading(String(vars.text));
        one.style.color = vars.color;
        const two = heading("Camera", "step panel");
        two.style.padding = view.vmin * 1 + "px " + view.vmin * 4 + "px";
        const three = heading("Action");
        three.style.color = vars.color;

        const stepDuration = 50 / 30;
        const scene = hyperbits.createScene3D(sceneEl, {
          perspective: 1000,
          transitionDuration: stepDuration,
          stepDuration: stepDuration,
          easing: "easeInOutCubic",
          steps: [
            { id: "1", x: 0, y: 0, z: 0, element: one },
            { id: "2", x: 0, y: view.vmin * 10, z: view.vmin * 200, element: two },
            { id: "3", x: 0, y: view.vmin * 20, z: view.vmin * 400, element: three },
          ],
        });
        sceneEl.style.position = "absolute";
        sceneEl.style.inset = "0";
        sceneEl.style.zIndex = "1";

        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        [one, two, three].forEach(function (node, index) {
          const enterTime = index * stepDuration;
          timeline.fromTo(node, { opacity: 0 }, { opacity: 1, duration: 1, ease: "none" }, enterTime);
          timeline.to(node, { opacity: 0, duration: 1, ease: "none" }, enterTime + stepDuration);
        });
        timeline.to({}, { duration: 5 }, 0);
        registerTimeline("3d-basic", timeline);

      })();
    </script>
  </body>
</html>
