<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0f172a;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { background-color: #0f172a; }
      .step {
        color: #f8fafc; font-weight: 800; letter-spacing: -0.04em; white-space: nowrap;
      }
      .panel { background-color: #f8fafc; color: #0f172a; padding: 0.12em 0.4em; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="3d-basic"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >

    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const view = hyperbits.viewport();
        const root = document.getElementById("root");
        function heading(text, className) {
          const node = document.createElement("h1");
          node.className = className || "step";
          node.textContent = text;
          node.style.fontSize = view.vmin * 8 + "px";
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          return node;
        }
        const one = heading("Control");
        const two = heading("Camera", "step panel");
        const three = heading("Action");
        const scene = hyperbits.createScene3D(root, {
          perspective: 1000,
          transitionDuration: 50 / 30,
          stepDuration: 50 / 30,
          easing: "easeInOutCubic",
          steps: [
            { id: "1", x: 0, y: 0, z: 0, element: one },
            { id: "2", x: 0, y: view.vmin * 10, z: view.vmin * 200, element: two },
            { id: "3", x: 0, y: view.vmin * 20, z: view.vmin * 400, element: three },
          ],
        });
        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        timeline.to({}, { duration: 5 }, 0);
        registerTimeline("3d-basic", timeline);

      })();
    </script>
  </body>
</html>
