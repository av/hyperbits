<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Top and bottom faces","default":"#ec8b49"},{"id":"background","type":"color","label":"Background","default":"#111111"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #111111;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #111111;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Geist Sans", Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .face {
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.3) inset;
      }
      .face h1 {
        color: #fcc192;
        font-weight: 700;
        margin: 0.67em 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="cube-navigation"
      data-start="0"
      data-duration="16"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="16" style="position:absolute;inset:0;background-color:#111111"></div>
      <div id="scene"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const sceneEl = document.getElementById("scene");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const size = vmin * 35;
        const distance = size * 0.8;
        const faces = [
          { id: "front", color: "#343331", title: "TEXT", rot: [0, 0, 0], pos: [0, 0, size / 2] },
          { id: "right", color: "#1c1b1a", title: "MOTION", rot: [0, 90, 90], pos: [size / 2, 0, 0] },
          { id: "back", color: "#343331", title: "PARTICLES", rot: [0, 180, 180], pos: [0, 0, -size / 2] },
          { id: "left", color: "#1c1b1a", title: "GRADIENTS", rot: [0, -90, -90], pos: [-size / 2, 0, 0] },
          { id: "top", color: vars.color, title: "3D", rot: [90, 0, 0], pos: [0, -size / 2, 0] },
          { id: "bottom", color: vars.color, title: "BITS", rot: [-90, 0, 0], pos: [0, size / 2, 0] },
        ];
        const elements = faces.map(function (face) {
          const node = document.createElement("div");
          node.className = "face";
          node.style.width = size + "px";
          node.style.height = size + "px";
          node.style.background = face.color;
          node.style.boxShadow = "0 0 " + 40 * unit + "px rgba(0, 0, 0, 0.3) inset";
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          const heading = document.createElement("h1");
          heading.textContent = face.title;
          heading.style.fontSize = size * 0.15 + "px";
          node.append(heading);
          return { element: node, centered: true, x: face.pos[0], y: face.pos[1], z: face.pos[2], rotateX: face.rot[0], rotateY: face.rot[1], rotateZ: face.rot[2] };
        });
        const isoDist = size * 1.5;
        const isoOffset = isoDist / Math.sqrt(3);
        const isoStep = { x: isoOffset, y: -isoOffset, z: isoOffset, rotateX: 35.264, rotateY: 45, rotateZ: 0, rotateOrder: "yxz" };
        const stepDuration = 2;
        const steps = [Object.assign({ id: "start", duration: stepDuration }, isoStep)];
        faces.forEach(function (face) {
          let x = face.pos[0];
          let y = face.pos[1];
          let z = face.pos[2];
          const rx = face.rot[0];
          const ry = face.rot[1];
          const rz = face.rot[2];
          if (Math.abs(rx) === 90) y += (rx > 0 ? -1 : 1) * distance;
          else if (Math.abs(ry) === 90) x += (ry > 0 ? 1 : -1) * distance;
          else if (Math.abs(ry) === 180) z -= distance;
          else z += distance;
          steps.push({ id: "step-" + face.id, x: x, y: y, z: z, rotateX: rx, rotateY: ry, rotateZ: rz, duration: stepDuration });
        });
        steps.push(Object.assign({ id: "end", duration: stepDuration }, isoStep));
        const scene = hyperbits.createScene3D(sceneEl, {
          perspective: 2000,
          transitionDuration: 40 / 30,
          stepDuration: stepDuration,
          easing: "easeInOutCubic",
          steps: steps,
          elements: elements,
        });
        sceneEl.style.position = "absolute";
        sceneEl.style.inset = "0";
        sceneEl.style.zIndex = "1";
        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        timeline.to({}, { duration: 16 }, 0);
        registerTimeline("cube-navigation", timeline);

      })();
    </script>
  </body>
</html>
