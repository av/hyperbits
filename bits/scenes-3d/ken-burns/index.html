<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #111827;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #111827;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #111827;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { background-color: #111827; }
      .photo { width: 1400px; height: 900px; border-radius: 0; }
      .a { background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 50%, #f59e0b 100%); }
      .b { background: linear-gradient(160deg, #9a3412 0%, #1f2937 55%, #38bdf8 100%); }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="ken-burns"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >

    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const view = hyperbits.viewport();
        const root = document.getElementById("root");
        const first = document.createElement("div");
        first.className = "photo a";
        const second = document.createElement("div");
        second.className = "photo b";
        const scene = hyperbits.createScene3D(root, {
          perspective: 1200,
          transitionDuration: 1.4,
          steps: [
            { id: "wide", z: 0, scale: 1, element: first, duration: 5 },
            { id: "push", x: view.vmin * 8, y: -view.vmin * 4, z: view.vmin * 30, scale: 1.15, duration: 5 },
          ],
          elements: [{ element: second, x: view.vmin * 4, z: -view.vmin * 8, scale: 1.05 }],
        });
        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        timeline.to({}, { duration: 10 }, 0);
        registerTimeline("ken-burns", timeline);

      })();
    </script>
  </body>
</html>
