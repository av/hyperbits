<!doctype html>
<html lang="en" data-composition-variables='[{"id":"command","type":"string","label":"Command","default":"git status"},{"id":"color","type":"color","label":"Accent","default":"#86efac"},{"id":"background","type":"color","label":"Background","default":"#020617"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #020617;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #020617;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .term[data-step-active="false"] {
        opacity: 0.12;
      }
      .term[data-step-active="true"] {
        opacity: 1;
      }
      .term {
        width: 40%;
        height: 50%;
        background-color: #0b1220;
        border: 1px solid #1e293b;
        border-radius: 1.4vmin;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 1.6vmin 4vmin rgba(0, 0, 0, 0.45);
      }
      .term-bar {
        height: 12%;
        background-color: #1e293b;
        display: flex;
        align-items: center;
        padding: 0 3%;
        gap: 0.8vmin;
      }
      .term-dot {
        width: 1.2vmin;
        height: 1.2vmin;
        border-radius: 50%;
      }
      .term-title {
        flex: 1;
        text-align: center;
        color: #94a3b8;
        font-size: 2vmin;
        font-weight: 600;
      }
      .term-body {
        flex: 1;
        padding: 4%;
        color: #86efac;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 3vmin;
        line-height: 1.45;
        white-space: pre;
        overflow: hidden;
      }
      .cursor {
        display: inline-block;
        width: 0.55em;
        background-color: #86efac;
        margin-left: 0.06em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="terminal-3d"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#020617"></div>
      <div id="scene"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const sceneEl = document.getElementById("scene");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        bg.setAttribute("data-color", vars.color);

        const termW = view.width * 0.4;
        const termH = view.height * 0.5;

        function terminal(title, text) {
          const node = document.createElement("div");
          node.className = "term";
          node.style.width = termW + "px";
          node.style.height = termH + "px";
          node.style.borderColor = vars.color;
          const bar = document.createElement("div");
          bar.className = "term-bar";
          ["#ff5f56", "#ffbd2e", "#27c93f"].forEach(function (hex) {
            const dot = document.createElement("div");
            dot.className = "term-dot";
            dot.style.backgroundColor = hex;
            bar.append(dot);
          });
          const label = document.createElement("div");
          label.className = "term-title";
          label.textContent = title;
          bar.append(label);
          const body = document.createElement("pre");
          body.className = "term-body";
          body.style.whiteSpace = "pre";
          body.style.color = vars.color;
          body.style.fontSize = view.vmin * 3 + "px";
          const typed = document.createElement("span");
          typed.textContent = text;
          const cursor = document.createElement("span");
          cursor.className = "cursor";
          cursor.textContent = " ";
          cursor.style.backgroundColor = vars.color;
          body.append(typed, cursor);
          node.append(bar, body);
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          return { node: node, typed: typed, cursor: cursor };
        }

        const command = String(vars.command);
        const one = terminal("user@dev:~/project", "$ " + command + "\nOn branch main\nworking tree clean");
        const two = terminal("server-logs", "[INFO] Server started on port 3000\n[INFO] Connected to database\n[WARN] High memory usage");
        const three = terminal("build-process", "> build project\n> transpile modules\n> optimize assets\nBuild successful");

        const scene = hyperbits.createScene3D(sceneEl, {
          perspective: 1000,
          transitionDuration: 1.15,
          easing: "easeInOutCubic",
          steps: [
            { id: "main", x: 0, y: 0, z: 0, rotateY: -6, duration: 3.4, element: one.node },
            { id: "side", x: view.vmin * 58, y: 0, z: view.vmin * 18, rotateY: -22, duration: 3.3, element: two.node },
            { id: "top", x: view.vmin * 58, y: -view.vmin * 42, z: view.vmin * 18, rotateX: 8, duration: 3.3, element: three.node },
          ],
        });
        sceneEl.style.position = "absolute";
        sceneEl.style.inset = "0";
        sceneEl.style.zIndex = "1";

        const writers = [
          hyperbits.typewriter(one.typed, { duration: 2.4, delay: 0.2 }),
          hyperbits.typewriter(two.typed, { duration: 2.4, delay: 3.5 }),
          hyperbits.typewriter(three.typed, { duration: 2.4, delay: 6.8 }),
        ];
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        timeline.to(proxy, {
          time: 10,
          duration: 10,
          ease: "none",
          onUpdate: function () {
            writers.forEach(function (writer) { writer.apply(proxy.time); });
          },
        }, 0);
        timeline.fromTo([one.cursor, two.cursor, three.cursor], { opacity: 1 }, { opacity: 0.15, duration: 0.45, repeat: 21, yoyo: true, ease: "none" }, 0);
        registerTimeline("terminal-3d", timeline);

      })();
    </script>
  </body>
</html>
