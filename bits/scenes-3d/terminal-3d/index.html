<!doctype html>
<html lang="en" data-composition-variables='[{"id":"command","type":"string","label":"Command","default":"git status"},{"id":"color","type":"color","label":"Terminal text","default":"#fcc192"},{"id":"background","type":"color","label":"Background","default":"#100f0f"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Mono";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .term-wrap {
        transform-style: preserve-3d;
      }
      .term {
        background-color: #1c1b1a;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        border: 1px solid #1c1b1a;
        font-weight: 700;
      }
      .term-bar {
        background-color: #343331;
        display: flex;
        align-items: center;
        border-bottom: 1px solid #1c1b1a;
      }
      .term-dots {
        display: flex;
      }
      .term-dot {
        border-radius: 50%;
      }
      .term-title {
        flex: 1;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .term-body {
        flex: 1;
        font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
        white-space: pre-wrap;
        overflow: hidden;
      }
      .cursor {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="terminal-3d"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <div id="scene"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const sceneEl = document.getElementById("scene");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const termWidth = view.width * 0.4;
        const termHeight = view.height * 0.5;
        function terminal(title, lead, typedText, typeSpeed, cursorEnabled) {
          const wrap = document.createElement("div");
          wrap.className = "term-wrap";
          wrap.style.perspective = view.width * 2 + "px";
          wrap.setAttribute("data-layout-allow-overlap", "");
          wrap.setAttribute("data-layout-allow-occlusion", "");
          const node = document.createElement("div");
          node.className = "term";
          node.style.width = termWidth + "px";
          node.style.height = termHeight + "px";
          node.style.borderRadius = termWidth * 0.02 + "px";
          node.style.color = vars.color;
          const bar = document.createElement("div");
          bar.className = "term-bar";
          bar.style.height = termWidth * 0.08 + "px";
          bar.style.padding = "0 " + termWidth * 0.02 + "px";
          const dots = document.createElement("div");
          dots.className = "term-dots";
          dots.style.gap = termWidth * 0.015 + "px";
          ["#ff5f56", "#ffbd2e", "#27c93f"].forEach(function (hex) {
            const dot = document.createElement("div");
            dot.className = "term-dot";
            dot.style.width = termWidth * 0.03 + "px";
            dot.style.height = termWidth * 0.03 + "px";
            dot.style.backgroundColor = hex;
            dots.append(dot);
          });
          const label = document.createElement("div");
          label.className = "term-title";
          label.textContent = title;
          label.style.fontSize = termWidth * 0.04 * 0.8 + "px";
          bar.append(dots, label);
          const body = document.createElement("div");
          body.className = "term-body";
          body.style.padding = termWidth * 0.04 + "px";
          body.style.fontSize = termWidth * 0.04 + "px";
          for (const part of lead) {
            const span = document.createElement("span");
            span.textContent = part.text;
            if (part.color) span.style.color = part.color;
            if (part.block) span.style.display = "block";
            body.append(span);
          }
          const typed = document.createElement("span");
          const cursor = document.createElement("span");
          cursor.className = "cursor";
          cursor.textContent = "|";
          cursor.style.display = cursorEnabled ? "inline-block" : "none";
          body.append(typed, cursor);
          node.append(bar, body);
          wrap.append(node);
          return { wrap: wrap, node: node, typed: typed, cursor: cursor, text: typedText, typeSpeed: typeSpeed };
        }
        const command = String(vars.command);
        const main = terminal("user@dev:~/project", [
          { text: "\u279C", color: "#4caf50" }, { text: " " }, { text: "~/project", color: "#64b5f6" }, { text: " " },
          { text: command.split(" ")[0], color: "#f44336" }, { text: command.indexOf(" ") >= 0 ? " " + command.slice(command.indexOf(" ") + 1) : "" }, { text: "\n" },
        ], "On branch main\nYour branch is up to date with 'origin/main'.\n\nworking tree clean", 1, false);
        main.node.setAttribute("aria-label", command);
        const side = terminal("server-logs", [{ text: "[INFO] Server started on port 3000", color: "#81c784", block: true }], "[INFO] Connected to database\n[WARN] High memory usage detected\n[INFO] Request handled in 23ms", 2, true);
        const top = terminal("build-process", [], "> build project\n> transpile modules\n> optimize assets\n\nBuild successful! \u2728", 1, true);
        const stepDuration = 2;
        const steps = [
          { id: "main", x: 0, y: 0, z: 0, duration: stepDuration, element: main.wrap },
          { id: "side", x: view.width * 0.8, y: 0, z: 150 * unit, rotateY: -45, duration: stepDuration, element: side.wrap },
          { id: "top", x: view.width * 0.8, y: -view.height * 0.8, z: 150 * unit, duration: stepDuration, element: top.wrap },
        ];
        const scene = hyperbits.createScene3D(sceneEl, {
          perspective: 1000,
          transitionDuration: 40 / 30,
          stepDuration: stepDuration,
          easing: "easeInOutCubic",
          steps: steps,
        });
        sceneEl.style.position = "absolute";
        sceneEl.style.inset = "0";
        sceneEl.style.zIndex = "1";
        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        const wobble = hyperbits.Easing.easeInOutCubic;
        timeline.fromTo(main.node, { rotationY: -5, rotationX: -5 }, { rotationY: 5, rotationX: 5, duration: 120 / 30, ease: wobble }, 0);
        timeline.fromTo(side.node, { rotationY: 5, rotationX: 5 }, { rotationY: -5, rotationX: -5, duration: 100 / 30, ease: wobble }, 0);
        timeline.fromTo(top.node, { rotationY: 5, rotationX: 5 }, { rotationY: -5, rotationX: -5, duration: 100 / 30, ease: wobble }, 0);
        const terminals = [main, side, top];
        const proxy = { time: 0 };
        function render() {
          const frame = Math.round(proxy.time * 30);
          for (const term of terminals) {
            const visible = Math.min(term.text.length, Math.floor(frame / term.typeSpeed));
            term.typed.textContent = term.text.slice(0, visible);
            term.cursor.style.opacity = frame % 30 < 15 ? "1" : "0";
          }
        }
        timeline.to(proxy, { time: 10, duration: 10, ease: "none", onUpdate: render }, 0);
        render();
        timeline.to({}, { duration: 10 }, 0);
        registerTimeline("terminal-3d", timeline);

      })();
    </script>
  </body>
</html>
