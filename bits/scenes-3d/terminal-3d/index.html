<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #020617;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #020617;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #020617;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { background-color: #020617; }
      .term {
        width: 520px; height: 320px; background-color: #0b1220; border: 1px solid #1e293b;
        border-radius: 16px; color: #86efac; font-family: ui-monospace, monospace;
        padding: 18px 20px; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="terminal-3d"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >

    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const view = hyperbits.viewport();
        const root = document.getElementById("root");
        function term(text) {
          const node = document.createElement("div");
          node.className = "term";
          node.style.fontSize = view.vmin * 2 + "px";
          node.textContent = text;
          return node;
        }
        const one = term("$ hyperframes lint\nok 0 errors");
        const two = term("$ hyperbits add fade-in\nwrote compositions/fade-in.html");
        const three = term("$ hyperframes render\nexported out.mp4");
        const scene = hyperbits.createScene3D(root, {
          perspective: 1400,
          transitionDuration: 0.9,
          stepDuration: 3.2,
          steps: [
            { id: "a", rotateY: -18, z: view.vmin * 6 },
            { id: "b", rotateY: 12, x: view.vmin * 10, z: view.vmin * 16 },
            { id: "c", rotateX: 8, z: view.vmin * 22 },
          ],
          elements: [
            { element: one, x: -view.vmin * 18, y: -view.vmin * 4, z: 0 },
            { element: two, x: view.vmin * 16, y: view.vmin * 2, z: -view.vmin * 8 },
            { element: three, x: 0, y: view.vmin * 14, z: view.vmin * 6 },
          ],
        });
        const writers = [
          hyperbits.typewriter(one, { duration: 2.2, delay: 0.2 }),
          hyperbits.typewriter(two, { duration: 2.2, delay: 2.4 }),
          hyperbits.typewriter(three, { duration: 2.2, delay: 5.2 }),
        ];
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        timeline.to(proxy, {
          time: 10,
          duration: 10,
          ease: "none",
          onUpdate: function () {
            writers.forEach(function (writer) { writer.apply(proxy.time); });
          },
        }, 0);
        registerTimeline("terminal-3d", timeline);

      })();
    </script>
  </body>
</html>
