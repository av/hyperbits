<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0f172a;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { background-color: #0f172a; }
      .slide { color: #f8fafc; width: 900px; }
      h1 { font-weight: 800; }
      p { color: #cbd5e1; margin-top: 0.4em; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="step-timing-context"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >

    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const view = hyperbits.viewport();
        const root = document.getElementById("root");
        function slide(titleText, bodyText) {
          const wrap = document.createElement("div");
          wrap.className = "slide";
          const title = document.createElement("h1");
          title.textContent = titleText;
          title.style.fontSize = view.vmin * 6 + "px";
          const body = document.createElement("p");
          body.textContent = bodyText;
          body.style.fontSize = view.vmin * 2.6 + "px";
          wrap.append(title, body);
          return wrap;
        }
        const first = slide("Enter", "Copy reveals as the camera settles.");
        const second = slide("Hold", "Motion waits for the active step.");
        const third = slide("Leave", "Exit starts before the next camera move.");
        const scene = hyperbits.createScene3D(root, {
          perspective: 1100,
          transitionDuration: 0.8,
          stepDuration: 3.2,
          steps: [
            { id: "enter", x: 0, z: 0, element: first },
            { id: "hold", x: view.vmin * 40, rotateY: -12, element: second },
            { id: "leave", x: view.vmin * 80, rotateY: 12, element: third },
          ],
        });
        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        [first, second, third].forEach(function (node, index) {
          const words = hyperbits.splitText(node.querySelector("h1"), "words");
          hyperbits.stagger(words, { opacity: [0, 1], y: [16, 0], duration: 0.45, stagger: 0.06, delay: index * 3.2 }, timeline);
        });
        timeline.to({}, { duration: 10 }, 0);
        registerTimeline("step-timing-context", timeline);

      })();
    </script>
  </body>
</html>
