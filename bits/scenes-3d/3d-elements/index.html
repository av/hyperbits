<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #020617;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #020617;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #020617;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { background-color: #020617; }
      .orb { border-radius: 50%; }
      .label { color: #f8fafc; font-weight: 700; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="3d-elements"
      data-start="0"
      data-duration="6.67"
      data-width="1920"
      data-height="1080"
    >

    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const view = hyperbits.viewport();
        const root = document.getElementById("root");
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = "Elements in space";
        label.style.fontSize = view.vmin * 5 + "px";
        const elements = [];
        const colors = ["#38bdf8", "#f472b6", "#f59e0b", "#34d399", "#a78bfa"];
        for (let index = 0; index < 8; index += 1) {
          const orb = document.createElement("div");
          orb.className = "orb";
          const size = view.vmin * hyperbits.randomFloat("s-" + index, 4, 10);
          orb.style.width = size + "px";
          orb.style.height = size + "px";
          orb.style.backgroundColor = colors[index % colors.length];
          elements.push({
            element: orb,
            x: hyperbits.randomFloat("x-" + index, -view.vmin * 40, view.vmin * 40),
            y: hyperbits.randomFloat("y-" + index, -view.vmin * 20, view.vmin * 20),
            z: hyperbits.randomFloat("z-" + index, -view.vmin * 30, view.vmin * 30),
          });
        }
        const scene = hyperbits.createScene3D(root, {
          perspective: 1200,
          transitionDuration: 0.8,
          stepDuration: 2.2,
          steps: [
            { id: "wide", x: 0, y: 0, z: 0, rotateY: -12, element: label },
            { id: "close", x: view.vmin * 8, y: view.vmin * 4, z: view.vmin * 40, rotateY: 18 },
            { id: "top", x: 0, y: -view.vmin * 10, z: view.vmin * 20, rotateX: 18 },
          ],
          elements: elements,
        });
        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        timeline.to({}, { duration: 6.67 }, 0);
        registerTimeline("3d-elements", timeline);

      })();
    </script>
  </body>
</html>
