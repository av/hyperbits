<!doctype html>
<html lang="en" data-composition-variables='[{"id":"title","type":"string","label":"Hero title","default":"Direct the camera"},{"id":"subtitle","type":"string","label":"Subtitle","default":"look-at · lens · roll · slerp"},{"id":"label","type":"string","label":"Panel label prefix","default":"KEY"},{"id":"seed","type":"number","label":"Layout seed","default":7},{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"surface","type":"color","label":"Panel surface","default":"#1c1b1a"},{"id":"edge","type":"color","label":"Panel edge","default":"#343331"},{"id":"foreground","type":"color","label":"Title ink","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#ec8b49"},{"id":"highlight","type":"color","label":"Highlight","default":"#fcc192"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 700;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-700-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist Mono";
        font-weight: 500;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-500-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --surface: #1c1b1a;
        --edge: #343331;
        --fg: #f2f0e5;
        --accent: #ec8b49;
        --highlight: #fcc192;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        font-family: "Geist Sans", ui-sans-serif, system-ui, sans-serif;
      }
      #glow,
      #stage,
      #hud {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .panel,
      .floor,
      .hero {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        backface-visibility: hidden;
      }
      .panel {
        overflow: hidden;
        border-style: solid;
      }
      .panel .fog {
        position: absolute;
        inset: 0;
      }
      .panel .rim {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
      }
      .panel .meta {
        position: absolute;
        display: flex;
        justify-content: space-between;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-weight: 500;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .panel svg {
        position: absolute;
        overflow: visible;
      }
      .hero {
        transform-style: preserve-3d;
        text-align: center;
        white-space: nowrap;
      }
      .hero .title {
        display: block;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1;
        transform-style: preserve-3d;
      }
      .hero .title span {
        display: inline-block;
        transform-origin: 50% 100%;
      }
      .hero .rule {
        display: block;
        margin: 0 auto;
        transform-origin: 50% 50%;
      }
      .hero .subtitle {
        display: block;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-weight: 500;
        letter-spacing: 0.08em;
      }
      #hud {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-weight: 500;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      #hud .readout {
        position: absolute;
        display: flex;
      }
      #hud .track {
        position: absolute;
      }
      #hud .tick,
      #hud .head {
        position: absolute;
        top: 0;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="camera-flight"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <div id="glow" class="clip" data-start="0" data-duration="10"></div>
      <div id="stage" class="clip" data-start="0" data-duration="10"><div id="world"></div></div>
      <div id="hud" class="clip" data-start="0" data-duration="10"></div>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const glow = document.getElementById("glow");
        const stage = document.getElementById("stage");
        const world = document.getElementById("world");
        const hud = document.getElementById("hud");
        const view = hyperbits.viewport(root);
        const unit = view.vmin;
        const duration = 10;
        const seed = "camera-flight-" + vars.seed;
        const DEG = Math.PI / 180;
        bg.style.backgroundColor = vars.background;

        const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
        const mix = (from, to, amount) => from + (to - from) * amount;
        const mixVec = (from, to, amount) => [mix(from[0], to[0], amount), mix(from[1], to[1], amount), mix(from[2], to[2], amount)];
        const add = (left, right) => [left[0] + right[0], left[1] + right[1], left[2] + right[2]];
        const scale = (vector, factor) => [vector[0] * factor, vector[1] * factor, vector[2] * factor];
        const smooth = (edge0, edge1, value) => {
          const amount = clamp((value - edge0) / (edge1 - edge0), 0, 1);
          return amount * amount * (3 - 2 * amount);
        };
        const world3 = (vector) => scale(vector, unit);
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgb(from, to, amount) {
          return "rgb(" + [0, 1, 2].map((index) => Math.round(mix(from[index], to[index], amount))).join(", ") + ")";
        }
        const tones = {
          background: channels(vars.background),
          surface: channels(vars.surface),
          edge: channels(vars.edge),
          foreground: channels(vars.foreground),
          accent: channels(vars.accent),
        };

        const RADIUS = 380;
        const TURN = 95 * DEG;
        const BEND_Z = -160;
        const ARC = RADIUS * TURN;
        const EYE = -4;
        function heading(length) {
          const angle = clamp(length, 0, ARC) / RADIUS;
          return [-Math.sin(angle), 0, -Math.cos(angle)];
        }
        function pathAt(length, height) {
          if (length <= 0) return [0, height, BEND_Z - length];
          const angle = Math.min(length, ARC) / RADIUS;
          const point = [-RADIUS + RADIUS * Math.cos(angle), height, BEND_Z - RADIUS * Math.sin(angle)];
          return length > ARC ? add(point, scale(heading(ARC), length - ARC)) : point;
        }
        const rightOf = (direction) => [-direction[2], 0, direction[0]];

        const exitHeading = heading(ARC);
        const exitRight = rightOf(exitHeading);
        const exitPoint = pathAt(ARC, 0);
        const heroPoint = add(add(exitPoint, scale(exitHeading, 120)), add(scale(exitRight, 190), [0, -12, 0]));
        const landing = add(pathAt(ARC + 170, 0), [0, -10, 0]);
        const heroOffset = [landing[0] - heroPoint[0], landing[1] - heroPoint[1], landing[2] - heroPoint[2]];
        const heroDistance = Math.hypot(heroOffset[0], heroOffset[1], heroOffset[2]);
        const heroFacing = Math.atan2(heroOffset[0], heroOffset[2]);

        const flightEase = hyperbits.gsapEase("sine.inOut");
        const DOLLY_SCALE = 0.6;
        const keys = [
          { time: 0, position: world3([0, EYE, 620]), target: world3([0, EYE, BEND_Z]), lens: DOLLY_SCALE * 780 * unit, roll: 0, ease: "power2.inOut" },
        ];
        const FLIGHT_START = 2.5;
        const FLIGHT_END = 6.4;
        const FLIGHT_FROM = -140;
        const FLIGHT_TO = ARC + 170;
        const STEPS = 28;
        for (let step = 0; step <= STEPS; step += 1) {
          const share = step / STEPS;
          const travel = flightEase(share);
          const length = mix(FLIGHT_FROM, FLIGHT_TO, travel);
          const reveal = smooth(0.5, 0.93, travel);
          const bend = smooth(-60, 120, length) * (1 - smooth(ARC - 160, ARC + 20, length));
          const position = mixVec(pathAt(length, EYE), landing, smooth(0.93, 1, travel));
          const ahead = pathAt(length + 130, EYE + 2);
          keys.push({
            time: mix(FLIGHT_START, FLIGHT_END, share),
            position: world3(position),
            target: world3(mixVec(ahead, heroPoint, reveal)),
            roll: -7 * bend + 9 * Math.sin(Math.PI * reveal) * (1 - smooth(0.9, 1, travel)),
            lens: mix(mix(DOLLY_SCALE * 140, 98, smooth(0, 0.4, travel)), heroDistance, reveal) * unit,
            ease: "none",
          });
        }
        keys.push({
          time: duration,
          position: world3(mixVec(landing, heroPoint, 0.15)),
          target: world3(heroPoint),
          roll: 0,
          lens: heroDistance * unit,
        });
        keys[keys.length - 2].ease = "power1.out";

        const camera = hyperbits.createCamera(stage, world, { keys: keys });

        const PANEL_W = 34;
        const PANEL_H = 21;
        const panelSpecs = [];
        let column = 0;
        for (let length = -290; length < ARC - 10; length += 46) {
          for (const side of [-1, 1]) {
            const key = seed + "-" + column + "-" + side;
            const tiers = hyperbits.random(key + "-tiers") < 0.62 ? [-15, 13] : [hyperbits.randomFloat(key + "-y", -7, 5)];
            tiers.forEach((height, tier) => {
              const along = length + hyperbits.randomFloat(key + "-along-" + tier, -7, 7) + tier * 9;
              const forward = heading(along);
              const lateral = scale(rightOf(forward), side * hyperbits.randomFloat(key + "-side-" + tier, 54, 66));
              const center = add(pathAt(along, height), lateral);
              const facing = add(scale(lateral, -1 / 60), scale(forward, -0.55));
              panelSpecs.push({
                key: key + "-" + tier,
                center: center,
                yaw: Math.atan2(facing[0], facing[2]),
                tilt: hyperbits.randomFloat(key + "-tilt-" + tier, -4, 4) + (height < 0 ? -5 : height > 8 ? 5 : 0),
              });
            });
          }
          column += 1;
        }
        const finalState = camera.stateAt(duration);
        const heroClear = (center) => {
          const projected = hyperbits.cameraProject(finalState, world3(center));
          if (projected.depth <= 0) return true;
          const reach = Math.hypot(PANEL_W, PANEL_H) * 0.5 * unit * projected.scale;
          if (Math.abs(projected.x) - reach > view.width * 0.5 || Math.abs(projected.y) - reach > view.height * 0.5) return true;
          const titleZone = Math.abs(projected.x) < view.width * 0.36 && Math.abs(projected.y) < view.height * 0.26;
          return !titleZone && projected.depth > (heroDistance + 260) * unit;
        };
        for (let index = 0; index < 18; index += 1) {
          const key = seed + "-far-" + index;
          const along = hyperbits.randomFloat(key + "-along", 60, ARC + 120);
          const forward = heading(along);
          const side = index % 2 === 0 ? -1 : 1;
          const lateral = scale(rightOf(forward), side * hyperbits.randomFloat(key + "-side", 140, 300));
          const center = add(pathAt(along, hyperbits.randomFloat(key + "-y", -80, 20)), lateral);
          panelSpecs.push({ key: key, center: center, yaw: Math.atan2(-lateral[0], -lateral[2]) + hyperbits.randomFloat(key + "-yaw", -0.4, 0.4), tilt: 0 });
        }
        for (let index = 0; index < 16; index += 1) {
          const key = seed + "-exit-" + index;
          const along = hyperbits.randomFloat(key + "-along", ARC - 140, ARC + 200);
          const forward = heading(along);
          const lateral = scale(rightOf(forward), hyperbits.randomFloat(key + "-side", 95, 240));
          const center = add(pathAt(along, hyperbits.randomFloat(key + "-y", -60, 28)), lateral);
          const toPath = [-lateral[0], 0, -lateral[2]];
          panelSpecs.push({ key: key, center: center, yaw: Math.atan2(toPath[0], toPath[2]) + hyperbits.randomFloat(key + "-yaw", -0.5, 0.2), tilt: hyperbits.randomFloat(key + "-tilt", -6, 6) });
        }
        const heroBack = scale(heroOffset, -1 / heroDistance);
        const heroSide = rightOf(heroBack);
        for (let index = 0; index < 16; index += 1) {
          const key = seed + "-backdrop-" + index;
          const depth = hyperbits.randomFloat(key + "-depth", 380, 820);
          const spread = hyperbits.randomFloat(key + "-spread", -1, 1) * (180 + depth * 0.9);
          const center = add(add(heroPoint, scale(heroBack, depth)), add(scale(heroSide, spread), [0, hyperbits.randomFloat(key + "-y", -1, 1) * (60 + depth * 0.35), 0]));
          panelSpecs.push({ key: key, center: center, yaw: heroFacing + hyperbits.randomFloat(key + "-yaw", -0.5, 0.5), tilt: hyperbits.randomFloat(key + "-tilt", -8, 8) });
        }

        const label = String(vars.label || "KEY");
        function panelMarkup(spec, index) {
          const variant = hyperbits.pick(spec.key + "-variant", ["curve", "curve", "frame", "wave"]);
          const svgWidth = PANEL_W - 4;
          const svgHeight = PANEL_H - 8;
          let body = "";
          if (variant === "curve") {
            const handleA = [hyperbits.randomFloat(spec.key + "-ax", 0.15, 0.6), hyperbits.randomFloat(spec.key + "-ay", -0.2, 0.3)];
            const handleB = [hyperbits.randomFloat(spec.key + "-bx", 0.4, 0.85), hyperbits.randomFloat(spec.key + "-by", 0.7, 1.2)];
            const point = (pair) => (pair[0] * svgWidth).toFixed(2) + " " + ((1 - pair[1]) * svgHeight).toFixed(2);
            body =
              '<line x1="0" y1="' + svgHeight + '" x2="' + svgWidth + '" y2="' + svgHeight + '" data-role="edge" stroke-width="0.14"/>' +
              '<line x1="0" y1="' + svgHeight + '" x2="' + point(handleA).replace(" ", '" y2="') + '" data-role="edge" stroke-width="0.14"/>' +
              '<line x1="' + svgWidth + '" y1="0" x2="' + point(handleB).replace(" ", '" y2="') + '" data-role="edge" stroke-width="0.14"/>' +
              '<circle cx="' + point(handleA).split(" ")[0] + '" cy="' + point(handleA).split(" ")[1] + '" r="0.55" data-role="edge-fill"/>' +
              '<circle cx="' + point(handleB).split(" ")[0] + '" cy="' + point(handleB).split(" ")[1] + '" r="0.55" data-role="edge-fill"/>' +
              '<path d="M0 ' + svgHeight + " C" + point(handleA) + " " + point(handleB) + " " + svgWidth + ' 0" data-role="draw" fill="none" stroke-width="0.42" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>';
          } else if (variant === "frame") {
            body =
              '<circle cx="' + svgWidth * 0.26 + '" cy="' + svgHeight * 0.5 + '" r="' + svgHeight * 0.4 + '" data-role="draw" fill="none" stroke-width="0.42" pathLength="1" stroke-dasharray="1 1"/>' +
              '<rect x="' + svgWidth * 0.56 + '" y="' + svgHeight * 0.18 + '" width="' + svgWidth * 0.4 + '" height="1.6" rx="0.8" data-role="edge-fill"/>' +
              '<rect x="' + svgWidth * 0.56 + '" y="' + svgHeight * 0.42 + '" width="' + svgWidth * 0.3 + '" height="1.6" rx="0.8" data-role="edge-fill"/>' +
              '<rect x="' + svgWidth * 0.56 + '" y="' + svgHeight * 0.66 + '" width="' + svgWidth * 0.18 + '" height="1.9" rx="0.95" data-role="accent-fill"/>';
          } else {
            const bars = 22;
            const gap = svgWidth / bars;
            for (let bar = 0; bar < bars; bar += 1) {
              const height = svgHeight * (0.18 + 0.78 * Math.abs(Math.sin(bar * 0.55 + hyperbits.randomFloat(spec.key + "-wave", 0, 6))) * hyperbits.randomFloat(spec.key + "-bar-" + bar, 0.55, 1));
              body += '<rect x="' + (bar * gap + gap * 0.2).toFixed(2) + '" y="' + (svgHeight - height).toFixed(2) + '" width="' + (gap * 0.6).toFixed(2) + '" height="' + height.toFixed(2) + '" rx="0.2" data-role="' + (bar === 13 ? "accent-fill" : "edge-fill") + '"/>';
            }
          }
          const time = ((index * 0.37) % 9.6).toFixed(2);
          return (
            '<div class="meta"><span>' + label + " " + String(index + 1).padStart(2, "0") + "</span><span>" + time + "s</span></div>" +
            '<svg viewBox="0 0 ' + svgWidth + " " + svgHeight + '">' + body + "</svg>" +
            '<div class="rim"></div><div class="fog"></div>'
          );
        }

        const panels = panelSpecs.filter((spec) => heroClear(spec.center)).map((spec, index) => {
          const node = document.createElement("div");
          node.className = "panel";
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          node.setAttribute("data-layout-allow-overflow", "");
          node.innerHTML = panelMarkup(spec, index);
          node.style.width = PANEL_W * unit + "px";
          node.style.height = PANEL_H * unit + "px";
          node.style.borderWidth = Math.max(1, unit * 0.16) + "px";
          node.style.borderRadius = unit * 1.1 + "px";
          node.style.backgroundColor = vars.surface;
          const center = world3(spec.center);
          node.style.transform =
            "translate3d(" + center[0] + "px," + center[1] + "px," + center[2] + "px) rotateY(" + spec.yaw + "rad) rotateX(" + spec.tilt + "deg) translate(-50%,-50%)";
          const meta = node.querySelector(".meta");
          meta.style.left = unit * 1.8 + "px";
          meta.style.right = unit * 1.8 + "px";
          meta.style.top = unit * 1.4 + "px";
          meta.style.fontSize = unit * 1.45 + "px";
          meta.style.color = rgb(tones.surface, tones.foreground, 0.45);
          meta.firstChild.style.color = vars.highlight;
          const svg = node.querySelector("svg");
          svg.style.left = unit * 2 + "px";
          svg.style.top = unit * 5.2 + "px";
          svg.style.width = (PANEL_W - 4) * unit + "px";
          svg.style.height = (PANEL_H - 8) * unit + "px";
          svg.querySelectorAll('[data-role="edge"]').forEach((line) => line.setAttribute("stroke", vars.edge));
          svg.querySelectorAll('[data-role="edge-fill"]').forEach((shape) => shape.setAttribute("fill", vars.edge));
          svg.querySelectorAll('[data-role="accent-fill"]').forEach((shape) => shape.setAttribute("fill", vars.accent));
          const draw = svg.querySelector('[data-role="draw"]');
          if (draw) draw.setAttribute("stroke", vars.accent);
          const rim = node.querySelector(".rim");
          rim.style.height = unit * 0.32 + "px";
          rim.style.backgroundColor = vars.accent;
          const fog = node.querySelector(".fog");
          fog.style.backgroundColor = vars.background;
          world.append(node);
          return { node: node, rim: rim, fog: fog, draw: draw, center: center, spec: spec };
        });

        const gate = document.createElement("div");
        gate.className = "panel gate";
        gate.setAttribute("data-layout-allow-overflow", "");
        const GATE_W = 92;
        const GATE_H = 52;
        const corner = 9;
        const reticle = 2.6;
        gate.innerHTML =
          '<svg viewBox="0 0 ' + GATE_W + " " + GATE_H + '" fill="none" stroke-linecap="square">' +
          [[0, 0, 1, 1], [GATE_W, 0, -1, 1], [0, GATE_H, 1, -1], [GATE_W, GATE_H, -1, -1]]
            .map((spec) => '<path d="M' + (spec[0] + spec[2] * corner) + " " + spec[1] + " H" + spec[0] + " V" + (spec[1] + spec[3] * corner) + '"/>')
            .join("") +
          '<path d="M' + (GATE_W / 2 - reticle) + " " + GATE_H / 2 + " H" + (GATE_W / 2 + reticle) + " M" + GATE_W / 2 + " " + (GATE_H / 2 - reticle) + " V" + (GATE_H / 2 + reticle) + '"/>' +
          "</svg>";
        gate.style.width = GATE_W * unit + "px";
        gate.style.height = GATE_H * unit + "px";
        gate.style.borderWidth = "0";
        gate.style.overflow = "visible";
        const gateSvg = gate.querySelector("svg");
        gateSvg.style.inset = "0";
        gateSvg.style.width = "100%";
        gateSvg.style.height = "100%";
        gateSvg.setAttribute("stroke", vars.accent);
        gateSvg.setAttribute("stroke-width", "0.32");
        const gateCenter = world3([0, EYE, BEND_Z]);
        gate.style.transform = "translate3d(" + gateCenter[0] + "px," + gateCenter[1] + "px," + gateCenter[2] + "px) translate(-50%,-50%)";
        world.append(gate);

        const floor = document.createElement("div");
        floor.className = "floor";
        const floorSize = 2200 * unit;
        const floorCenter = world3(add(pathAt(ARC * 0.55, 0), [0, 42, 0]));
        const gridStep = 24 * unit;
        const gridLine = Math.max(1, unit * 0.12);
        floor.style.width = floorSize + "px";
        floor.style.height = floorSize + "px";
        floor.style.backgroundImage =
          "linear-gradient(to right, " + rgb(tones.background, tones.edge, 0.9) + " " + gridLine + "px, rgba(0, 0, 0, 0) " + gridLine + "px), linear-gradient(to bottom, " + rgb(tones.background, tones.edge, 0.9) + " " + gridLine + "px, rgba(0, 0, 0, 0) " + gridLine + "px)";
        floor.style.backgroundSize = gridStep + "px " + gridStep + "px";
        floor.style.backgroundPosition = "50% 50%";
        floor.style.webkitMaskImage = "radial-gradient(closest-side, rgba(0, 0, 0, 1) 20%, rgba(0, 0, 0, 0) 100%)";
        floor.style.maskImage = "radial-gradient(closest-side, rgba(0, 0, 0, 1) 20%, rgba(0, 0, 0, 0) 100%)";
        floor.style.transform = "translate3d(" + floorCenter[0] + "px," + floorCenter[1] + "px," + floorCenter[2] + "px) rotateX(90deg) translate(-50%,-50%)";
        floor.setAttribute("data-layout-allow-overflow", "");
        world.prepend(floor);

        const hero = document.createElement("div");
        hero.className = "hero";
        hero.setAttribute("data-layout-allow-overflow", "");
        const heroTitle = document.createElement("span");
        heroTitle.className = "title";
        heroTitle.textContent = String(vars.title);
        heroTitle.style.fontSize = unit * 9.6 + "px";
        heroTitle.style.color = vars.foreground;
        const heroRule = document.createElement("span");
        heroRule.className = "rule";
        heroRule.style.width = unit * 16 + "px";
        heroRule.style.height = Math.max(2, unit * 0.36) + "px";
        heroRule.style.margin = unit * 3.2 + "px auto " + unit * 2.6 + "px";
        heroRule.style.backgroundColor = vars.accent;
        const heroSubtitle = document.createElement("span");
        heroSubtitle.className = "subtitle";
        heroSubtitle.textContent = String(vars.subtitle);
        heroSubtitle.style.fontSize = unit * 3.2 + "px";
        heroSubtitle.style.color = vars.highlight;
        hero.append(heroTitle, heroRule, heroSubtitle);
        world.append(hero);
        const heroWorld = world3(heroPoint);
        hero.style.transform = "translate3d(" + heroWorld[0] + "px," + heroWorld[1] + "px," + heroWorld[2] + "px) rotateY(" + heroFacing + "rad) translate(-50%,-50%)";
        const letters = hyperbits.splitText(heroTitle, "chars");

        const readout = document.createElement("div");
        readout.className = "readout";
        readout.style.left = unit * 4 + "px";
        readout.style.bottom = unit * 4 + "px";
        readout.style.fontSize = unit * 1.9 + "px";
        readout.style.gap = unit * 3 + "px";
        readout.style.color = rgb(tones.background, tones.foreground, 0.55);
        const fields = ["lens", "roll", "key"].map((name) => {
          const cell = document.createElement("span");
          const tag = document.createElement("span");
          tag.textContent = name.toUpperCase() + " ";
          tag.style.color = vars.accent;
          const value = document.createElement("span");
          cell.append(tag, value);
          readout.append(cell);
          return value;
        });
        const track = document.createElement("div");
        track.className = "track";
        track.style.left = unit * 4 + "px";
        track.style.right = unit * 4 + "px";
        track.style.bottom = unit * 8.4 + "px";
        track.style.height = unit * 1.1 + "px";
        track.style.borderBottom = Math.max(1, unit * 0.1) + "px solid " + vars.edge;
        const trackWidth = view.width - unit * 8;
        keys.forEach((key) => {
          const tick = document.createElement("span");
          tick.className = "tick";
          tick.style.left = (key.time / duration) * trackWidth + "px";
          tick.style.width = Math.max(1, unit * 0.12) + "px";
          tick.style.backgroundColor = vars.edge;
          track.append(tick);
        });
        const head = document.createElement("span");
        head.className = "head";
        head.style.width = Math.max(2, unit * 0.22) + "px";
        head.style.top = -unit * 0.8 + "px";
        head.style.backgroundColor = vars.accent;
        track.append(head);
        hud.append(track, readout);
        const ticks = Array.from(track.querySelectorAll(".tick"));

        function render(time) {
          const state = camera.stateAt(time);
          panels.forEach((panel) => {
            const projected = hyperbits.cameraProject(state, panel.center);
            const depth = projected.depth / unit;
            const fog = smooth(320, 1250, depth);
            const near = smooth(6, 34, depth);
            const centered = 1 - smooth(view.width * 0.08, view.width * 0.42, Math.hypot(projected.x, projected.y * 1.4));
            const focus = depth > 0 ? centered * smooth(260, 110, depth) * near : 0;
            const drawn = depth <= 0 ? 1 : 1 - smooth(110, 300, depth);
            panel.node.style.opacity = near.toFixed(3);
            panel.fog.style.opacity = fog.toFixed(3);
            panel.rim.style.opacity = focus.toFixed(3);
            panel.node.style.borderColor = focus > 0 ? rgb(tones.edge, tones.accent, focus * 0.85) : rgb(tones.edge, tones.background, fog);
            if (panel.draw) panel.draw.setAttribute("stroke-dashoffset", (1 - drawn).toFixed(3));
          });
          gate.style.opacity = smooth(30, 90, hyperbits.cameraProject(state, gateCenter).depth / unit).toFixed(3);
          const heroScreen = hyperbits.cameraProject(state, heroWorld);
          const shine = smooth(4.6, 6.8, time);
          const glowX = clamp(view.width / 2 + heroScreen.x, -view.width * 0.4, view.width * 1.4);
          const glowY = view.height / 2 + clamp(heroScreen.y, -view.height, view.height);
          glow.style.opacity = (heroScreen.depth > 0 ? shine : 0).toFixed(3);
          glow.style.backgroundImage =
            "radial-gradient(" + unit * 90 + "px " + unit * 55 + "px at " + glowX.toFixed(1) + "px " + glowY.toFixed(1) + "px, " + rgb(tones.background, tones.accent, 0.22) + ", rgba(0, 0, 0, 0))";
          fields[0].textContent = Math.round(state.lens) + "PX";
          const roll = Math.round(state.roll * 10) / 10;
          fields[1].textContent = (roll < 0 ? "-" : "+") + Math.abs(roll).toFixed(1) + "°";
          fields[2].textContent = String(state.segment + 1).padStart(2, "0") + "/" + keys.length;
          head.style.left = (clamp(time / duration, 0, 1) * trackWidth).toFixed(1) + "px";
          ticks.forEach((tick, index) => {
            tick.style.backgroundColor = keys[index].time <= time ? vars.accent : vars.edge;
          });
          hud.style.opacity = (1 - smooth(6.6, 7.6, time)).toFixed(3);
        }

        const timeline = gsap.timeline({ paused: true });
        timeline.to({ value: 0 }, { value: 1, duration: duration, ease: "none" }, 0);
        timeline.eventCallback("onUpdate", () => render(timeline.time()));
        hyperbits.stagger(
          letters,
          {
            opacity: [0, 1],
            y: [unit * 5, 0],
            duration: 0.9,
            stagger: 0.045,
            ease: "expo.out",
            at: 5.3,
            from: { rotationX: -95, z: -unit * 6 },
            to: { rotationX: 0, z: 0 },
          },
          timeline,
        );
        timeline.fromTo(heroRule, { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: "expo.inOut" }, 6.3);
        timeline.fromTo(heroSubtitle, { opacity: 0, y: unit * 2 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 6.65);
        timeline.fromTo(stage, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
        camera.bind(timeline);
        render(0);
        registerTimeline("camera-flight", timeline);
      })();
    </script>
  </body>
</html>
