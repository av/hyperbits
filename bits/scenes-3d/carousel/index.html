<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0b1220;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0b1220;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #0b1220;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { background-color: #0b1220; }
      .card {
        width: 280px; height: 380px; border-radius: 22px; display: flex; align-items: flex-end;
        color: #f8fafc; font-weight: 800; padding: 24px; box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="carousel"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >

    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const view = hyperbits.viewport();
        const root = document.getElementById("root");
        const labels = ["North", "Atlas", "Signal", "Harbor", "Nova", "Prism"];
        const colors = ["#1d4ed8", "#0f766e", "#9a3412", "#6d28d9", "#be123c", "#0369a1"];
        const radius = view.vmin * 28;
        const elements = labels.map(function (label, index) {
          const card = document.createElement("div");
          card.className = "card";
          card.setAttribute("data-layout-allow-overlap", "");
          card.setAttribute("data-layout-allow-occlusion", "");
          card.textContent = label;
          card.style.backgroundColor = colors[index];
          card.style.fontSize = view.vmin * 3.4 + "px";
          const angle = (index / labels.length) * Math.PI * 2;
          return {
            element: card,
            x: Math.sin(angle) * radius,
            z: Math.cos(angle) * radius,
            rotateY: (index / labels.length) * 360,
          };
        });
        const steps = labels.map(function (_label, index) {
          return { id: "c" + index, rotateY: -(index / labels.length) * 360, z: view.vmin * 8, duration: 10 / labels.length };
        });
        const scene = hyperbits.createScene3D(root, {
          perspective: 1400,
          transitionDuration: 0.8,
          steps: steps,
          elements: elements,
        });
        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        timeline.to({}, { duration: 10 }, 0);
        registerTimeline("carousel", timeline);

      })();
    </script>
  </body>
</html>
