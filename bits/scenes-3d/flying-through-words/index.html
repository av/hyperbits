<!doctype html>
<html lang="en" data-composition-variables='[{"id":"words","type":"string","label":"Words","default":"SEEK,FRAME,MOTION,SCALE,DEPTH,LIGHT,TIME,SPACE"},{"id":"color","type":"color","label":"Text color","default":"#e2e8f0"},{"id":"background","type":"color","label":"Background","default":"#000000"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #000000;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #000000;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .word {
        color: #e2e8f0;
        font-weight: 800;
        letter-spacing: 0.08em;
        white-space: nowrap;
        line-height: 1;
        font-size: 8vmin;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="flying-through-words"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#000000"></div>
      <div id="scene"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const sceneEl = document.getElementById("scene");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        bg.setAttribute("data-color", vars.color);

        const list = String(vars.words).split(",").map(function (part) { return part.trim(); }).filter(Boolean);
        const slots = [
          { x: -22, y: -10 },
          { x: 24, y: 12 },
          { x: -18, y: 16 },
          { x: 20, y: -14 },
          { x: -26, y: 8 },
          { x: 14, y: 18 },
          { x: -12, y: -18 },
          { x: 22, y: 4 },
        ];
        const depth = view.vmin * 40;
        const count = Math.max(list.length, slots.length);
        const elements = [];
        for (let index = 0; index < Math.min(count, slots.length); index += 1) {
          const node = document.createElement("div");
          node.className = "word";
          node.textContent = list[index % list.length];
          node.style.fontSize = view.vmin * 8 + "px";
          node.style.color = vars.color;
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          elements.push({
            element: node,
            centered: true,
            x: slots[index].x * view.vmin,
            y: slots[index].y * view.vmin,
            z: (index + 1) * depth,
          });
        }

        const stepCount = 7;
        const steps = [];
        for (let index = 0; index < stepCount; index += 1) {
          steps.push({
            id: "z" + index,
            x: 0,
            y: 0,
            z: index * depth + view.vmin * 8,
            duration: 10 / stepCount,
          });
        }

        const scene = hyperbits.createScene3D(sceneEl, {
          perspective: 900,
          transitionDuration: 1.28,
          easing: "easeInOutCubic",
          steps: steps,
          elements: elements,
        });
        sceneEl.style.position = "absolute";
        sceneEl.style.inset = "0";
        sceneEl.style.zIndex = "1";

        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        timeline.to({}, { duration: 10 }, 0);
        registerTimeline("flying-through-words", timeline);

      })();
    </script>
  </body>
</html>
