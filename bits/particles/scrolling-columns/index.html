<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #020617;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #020617;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #020617;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { perspective: 1400px; background-color: #020617; overflow: hidden; }
      #world { position: absolute; inset: 0; transform-style: preserve-3d; }
      .col { position: absolute; top: -40%; height: 180%; display: flex; flex-direction: column; gap: 18px; }
      .card { border-radius: 18px; flex: 0 0 auto; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="scrolling-columns"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="world" class="clip" data-start="0" data-duration="10"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const view = hyperbits.viewport();
        const world = document.getElementById("world");
        const palette = ["#1d4ed8", "#0f766e", "#9a3412", "#6d28d9", "#be123c", "#0369a1"];
        const speeds = [0.35, 0.55, 0.28, 0.7];
        const columns = [];
        for (let col = 0; col < 4; col += 1) {
          const column = document.createElement("div");
          column.className = "col";
          column.style.left = 10 + col * 22 + "%";
          column.style.width = "18%";
          const depth = col % 2 === 0 ? -120 : 80;
          for (let cardIndex = 0; cardIndex < 10; cardIndex += 1) {
            const card = document.createElement("div");
            card.className = "card";
            card.style.height = view.vh * 22 + "px";
            card.style.backgroundColor = palette[hyperbits.randomInt("c-" + col + "-" + cardIndex, 0, palette.length - 1)];
            column.append(card);
          }
          world.append(column);
          columns.push({ el: column, speed: speeds[col], depth: depth });
        }
        const proxy = { t: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, {
          t: 10,
          duration: 10,
          ease: "none",
          onUpdate: function () {
            world.style.transform = "rotateY(" + (proxy.t * 3 - 12) + "deg) translateZ(" + view.vmin * 4 + "px)";
            columns.forEach(function (column) {
              column.el.style.transform =
                "translateZ(" +
                column.depth +
                "px) translateY(" +
                -proxy.t * column.speed * view.vh * 8 +
                "px)";
            });
          },
        }, 0);
        registerTimeline("scrolling-columns", timeline);

      })();
    </script>
  </body>
</html>
