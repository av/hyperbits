<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Spark color","default":"#ebb03b"},{"id":"background","type":"color","label":"Background","default":"#100f0f"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="particles-fountain"
      data-start="0"
      data-duration="2"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="2" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="2" style="position:absolute;inset:0;width:100%;height:100%;z-index:1"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const vmax = view.vmax;
        bg.style.backgroundColor = vars.background;
        const canvas = document.getElementById("stage");
        canvas.setAttribute("data-color", vars.color);
        canvas.width = view.width;
        canvas.height = view.height;
        const variants = [
          { size: vmax * 1, color: vars.color + "99" },
          { size: vmax * 2, color: vars.color + "22" },
          { size: vmax * 1.5, color: "#808080" },
          { size: vmax * 30, color: "rgba(176, 126, 223, 0.05)" },
        ];
        const variantOf = function (particle) {
          return variants[Math.floor(particle.seed * variants.length)];
        };
        const simulator = hyperbits.createParticles({
          fps: 30,
          spawners: [{
            id: "spawner-0",
            rate: 10,
            burst: 20,
            startFrame: 100,
            max: 200,
            position: { x: view.width / 2, y: view.height * 1.1 },
            area: { width: view.width * 0.1, height: 0 },
            velocity: { x: 0, y: -view.height * 0.05, varianceX: view.width * 0.1, varianceY: view.height * 0.01 },
            lifespan: 100,
          }],
          behaviors: [{ id: "gravity", handler: hyperbits.createGravity({ y: 0.2 }) }],
        });
        const timeline = gsap.timeline({ paused: true });
        hyperbits.bind(timeline, canvas, simulator, {
          shape: "glow",
          size: function (particle) { return variantOf(particle).size * Math.SQRT1_2; },
          color: function (particle) { return variantOf(particle).color; },
          offset: function (particle) { const size = variantOf(particle).size; return { x: size / 2, y: size / 2 }; },
        });
        timeline.to({}, { duration: 2 }, 0);
        registerTimeline("particles-fountain", timeline);

      })();
    </script>
  </body>
</html>
