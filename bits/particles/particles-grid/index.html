<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Particle color","default":"#38bdf8"},{"id":"background","type":"color","label":"Background","default":"#020617"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #020617;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #020617;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="particles-grid"
      data-start="0"
      data-duration="6.67"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="6.67" style="position:absolute;inset:0;background-color:#020617"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="6.67" style="position:absolute;inset:0;width:100%;height:100%;z-index:1"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const cols = 20;
        const rows = 12;
        const cellW = view.width / cols;
        const cellH = view.height / rows;
        const simulator = hyperbits.createParticles({
          fps: 30,
          spawners: [{
            id: "grid",
            burst: cols * rows,
            startFrame: 1,
            position: { x: view.width / 2, y: view.height / 2 },
            area: { width: 0, height: 0 },
            velocity: { x: 0, y: 0 },
            lifespan: 220,
            max: cols * rows,
          }],
          behaviors: [{
            id: "lattice",
            handler: function (particle, age) {
              const col = particle.index % cols;
              const row = Math.floor(particle.index / cols);
              particle.position.x = cellW * (col + 0.5);
              particle.position.y = cellH * (row + 0.5);
              particle.opacity = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(age * 0.12 + col * 0.45 + row * 0.35));
            },
          }],
        });
        const timeline = gsap.timeline({ paused: true });
        hyperbits.bind(timeline, canvas, simulator, {
          color: vars.color,
          size: view.vmin * 1.4,
          glow: 1.2,
          shape: "circle",
        });
        timeline.fromTo(canvas, { x: 0 }, { x: 0.5, duration: 6.67, ease: "none" }, 0);
        registerTimeline("particles-grid", timeline);

      })();
    </script>
  </body>
</html>
