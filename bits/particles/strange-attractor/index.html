<!doctype html>
<html lang="en" data-composition-variables='[{"id":"title","type":"string","label":"Title","default":"Lorenz system"},{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Thread ink","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#ec8b49"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Mono";
        font-weight: 500;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-500-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist Sans";
        font-weight: 600;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-600-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ec8b49;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #panel {
        position: absolute;
        color: #f2f0e5;
      }
      #panel .title {
        font-family: "Geist Sans", ui-sans-serif, system-ui, sans-serif;
        font-weight: 600;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      #panel .row {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-weight: 500;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="strange-attractor"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="10"></canvas>
      <div id="panel" class="clip" data-start="0" data-duration="10"></div>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + Math.round(rgb[0]) + ", " + Math.round(rgb[1]) + ", " + Math.round(rgb[2]) + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mixRgb(from, to, amount) {
          return [from[0] + (to[0] - from[0]) * amount, from[1] + (to[1] - from[1]) * amount, from[2] + (to[2] - from[2]) * amount];
        }
        function progressOf(time, start, length) {
          return Math.min(Math.max((time - start) / length, 0), 1);
        }

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const panel = document.getElementById("panel");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const duration = 10;
        const back = channels(vars.background);
        const fore = channels(vars.foreground);
        const accent = channels(vars.accent);
        const sigma = 10;
        const rho = 28;
        const beta = 8 / 3;
        function derivative(state) {
          return [sigma * (state[1] - state[0]), state[0] * (rho - state[2]) - state[1], state[0] * state[1] - beta * state[2]];
        }
        const total = 9000;
        const step = 0.0075;
        const points = new Float32Array(total * 3);
        let state = [0.1, 0, 0];
        for (let warm = 0; warm < 300; warm += 1) {
          const first = derivative(state);
          state = state.map((value, axis) => value + first[axis] * step);
        }
        for (let index = 0; index < total; index += 1) {
          const first = derivative(state);
          const second = derivative(state.map((value, axis) => value + (first[axis] * step) / 2));
          const third = derivative(state.map((value, axis) => value + (second[axis] * step) / 2));
          const fourth = derivative(state.map((value, axis) => value + third[axis] * step));
          state = state.map((value, axis) => value + (step / 6) * (first[axis] + 2 * second[axis] + 2 * third[axis] + fourth[axis]));
          points[index * 3] = state[0];
          points[index * 3 + 1] = state[1];
          points[index * 3 + 2] = state[2] - 25;
        }
        const projected = new Float32Array(total * 3);
        const bands = 12;
        function draw(time) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const grow = hyperbits.Easing.easeInOutCubic(progressOf(time, 0.2, 7.4));
          const count = Math.max(2, Math.floor(total * grow));
          const yaw = -0.6 + time * 0.16;
          const pitch = 0.25;
          const cosYaw = Math.cos(yaw);
          const sinYaw = Math.sin(yaw);
          const cosPitch = Math.cos(pitch);
          const sinPitch = Math.sin(pitch);
          const scale = view.height * 0.0165;
          const centerX = view.width * 0.6;
          const centerY = view.height * 0.5;
          const camera = 120;
          for (let index = 0; index < count; index += 1) {
            const pointX = points[index * 3];
            const pointY = points[index * 3 + 1];
            const pointZ = points[index * 3 + 2];
            const turnedX = pointX * cosYaw - pointY * sinYaw;
            const turnedY = pointX * sinYaw + pointY * cosYaw;
            const liftedY = turnedY * cosPitch - pointZ * sinPitch;
            const liftedZ = turnedY * sinPitch + pointZ * cosPitch;
            const perspective = camera / (camera + liftedY);
            projected[index * 3] = centerX + turnedX * scale * perspective;
            projected[index * 3 + 1] = centerY - liftedZ * scale * perspective;
            projected[index * 3 + 2] = liftedY;
          }
          context.lineCap = "round";
          context.lineJoin = "round";
          const recent = 900;
          for (let band = 0; band < bands; band += 1) {
            const near = band / (bands - 1);
            context.beginPath();
            let open = false;
            for (let index = 1; index < count - recent; index += 1) {
              const depth = projected[index * 3 + 2];
              const level = Math.min(bands - 1, Math.max(0, Math.floor(((32 - depth) / 64) * bands)));
              if (level !== band) {
                open = false;
                continue;
              }
              if (!open) {
                context.moveTo(projected[(index - 1) * 3], projected[(index - 1) * 3 + 1]);
                open = true;
              }
              context.lineTo(projected[index * 3], projected[index * 3 + 1]);
            }
            context.strokeStyle = rgba(mixRgb(mixRgb(back, fore, 0.25), fore, near), 0.18 + near * 0.5);
            context.lineWidth = view.vmin * (0.06 + near * 0.12);
            context.stroke();
          }
          const tailStart = Math.max(1, count - recent);
          const segments = 30;
          for (let segment = 0; segment < segments; segment += 1) {
            const from = tailStart + Math.floor(((count - tailStart) * segment) / segments);
            const to = tailStart + Math.floor(((count - tailStart) * (segment + 1)) / segments);
            const heat = (segment + 1) / segments;
            context.beginPath();
            context.moveTo(projected[(from - 1) * 3], projected[(from - 1) * 3 + 1]);
            for (let index = from; index <= Math.min(to, count - 1); index += 1) context.lineTo(projected[index * 3], projected[index * 3 + 1]);
            context.strokeStyle = rgba(mixRgb(fore, accent, heat), 0.35 + heat * 0.65);
            context.lineWidth = view.vmin * (0.12 + heat * 0.28);
            context.stroke();
          }
          const headX = projected[(count - 1) * 3];
          const headY = projected[(count - 1) * 3 + 1];
          const halo = context.createRadialGradient(headX, headY, 0, headX, headY, view.vmin * 4);
          halo.addColorStop(0, rgba(accent, 0.55));
          halo.addColorStop(1, rgba(accent, 0));
          context.fillStyle = halo;
          context.beginPath();
          context.arc(headX, headY, view.vmin * 4, 0, Math.PI * 2);
          context.fill();
          context.fillStyle = rgba(fore, 1);
          context.beginPath();
          context.arc(headX, headY, view.vmin * 0.45, 0, Math.PI * 2);
          context.fill();
          const index = count - 1;
          readout.textContent = "x " + points[index * 3].toFixed(2).padStart(7, " ") + "   y " + points[index * 3 + 1].toFixed(2).padStart(7, " ") + "   z " + (points[index * 3 + 2] + 25).toFixed(2).padStart(6, " ");
        }
        panel.style.left = view.vmin * 7 + "px";
        panel.style.top = view.height * 0.5 + "px";
        panel.style.transform = "translateY(-50%)";
        const titleNode = document.createElement("div");
        titleNode.className = "title";
        titleNode.textContent = String(vars.title);
        titleNode.style.fontSize = view.vmin * 6.5 + "px";
        titleNode.style.color = vars.foreground;
        titleNode.style.marginBottom = view.vmin * 3 + "px";
        panel.append(titleNode);
        const equations = ["dx/dt = \u03c3 (y \u2212 x)", "dy/dt = x (\u03c1 \u2212 z) \u2212 y", "dz/dt = x y \u2212 \u03b2 z", "\u03c3 = 10   \u03c1 = 28   \u03b2 = 8/3"];
        const rows = equations.map((text, index) => {
          const row = document.createElement("div");
          row.className = "row";
          row.textContent = text;
          row.style.fontSize = view.vmin * 2.3 + "px";
          row.style.lineHeight = "1.7";
          row.style.color = index === 3 ? vars.accent : vars.foreground;
          row.style.opacity = index === 3 ? "1" : "0.78";
          if (index === 3) row.style.marginTop = view.vmin * 1.5 + "px";
          panel.append(row);
          return row;
        });
        const readout = document.createElement("div");
        readout.className = "row";
        readout.style.fontSize = view.vmin * 1.6 + "px";
        readout.style.marginTop = view.vmin * 4 + "px";
        readout.style.color = vars.foreground;
        readout.style.opacity = "0.5";
        readout.style.whiteSpace = "pre";
        panel.append(readout);
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: duration, duration: duration, ease: "none", onUpdate: () => draw(proxy.time) }, 0);
        timeline.fromTo(titleNode, { opacity: 0, y: view.vmin * 3 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.2);
        timeline.fromTo(rows, { opacity: 0, x: -view.vmin * 2 }, { opacity: (index) => (index === 3 ? 1 : 0.78), x: 0, duration: 0.6, stagger: 0.15, ease: "power3.out" }, 0.6);
        timeline.fromTo(readout, { opacity: 0 }, { opacity: 0.5, duration: 0.6 }, 1.4);
        draw(0);
        registerTimeline("strange-attractor", timeline);
      })();
    </script>
  </body>
</html>
