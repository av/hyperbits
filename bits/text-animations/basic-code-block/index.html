<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Accent","default":"#38bdf8"},{"id":"background","type":"color","label":"Background","default":"#0b1220"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0b1220;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0b1220;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #panel {
        width: 70%;
        background-color: #111827;
        border: 2px solid #38bdf8;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        position: relative;
        z-index: 1;
      }
      .hyperbits-code {
        margin: 0;
        background: #111827;
        color: #e5e7eb;
        white-space: pre;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 2.5vw;
        line-height: 1.55;
      }
      .hyperbits-code-line {
        display: block;
      }
      .hyperbits-code-gutter {
        display: inline-block;
        width: 3em;
        color: #64748b;
        user-select: none;
      }
      .token.keyword { color: #c084fc; }
      .token.function { color: #38bdf8; }
      .token.string { color: #86efac; }
      .token.boolean { color: #fbbf24; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="basic-code-block"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="4" style="position:absolute;inset:0;background-color:#0b1220"></div>
      <div id="panel" class="clip" data-start="0" data-duration="4"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const panel = document.getElementById("panel");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        panel.style.borderColor = vars.color;
        panel.setAttribute("data-color", vars.color);
        panel.style.padding = view.vmin * 4 + "px " + view.vmin * 5 + "px";
        panel.style.width = view.vw * 70 + "px";
        const code = "function hello() {\n  console.log(\"Hello World\");\n  return true;\n}";
        const block = hyperbits.createCodeBlock(panel, { code: code, language: "javascript", showLineNumbers: true });
        block.style.fontSize = view.vw * 2.5 + "px";
        block.style.lineHeight = "1.55";
        block.style.whiteSpace = "pre";
        const functions = panel.querySelectorAll(".token.function");
        for (let index = 0; index < functions.length; index += 1) {
          functions[index].style.color = vars.color;
        }
        const lines = hyperbits.codeLines(block);
        const timeline = gsap.timeline({ paused: true });
        hyperbits.stagger(
          lines,
          { opacity: [0, 1], y: [16, 0], duration: 0.7, stagger: 0.35, ease: "power2.out" },
          timeline,
        );
        registerTimeline("basic-code-block", timeline);

      })();
    </script>
  </body>
</html>
