<!doctype html>
<html lang="en" data-composition-variables='[{"id":"headline","type":"string","label":"Headline","default":"Low res, high taste"},{"id":"label","type":"string","label":"Label","default":"EPISODE 08 / PIXEL WORKS"},{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#ec8b49"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 800;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-800-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist Mono";
        font-weight: 500;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-500-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ec8b49;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="mosaic-resolve"
      data-start="0"
      data-duration="7"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="7" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="7"></canvas>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + Math.round(rgb[0]) + ", " + Math.round(rgb[1]) + ", " + Math.round(rgb[2]) + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mixRgb(from, to, amount) {
          return [from[0] + (to[0] - from[0]) * amount, from[1] + (to[1] - from[1]) * amount, from[2] + (to[2] - from[2]) * amount];
        }
        function progressOf(time, start, length) {
          return Math.min(Math.max((time - start) / length, 0), 1);
        }

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        canvas.setAttribute("aria-label", String(vars.headline) + " " + String(vars.label));
        const context = canvas.getContext("2d");
        const duration = 7;
        const back = channels(vars.background);
        const fore = channels(vars.foreground);
        const accent = channels(vars.accent);
        const palette = [back, mixRgb(back, accent, 0.16), mixRgb(back, accent, 0.45), accent, mixRgb(accent, fore, 0.55), fore];
        const blocks = [144, 96, 64, 44, 30, 20, 14, 10, 7, 5, 3, 2, 1];
        const stepIn = 0.13;
        const inStart = 0.35;
        const outStart = 5.3;
        const stepOut = 0.09;
        const wide = view.width > view.height * 1.2;
        const portrait = view.height > view.width * 1.1;
        let source = null;
        let sourceContext = null;
        let small = null;
        let smallContext = null;
        function blockAt(time) {
          if (time < outStart) {
            const index = Math.min(blocks.length - 1, Math.max(0, Math.floor((time - inStart) / stepIn)));
            return { block: blocks[index], vanish: time < inStart ? 1 : 0 };
          }
          const steps = blocks.length - 1;
          const index = Math.max(0, steps - Math.floor((time - outStart) / stepOut));
          const vanish = progressOf(time, outStart + steps * stepOut, 0.55);
          return { block: blocks[index], vanish };
        }
        function hash(first, second) {
          let value = Math.imul(first ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(second + 0x632be5ab, 0xc2b2ae35);
          value ^= value >>> 15;
          value = Math.imul(value, 0x27d4eb2f);
          value ^= value >>> 13;
          return (value >>> 0) / 4294967296;
        }
        function paintSource(time) {
          const target = sourceContext;
          target.fillStyle = rgba(back, 1);
          target.fillRect(0, 0, view.width, view.height);
          const sunX = wide ? view.width * 0.72 : portrait ? view.width * 0.5 : view.width * 0.64;
          const sunY = wide ? view.height * 0.5 : portrait ? view.height * 0.33 : view.height * 0.34;
          const sunRadius = view.vmin * (wide ? 30 : portrait ? 34 : 24);
          const glow = target.createRadialGradient(sunX, sunY, sunRadius * 0.6, sunX, sunY, sunRadius * 1.7);
          glow.addColorStop(0, rgba(accent, 0.22));
          glow.addColorStop(1, rgba(accent, 0));
          target.fillStyle = glow;
          target.fillRect(0, 0, view.width, view.height);
          target.save();
          target.beginPath();
          target.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
          target.clip();
          const fill = target.createLinearGradient(0, sunY - sunRadius, 0, sunY + sunRadius);
          fill.addColorStop(0, rgba(fore, 1));
          fill.addColorStop(0.45, rgba(mixRgb(accent, fore, 0.35), 1));
          fill.addColorStop(1, rgba(accent, 1));
          target.fillStyle = fill;
          target.fillRect(sunX - sunRadius, sunY - sunRadius, sunRadius * 2, sunRadius * 2);
          target.fillStyle = rgba(back, 1);
          const drift = (time * 0.35) % 1;
          for (let stripe = 0; stripe < 9; stripe += 1) {
            const amount = (stripe + drift) / 9;
            const stripeY = sunY - sunRadius * 0.05 + amount * sunRadius * 1.1;
            const thickness = sunRadius * (0.012 + amount * 0.085);
            target.fillRect(sunX - sunRadius, stripeY, sunRadius * 2, thickness);
          }
          target.restore();
          const left = view.vmin * 9;
          target.fillStyle = rgba(accent, 1);
          target.font = "500 " + view.vmin * 2.2 + "px 'Geist Mono', ui-monospace, monospace";
          target.textBaseline = "alphabetic";
          const labelY = view.height * (wide ? 0.3 : 0.6);
          target.fillText(String(vars.label), left, labelY);
          const words = String(vars.headline).split(/\s+/);
          const lines = [];
          let line = "";
          const size = view.vmin * 11.5;
          target.font = "800 " + size + "px 'Geist Sans', ui-sans-serif, system-ui, sans-serif";
          for (const word of words) {
            const candidate = line ? line + " " + word : word;
            if (target.measureText(candidate).width > (wide ? view.width * 0.52 : view.width - left * 2) && line) {
              lines.push(line);
              line = word;
            } else line = candidate;
          }
          if (line) lines.push(line);
          target.fillStyle = rgba(fore, 1);
          const shown = lines.slice(0, 3);
          shown.forEach((text, index) => target.fillText(text, left - size * 0.04, labelY + size * (1.15 + index * 1.02)));
          const ruleY = Math.max(view.height * 0.84, labelY + size * (1.6 + (shown.length - 1) * 1.02));
          target.fillStyle = rgba(mixRgb(back, fore, 0.2), 1);
          target.fillRect(left, ruleY, view.width - left * 2, Math.max(1, view.vmin * 0.2));
        }
        function nearest(red, green, blue) {
          let best = palette[0];
          let bestDistance = Infinity;
          for (const color of palette) {
            const distance = (color[0] - red) ** 2 + (color[1] - green) ** 2 + (color[2] - blue) ** 2;
            if (distance < bestDistance) {
              bestDistance = distance;
              best = color;
            }
          }
          return best;
        }
        function draw(time) {
          if (!context || typeof context.stroke !== "function") return;
          if (!source) {
            source = document.createElement("canvas");
            source.width = view.width;
            source.height = view.height;
            sourceContext = source.getContext("2d");
            small = document.createElement("canvas");
            smallContext = small.getContext("2d", { willReadFrequently: true });
          }
          paintSource(time);
          context.clearRect(0, 0, view.width, view.height);
          const { block, vanish } = blockAt(time);
          if (vanish >= 1) return;
          const size = Math.max(1, Math.round((block * view.vmin) / 10.8));
          if (size <= 1 && vanish === 0) {
            context.drawImage(source, 0, 0);
            return;
          }
          const columns = Math.ceil(view.width / size);
          const rows = Math.ceil(view.height / size);
          small.width = columns;
          small.height = rows;
          smallContext.imageSmoothingEnabled = true;
          smallContext.imageSmoothingQuality = "high";
          smallContext.drawImage(source, 0, 0, columns, rows);
          if (size >= 6) {
            const pixels = smallContext.getImageData(0, 0, columns, rows);
            const data = pixels.data;
            for (let index = 0; index < columns * rows; index += 1) {
              const column = index % columns;
              const row = Math.floor(index / columns);
              let color = nearest(data[index * 4], data[index * 4 + 1], data[index * 4 + 2]);
              if (vanish > 0 && hash(column * 977 + row, size) < vanish) color = back;
              data[index * 4] = color[0];
              data[index * 4 + 1] = color[1];
              data[index * 4 + 2] = color[2];
              data[index * 4 + 3] = 255;
            }
            smallContext.putImageData(pixels, 0, 0);
          }
          context.imageSmoothingEnabled = false;
          context.drawImage(small, 0, 0, columns * size, rows * size);
          if (size >= 10) {
            context.fillStyle = rgba(back, 0.55);
            const gap = Math.max(1, size * 0.06);
            for (let column = 1; column < columns; column += 1) context.fillRect(column * size - gap / 2, 0, gap, view.height);
            for (let row = 1; row < rows; row += 1) context.fillRect(0, row * size - gap / 2, view.width, gap);
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: duration, duration: duration, ease: "none", onUpdate: () => draw(proxy.time) }, 0);
        draw(0);
        registerTimeline("mosaic-resolve", timeline);
      })();
    </script>
  </body>
</html>
