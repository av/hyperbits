<!doctype html>
<html lang="en" data-composition-variables='[{"id":"text","type":"string","label":"Text","default":"Ah, those sunny days!"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0f172a;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #line {
        color: #f8fafc;
        font-weight: 600;
        display: flex;
        align-items: baseline;
      }
      #cursor {
        display: inline-block;
        width: 0.08em;
        background-color: #38bdf8;
        margin-left: 0.08em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="basic-typewriter"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="line" class="clip" data-start="0" data-duration="5">
        <span id="typed"></span><span id="cursor">&nbsp;</span>
      </div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const view = hyperbits.viewport();
        const typed = document.getElementById("typed");
        const cursor = document.getElementById("cursor");
        const line = document.getElementById("line");
        line.style.fontSize = view.vmin * 8 + "px";
        cursor.style.height = view.vmin * 8 + "px";
        typed.textContent = vars.text;
        const writer = hyperbits.typewriter(typed, { duration: 3.2, delay: 0.2 });
        const timeline = gsap.timeline({ paused: true });
        const proxy = { time: 0 };
        timeline.to(proxy, {
          time: 5,
          duration: 5,
          ease: "none",
          onUpdate: function () { writer.apply(proxy.time); },
        }, 0);
        timeline.fromTo(cursor, { opacity: 1 }, { opacity: 0, duration: 0.4, repeat: 12, yoyo: true, ease: "none" }, 0);
        registerTimeline("basic-typewriter", timeline);

      })();
    </script>
  </body>
</html>
