<!doctype html>
<html lang="en" data-composition-variables='[{"id":"text","type":"string","label":"Text","default":"Ah, those sunny days!"},{"id":"color","type":"color","label":"Text color","default":"#fcc192"},{"id":"background","type":"color","label":"Background","default":"#100f0f"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Geist Sans", Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #line {
        position: relative;
        z-index: 1;
        color: #fcc192;
        font-weight: 700;
      }
      #cursor {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="basic-typewriter"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="5" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <span id="line" class="clip" data-start="0" data-duration="5"><span id="typed"></span><span id="cursor">|</span></span>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const line = document.getElementById("line");
        const typed = document.getElementById("typed");
        const cursor = document.getElementById("cursor");
        const text = String(vars.text);
        line.setAttribute("aria-label", text);
        line.style.color = vars.color;
        line.style.fontSize = vmin * 8 + "px";
        const typeSpeed = 3;
        const blinkSpeed = 30;
        const proxy = { time: 0 };
        function render() {
          const frame = Math.round(proxy.time * 30);
          const visible = Math.min(text.length, Math.floor(frame / typeSpeed));
          typed.textContent = text.slice(0, visible);
          cursor.style.opacity = frame % blinkSpeed < blinkSpeed / 2 ? "1" : "0";
        }
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: 5, duration: 5, ease: "none", onUpdate: render }, 0);
        render();
        registerTimeline("basic-typewriter", timeline);

      })();
    </script>
  </body>
</html>
