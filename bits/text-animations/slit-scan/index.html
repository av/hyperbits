<!doctype html>
<html lang="en" data-composition-variables='[{"id":"headline","type":"string","label":"Headline","default":"Time bends"},{"id":"label","type":"string","label":"Label","default":"SLIT-SCAN / 480 SLICES"},{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Text","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Echo","default":"#ec8b49"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 800;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-800-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist Mono";
        font-weight: 500;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-500-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ec8b49;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #label {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-weight: 500;
        letter-spacing: 0.24em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="slit-scan"
      data-start="0"
      data-duration="7"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="7" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="7"></canvas>
      <div id="label" class="clip" data-start="0" data-duration="7"></div>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + Math.round(rgb[0]) + ", " + Math.round(rgb[1]) + ", " + Math.round(rgb[2]) + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const label = document.getElementById("label");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        canvas.setAttribute("aria-label", String(vars.headline));
        const context = canvas.getContext("2d");
        const duration = 7;
        const fore = channels(vars.foreground);
        const accent = channels(vars.accent);
        const slices = 480;
        const sliceWidth = view.width / slices;
        const font = "800 FONTSIZEpx 'Geist Sans', ui-sans-serif, system-ui, sans-serif";
        let sprites = null;
        let spritesReady = false;
        function buildSprites() {
          const make = (color) => {
            const sprite = document.createElement("canvas");
            sprite.width = view.width;
            sprite.height = view.height;
            const spriteContext = sprite.getContext("2d");
            let size = view.vmin * 19;
            spriteContext.font = font.replace("FONTSIZE", String(size));
            const width = spriteContext.measureText(String(vars.headline)).width;
            if (width > view.width * 0.86) size *= (view.width * 0.86) / width;
            const fontString = font.replace("FONTSIZE", String(size));
            spriteContext.font = fontString;
            spriteContext.textAlign = "center";
            spriteContext.textBaseline = "middle";
            spriteContext.fillStyle = rgba(color, 1);
            spriteContext.fillText(String(vars.headline), view.width / 2, view.height * 0.46);
            spritesReady = !document.fonts || document.fonts.check(fontString);
            return sprite;
          };
          return { text: make(fore), echo: make(accent) };
        }
        function stateAt(time) {
          const enter = hyperbits.Easing.easeOutCubic(Math.min(1, Math.max(0, (time - 0.3) / 1.6)));
          const leave = hyperbits.Easing.easeInCubic(Math.min(1, Math.max(0, (time - 5) / 1.5)));
          const wobble = Math.sin(time * 6) * Math.exp(-Math.max(0, time - 1.9) * 2.2) * 0.06 * (time > 1.9 ? 1 : 0);
          return {
            offset: (1 - enter) * view.height * 0.9 - leave * view.height * 0.9,
            stretch: 1 + (1 - enter) * 2.4 + leave * 2.4 + wobble,
            alpha: Math.min(1, enter * 1.5) * (1 - Math.max(0, leave - 0.6) / 0.4),
          };
        }
        function drawSlices(sprite, time, lag, alpha) {
          for (let slice = 0; slice < slices; slice += 1) {
            const centre = slice / slices;
            const delay = (Math.sin(centre * Math.PI * 2.2 + 0.6) * 0.5 + 0.5) * 0.55 + centre * 0.35 + lag;
            const state = stateAt(time - delay);
            if (state.alpha <= 0) continue;
            const sourceX = slice * sliceWidth;
            const pivot = view.height * 0.46;
            const height = view.height * state.stretch;
            context.globalAlpha = state.alpha * alpha;
            context.drawImage(sprite, sourceX, 0, sliceWidth, view.height, sourceX, pivot - pivot * state.stretch + state.offset, sliceWidth + 0.6, height);
          }
          context.globalAlpha = 1;
        }
        function draw(time) {
          if (!context || typeof context.stroke !== "function") return;
          if (!sprites || !spritesReady) sprites = buildSprites();
          context.clearRect(0, 0, view.width, view.height);
          drawSlices(sprites.echo, time, 0.22, 0.85);
          drawSlices(sprites.text, time, 0, 1);
        }
        label.textContent = String(vars.label);
        label.style.fontSize = view.vmin * 2 + "px";
        label.style.top = view.height * 0.66 + "px";
        label.style.color = vars.accent;
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: duration, duration: duration, ease: "none", onUpdate: () => draw(proxy.time) }, 0);
        timeline.fromTo(label, { opacity: 0, y: view.vmin * 1.5 }, { opacity: 0.8, y: 0, duration: 1, ease: "power3.out" }, 2.3);
        timeline.to(label, { opacity: 0, duration: 0.4 }, 4.9);
        if (document.fonts && document.fonts.load) {
          document.fonts.load(font.replace("FONTSIZE", "64")).then(() => {
            sprites = null;
            draw(proxy.time);
          });
        }
        draw(0);
        registerTimeline("slit-scan", timeline);
      })();
    </script>
  </body>
</html>
