<!doctype html>
<html lang="en" data-composition-variables='[{"id":"command","type":"string","label":"Command","default":"npm install hyperbits"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #1e1e1e;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #1e1e1e;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #1e1e1e;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root {
        display: flex;
        justify-content: center;
        background-color: #1e1e1e;
        font-family: ui-monospace, monospace;
        color: #d4d4d4;
      }
      #term {
        width: 86%;
        margin-top: 8%;
        line-height: 1.55;
      }
      .row { display: flex; gap: 0.6em; }
      .ok { color: #4ec9b0; }
      .path { color: #569cd6; }
      .cmd { color: #ce9178; }
      .out { color: #d4d4d4; white-space: pre-wrap; }
      #cursor { width: 0.55em; background-color: #d4d4d4; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="cli-simulation"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <div id="term" class="clip" data-start="0" data-duration="15">
        <div class="row">
          <span class="ok">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4ec9b0" stroke-width="2.4"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
          </span>
          <span class="path">~</span>
          <span id="command" class="cmd"></span>
          <span id="cursor">&nbsp;</span>
        </div>
        <div id="output" class="out"></div>
      </div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const view = hyperbits.viewport();
        const term = document.getElementById("term");
        const commandEl = document.getElementById("command");
        const outputEl = document.getElementById("output");
        const cursor = document.getElementById("cursor");
        term.style.fontSize = view.vmin * 3 + "px";
        const command = String(vars.command);
        commandEl.textContent = command;
        const commandWriter = hyperbits.typewriter(commandEl, { duration: 100 / 30, delay: 0 });
        const logs = ["Package found", "Dependencies resolved", "Installing...", "Done in 1.4s"];
        outputEl.textContent = logs.map(function (line) { return "  " + line; }).join("\n");
        const outputWriter = hyperbits.typewriter(outputEl, { duration: 2.4, delay: 90 / 30 });
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, {
          time: 15,
          duration: 15,
          ease: "none",
          onUpdate: function () {
            commandWriter.apply(proxy.time);
            outputWriter.apply(proxy.time);
            cursor.style.opacity = proxy.time < 100 / 30 ? (Math.floor(proxy.time * 2) % 2 === 0 ? "1" : "0") : "0";
          },
        }, 0);
        registerTimeline("cli-simulation", timeline);

      })();
    </script>
  </body>
</html>
