<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Rain color","default":"#00FF41"},{"id":"fontSize","type":"number","label":"Font size (px at 1080p)","default":30},{"id":"speed","type":"number","label":"Speed","default":1},{"id":"density","type":"number","label":"Density (0-1)","default":1},{"id":"streamLength","type":"number","label":"Stream length","default":15},{"id":"background","type":"color","label":"Background","default":"#100f0f"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Mono";
        font-weight: 400;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-400-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist Mono";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #rain {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="matrix-rain"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="rain" class="clip" data-start="0" data-duration="10"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        const canvas = document.getElementById("rain");
        canvas.setAttribute("data-color", vars.color);
        canvas.width = view.width;
        canvas.height = view.height;
        let context = null;
        try {
          context = canvas.getContext("2d");
        } catch (err) {
          context = null;
        }
        const fontSize = (Number(vars.fontSize) || 30) * (view.height / 1080);
        const color = String(vars.color);
        const speed = Number(vars.speed) || 1;
        const density = Math.min(Math.max(Number(vars.density) || 0, 0), 1);
        const streamLength = Number(vars.streamLength) || 15;
        const charset = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz$+-*/=%\"'#&_(),.;:?!\\|{}<>[]^~";
        const cols = Math.floor(view.width / fontSize);
        const rows = Math.ceil(view.height / fontSize);
        const effectiveHeight = view.height + streamLength * fontSize;
        const streams = [];
        for (let index = 0; index < cols; index += 1) {
          streams.push({
            isVisible: hyperbits.random(index) < density,
            speed: speed * (0.5 + hyperbits.random(index + 1) * 1.5),
            offset: hyperbits.random(index + 2) * effectiveHeight,
            seed: index,
          });
        }
        const fontFamily = '"Geist Mono", "JetBrains Mono", ui-monospace, monospace';
        const proxy = { time: 0 };
        function draw() {
          if (!context) return;
          const frame = Math.round(proxy.time * 30);
          context.clearRect(0, 0, canvas.width, canvas.height);
          context.textBaseline = "top";
          for (let colIndex = 0; colIndex < streams.length; colIndex += 1) {
            const stream = streams[colIndex];
            if (!stream.isVisible) continue;
            const headY = (frame * stream.speed * fontSize + stream.offset) % effectiveHeight;
            for (let row = 0; row < rows; row += 1) {
              const y = row * fontSize;
              const distInChars = (headY - y) / fontSize;
              if (distInChars < 0 || distInChars >= streamLength) continue;
              const isHead = distInChars < 1;
              const charSeed = stream.seed * 1000 + row * 100 + Math.floor(frame / 4);
              const glyph = charset[Math.floor(hyperbits.random(charSeed) * charset.length)];
              context.globalAlpha = isHead ? 1 : 1 - distInChars / streamLength;
              context.fillStyle = isHead ? "#FFFFFF" : color;
              context.font = (isHead ? "bold " : "") + fontSize + "px " + fontFamily;
              context.shadowBlur = isHead ? 8 * (view.height / 1080) : 0;
              context.shadowColor = isHead ? "#FFFFFF" : "rgba(0, 0, 0, 0)";
              context.fillText(glyph, colIndex * fontSize, y);
            }
          }
          context.globalAlpha = 1;
          context.shadowBlur = 0;
        }
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: 10, duration: 10, ease: "none", onUpdate: draw }, 0);
        draw();
        registerTimeline("matrix-rain", timeline);

      })();
    </script>
  </body>
</html>
