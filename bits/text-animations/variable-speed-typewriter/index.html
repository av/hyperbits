<!doctype html>
<html lang="en" data-composition-variables='[{"id":"text","type":"string","label":"Text","default":"Typing with errors and variable speed..."},{"id":"color","type":"color","label":"Text color","default":"#ff6b6b"},{"id":"background","type":"color","label":"Background","default":"#100f0f"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Mono";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #line {
        position: relative;
        z-index: 1;
        color: #fcc192;
        font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
        font-weight: 700;
      }
      #cursor {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="variable-speed-typewriter"
      data-start="0"
      data-duration="13.33"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="13.33" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <span id="line" class="clip" data-start="0" data-duration="13.33"><span id="typed"></span><span id="cursor">_</span></span>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const line = document.getElementById("line");
        const typed = document.getElementById("typed");
        const cursor = document.getElementById("cursor");
        const text = String(vars.text);
        line.setAttribute("aria-label", text);
        line.style.color = vars.color;
        line.style.fontSize = vmin * 6 + "px";
        const KEYBOARD_CHARS = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,!? ";
        const errorRate = 0.1;
        const errorCorrectDelay = 10;
        const deleteSpeed = 2;
        const blinkSpeed = 20;
        const events = [{ frame: 0, text: "" }];
        let floatFrame = 0;
        let current = "";
        function push() { events.push({ frame: Math.round(floatFrame), text: current }); }
        const length = text.length;
        for (let index = 0; index < length; index += 1) {
          const progress = index / Math.max(1, length);
          const charSeed = "typewriter-0-" + index;
          const typeSpeed = hyperbits.interpolateKeyframes([2, 10, 2], progress);
          if (hyperbits.random(charSeed) < errorRate) {
            const wrongChar = KEYBOARD_CHARS[hyperbits.randomInt(charSeed + "-wrong", 0, KEYBOARD_CHARS.length - 1)];
            floatFrame += typeSpeed;
            current += wrongChar;
            push();
            floatFrame += errorCorrectDelay;
            push();
            floatFrame += deleteSpeed;
            current = current.slice(0, -1);
            push();
          }
          floatFrame += typeSpeed;
          current += text[index];
          push();
        }
        const proxy = { time: 0 };
        function render() {
          const frame = Math.round(proxy.time * 30);
          let active = 0;
          for (let index = 0; index < events.length; index += 1) {
            if (events[index].frame <= frame) active = index; else break;
          }
          typed.textContent = events[active].text;
          cursor.style.opacity = frame % blinkSpeed < blinkSpeed / 2 ? "1" : "0";
        }
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: 13.33, duration: 13.33, ease: "none", onUpdate: render }, 0);
        render();
        registerTimeline("variable-speed-typewriter", timeline);

      })();
    </script>
  </body>
</html>
