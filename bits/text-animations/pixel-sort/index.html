<!doctype html>
<html lang="en" data-composition-variables='[{"id":"headline","type":"string","label":"Headline","default":"Sorted by light"},{"id":"label","type":"string","label":"Label","default":"SIDE A / TRACK 04"},{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#ec8b49"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 800;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-800-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist Mono";
        font-weight: 500;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-500-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ec8b49;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="pixel-sort"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="8" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="8"></canvas>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + Math.round(rgb[0]) + ", " + Math.round(rgb[1]) + ", " + Math.round(rgb[2]) + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mixRgb(from, to, amount) {
          return [from[0] + (to[0] - from[0]) * amount, from[1] + (to[1] - from[1]) * amount, from[2] + (to[2] - from[2]) * amount];
        }
        function smoothstep(edge0, edge1, value) {
          const amount = Math.min(Math.max((value - edge0) / (edge1 - edge0), 0), 1);
          return amount * amount * (3 - 2 * amount);
        }

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        canvas.setAttribute("aria-label", String(vars.headline) + " " + String(vars.label));
        const context = canvas.getContext("2d");
        const duration = 8;
        const back = channels(vars.background);
        const fore = channels(vars.foreground);
        const accent = channels(vars.accent);
        const pixel = Math.max(2, Math.round(view.vmin * 0.3));
        const bufferWidth = Math.ceil(view.width / pixel);
        const bufferHeight = Math.ceil(view.height / pixel);
        let source = null;
        let sourceContext = null;
        let small = null;
        let smallContext = null;
        let pixels = null;
        let luminance = null;
        const runIndexes = [];
        function hash(first, second) {
          let value = Math.imul(first ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(second + 0x632be5ab, 0xc2b2ae35);
          value ^= value >>> 15;
          value = Math.imul(value, 0x27d4eb2f);
          value ^= value >>> 13;
          return (value >>> 0) / 4294967296;
        }
        function paintSource(time) {
          const target = sourceContext;
          const sky = target.createLinearGradient(0, 0, 0, view.height);
          sky.addColorStop(0, rgba(back, 1));
          sky.addColorStop(0.5, rgba(mixRgb(back, accent, 0.35), 1));
          sky.addColorStop(0.66, rgba(accent, 1));
          sky.addColorStop(0.67, rgba(back, 1));
          sky.addColorStop(1, rgba(mixRgb(back, accent, 0.15), 1));
          target.fillStyle = sky;
          target.fillRect(0, 0, view.width, view.height);
          const sunX = view.width * 0.5;
          const horizon = view.height * 0.665;
          const sunRadius = view.vmin * 26;
          target.save();
          target.beginPath();
          target.rect(0, 0, view.width, horizon);
          target.clip();
          const sun = target.createLinearGradient(0, horizon - sunRadius, 0, horizon);
          sun.addColorStop(0, rgba(fore, 1));
          sun.addColorStop(1, rgba(accent, 1));
          target.fillStyle = sun;
          target.beginPath();
          target.arc(sunX, horizon + sunRadius * 0.15, sunRadius, 0, Math.PI * 2);
          target.fill();
          target.restore();
          target.strokeStyle = rgba(mixRgb(back, accent, 0.6), 1);
          target.lineWidth = Math.max(1, view.vmin * 0.18);
          for (let line = 1; line < 9; line += 1) {
            const depth = (line + ((time * 0.8) % 1)) / 9;
            const lineY = horizon + (view.height - horizon) * depth * depth;
            target.beginPath();
            target.moveTo(0, lineY);
            target.lineTo(view.width, lineY);
            target.stroke();
          }
          for (let ray = -8; ray <= 8; ray += 1) {
            target.beginPath();
            target.moveTo(sunX + ray * view.vmin * 3, horizon);
            target.lineTo(sunX + ray * view.vmin * 40, view.height);
            target.stroke();
          }
          target.fillStyle = rgba(fore, 1);
          target.textAlign = "center";
          target.textBaseline = "alphabetic";
          let size = view.vmin * 13;
          target.font = "800 " + size + "px 'Geist Sans', ui-sans-serif, system-ui, sans-serif";
          const width = target.measureText(String(vars.headline)).width;
          if (width > view.width * 0.86) {
            size *= (view.width * 0.86) / width;
            target.font = "800 " + size + "px 'Geist Sans', ui-sans-serif, system-ui, sans-serif";
          }
          target.fillText(String(vars.headline), sunX, view.height * 0.37);
          target.font = "500 " + view.vmin * 2.4 + "px 'Geist Mono', ui-monospace, monospace";
          target.fillStyle = rgba(accent, 1);
          target.fillText(String(vars.label), sunX, view.height * 0.37 + view.vmin * 7);
          target.textAlign = "left";
        }
        function amountAt(time) {
          const intro = 1 - smoothstep(0.3, 2.6, time);
          return intro;
        }
        function draw(time) {
          if (!context || typeof context.stroke !== "function") return;
          if (!source) {
            source = document.createElement("canvas");
            source.width = view.width;
            source.height = view.height;
            sourceContext = source.getContext("2d");
            small = document.createElement("canvas");
            small.width = bufferWidth;
            small.height = bufferHeight;
            smallContext = small.getContext("2d", { willReadFrequently: true });
            luminance = new Float32Array(bufferHeight);
          }
          paintSource(time);
          const intro = amountAt(time);
          const bandCenter = ((time - 4.4) / 2.2) * (bufferWidth * 1.4) - bufferWidth * 0.2;
          const bandActive = time > 4.4 && time < 6.6;
          const outro = smoothstep(7, 7.9, time);
          context.clearRect(0, 0, view.width, view.height);
          if (intro <= 0.001 && !bandActive && outro <= 0) {
            context.drawImage(source, 0, 0);
            return;
          }
          smallContext.imageSmoothingEnabled = true;
          smallContext.drawImage(source, 0, 0, bufferWidth, bufferHeight);
          pixels = smallContext.getImageData(0, 0, bufferWidth, bufferHeight);
          const data = pixels.data;
          const frame = Math.floor(time * 12);
          for (let column = 0; column < bufferWidth; column += 1) {
            let strength = Math.max(intro, outro);
            if (bandActive) strength = Math.max(strength, Math.max(0, 1 - Math.abs(column - bandCenter) / (bufferWidth * 0.12)));
            strength *= 0.55 + 0.45 * hash(column, frame);
            if (strength <= 0.02) continue;
            const threshold = 0.95 - strength * 0.8;
            for (let row = 0; row < bufferHeight; row += 1) {
              const offset = (row * bufferWidth + column) * 4;
              luminance[row] = (data[offset] * 0.299 + data[offset + 1] * 0.587 + data[offset + 2] * 0.114) / 255;
            }
            let row = 0;
            while (row < bufferHeight) {
              if (luminance[row] < threshold) {
                row += 1;
                continue;
              }
              const start = row;
              while (row < bufferHeight && luminance[row] >= threshold * 0.85) row += 1;
              const end = Math.min(bufferHeight, row + Math.floor(strength * bufferHeight * 0.35 * hash(column * 7 + start, frame + 1)));
              if (end - start < 3) continue;
              runIndexes.length = 0;
              for (let index = start; index < end; index += 1) runIndexes.push(index);
              const colors = runIndexes.map((index) => {
                const offset = (index * bufferWidth + column) * 4;
                return [data[offset], data[offset + 1], data[offset + 2], luminance[index]];
              });
              colors.sort((left, right) => right[3] - left[3]);
              runIndexes.forEach((index, order) => {
                const offset = (index * bufferWidth + column) * 4;
                data[offset] = colors[order][0];
                data[offset + 1] = colors[order][1];
                data[offset + 2] = colors[order][2];
              });
              row = end;
            }
          }
          smallContext.putImageData(pixels, 0, 0);
          context.imageSmoothingEnabled = false;
          context.drawImage(small, 0, 0, bufferWidth * pixel, bufferHeight * pixel);
          if (outro > 0) {
            context.fillStyle = rgba(back, outro);
            context.fillRect(0, 0, view.width, view.height);
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: duration, duration: duration, ease: "none", onUpdate: () => draw(proxy.time) }, 0);
        draw(0);
        registerTimeline("pixel-sort", timeline);
      })();
    </script>
  </body>
</html>
