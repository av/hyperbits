<!doctype html>
<html lang="en" data-composition-variables='[{"id":"prefix","type":"string","label":"Prefix","default":"width:"},{"id":"postfix","type":"string","label":"Postfix","default":"px"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0f172a;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { display: flex; align-items: center; justify-content: center; }
      #value {
        color: #f8fafc;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="basic-counter"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div id="value" class="clip" data-start="0" data-duration="4">width: 0px</div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const view = hyperbits.viewport();
        const valueEl = document.getElementById("value");
        valueEl.style.fontSize = view.vmin * 8 + "px";
        const counter = hyperbits.createCounter(valueEl, {
          prefix: vars.prefix + " ",
          postfix: vars.postfix,
        });
        const timeline = gsap.timeline({ paused: true });
        timeline.fromTo(counter.proxy, { value: 0 }, { value: 10, duration: 0.8, ease: "power2.out", onUpdate: counter.apply }, 0);
        timeline.to(counter.proxy, { value: 10, duration: 0.4, onUpdate: counter.apply }, 0.8);
        timeline.to(counter.proxy, { value: 50, duration: 1.2, ease: "power2.inOut", onUpdate: counter.apply }, 1.2);
        timeline.to(counter.proxy, { value: 10, duration: 1.2, ease: "power2.inOut", onUpdate: counter.apply }, 2.4);
        registerTimeline("basic-counter", timeline);

      })();
    </script>
  </body>
</html>
