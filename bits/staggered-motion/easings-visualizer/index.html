<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Dot color","default":"#38bdf8"},{"id":"background","type":"color","label":"Background","default":"#09090b"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #09090b;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #09090b;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #board {
        display: flex;
        flex-direction: column;
        width: 70%;
        position: relative;
        z-index: 1;
      }
      .row {
        display: flex;
        align-items: center;
      }
      .label {
        color: #e2e8f0;
        font-weight: 600;
        width: 28%;
        font-size: 4vmin;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        flex-shrink: 0;
        z-index: 2;
      }
      .track {
        flex: 1;
        height: 1.8vmin;
        background-color: #1e293b;
        border-radius: 99px;
        position: relative;
      }
      .dot {
        position: absolute;
        top: 50%;
        left: 0;
        width: 5.5vmin;
        height: 5.5vmin;
        margin-top: -2.75vmin;
        border-radius: 1vmin;
        background-color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="easings-visualizer"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="3" style="position:absolute;inset:0;background-color:#09090b"></div>
      <div id="board" class="clip" data-start="0" data-duration="3"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const board = document.getElementById("board");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        const boardWidth = view.width * 0.7;
        const labelWidth = boardWidth * 0.22;
        const rowGap = view.vmin * 3.2;
        const dotSize = view.vmin * 5.5;
        const trackWidth = boardWidth - labelWidth - rowGap;
        const travel = Math.max(trackWidth - dotSize, view.vmin * 20);
        board.style.width = boardWidth + "px";
        board.style.gap = view.vmin * 3.2 + "px";
        const easings = ["none", "power1.out", "power2.out", "power3.inOut", "back.out", "elastic.out"];
        const dots = [];
        for (const easing of easings) {
          const row = document.createElement("div");
          row.className = "row";
          row.style.gap = rowGap + "px";
          const label = document.createElement("div");
          label.className = "label";
          label.textContent = easing;
          label.style.width = labelWidth + "px";
          label.style.fontSize = view.vmin * 4 + "px";
          label.setAttribute("data-layout-allow-occlusion", "");
          const track = document.createElement("div");
          track.className = "track";
          track.style.height = view.vmin * 1.8 + "px";
          const dot = document.createElement("div");
          dot.className = "dot";
          dot.style.width = dotSize + "px";
          dot.style.height = dotSize + "px";
          dot.style.marginTop = -dotSize / 2 + "px";
          dot.style.borderRadius = view.vmin * 0.8 + "px";
          dot.style.backgroundColor = vars.color;
          track.append(dot);
          row.append(label, track);
          board.append(row);
          dots.push({ dot: dot, easing: easing });
        }
        const timeline = gsap.timeline({ paused: true });
        dots.forEach(function (item) {
          timeline.fromTo(item.dot, { x: 0 }, { x: travel, duration: 2.2, ease: item.easing }, 0.2);
        });
        registerTimeline("easings-visualizer", timeline);

      })();
    </script>
  </body>
</html>
