<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Square color","default":"#3b82f6"},{"id":"background","type":"color","label":"Background","default":"#09090b"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Mono";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #09090b;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background-color: #09090b;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #board {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        color: #e4e4e7;
        font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
        font-weight: 700;
        overflow: hidden;
      }
      .row {
        display: flex;
        align-items: center;
      }
      .label {
        opacity: 0.8;
        flex-shrink: 0;
      }
      .track {
        flex: 1;
        position: relative;
      }
      .dot {
        border-radius: 4px;
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
      }
      #caption {
        position: absolute;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="easings-visualizer"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="3" style="position:absolute;inset:0;background-color:#09090b"></div>
      <div id="board" class="clip" data-start="0" data-duration="3"><div id="caption">Duration: 60 frames</div></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const board = document.getElementById("board");
        const caption = document.getElementById("caption");
        const easings = [
          { label: "linear", value: hyperbits.Easing.linear },
          { label: "easeInQuad", value: hyperbits.Easing.easeInQuad },
          { label: "easeOutQuad", value: hyperbits.Easing.easeOutQuad },
          { label: "easeInOutQuad", value: hyperbits.Easing.easeInOutQuad },
          { label: "easeInCubic", value: hyperbits.Easing.easeInCubic },
          { label: "easeOutCubic", value: hyperbits.Easing.easeOutCubic },
          { label: "easeInOutCubic", value: hyperbits.Easing.easeInOutCubic },
          { label: "spring", value: hyperbits.Easing.spring },
          { label: "steps(5)", value: hyperbits.steps(5) },
        ];
        const labelWidth = Math.max(view.width * 0.2, 120 * unit);
        const trackWidth = view.width - labelWidth - 40 * unit;
        const verticalPadding = 40 * unit;
        const itemHeight = (view.height - verticalPadding * 2) / easings.length;
        const squareSize = Math.min(itemHeight * 0.6, 40 * unit);
        const travel = trackWidth - squareSize;
        board.style.padding = verticalPadding + "px " + 20 * unit + "px";
        caption.style.bottom = 10 * unit + "px";
        caption.style.right = 20 * unit + "px";
        caption.style.fontSize = 12 * unit + "px";
        const timeline = gsap.timeline({ paused: true });
        easings.forEach(function (item, index) {
          const row = document.createElement("div");
          row.className = "row";
          row.style.height = itemHeight + "px";
          if (index < easings.length - 1) row.style.borderBottom = unit + "px solid #27272a";
          const label = document.createElement("div");
          label.className = "label";
          label.textContent = item.label;
          label.style.width = labelWidth + "px";
          label.style.paddingRight = 10 * unit + "px";
          label.style.fontSize = Math.min(itemHeight * 0.4, 16 * unit) + "px";
          const track = document.createElement("div");
          track.className = "track";
          const dot = document.createElement("div");
          dot.className = "dot";
          dot.style.width = squareSize + "px";
          dot.style.height = squareSize + "px";
          dot.style.borderRadius = 4 * unit + "px";
          dot.style.backgroundColor = vars.color;
          track.append(dot);
          row.append(label, track);
          board.insertBefore(row, caption);
          timeline.fromTo(dot, { x: 0 }, { x: travel, duration: 2, ease: item.value }, 0);
        });
        timeline.to({}, { duration: 3 }, 0);
        registerTimeline("easings-visualizer", timeline);

      })();
    </script>
  </body>
</html>
