<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #020617;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #020617;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #020617;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { background-color: #020617; }
      #stage { position: absolute; inset: 8%; }
      .tile { position: absolute; border-radius: 18px; overflow: hidden; }
      .swatch { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="mosaic-reframe"
      data-start="0"
      data-duration="9"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage" class="clip" data-start="0" data-duration="9"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const view = hyperbits.viewport();
        const stage = document.getElementById("stage");
        const colors = ["#0ea5e9", "#6366f1", "#f43f5e", "#f59e0b", "#22c55e", "#14b8a6", "#e879f9", "#94a3b8", "#f97316", "#38bdf8", "#a3e635", "#f472b6"];
        const tiles = [];
        for (let index = 0; index < 12; index += 1) {
          const tile = document.createElement("div");
          tile.className = "tile";
          const swatch = document.createElement("div");
          swatch.className = "swatch";
          swatch.style.backgroundColor = colors[index];
          tile.append(swatch);
          stage.append(tile);
          tiles.push(tile);
        }
        const stageWidth = view.width * 0.84;
        const stageHeight = view.height * 0.84;
        const baseW = stageWidth * 0.22;
        const baseH = stageHeight * 0.26;
        function gridPos(index) {
          const col = index % 4;
          const row = Math.floor(index / 4);
          return { x: col * 24, y: row * 30, w: 22, h: 26 };
        }
        function featurePos(index) {
          if (index === 0) return { x: 0, y: 0, w: 46, h: 62 };
          if (index < 5) return { x: 50, y: (index - 1) * 16, w: 22, h: 14 };
          return { x: 76, y: (index - 5) * 12, w: 22, h: 10 };
        }
        function cascadePos(index) {
          return { x: 8 + index * 6, y: 8 + index * 6, w: 18, h: 22 };
        }
        function toMotion(box) {
          return {
            x: (box.x / 100) * stageWidth,
            y: (box.y / 100) * stageHeight,
            scaleX: box.w / 22,
            scaleY: box.h / 26,
          };
        }
        tiles.forEach(function (tile, index) {
          const start = toMotion(gridPos(index));
          gsap.set(tile, {
            width: baseW,
            height: baseH,
            transformOrigin: "0 0",
            x: start.x,
            y: start.y,
            scaleX: start.scaleX,
            scaleY: start.scaleY,
          });
        });
        const timeline = gsap.timeline({ paused: true });
        tiles.forEach(function (tile, index) {
          const start = toMotion(gridPos(index));
          const feature = toMotion(featurePos(index));
          const cascade = toMotion(cascadePos(index));
          timeline.fromTo(
            tile,
            { opacity: 0, scaleX: start.scaleX * 0.8, scaleY: start.scaleY * 0.8 },
            { opacity: 1, scaleX: start.scaleX, scaleY: start.scaleY, duration: 0.45, ease: "power2.out" },
            index * 0.04,
          );
          timeline.to(tile, {
            x: feature.x,
            y: feature.y,
            scaleX: feature.scaleX,
            scaleY: feature.scaleY,
            duration: 1.1,
            ease: "power3.inOut",
          }, 2.2);
          timeline.to(tile, {
            x: cascade.x,
            y: cascade.y,
            scaleX: cascade.scaleX,
            scaleY: cascade.scaleY,
            duration: 1.1,
            ease: "power3.inOut",
          }, 5.4);
        });
        registerTimeline("mosaic-reframe", timeline);

      })();
    </script>
  </body>
</html>
