<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Tile shadow","default":"#000000"},{"id":"background","type":"color","label":"Background","default":"#09090b"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #09090b;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background-color: #09090b;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage {
        position: relative;
        transform-style: preserve-3d;
        z-index: 1;
      }
      .tile-wrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
      }
      .tile {
        overflow: hidden;
        backface-visibility: hidden;
      }
      .tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        backface-visibility: hidden;
        transform: translateZ(0);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="mosaic-reframe"
      data-start="0"
      data-duration="9"
      data-width="1080"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="9" style="position:absolute;inset:0;background-color:#09090b"></div>
      <div id="stage" class="clip" data-start="0" data-duration="9"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const stage = document.getElementById("stage");
        const containerSize = vmin * 75;
        const gap = vmin * 1.5;
        const TILE_COUNT = 12;
        stage.style.width = containerSize + "px";
        stage.style.height = containerSize + "px";
        stage.style.perspective = vmin * 120 + "px";
        function buildConfigA(size, gapSize) {
          const cols = 4;
          const rows = 3;
          const tileW = (size - (cols - 1) * gapSize) / cols;
          const tileH = (size - (rows - 1) * gapSize) / rows;
          const configs = [];
          for (let index = 0; index < TILE_COUNT; index += 1) {
            const col = index % cols;
            const row = Math.floor(index / cols);
            configs.push({ x: col * (tileW + gapSize), y: row * (tileH + gapSize), w: tileW, h: tileH, rotate: 0 });
          }
          return configs;
        }
        function buildConfigB(size, gapSize) {
          const configs = [];
          const cols = 4;
          const rows = 3;
          const cellW = (size - (cols - 1) * gapSize) / cols;
          const cellH = (size - (rows - 1) * gapSize) / rows;
          const featureW = cellW * 2 + gapSize;
          const featureH = cellH * 2 + gapSize;
          configs.push({ x: 0, y: 0, w: featureW, h: featureH, rotate: 0 });
          const rightX = featureW + gapSize;
          const rightW = (size - rightX - gapSize) / 2;
          configs.push({ x: rightX, y: 0, w: rightW, h: cellH, rotate: 0 });
          configs.push({ x: rightX + rightW + gapSize, y: 0, w: rightW, h: cellH, rotate: 0 });
          configs.push({ x: rightX, y: cellH + gapSize, w: rightW, h: cellH, rotate: 0 });
          configs.push({ x: rightX + rightW + gapSize, y: cellH + gapSize, w: rightW, h: cellH, rotate: 0 });
          const bottomY = featureH + gapSize;
          const bottomH = size - bottomY;
          const bottomCount = 7;
          const bottomTileW = (size - (bottomCount - 1) * gapSize) / bottomCount;
          for (let index = 0; index < bottomCount; index += 1) {
            configs.push({ x: index * (bottomTileW + gapSize), y: bottomY, w: bottomTileW, h: bottomH, rotate: 0 });
          }
          return configs;
        }
        function buildConfigC(size) {
          const configs = [];
          const tileSize = size * 0.2;
          const step = (size - tileSize) / (TILE_COUNT - 1);
          for (let index = 0; index < TILE_COUNT; index += 1) {
            configs.push({ x: step * index, y: step * index, w: tileSize, h: tileSize, rotate: -15 + index * 3 });
          }
          return configs;
        }
        const configA = buildConfigA(containerSize, gap);
        const configB = buildConfigB(containerSize, gap);
        const configC = buildConfigC(containerSize);
        const ease = hyperbits.Easing.easeInOutCubic;
        const smoothstep = function (t) { return t * t * (3 - 2 * t); };
        const hold = hyperbits.hold(60);
        const radius = vmin * 1.2;
        const tiles = [];
        for (let index = 0; index < TILE_COUNT; index += 1) {
          const a = configA[index];
          const b = configB[index];
          const c = configC[index];
          const maxW = Math.max(a.w, b.w, c.w);
          const maxH = Math.max(a.h, b.h, c.h);
          const wrap = document.createElement("div");
          wrap.className = "tile-wrap";
          wrap.setAttribute("data-layout-allow-overlap", "");
          wrap.setAttribute("data-layout-allow-occlusion", "");
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.style.width = maxW + "px";
          tile.style.height = maxH + "px";
          tile.style.borderRadius = radius + "px";
          tile.style.boxShadow = "0 " + vmin * 0.4 + "px " + vmin * 1.5 + "px " + vars.color + "66";
          const image = document.createElement("img");
          image.src = "https://picsum.photos/seed/" + (index + 1) + "/" + Math.round(maxW * 2) + "/" + Math.round(maxH * 2);
          image.alt = "";
          tile.append(image);
          wrap.append(tile);
          stage.append(wrap);
          tiles.push({ index: index, element: tile, a: a, b: b, c: c, maxW: maxW, maxH: maxH, depth: (index - (TILE_COUNT - 1) / 2) * vmin * 1.2 });
        }
        const proxy = { frame: 0 };
        function render() {
          const frame = proxy.frame;
          stage.style.opacity = String(hyperbits.interpolate(frame, [0, 20, 255, 270], [0, 1, 1, 0], { extrapolateLeft: "clamp", extrapolateRight: "clamp" }));
          for (const tile of tiles) {
            const shift = tile.index * 2;
            const progress = Math.min(1, Math.max(0, (frame - shift - 90) / 150));
            const track = function (from, mid, to) {
              return hyperbits.interpolateKeyframes([from, mid, hold, to], progress, ease, 150);
            };
            const sizeRange = [90 + shift, 135 + shift, 195 + shift, 240 + shift];
            const desiredW = hyperbits.interpolate(frame, sizeRange, [tile.a.w, tile.b.w, tile.b.w, tile.c.w], { extrapolateLeft: "clamp", extrapolateRight: "clamp", easing: smoothstep });
            const desiredH = hyperbits.interpolate(frame, sizeRange, [tile.a.h, tile.b.h, tile.b.h, tile.c.h], { extrapolateLeft: "clamp", extrapolateRight: "clamp", easing: smoothstep });
            tile.element.style.transform =
              "translateX(" + track(tile.a.x, tile.b.x, tile.c.x) + "px) translateY(" + track(tile.a.y, tile.b.y, tile.c.y) + "px) translateZ(" + track(0, 0, tile.depth) + "px)" +
              " rotate(" + track(tile.a.rotate, tile.b.rotate, tile.c.rotate) + "deg) rotateX(" + track(0, 0, -8) + "deg)";
            tile.element.style.clipPath = "inset(0px " + (tile.maxW - desiredW) + "px " + (tile.maxH - desiredH) + "px 0px round " + radius + "px)";
          }
        }
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { frame: 270, duration: 9, ease: "none", onUpdate: render }, 0);
        render();
        registerTimeline("mosaic-reframe", timeline);

      })();
    </script>
  </body>
</html>
