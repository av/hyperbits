<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Tile outline","default":"#100f0f"},{"id":"background","type":"color","label":"Background","default":"#100f0f"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 900;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-900-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Geist Sans", Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #mosaic {
        position: relative;
        transform-style: preserve-3d;
        z-index: 1;
      }
      .tile-wrap {
        position: absolute;
        transform-style: preserve-3d;
      }
      .tile {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      .tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        inset: 0;
      }
      .symbol {
        font-weight: 900;
        color: #ffffff;
        text-shadow: 0 0 5px #000000;
        line-height: 1;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="fracture-reassemble"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="6" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <div id="mosaic" class="clip" data-start="0" data-duration="6"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const mosaic = document.getElementById("mosaic");
        const ROWS = 5;
        const COLS = 5;
        const CENTER_ROW = 2;
        const SYMBOLS = ["\u25C8", "\u25C9", "\u25CE", "\u25CD", "\u25CC"];
        const gap = vmin * 1.2;
        const tileSize = vmin * 14;
        mosaic.style.width = COLS * tileSize + (COLS - 1) * gap + "px";
        mosaic.style.height = ROWS * tileSize + (ROWS - 1) * gap + "px";
        const ease = hyperbits.Easing.easeInOutCubic;
        const hold = hyperbits.hold(60);
        const tiles = [];
        for (let index = 0; index < ROWS * COLS; index += 1) {
          const row = Math.floor(index / COLS);
          const col = index % COLS;
          const wrap = document.createElement("div");
          wrap.className = "tile-wrap";
          wrap.style.left = col * (tileSize + gap) + "px";
          wrap.style.top = row * (tileSize + gap) + "px";
          wrap.style.width = tileSize + "px";
          wrap.style.height = tileSize + "px";
          wrap.style.perspective = vmin * 100 + "px";
          wrap.setAttribute("data-layout-allow-overlap", "");
          wrap.setAttribute("data-layout-allow-occlusion", "");
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.style.borderRadius = vmin * 1.5 + "px";
          tile.style.boxShadow = "0 0 0 " + vmin * 0.25 + "px " + vars.color;
          const image = document.createElement("img");
          image.src = "https://picsum.photos/seed/" + (index + 1) + "/" + Math.round(tileSize) + "/" + Math.round(tileSize);
          image.alt = "";
          tile.append(image);
          if (row === CENTER_ROW) {
            const symbol = document.createElement("span");
            symbol.className = "symbol";
            symbol.textContent = SYMBOLS[col];
            symbol.style.fontSize = tileSize * 0.55 + "px";
            tile.append(symbol);
          }
          wrap.append(tile);
          mosaic.append(wrap);
          tiles.push({
            element: tile,
            delay: (Math.abs(row - 2) + Math.abs(col - 2)) * 4,
            dx: hyperbits.randomFloat("frac-x-" + index, -vmin * 80, vmin * 80),
            dy: hyperbits.randomFloat("frac-y-" + index, -vmin * 80, vmin * 80),
            dz: hyperbits.randomFloat("frac-z-" + index, -vmin * 120, vmin * 20),
            rx: hyperbits.randomFloat("frac-rx-" + index, -180, 180),
            ry: hyperbits.randomFloat("frac-ry-" + index, -180, 180),
            rz: hyperbits.randomFloat("frac-rz-" + index, -90, 90),
          });
        }
        const proxy = { frame: 0 };
        function render() {
          const frame = proxy.frame;
          for (const tile of tiles) {
            const progress = Math.min(1, Math.max(0, (frame - tile.delay) / 170));
            const value = function (from) {
              return hyperbits.interpolateKeyframes([from, 0, hold, from], progress, ease, 170);
            };
            const opacity = hyperbits.interpolateKeyframes([0, 1, hold, 0], progress, ease, 170);
            tile.element.style.transform =
              "translateX(" + value(tile.dx) + "px) translateY(" + value(tile.dy) + "px) translateZ(" + value(tile.dz) + "px)" +
              " rotateX(" + value(tile.rx) + "deg) rotateY(" + value(tile.ry) + "deg) rotateZ(" + value(tile.rz) + "deg)";
            tile.element.style.opacity = String(opacity);
          }
        }
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { frame: 180, duration: 6, ease: "none", onUpdate: render }, 0);
        render();
        registerTimeline("fracture-reassemble", timeline);

      })();
    </script>
  </body>
</html>
