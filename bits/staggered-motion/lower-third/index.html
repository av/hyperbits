<!doctype html>
<html lang="en" data-composition-variables='[{"id":"name","type":"string","label":"Name","default":"Ada Lovelace"},{"id":"title","type":"string","label":"Title","default":"Analytical Engine Programmer"},{"id":"color","type":"color","label":"Accent","default":"#ec8b49"},{"id":"background","type":"color","label":"Background","default":"#1c1b1a"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 500;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-500-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist Sans";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #1c1b1a;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #1c1b1a;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Geist Sans", Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #card {
        position: absolute;
        display: flex;
        align-items: stretch;
        z-index: 1;
        color: #ffffff;
      }
      #bar {
        transform-origin: center top;
      }
      #copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      #name {
        font-weight: 700;
        line-height: 1.05;
      }
      #role-line {
        font-size: 5vw;
      }
      #role {
        display: inline-flex;
        align-items: center;
        font-weight: 500;
        color: #fcc192;
        text-transform: uppercase;
      }
      #role-dot {
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="lower-third"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="5" style="position:absolute;inset:0;background-color:#1c1b1a"></div>
      <div id="card" class="clip" data-start="0" data-duration="5">
        <div id="bar"></div>
        <div id="copy">
          <div id="name">Ada Lovelace</div>
          <div id="role-line"><div id="role"><span id="role-dot"></span><span id="role-text">Analytical Engine Programmer</span></div></div>
        </div>
      </div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const card = document.getElementById("card");
        const bar = document.getElementById("bar");
        const copy = document.getElementById("copy");
        const nameEl = document.getElementById("name");
        const role = document.getElementById("role");
        document.getElementById("role-line").style.fontSize = view.vw * 5 + "px";
        const roleDot = document.getElementById("role-dot");
        const roleText = document.getElementById("role-text");
        bg.style.backgroundImage = "radial-gradient(circle at 70% 30%, #343331 0%, " + vars.background + " 60%)";
        nameEl.textContent = vars.name;
        roleText.textContent = vars.title;
        const total = 150;
        const enter = 25;
        const exit = 20;
        const holdFrames = total - enter - exit;
        const barWidth = vmin * 1.6;
        const cardHeight = vmin * 18;
        const shift = vmin * 6;
        card.style.left = view.vw * 6 + "px";
        card.style.bottom = view.vh * 10 + "px";
        bar.style.width = barWidth + "px";
        bar.style.minHeight = cardHeight + "px";
        bar.style.borderRadius = barWidth + "px";
        bar.style.backgroundColor = vars.color;
        copy.style.gap = vmin * 1.2 + "px";
        copy.style.padding = vmin * 1.5 + "px 0 " + vmin * 1.5 + "px " + vmin * 3 + "px";
        nameEl.style.fontSize = vmin * 6.5 + "px";
        nameEl.style.letterSpacing = -vmin * 0.1 + "px";
        role.style.gap = vmin * 1.5 + "px";
        role.style.fontSize = vmin * 2.8 + "px";
        role.style.letterSpacing = vmin * 0.25 + "px";
        roleDot.style.width = vmin + "px";
        roleDot.style.height = vmin + "px";
        roleDot.style.backgroundColor = vars.color;
        const ease = hyperbits.Easing;
        function holdMotion(element, from, to, delay, duration, holdLength, easing) {
          const segment = (duration - holdLength) / 2 / 30;
          const start = delay / 30;
          const target = Object.assign({ duration: segment, ease: easing }, to);
          timeline.fromTo(element, from, target, start);
          const back = Object.assign({ duration: segment, ease: easing }, from);
          timeline.to(element, back, start + segment + holdLength / 30);
        }
        const timeline = gsap.timeline({ paused: true });
        holdMotion(bar, { scaleY: 0 }, { scaleY: 1 }, 0, total, holdFrames, ease.easeInOutCubic);
        holdMotion(nameEl, { x: -shift, opacity: 0 }, { x: 0, opacity: 1 }, 6, total - 6, holdFrames - 8, ease.easeOutCubic);
        holdMotion(role, { x: -shift, opacity: 0 }, { x: 0, opacity: 1 }, 12, total - 12, holdFrames - 16, ease.easeOutCubic);
        timeline.to({}, { duration: 5 }, 0);
        registerTimeline("lower-third", timeline);

      })();
    </script>
  </body>
</html>
