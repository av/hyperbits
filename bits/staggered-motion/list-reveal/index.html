<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #09090b;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background-color: #09090b;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #09090b;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { display: flex; align-items: center; justify-content: center; background-color: #09090b; }
      #list { display: flex; flex-direction: column; }
      .item {
        background-color: #27272a; border-radius: 12px; display: flex; align-items: center;
        color: #f4f4f5; font-weight: 500;
      }
      .dot { border-radius: 50%; background-color: #52525b; margin-left: auto; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="list-reveal"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1080"
    >
      <div id="list" class="clip" data-start="0" data-duration="3"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const view = hyperbits.viewport();
        const list = document.getElementById("list");
        const items = [
          { title: "Dashboard", path: "M3 13h8V3H3v10zm10 8h8V3h-8v18zM3 21h8v-6H3v6z" },
          { title: "Analytics", path: "M3 17l6-6 4 4 8-8" },
          { title: "Settings", path: "M12 8a4 4 0 100 8 4 4 0 000-8zm8.66 2l-1.2-2.08 1.2-2.08-2.08-1.2L17.5 3H14.5L13.3 4.64 11.22 3.44 10 5.52 11.2 7.6 10 9.68l2.08 1.2 1.22 1.64h3l1.2-1.64 2.08-1.2z" },
          { title: "Profile", path: "M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6z" },
          { title: "Messages", path: "M4 4h16v12H7l-3 3V4z" },
          { title: "Notifications", path: "M12 22a2 2 0 002-2H10a2 2 0 002 2zm6-6V11a6 6 0 10-12 0v5L4 18v1h16v-1l-2-2z" },
        ];
        const itemWidth = Math.min(view.width * 0.8, 600);
        list.style.width = itemWidth + "px";
        list.style.gap = "16px";
        for (const item of items) {
          const row = document.createElement("div");
          row.className = "item";
          row.style.height = "80px";
          row.style.padding = "0 24px";
          row.style.gap = "16px";
          row.style.fontSize = "20px";
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("width", "24");
          svg.setAttribute("height", "24");
          svg.setAttribute("viewBox", "0 0 24 24");
          svg.setAttribute("fill", "#f4f4f5");
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", item.path);
          svg.append(path);
          const title = document.createElement("div");
          title.textContent = item.title;
          title.style.flex = "1";
          const dot = document.createElement("div");
          dot.className = "dot";
          dot.style.width = "8px";
          dot.style.height = "8px";
          row.append(svg, title, dot);
          list.append(row);
        }
        const timeline = gsap.timeline({ paused: true });
        hyperbits.stagger(list.children, { y: [50, 0], opacity: [0, 1], scale: [0.9, 1], duration: 40 / 30, stagger: 3 / 30, ease: "easeOutCubic" }, timeline);
        registerTimeline("list-reveal", timeline);

      })();
    </script>
  </body>
</html>
