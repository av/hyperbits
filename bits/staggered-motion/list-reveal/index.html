<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Icon color","default":"#fcc192"},{"id":"background","type":"color","label":"Background","default":"#09090b"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 500;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-500-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #09090b;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background-color: #09090b;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Geist Sans", Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #list-outer {
        position: relative;
        z-index: 1;
      }
      #list {
        display: flex;
        flex-direction: column;
      }
      .item {
        width: 100%;
        background-color: #27272a;
        display: flex;
        align-items: center;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      .icon {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .title {
        color: #f4f4f5;
        font-weight: 500;
        flex: 1;
      }
      .dot {
        border-radius: 50%;
        background-color: #52525b;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="list-reveal"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="3" style="position:absolute;inset:0;background-color:#09090b"></div>
      <div id="list-outer" class="clip" data-start="0" data-duration="3"><div id="list"></div></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const outer = document.getElementById("list-outer");
        const list = document.getElementById("list");
        const items = [
          { title: "Dashboard", path: "M3 13h8V3H3v10zm10 8h8V3h-8v18zM3 21h8v-6H3v6z" },
          { title: "Analytics", path: "M3 17l6-6 4 4 8-8" },
          { title: "Settings", path: "M12 8a4 4 0 100 8 4 4 0 000-8z" },
          { title: "Profile", path: "M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6z" },
          { title: "Messages", path: "M4 4h16v12H7l-3 3V4z" },
          { title: "Notifications", path: "M12 22a2 2 0 002-2H10a2 2 0 002 2zm6-6V11a6 6 0 10-12 0v5L4 18v1h16v-1l-2-2z" },
        ];
        const itemWidth = Math.min(view.width * 0.8, 600 * unit);
        const itemHeight = 80 * unit;
        list.style.width = itemWidth + "px";
        list.style.gap = 16 * unit + "px";
        for (const item of items) {
          const row = document.createElement("div");
          row.className = "item";
          row.style.height = itemHeight + "px";
          row.style.borderRadius = 12 * unit + "px";
          row.style.padding = "0 " + 24 * unit + "px";
          row.style.gap = 16 * unit + "px";
          const icon = document.createElement("div");
          icon.className = "icon";
          icon.style.width = 24 * unit + "px";
          icon.style.height = 24 * unit + "px";
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("width", String(24 * unit));
          svg.setAttribute("height", String(24 * unit));
          svg.setAttribute("viewBox", "0 0 24 24");
          svg.setAttribute("fill", vars.color);
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", item.path);
          svg.append(path);
          icon.append(svg);
          const title = document.createElement("div");
          title.className = "title";
          title.textContent = item.title;
          title.style.fontSize = 20 * unit + "px";
          const dot = document.createElement("div");
          dot.className = "dot";
          dot.style.width = 8 * unit + "px";
          dot.style.height = 8 * unit + "px";
          row.append(icon, title, dot);
          list.append(row);
        }
        const timeline = gsap.timeline({ paused: true });
        timeline.fromTo(list, { y: 200 * unit }, { y: -100 * unit, duration: 1, ease: hyperbits.Easing.easeInOutCubic }, 0);
        hyperbits.stagger(list.children, { y: [50 * unit, 0], opacity: [0, 1], scale: [0.9, 1], duration: 40 / 30, stagger: 3 / 30, ease: "easeOutCubic", at: 0 }, timeline);
        timeline.to({}, { duration: 3 }, 0);
        registerTimeline("list-reveal", timeline);

      })();
    </script>
  </body>
</html>
