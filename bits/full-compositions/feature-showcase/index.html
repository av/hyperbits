        const heroWords = hyperbits.splitText(heroTitle, "words");

        const dash = sceneItem(vmin * 36, vmin * 16);
        const dashBox = el("div", "", { width: "100%", height: "100%", background: "#1a1a2e", borderRadius: vmin * 1.2 + "px", padding: vmin * 2.5 + "px", border: "1px solid rgba(255,255,255,0.1)", boxShadow: "0 15px 35px rgba(0,0,0,0.4)", display: "flex", flexDirection: "column", lineHeight: "1rem" });
        const dashHeader = el("div", "", { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: vmin + "px" });
        const dashLeft = el("div", "", { display: "flex", alignItems: "center", gap: vmin + "px" });
        dashLeft.append(el("div", "", { width: vmin + "px", height: vmin + "px", borderRadius: "50%", background: "#e94560" }));
        const dashLabel = el("span", "", { color: "#fff", fontWeight: "bold", fontSize: vmin * 1.5 + "px" });
        dashLabel.textContent = "Revenue";
        dashLeft.append(dashLabel);
        const dashWeek = el("span", "", { color: "#ffffff66", fontSize: vmin * 1.2 + "px" });
        dashWeek.textContent = "This Week";
        dashHeader.append(dashLeft, dashWeek);
        const dashValueWrap = el("div", "", { marginBottom: vmin + "px" });
        const dashValue = el("span", "", { display: "inline-flex", alignItems: "center", color: "#fff", fontSize: vmin * 4 + "px", fontWeight: "bold" });
        const dashNumber = el("span");
        const dashPostfix = el("span");
        dashPostfix.textContent = "$";
        dashValue.append(dashNumber, dashPostfix);
        dashValueWrap.append(dashValue);
        dashBox.append(dashHeader, dashValueWrap);
        dash.append(dashBox);

        const notif = sceneItem(vmin * 30, 0);
        const notifBox = el("div", "", { width: "100%", background: "rgba(255,255,255,0.95)", borderRadius: vmin * 1.2 + "px", padding: vmin * 1.5 + "px", display: "flex", alignItems: "center", gap: vmin * 1.5 + "px", boxShadow: "0 10px 30px rgba(0,0,0,0.2)" });
        const notifIcon = el("div", "", { width: vmin * 5 + "px", height: vmin * 5 + "px", background: "#10B981", borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: "0" });
        notifIcon.innerHTML = '<svg width="' + vmin * 2.5 + '" height="' + vmin * 2.5 + '" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        const notifCopy = el("div");
        const notifTitle = el("div", "", { color: "#111", fontWeight: "bold", fontSize: vmin * 1.4 + "px", lineHeight: "1.2" });
        notifTitle.textContent = "Render Complete";
        const notifFile = el("div", "", { color: "#666", fontSize: vmin * 1.1 + "px" });
        notifFile.textContent = "video_final_v2.mp4";
        notifCopy.append(notifTitle, notifFile);
        notifBox.append(notifIcon, notifCopy);
        notif.append(notifBox);

        const code = sceneItem(vmin * 28, vmin * 18);
        const codeBox = el("div", "", { width: "100%", height: "100%", background: "#282c34", borderRadius: vmin + "px", padding: vmin * 1.5 + "px", boxShadow: "0 15px 30px rgba(0,0,0,0.4)", border: "1px solid #3e4451", fontFamily: mono, fontSize: vmin * 1.2 + "px", color: "#abb2bf", overflow: "hidden" });
        const codeDots = el("div", "", { display: "flex", gap: vmin / 2 + "px", marginBottom: vmin + "px" });
        ["#e06c75", "#e5c07b", "#98c379"].forEach(function (hex) { codeDots.append(el("div", "", { width: vmin + "px", height: vmin + "px", borderRadius: "50%", background: hex })); });
        codeBox.append(codeDots);
        const codeLinesHtml = [
          '<span style="color:#c678dd">const</span> <span style="color:#e5c07b">Video</span> = () =&gt; {',
          '<span style="padding-left:' + vmin * 2 + 'px"><span style="color:#e06c75">return</span> (</span>',
          '<span style="padding-left:' + vmin * 4 + 'px">&lt;<span style="color:#e5c07b">Composition</span> /&gt;</span>',
          '<span style="padding-left:' + vmin * 2 + 'px">);</span>',
          '};',
        ];
        codeLinesHtml.forEach(function (html) { const line = el("div"); line.innerHTML = html; codeBox.append(line); });
        code.append(codeBox);

        const player = sceneItem(vmin * 25, vmin * 15);
        const playerBox = el("div", "", { width: "100%", height: "100%", background: "#000", borderRadius: vmin + "px", overflow: "hidden", boxShadow: "0 10px 40px rgba(0,0,0,0.5)", border: "1px solid #333", display: "flex", alignItems: "center", justifyContent: "center", position: "relative" });
        playerBox.append(el("div", "", { position: "absolute", inset: "0", background: "linear-gradient(45deg, #111, #222)", opacity: "0.5" }));
        const playButton = el("div", "", { width: vmin * 6 + "px", height: vmin * 6 + "px", borderRadius: "50%", background: "rgba(255,255,255,0.1)", backdropFilter: "blur(5px)", display: "flex", alignItems: "center", justifyContent: "center", border: "1px solid rgba(255,255,255,0.2)", zIndex: "10" });
        playButton.append(el("div", "", { width: "0", height: "0", borderTop: vmin * 1.5 + "px solid rgba(0, 0, 0, 0)", borderBottom: vmin * 1.5 + "px solid rgba(0, 0, 0, 0)", borderLeft: vmin * 2.5 + "px solid white", marginLeft: vmin * 0.5 + "px" }));
        playerBox.append(playButton);
        const progressTrack = el("div", "", { position: "absolute", bottom: vmin * 1.5 + "px", left: vmin * 1.5 + "px", right: vmin * 1.5 + "px", height: vmin * 0.5 + "px", background: "rgba(255,255,255,0.2)", borderRadius: vmin + "px" });
        progressTrack.append(el("div", "", { width: "60%", height: "100%", background: accent, borderRadius: vmin + "px", boxShadow: "0 0 10px " + accent }));
        playerBox.append(progressTrack);
        player.append(playerBox);
        const sceneItemSpecs = [
          { node: hero, delay: 10, duration: 35, keys: poses.sceneItems.hero, ease: Easing.easeInOutCubic },
          { node: dash, delay: 20, duration: 35, keys: poses.sceneItems.dash, ease: Easing.easeInOutCubic },
          { node: notif, delay: 30, duration: 20, keys: poses.sceneItems.notif, ease: Easing.easeOutCubic },
          { node: code, delay: 40, duration: 35, keys: poses.sceneItems.code, ease: Easing.easeOutCubic },
          { node: player, delay: 25, duration: 35, keys: poses.sceneItems.player, ease: Easing.easeOutCubic },
        ];

        const steps = [
          Object.assign({ id: "intro", duration: 2, element: stepNode() }, toProps(base)),
          Object.assign({ id: "elements", duration: 2, element: stepNode() }, toProps(elementsBase)),
          Object.assign({ id: "element-particles", duration: 2, element: cards["element-particles"].step }, toProps(itemPoses.particles)),
          Object.assign({ id: "element-animated-text", duration: 2, element: cards["element-animated-text"].step }, toProps(itemPoses.animatedText)),
          Object.assign({ id: "element-counter", duration: 2, element: cards["element-counter"].step }, toProps(itemPoses.counter)),
          Object.assign({ id: "element-type-writer", duration: 2, element: cards["element-type-writer"].step }, toProps(itemPoses.typeWriter)),
          Object.assign({ id: "element-code-block", duration: 2, element: cards["element-code-block"].step }, toProps(itemPoses.codeBlock)),
          Object.assign({ id: "element-glitch-cycle", duration: 2, element: cards["element-glitch-cycle"].step }, toProps(itemPoses.glitchCycle)),
          Object.assign({ id: "element-slide-in", duration: 2, element: cards["element-slide-in"].step }, toProps(itemPoses.slideIn)),
          Object.assign({ id: "element-carousel", duration: 2, element: cards["element-carousel"].step }, toProps(itemPoses.carousel)),
          Object.assign({ id: "element-typewriter-rewrite", duration: 2, element: cards["element-typewriter-rewrite"].step }, toProps(itemPoses.typewriterRewrite)),
          Object.assign({ id: "transitions", duration: 4, element: transitionsStep }, toProps(transitionsBase)),
          Object.assign({ id: "scenes", duration: 4, element: scenesStep }, toProps(scenesBase)),
          Object.assign({ id: "outro", duration: 4, element: stepNode() }, toProps(base)),
        ];
        const scene = hyperbits.createScene3D(sceneEl, {
          perspective: 1000,
          transitionDuration: 2,
          stepDuration: 2,
          easing: "easeInOutCubic",
          steps: steps,
        });
        sceneEl.style.position = "absolute";
        sceneEl.style.inset = "0";
        sceneEl.style.zIndex = "1";

        function worldNode(tag, className, styles) {
          const node = el(tag, className, styles);
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          scene.world.append(node);
          return node;
        }
        function title(text, width) {
          const node = worldNode("h1", "title", { fontSize: fontSize + "px", width: width });
          node.textContent = text;
          return node;
        }
        const titleMain = title(String(vars.title), vmin * 70 + "px");
        const titleElements = title("Elements", "max-content");
        const titleTransitions = title("Transitions", "max-content");
        titleTransitions.style.textShadow = "0 0 10px rgba(0,0,0,0.5)";
        const titleScenes = title("Scenes", "max-content");
        function icon(variant) {
          const size = vmin * 10;
          const inner = variant === "triangle"
            ? '<path d="M13.73 4a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />'
            : variant === "square" ? '<rect width="18" height="18" x="3" y="3" rx="2" />' : '<circle cx="12" cy="12" r="10" />';
          const holder = document.createElement("div");
          holder.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="icon" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + accent + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + "</svg>";
          const node = holder.firstChild;
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          scene.world.append(node);
          return node;
        }
        const iconTriangle = icon("triangle");
        const iconSquare = icon("square");
        const iconCircle = icon("circle");
        const elementStepIds = stepOrder.slice(1, 11);
        function mapElementSteps(props) {
          const map = {};
          elementStepIds.forEach(function (id) { map[id] = props; });
          return map;
        }
        const responsiveSpecs = [
          { node: titleMain, steps: { intro: { transform: poses.intro.title }, outro: { transform: poses.outro.title, duration: "step", easing: Easing.easeInOutCubic } } },
          { node: titleElements, steps: Object.assign({ intro: { transform: poses.elementsTitle } }, mapElementSteps({ transform: poses.elementsTitle }), { transitions: { transform: poses.elementsTitle } }) },
          { node: titleTransitions, steps: Object.assign({ intro: { transform: poses.transitionsTitle } }, mapElementSteps({ transform: poses.transitionsTitle }), { transitions: { transform: poses.transitionsTitle }, scenes: { transform: poses.transitionsTitle } }) },
          { node: titleScenes, steps: { intro: { transform: poses.scenesTitle.still }, transitions: { transform: poses.scenesTitle.still }, scenes: { transform: poses.scenesTitle.scenes }, outro: { transform: poses.scenesTitle.outro, duration: "step" } } },
          { node: iconTriangle, steps: Object.assign({ intro: { opacity: [0, 1], transform: poses.intro.icons.triangle } }, mapElementSteps({ transform: poses.elementsTriangle }), { outro: { transform: poses.outro.icons.triangle, opacity: [1, 1, 1, 0], duration: "step", easing: Easing.easeInOutCubic } }) },
          { node: iconSquare, steps: { intro: { opacity: [0, 1], transform: poses.intro.icons.square }, scenes: { transform: poses.scenesSquare }, outro: { transform: poses.outro.icons.square, opacity: [1, 1, 1, 0], duration: "step", easing: Easing.easeInOutCubic } } },
          { node: iconCircle, steps: { intro: { opacity: [0, 1], transform: poses.intro.icons.circle }, transitions: { transform: transitionsIconBase }, outro: { transform: poses.outro.icons.circle, opacity: [1, 1, 1, 0], duration: "step", easing: Easing.easeInOutCubic } } },
        ];
        function cumulative(spec, index) {
          const result = {};
          for (let step = 0; step <= index; step += 1) {
            if (step > 0) {
              for (const key in result) {
                if (Array.isArray(result[key]) && result[key].length > 0) result[key] = result[key][result[key].length - 1];
              }
            }
            const props = spec.steps[stepOrder[step]];
            if (props) Object.assign(result, props);
          }
          return result;
        }
        function mergeValues(fromVal, toVal) {
          const effectiveFrom = Array.isArray(fromVal) ? fromVal[fromVal.length - 1] : fromVal;
          let target = Array.isArray(toVal) ? toVal.slice() : [toVal];
          if (effectiveFrom === target[0]) {
            target = target.slice(1);
            if (target.length === 0) return [effectiveFrom];
          }
          return [effectiveFrom].concat(target);
        }
        function applyResponsive(spec, state, frame) {
          const index = state.activeStepIndex;
          const stepId = stepOrder[index];
          const current = spec.steps[stepId];
          const target = cumulative(spec, index);
          const previous = index > 0 ? cumulative(spec, index - 1) : {};
          let progress = state.transitionProgress;
          let easeFn;
          if (current && current.duration !== undefined) {
            const activeStep = state.steps[index];
            const duration = current.duration === "step" ? (activeStep.exitTime - activeStep.enterTime) * 30 : current.duration;
            progress = clamp01((frame - activeStep.enterTime * 30) / duration);
            easeFn = current.easing;
          }
          const resolve = function (key) {
            const fromVal = previous[key];
            const toVal = target[key];
            if (fromVal !== undefined && toVal !== undefined) return mergeValues(fromVal, toVal);
            if (toVal !== undefined) return toVal;
            return fromVal;
          };
          const transformValue = resolve("transform");
          const transforms = Array.isArray(transformValue) ? transformValue : transformValue ? [transformValue] : null;
          spec.node.style.transform = "translate(-50%, -50%) rotate(0.01deg)" + (transforms ? " " + matrixAt(transforms, progress, easeFn) : "");
          const opacityValue = resolve("opacity");
          if (opacityValue !== undefined) {
            spec.node.style.opacity = String(Array.isArray(opacityValue) ? kf(opacityValue, progress, easeFn) : opacityValue);
          }
        }

        const glyphs = function (text, frame, glitchVal) {
          let output = "";
          for (let charIndex = 0; charIndex < text.length; charIndex += 1) {
            const char = text[charIndex];
            if (char === " " || glitchVal <= 0) output += char;
            else if (hyperbits.random("glitch-" + frame + "-0-" + charIndex) < glitchVal) output += GLITCH_CHARS[Math.floor(hyperbits.random("char-" + frame + "-0-" + charIndex) * GLITCH_CHARS.length)];
            else output += char;
          }
          return output;
        };
        const counter = hyperbits.createCounter(counterNumber, { decimals: 0 });
        const dashCounter = hyperbits.createCounter(dashNumber, { decimals: 0 });

        const proxy = { time: 0 };
        function render() {
          const time = proxy.time;
          const frame = Math.round(time * 30);
          const state = scene.stateAt(time);
          const active = state.activeStepIndex;

          state.steps.forEach(function (step, index) {
            const enter = step.enterTime * 30;
            const exit = step.exitTime * 30;
            if (cards[step.id]) {
              const progress = clamp01((frame - enter) / 30);
              step.element.style.opacity = String(progress);
              const blur = 10 * (1 - progress);
              step.element.style.filter = blur > 0 ? "blur(" + blur * unit + "px)" : "none";
            }
            if (step.id === "transitions") {
              if (index < active) {
                const progress = clamp01((frame - exit) / 30);
                step.element.style.opacity = String(1 - progress);
                step.element.style.filter = progress > 0 ? "blur(" + 10 * progress * unit + "px)" : "none";
              } else {
                step.element.style.opacity = "1";
                step.element.style.filter = "none";
              }
            }
            if (step.id === "scenes" && index < active) {
              const progress = clamp01((frame - exit) / 30);
              step.element.style.transform = matrixAt([scenesBase, scenesBase.translate(0, vmin * 20, 0)], progress);
            }
          });

          const particles = particleSim.stateAt(time);
          const seen = new Set();
          for (const particle of particles) {
            let node = particleNodes.get(particle.id);
            if (!node) {
              node = el("div", "particle");
              const dot = el("div", "", { width: vmin * 2 + "px", height: vmin * 2 + "px", borderRadius: "50%", background: particle.seed < 0.5 ? accent : primary });
              node.append(dot);
              particleLayer.append(node);
              particleNodes.set(particle.id, node);
            }
            seen.add(particle.id);
            node.style.display = "block";
            node.style.transform = "translate3d(" + particle.position.x + "px, " + particle.position.y + "px, " + particle.position.z + "px) rotate(" + particle.rotation + "deg) scale(" + particle.scale + ")";
            node.style.opacity = String(particle.opacity);
          }
          particleNodes.forEach(function (node, id) { if (!seen.has(id)) node.style.display = "none"; });

          const textEnter = enterFrame["element-animated-text"];
          textChars.forEach(function (span, index) {
            const progress = motionProgress(frame, textEnter, 20, 10, index, 1);
            const eased = Easing.easeInOutCubic(progress);
            span.style.transform = "translateY(" + 10 * (1 - eased) * unit + "px)";
            span.style.opacity = String(eased);
            const blur = 2 * (1 - eased);
            span.style.filter = blur > 0 ? "blur(" + blur * unit + "px)" : "none";
          });

          const counterProgress = motionProgress(frame, enterFrame["element-counter"], 20, revealDuration);
          counter.proxy.value = 1000 * counterProgress;
          counter.apply();
          counterValue.style.color = hyperbits.interpolateColorKeyframes(["#fb4934", "#8ec07c"], counterProgress);
          counterValue.style.transform = "scale(" + (0.8 + 0.2 * counterProgress) + ")";

          const typeRelative = frame - 330;
          const typeVisible = typeRelative < 0 ? 0 : Math.min(typeWriterText.length, Math.floor(typeRelative / 2));
          typeText.textContent = typeWriterText.slice(0, typeVisible);
          typeCursor.style.opacity = typeRelative >= 0 && typeRelative % 30 < 15 ? "1" : "0";

          const codeEnter = enterFrame["element-code-block"];
          codeLines.forEach(function (line, index) {
            const progress = motionProgress(frame, codeEnter, 20, revealDuration, index, 2);
            line.style.opacity = String(progress);
            line.style.transform = "translateY(" + 8 * (1 - progress) * unit + "px)";
            const blur = 10 * (1 - progress);
            line.style.filter = blur > 0 ? "blur(" + blur * unit + "px)" : "none";
          });

          const glitchRelative = Math.max(0, frame - 20);
          const glitchIndex = Math.floor(glitchRelative / (revealDuration * 2)) % glitchTexts.length;
          const glitchProgress = clamp01((glitchRelative % (revealDuration * 2)) / revealDuration);
          glitchLine.textContent = glyphs(glitchTexts[glitchIndex], frame, kf([0.6, 0], glitchProgress));

          slideWords.forEach(function (word) {
            const progress = Easing.easeOutCubic(motionProgress(frame, enterFrame["element-slide-in"], word.delay, revealDuration - 5));
            word.node.style.transform = "translateX(" + word.from.x * (1 - progress) * unit + "px) translateY(" + word.from.y * (1 - progress) * unit + "px)";
            word.node.style.opacity = String(progress);
          });

          const carouselRelative = Math.max(0, frame - 20);
          const carouselIndex = Math.floor(carouselRelative / revealDuration) % carouselTexts.length;
          const carouselProgress = clamp01((carouselRelative % revealDuration) / revealDuration);
          carouselLine.textContent = carouselTexts[carouselIndex];
          carouselLine.style.opacity = String(kf([0, 1, 1, 0], carouselProgress));
          carouselLine.style.transform = "translateY(" + kf([10, 0, 0, -10], carouselProgress) * unit + "px)";

          const rewriteLocal = frame - 20;
          if (rewriteLocal >= 0) {
            const looped = rewriteLocal % rewriteEvents.total;
            rewriteText.textContent = eventText(rewriteEvents, looped);
            rewriteCursor.style.opacity = looped % 30 < 15 ? "1" : "0";
            rewriteLine.style.visibility = "visible";
          } else {
            rewriteLine.style.visibility = "hidden";
          }

          const gridEnter = enterFrame.transitions;
          tiles.forEach(function (tile) {
            const props = tile.props;
            const progress = motionProgress(frame, gridEnter, props.delay, props.duration);
            const ease = props.easing;
            const parts = [];
            if (props.x) parts.push("translateX(" + kf(props.x, progress, ease) + "px)");
            if (props.y) parts.push("translateY(" + kf(props.y, progress, ease) + "px)");
            if (props.scale) parts.push("scale(" + kf(props.scale, progress, ease) + ")");
            if (props.rotate) parts.push("rotate(" + kf(props.rotate, progress, ease) + "deg)");
            tile.node.style.transform = parts.join(" ");
            tile.node.style.opacity = String(kf(props.opacity, progress, ease));
            const radius = Array.isArray(props.borderRadius) ? kf(props.borderRadius, progress, ease) : props.borderRadius;
            tile.node.style.borderRadius = radius * unit + "px";
            if (props.blur) {
              const blur = kf(props.blur, progress, ease);
              tile.node.style.filter = blur > 0 ? "blur(" + blur + "px)" : "none";
            }
          });

          const scenesEnter = enterFrame.scenes;
          sceneItemSpecs.forEach(function (spec) {
            const progress = motionProgress(frame, scenesEnter, spec.delay, spec.duration);
            spec.node.style.opacity = String(spec.ease(progress));
            spec.node.style.transform = matrixAt(spec.keys, progress, spec.ease);
          });
          heroWords.forEach(function (span, index) {
            const progress = Easing.easeInOutCubic(motionProgress(frame, scenesEnter, 20, 20, index, 5));
            span.style.transform = "translateY(" + 10 * (1 - progress) * unit + "px)";
            span.style.opacity = String(progress);
          });
          const dashProgress = Easing.easeOutQuart(motionProgress(frame, scenesEnter, 20, 45));
          dashCounter.proxy.value = 8492 * dashProgress;
          dashCounter.apply();

          responsiveSpecs.forEach(function (spec) { applyResponsive(spec, state, frame); });
        }
        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        const previousUpdate = timeline.eventCallback("onUpdate");
        timeline.eventCallback("onUpdate", function () {
          if (typeof previousUpdate === "function") previousUpdate.call(timeline);
          proxy.time = timeline.time();
          render();
        });
        timeline.to({}, { duration: 38 }, 0);
        render();
        registerTimeline("feature-showcase", timeline);

      })();
    </script>
  </body>
