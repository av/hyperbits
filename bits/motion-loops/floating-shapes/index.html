<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#9d8af0"},{"id":"shapes","type":"number","label":"Shapes","default":16},{"id":"seed","type":"number","label":"Seed","default":8}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #9d8af0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="floating-shapes"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mix(from, to, amount) {
          return from.map((value, index) => Math.round(value + (to[index] - value) * amount));
        }
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const muted = mix(accent, channels(vars.background), 0.55);
        const count = Math.max(1, Math.round(Number(vars.shapes) || 16));
        const seed = Number(vars.seed) || 0;
        const symmetry = { circle: 0, ring: 0, triangle: 3, square: 4, plus: 4, diamond: 2 };
        const kinds = Object.keys(symmetry);
        const shapes = [...Array(count).keys()].map((index) => {
          const key = "float-" + seed + "-" + index;
          const layer = index < 3 ? 0.85 + 0.05 * index : hyperbits.random(key + "-layer");
          const tone = hyperbits.random(key + "-tone");
          const kind = index < 3 ? ["circle", "triangle", "square"][index] : hyperbits.pick(key + "-kind", kinds);
          const order = symmetry[kind];
          return {
            kind,
            layer,
            size: view.vmin * (9 + 20 * layer * layer),
            homeX: (((index * 7) % count) + hyperbits.randomFloat(key + "-x", 0.25, 0.75)) / count * view.width,
            homeY: (index * 0.618034 + hyperbits.randomFloat(key + "-y", 0, 0.08)) % 1,
            swayX: view.vmin * (1.5 + 3 * layer),
            swayFrequency: hyperbits.pick(key + "-fx", [1, 2]),
            swayShift: hyperbits.random(key + "-sx"),
            rise: layer > 0.55 ? 2 : 1,
            tilt: hyperbits.randomFloat(key + "-tilt", 0, turn),
            spin: order === 0 ? 0 : (turn / order) * hyperbits.pick(key + "-spin", [-1, 1]) * 2,
            color: tone > 0.72 ? foreground : tone > 0.22 ? accent : muted,
            outline: index >= 3 && layer > 0.4 && hyperbits.random(key + "-outline") > 0.6,
          };
        }).sort((left, right) => left.layer - right.layer);
        function path(kind, size) {
          const half = size / 2;
          context.beginPath();
          if (kind === "circle" || kind === "ring") {
            context.arc(0, 0, half, 0, turn);
          } else if (kind === "triangle") {
            for (let corner = 0; corner < 3; corner += 1) {
              const angle = (turn * corner) / 3 - Math.PI / 2;
              if (corner === 0) context.moveTo(Math.cos(angle) * half, Math.sin(angle) * half);
              else context.lineTo(Math.cos(angle) * half, Math.sin(angle) * half);
            }
          } else if (kind === "square") {
            context.rect(-half * 0.8, -half * 0.8, half * 1.6, half * 1.6);
          } else if (kind === "plus") {
            const arm = half * 0.32;
            context.rect(-half, -arm, size, arm * 2);
            context.rect(-arm, -half, arm * 2, size);
          } else {
            context.moveTo(0, -half);
            context.lineTo(half * 0.62, 0);
            context.lineTo(0, half);
            context.lineTo(-half * 0.62, 0);
          }
          context.closePath();
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          context.lineJoin = "round";
          for (const shape of shapes) {
            const margin = shape.size * 1.2;
            const span = view.height + margin * 2;
            const progress = (((shape.homeY - phase * shape.rise) % 1) + 1) % 1;
            const shapeY = progress * span - margin;
            const shapeX = shape.homeX + Math.sin(turn * (phase * shape.swayFrequency + shape.swayShift)) * shape.swayX;
            context.save();
            context.translate(shapeX, shapeY);
            context.rotate(shape.tilt + shape.spin * phase);
            context.globalAlpha = 0.55 + 0.45 * shape.layer;
            path(shape.kind, shape.size);
            if (shape.kind === "ring" || shape.outline) {
              context.strokeStyle = rgba(shape.color, 1);
              context.lineWidth = Math.max(view.vmin * 0.2, shape.size * 0.09);
              context.stroke();
            } else {
              context.fillStyle = rgba(shape.color, 1);
              context.fill();
            }
            context.restore();
          }
          context.globalAlpha = 1;
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("floating-shapes", timeline);

      })();
    </script>
  </body>
</html>
