<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#f2f0e5"},{"id":"foreground","type":"color","label":"Foreground","default":"#100f0f"},{"id":"accent","type":"color","label":"Accent","default":"#9d8af0"},{"id":"sway","type":"number","label":"Sway (degrees)","default":9}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #f2f0e5;
        --fg: #100f0f;
        --accent: #9d8af0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #f2f0e5;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="floating-shapes"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#f2f0e5"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mix(from, to, amount) {
          return from.map((value, index) => Math.round(value + (to[index] - value) * amount));
        }
        const background = channels(vars.background);
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const light = mix(accent, background, 0.45);
        const sway = ((Number(vars.sway) || 9) * Math.PI) / 180;
        const unit = view.vmin;
        const mobile = {
          drop: 16, half: 34, rate: 1, shift: 0, spin: 1,
          left: { drop: 14, shape: "circle", size: 11, color: accent },
          right: {
            drop: 12, half: 24, rate: 2, shift: 0.3, spin: -1,
            left: { drop: 18, shape: "half", size: 10, color: foreground },
            right: {
              drop: 10, half: 16, rate: 1, shift: 0.6, spin: 2,
              left: { drop: 12, shape: "triangle", size: 9, color: light },
              right: {
                drop: 9, half: 11, rate: 3, shift: 0.15, spin: -1,
                left: { drop: 8, shape: "ring", size: 6, color: foreground },
                right: { drop: 14, shape: "square", size: 6, color: accent },
              },
            },
          },
        };
        function shape(kind, size, color) {
          context.fillStyle = rgba(color, 1);
          context.beginPath();
          if (kind === "circle") {
            context.arc(0, size, size, 0, turn);
          } else if (kind === "half") {
            context.arc(0, 0, size, 0, Math.PI);
          } else if (kind === "triangle") {
            context.moveTo(0, 0);
            context.lineTo(size, size * 1.6);
            context.lineTo(-size, size * 1.6);
          } else if (kind === "ring") {
            context.arc(0, size, size, 0, turn);
            context.arc(0, size, size * 0.55, 0, turn, true);
          } else {
            context.rect(-size, 0, size * 2, size * 2);
          }
          context.closePath();
          context.fill("evenodd");
        }
        function hang(node, phase) {
          context.strokeStyle = rgba(foreground, 0.8);
          context.lineWidth = unit * 0.16;
          context.beginPath();
          context.moveTo(0, 0);
          context.lineTo(0, node.drop * unit);
          context.stroke();
          context.translate(0, node.drop * unit);
          if (node.shape) {
            context.rotate(0.12 * Math.sin(turn * (phase * 2 + node.size * 0.1)));
            shape(node.shape, node.size * unit, node.color);
            return;
          }
          context.rotate(sway * Math.sin(turn * (phase * node.rate + node.shift)));
          const reach = node.half * unit * Math.cos(turn * (phase * node.spin + node.shift) * 0.5) ** 2 * 0.35 + node.half * unit * 0.65;
          context.strokeStyle = rgba(foreground, 1);
          context.lineWidth = unit * 0.45;
          context.beginPath();
          context.moveTo(-reach, 0);
          context.lineTo(reach, 0);
          context.stroke();
          context.fillStyle = rgba(foreground, 1);
          context.beginPath();
          context.arc(0, 0, unit * 0.7, 0, turn);
          context.fill();
          for (const [side, child] of [[-1, node.left], [1, node.right]]) {
            context.save();
            context.translate(side * reach, 0);
            context.rotate(-sway * 0.6 * Math.sin(turn * (phase * node.rate + node.shift)));
            hang(child, phase);
            context.restore();
          }
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          context.save();
          context.translate(view.width * 0.46, 0);
          hang(mobile, phase);
          context.restore();
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("floating-shapes", timeline);

      })();
    </script>
  </body>
</html>
