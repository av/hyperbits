<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#4fb6ec"},{"id":"ridges","type":"number","label":"Ridge rows","default":34}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #4fb6ec;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="horizon-grid"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mix(from, to, amount) {
          return from.map((value, index) => Math.round(value + (to[index] - value) * amount));
        }
        const background = channels(vars.background);
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const sunLow = mix(accent, foreground, 0.55);
        const ridges = Math.max(8, Math.round(Number(vars.ridges) || 34));
        const horizon = view.height * 0.46;
        const centerX = view.width * 0.5;
        const focal = view.height * 0.55;
        const spacing = 0.5;
        const near = 0.35;
        const far = ridges * spacing;
        const rowsPerLoop = 16;
        const period = rowsPerLoop * spacing;
        const samples = 90;
        const sunX = view.width * 0.66;
        const sunRadius = view.vmin * 19;
        function height(worldX, worldZ) {
          const along = (turn * worldZ) / period;
          return (
            0.55 * Math.sin(along + worldX * 0.45) +
            0.35 * Math.sin(along * 2 - worldX * 0.9 + 1.3) +
            0.18 * Math.sin(along * 3 + worldX * 1.7 + 2.1)
          ) * (0.35 + Math.min(Math.abs(worldX) / 6, 1));
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const travel = phase * period;
          const sway = Math.sin(turn * phase) * 0.8;
          const glow = context.createRadialGradient(sunX, horizon, 0, sunX, horizon, sunRadius * 2.6);
          glow.addColorStop(0, rgba(accent, 0.35));
          glow.addColorStop(1, rgba(accent, 0));
          context.fillStyle = glow;
          context.fillRect(0, 0, view.width, horizon + sunRadius);
          const sun = context.createLinearGradient(0, horizon - sunRadius * 1.3, 0, horizon);
          sun.addColorStop(0, rgba(sunLow, 1));
          sun.addColorStop(1, rgba(accent, 1));
          context.save();
          context.beginPath();
          context.arc(sunX, horizon - sunRadius * 0.3, sunRadius, 0, turn);
          context.clip();
          context.fillStyle = sun;
          context.fillRect(sunX - sunRadius, horizon - sunRadius * 1.4, sunRadius * 2, sunRadius * 2);
          context.fillStyle = rgba(background, 1);
          const slit = sunRadius * 0.22;
          const slide = (phase * 4) % 1;
          for (let band = 0; band < 6; band += 1) {
            const offset = (band + slide) * slit;
            const thickness = slit * (0.08 + 0.09 * (band + slide));
            context.fillRect(sunX - sunRadius, horizon - sunRadius * 0.55 + offset, sunRadius * 2, thickness);
          }
          context.restore();
          const first = Math.ceil((travel + near) / spacing);
          const last = Math.floor((travel + far) / spacing);
          context.lineJoin = "round";
          for (let row = last; row >= first; row -= 1) {
            const worldZ = row * spacing;
            const depth = worldZ - travel;
            const fog = Math.pow(1 - (depth - near) / (far - near), 1.4);
            context.beginPath();
            for (let sample = 0; sample <= samples; sample += 1) {
              const worldX = (sample / samples - 0.5) * (depth * 3.6 + 4) + sway;
              const pointX = centerX + ((worldX - sway) * focal) / depth;
              const pointY = horizon + ((1.2 - height(worldX, worldZ)) * focal) / depth;
              if (sample === 0) context.moveTo(pointX, pointY);
              else context.lineTo(pointX, pointY);
            }
            context.lineTo(view.width * 2, view.height * 2);
            context.lineTo(-view.width, view.height * 2);
            context.closePath();
            context.fillStyle = rgba(background, 1);
            context.fill();
            context.strokeStyle = rgba(row % 4 === 0 ? foreground : accent, fog * (row % 4 === 0 ? 0.9 : 0.75));
            context.lineWidth = Math.max(view.vmin * 0.1, (view.vmin * 0.55) / depth);
            context.stroke();
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("horizon-grid", timeline);

      })();
    </script>
  </body>
</html>
