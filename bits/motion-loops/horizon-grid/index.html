<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#4fb6ec"},{"id":"columns","type":"number","label":"Grid columns","default":24}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #4fb6ec;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="horizon-grid"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        const background = channels(vars.background);
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const columns = Math.max(6, Math.round(Number(vars.columns) || 24));
        const centerX = view.width / 2;
        const horizon = view.height / 2;
        const focal = view.height * 0.42;
        const near = 0.12;
        const far = 32;
        const rowsPerLoop = 18;
        function fade(depth) {
          const distance = Math.min(Math.max((depth - near) / (far - near), 0), 1);
          return Math.pow(1 - distance, 1.5);
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const travel = (phase * rowsPerLoop) % 1;
          const sway = Math.sin(turn * phase) * 0.7;
          const glow = context.createLinearGradient(0, horizon - view.vh * 18, 0, horizon + view.vh * 18);
          glow.addColorStop(0, rgba(accent, 0));
          glow.addColorStop(0.5, rgba(accent, 0.38));
          glow.addColorStop(1, rgba(accent, 0));
          context.fillStyle = glow;
          context.fillRect(0, horizon - view.vh * 18, view.width, view.vh * 36);
          context.lineCap = "round";
          for (const side of [1, -1]) {
            const strength = side > 0 ? 1 : 0.45;
            for (let row = 0; row <= far + 1; row += 1) {
              const depth = row + 1 - travel;
              if (depth < near || depth > far) continue;
              const lineY = horizon + (side * focal) / depth;
              context.strokeStyle = rgba(accent, fade(depth) * strength);
              context.lineWidth = Math.max(view.vmin * 0.09, (view.vmin * 0.6) / depth);
              context.beginPath();
              context.moveTo(0, lineY);
              context.lineTo(view.width, lineY);
              context.stroke();
            }
            for (let column = 0; column <= columns; column += 1) {
              const worldX = column - columns / 2 - sway;
              const nearX = centerX + (worldX * focal) / near;
              const nearY = horizon + (side * focal) / near;
              const farX = centerX + (worldX * focal) / far;
              const farY = horizon + (side * focal) / far;
              const gradient = context.createLinearGradient(nearX, nearY, farX, farY);
              for (let stop = 0; stop <= 8; stop += 1) {
                const progress = stop / 8;
                const depth = 1 / (1 / near + (1 / far - 1 / near) * progress);
                gradient.addColorStop(progress, rgba(accent, fade(depth) * strength));
              }
              context.strokeStyle = gradient;
              context.lineWidth = view.vmin * 0.22;
              context.beginPath();
              context.moveTo(nearX, nearY);
              context.lineTo(farX, farY);
              context.stroke();
            }
          }
          context.fillStyle = rgba(foreground, 0.55);
          context.fillRect(0, horizon - view.vmin * 0.06, view.width, view.vmin * 0.12);
          const vignette = context.createRadialGradient(centerX, horizon, 0, centerX, horizon, view.vmax * 62);
          vignette.addColorStop(0, rgba(background, 0));
          vignette.addColorStop(0.55, rgba(background, 0));
          vignette.addColorStop(1, rgba(background, 0.7));
          context.fillStyle = vignette;
          context.fillRect(0, 0, view.width, view.height);
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("horizon-grid", timeline);

      })();
    </script>
  </body>
</html>
