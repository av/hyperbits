<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#ef5da8"},{"id":"wavelength","type":"number","label":"Wavelength","default":2.4}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ef5da8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="dot-ripple"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const wavelength = Math.max(0.5, Number(vars.wavelength) || 2.4);
        const pitch = view.vmin * 2.6;
        const rows = Math.ceil(view.height / (pitch * 0.62)) + 2;
        const columns = Math.ceil((view.width * 1.6) / pitch);
        const sources = [
          { sourceX: 0.22, sourceY: 0.75 },
          { sourceX: 0.78, sourceY: 0.62 },
          { sourceX: 0.5, sourceY: 0.2 },
        ];
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          for (let row = rows - 1; row >= 0; row -= 1) {
            const share = row / (rows - 1);
            const scale = 1 - 0.4 * share;
            const baseY = view.height * (1.02 - 1.06 * share);
            for (let column = 0; column < columns; column += 1) {
              const offsetX = (column - columns / 2 + (row % 2) * 0.5) * pitch * scale;
              const pointX = view.width / 2 + offsetX;
              if (pointX < -pitch || pointX > view.width + pitch) continue;
              let height = 0;
              for (const source of sources) {
                const distance = Math.hypot(pointX / view.width - source.sourceX, (baseY / view.height - source.sourceY) * 0.6) * 100;
                height += Math.sin(turn * (distance / (wavelength * 4) - phase * 2)) * Math.exp(-distance / 60);
              }
              height /= 2;
              const crest = Math.max(0, height);
              context.fillStyle = rgba(crest > 0.4 ? accent : foreground, crest > 0.4 ? 0.5 : 0.24 + 0.2 * crest);
              context.beginPath();
              context.arc(pointX, baseY - height * view.vmin * 1.6 * scale, view.vmin * (0.26 + 0.16 * crest) * scale, 0, turn);
              context.fill();
            }
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("dot-ripple", timeline);

      })();
    </script>
  </body>
</html>
