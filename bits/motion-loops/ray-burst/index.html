<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#f2f0e5"},{"id":"foreground","type":"color","label":"Foreground","default":"#100f0f"},{"id":"accent","type":"color","label":"Accent","default":"#f2652a"},{"id":"rays","type":"number","label":"Rays","default":64},{"id":"seed","type":"number","label":"Seed","default":12}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #f2f0e5;
        --fg: #100f0f;
        --accent: #f2652a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #f2f0e5;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="ray-burst"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#f2f0e5"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const rays = Math.max(8, Math.round(Number(vars.rays) || 64));
        const seed = Number(vars.seed) || 0;
        const lengths = [...Array(rays).keys()].map((ray) => hyperbits.randomFloat("burst-" + seed + "-" + ray, 0.5, 1));
        const centerX = view.width / 2;
        const centerY = view.height / 2;
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          context.lineCap = "round";
          for (let ray = 0; ray < rays; ray += 1) {
            const angle = (turn * ray) / rays;
            const breath = 0.82 + 0.1 * Math.sin(3 * angle - turn * phase) + 0.08 * Math.sin(turn * (phase * 2 + ray * 0.37));
            const reach = 16 + 74 * lengths[ray] * breath;
            const inner = 8.5 + 0.5 * Math.sin(turn * (phase * 2 + ray / rays));
            const startX = centerX + Math.cos(angle) * view.vmin * inner;
            const startY = centerY + Math.sin(angle) * view.vmin * inner;
            const endX = centerX + Math.cos(angle) * view.vmin * reach;
            const endY = centerY + Math.sin(angle) * view.vmin * reach;
            context.strokeStyle = rgba(foreground, 1);
            context.lineWidth = view.vmin * 0.42;
            context.beginPath();
            context.moveTo(startX, startY);
            context.lineTo(endX, endY);
            context.stroke();
            context.fillStyle = rgba(foreground, 1);
            context.beginPath();
            context.arc(endX, endY, view.vmin * 0.55, 0, turn);
            context.fill();
          }
          context.strokeStyle = rgba(foreground, 1);
          context.lineWidth = view.vmin * 0.3;
          context.beginPath();
          context.arc(centerX, centerY, view.vmin * 6.2, 0, turn);
          context.stroke();
          const pulse = 0.5 + 0.5 * Math.sin(turn * phase * 4);
          context.strokeStyle = rgba(accent, 0.25 + 0.5 * (1 - pulse));
          context.lineWidth = view.vmin * 0.3;
          context.beginPath();
          context.arc(centerX, centerY, view.vmin * (2.6 + 1.6 * pulse), 0, turn);
          context.stroke();
          context.fillStyle = rgba(accent, 1);
          context.beginPath();
          context.arc(centerX, centerY, view.vmin * 1.8, 0, turn);
          context.fill();
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("ray-burst", timeline);

      })();
    </script>
  </body>
</html>
