<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#9d8af0"},{"id":"pinwheels","type":"number","label":"Pinwheels","default":9},{"id":"seed","type":"number","label":"Seed","default":5}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #9d8af0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="pinwheel-grid"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mix(from, to, amount) {
          return from.map((value, index) => Math.round(value + (to[index] - value) * amount));
        }
        const background = channels(vars.background);
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const fold = mix(accent, background, 0.4);
        const paleFold = mix(foreground, background, 0.35);
        const count = Math.max(1, Math.round(Number(vars.pinwheels) || 9));
        const seed = Number(vars.seed) || 0;
        const ground = view.height * 0.9;
        const plants = [...Array(count).keys()].map((index) => {
          const key = "garden-" + seed + "-" + index;
          return {
            baseX: view.width * ((index + hyperbits.randomFloat(key + "-x", 0.3, 0.7)) / count),
            height: view.height * hyperbits.randomFloat(key + "-h", 0.3, 0.7),
            radius: view.vmin * hyperbits.randomFloat(key + "-r", 5, 10),
            spins: hyperbits.pick(key + "-s", [2, 3, 3, 4]),
            pale: index % 3 === 1,
          };
        });
        function wheel(radius, pale) {
          for (let blade = 0; blade < 4; blade += 1) {
            context.fillStyle = rgba(pale ? foreground : accent, 1);
            context.beginPath();
            context.moveTo(0, 0);
            context.lineTo(radius, 0);
            context.lineTo(radius, -radius);
            context.closePath();
            context.fill();
            context.fillStyle = rgba(pale ? paleFold : fold, 1);
            context.beginPath();
            context.moveTo(0, 0);
            context.lineTo(radius, -radius);
            context.lineTo(radius * 0.25, -radius * 0.55);
            context.closePath();
            context.fill();
            context.rotate(Math.PI / 2);
          }
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          context.strokeStyle = rgba(foreground, 0.4);
          context.lineWidth = view.vmin * 0.3;
          context.beginPath();
          context.moveTo(0, ground);
          context.lineTo(view.width, ground);
          context.stroke();
          for (const plant of plants) {
            const gust = Math.pow(0.5 + 0.5 * Math.cos(turn * (phase * 2 - plant.baseX / view.width)), 3);
            const bend = view.vmin * (2 + 7 * gust);
            const tipX = plant.baseX + bend;
            const tipY = ground - plant.height;
            context.strokeStyle = rgba(foreground, 0.85);
            context.lineWidth = view.vmin * 0.4;
            context.beginPath();
            context.moveTo(plant.baseX, ground);
            context.quadraticCurveTo(plant.baseX, ground - plant.height * 0.55, tipX, tipY);
            context.stroke();
            const angle = turn * phase * plant.spins + 1.2 * Math.sin(turn * (phase * 2 - plant.baseX / view.width));
            context.save();
            context.translate(tipX, tipY);
            context.rotate(angle);
            wheel(plant.radius, plant.pale);
            context.fillStyle = rgba(foreground, 1);
            context.beginPath();
            context.arc(0, 0, view.vmin * 0.6, 0, turn);
            context.fill();
            context.restore();
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("pinwheel-grid", timeline);

      })();
    </script>
  </body>
</html>
