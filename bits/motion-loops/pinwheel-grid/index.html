<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#9d8af0"},{"id":"columns","type":"number","label":"Columns","default":10}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #9d8af0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="pinwheel-grid"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mix(from, to, amount) {
          return from.map((value, index) => Math.round(value + (to[index] - value) * amount));
        }
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const shade = mix(accent, channels(vars.background), 0.5);
        const columns = Math.max(2, Math.round(Number(vars.columns) || 10));
        const size = view.width / columns;
        const rows = Math.ceil(view.height / size);
        const marginY = (view.height - rows * size) / 2;
        const ease = hyperbits.Easing.easeInOutCubic;
        function blade(half) {
          context.beginPath();
          context.moveTo(0, 0);
          context.lineTo(0, -half);
          context.lineTo(half, -half);
          context.closePath();
          context.fill();
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const half = size * 0.44;
          for (let row = 0; row < rows; row += 1) {
            for (let column = 0; column < columns; column += 1) {
              const direction = (row + column) % 2 === 0 ? 1 : -1;
              const delay = (column / columns) * 0.35 + (row / rows) * 0.2;
              const beat = phase * 2 - delay;
              const whole = Math.floor(beat);
              const local = Math.min(Math.max((beat - whole) / 0.45, 0), 1);
              const eased = ease(local);
              const angle = direction * (Math.PI / 2) * (whole + eased);
              const squeeze = 1 - 0.18 * Math.sin(Math.PI * local);
              context.save();
              context.translate(column * size + size / 2, marginY + row * size + size / 2);
              context.rotate(angle);
              context.scale(squeeze, squeeze);
              for (let quarter = 0; quarter < 4; quarter += 1) {
                context.fillStyle = rgba(quarter % 2 === 0 ? accent : shade, 1);
                blade(half);
                context.rotate(Math.PI / 2);
              }
              context.fillStyle = rgba(foreground, 1);
              context.beginPath();
              context.arc(0, 0, size * 0.035, 0, turn);
              context.fill();
              context.restore();
            }
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("pinwheel-grid", timeline);

      })();
    </script>
  </body>
</html>
