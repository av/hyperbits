<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#4fb6ec"},{"id":"rings","type":"number","label":"Rings","default":28},{"id":"dots","type":"number","label":"Dots per ring","default":48}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #4fb6ec;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="dot-tunnel"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const rings = Math.max(8, Math.round((Number(vars.rings) || 28) / 4) * 4);
        const dots = Math.max(8, Math.round(Number(vars.dots) || 48));
        const centerX = view.width / 2;
        const centerY = view.height / 2;
        const focal = view.vmin * 30;
        const near = 0.28;
        const far = 12;
        const spacing = (far - near) / rings;
        const ringsPerLoop = 8;
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const vanishX = centerX + Math.sin(turn * phase + far * 0.32) * view.vw * 13;
          const vanishY = centerY + Math.cos(turn * phase * 2 + far * 0.21) * view.vh * 9;
          const core = context.createRadialGradient(vanishX, vanishY, 0, vanishX, vanishY, view.vmin * 26);
          core.addColorStop(0, rgba(accent, 0.22));
          core.addColorStop(1, rgba(accent, 0));
          context.fillStyle = core;
          context.fillRect(0, 0, view.width, view.height);
          for (let ring = rings - 1; ring >= 0; ring -= 1) {
            const slot = (((ring - phase * ringsPerLoop) % rings) + rings) % rings;
            const depth = near + slot * spacing;
            const distance = (depth - near) / (far - near);
            const alpha = Math.pow(1 - distance, 0.7) * Math.min(1, slot * 1.5);
            if (alpha <= 0.002) continue;
            const bend = Math.min(depth / far, 1);
            const offsetX = Math.sin(turn * phase + depth * 0.32) * view.vw * 13 * bend;
            const offsetY = Math.cos(turn * phase * 2 + depth * 0.21) * view.vh * 9 * bend;
            const ringX = centerX + offsetX;
            const ringY = centerY + offsetY;
            const radius = focal / depth;
            const twist = depth * 0.18 + (turn / dots) * phase * 3;
            const dotRadius = Math.max(view.vmin * 0.16, (view.vmin * 0.95) / depth);
            const isBright = Math.round(ring) % 4 === 0;
            context.fillStyle = rgba(isBright ? foreground : accent, alpha);
            context.beginPath();
            for (let dot = 0; dot < dots; dot += 1) {
              const angle = (turn * dot) / dots + twist;
              const dotX = ringX + Math.cos(angle) * radius;
              const dotY = ringY + Math.sin(angle) * radius;
              context.moveTo(dotX + dotRadius, dotY);
              context.arc(dotX, dotY, dotRadius, 0, turn);
            }
            context.fill();
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("dot-tunnel", timeline);

      })();
    </script>
  </body>
</html>
