<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#4fb6ec"},{"id":"frames","type":"number","label":"Rings","default":46},{"id":"dots","type":"number","label":"Dots per ring","default":18}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #4fb6ec;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="dot-tunnel"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const rings = Math.max(8, Math.round(Number(vars.frames) || 46));
        const dots = Math.max(6, Math.round(Number(vars.dots) || 18));
        const span = view.width * 1.2;
        const gap = span / rings;
        const radius = view.vmin * 19;
        const camera = view.vmin * 120;
        const tilt = -0.12;
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const points = [];
          for (let ring = 0; ring < rings; ring += 1) {
            const along = ((((ring - phase * 6) % rings) + rings) % rings) * gap - span / 2;
            const share = along / span + 0.5;
            const swell = 1 + 0.35 * Math.pow(0.5 + 0.5 * Math.cos(turn * (share - phase * 2)), 4);
            const edgeFade = Math.min(1, share * 6, (1 - share) * 6);
            for (let dot = 0; dot < dots; dot += 1) {
              const theta = (turn * dot) / dots + share * 5.5 + (turn / dots) * phase * 4;
              const across = Math.cos(theta) * radius * swell;
              const depth = Math.sin(theta) * radius * swell;
              const scale = camera / (camera - depth);
              const baseX = along * scale;
              const baseY = across * scale;
              points.push({
                pointX: view.width / 2 + baseX * Math.cos(tilt) - baseY * Math.sin(tilt),
                pointY: view.height / 2 + baseX * Math.sin(tilt) + baseY * Math.cos(tilt),
                depth,
                scale,
                fade: edgeFade,
                stripe: Math.sin(theta * 2 - share * 3),
              });
            }
          }
          points.sort((left, right) => left.depth - right.depth);
          for (const point of points) {
            const front = (point.depth / radius + 1) / 2;
            const lit = point.stripe > 0.75;
            context.fillStyle = rgba(lit ? accent : foreground, point.fade * (0.25 + 0.75 * front));
            context.beginPath();
            context.arc(point.pointX, point.pointY, view.vmin * (0.22 + 0.42 * front) * point.scale * (lit ? 1.25 : 1), 0, turn);
            context.fill();
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("dot-tunnel", timeline);

      })();
    </script>
  </body>
</html>
