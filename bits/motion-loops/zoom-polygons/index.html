<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#4fb6ec"},{"id":"sides","type":"number","label":"Polygon sides","default":6},{"id":"count","type":"number","label":"Polygons","default":54}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #4fb6ec;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="zoom-polygons"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const sides = Math.max(3, Math.round(Number(vars.sides) || 6));
        const count = Math.max(1, Math.round(Number(vars.count) || 54));
        const shapes = [...Array(count).keys()].map((index) => {
          const key = "drift-" + index;
          const layer = index % 3;
          return {
            layer,
            homeX: hyperbits.random(key + "-x"),
            homeY: (index * 0.618034 + hyperbits.randomFloat(key + "-y", 0, 0.05)) % 1,
            radius: view.vmin * (2.2 + layer * 2.6) * hyperbits.randomFloat(key + "-r", 0.8, 1.2),
            tilt: hyperbits.randomFloat(key + "-t", 0, turn),
            spin: hyperbits.pick(key + "-s", [-1, 1]),
            inner: hyperbits.random(key + "-i") > 0.7,
            accent: hyperbits.random(key + "-a") > 0.85,
          };
        }).sort((left, right) => left.layer - right.layer);
        function polygon(centerX, centerY, radius, angle) {
          context.beginPath();
          for (let corner = 0; corner <= sides; corner += 1) {
            const theta = angle + (turn * corner) / sides;
            const pointX = centerX + Math.cos(theta) * radius;
            const pointY = centerY + Math.sin(theta) * radius;
            if (corner === 0) context.moveTo(pointX, pointY);
            else context.lineTo(pointX, pointY);
          }
          context.closePath();
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          context.lineJoin = "round";
          for (const shape of shapes) {
            const orbit = view.vmin * (1.5 + 1.5 * shape.layer);
            const centerX = shape.homeX * view.width + Math.cos(turn * (phase + shape.homeY)) * orbit;
            const centerY = shape.homeY * view.height + Math.sin(turn * (phase + shape.homeY)) * orbit;
            const angle = shape.tilt + shape.spin * (turn / sides) * phase;
            const alpha = 0.16 + 0.14 * shape.layer;
            polygon(centerX, centerY, shape.radius, angle);
            context.strokeStyle = rgba(shape.accent ? accent : foreground, shape.accent ? alpha + 0.15 : alpha);
            context.lineWidth = view.vmin * (0.1 + 0.06 * shape.layer);
            context.stroke();
            if (shape.inner) {
              polygon(centerX, centerY, shape.radius * 0.5, -angle);
              context.stroke();
            }
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("zoom-polygons", timeline);

      })();
    </script>
  </body>
</html>
