<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #1c140d;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background-color: #1c140d;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #1c140d;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { display: flex; align-items: center; justify-content: center; perspective: 1200px; background-color: #1c140d; }
      #stack { position: relative; transform-style: preserve-3d; }
      .card {
        position: absolute; inset: 0; border-radius: 24px; border: 4px solid rgba(255,255,255,0.12);
        display: flex; align-items: center; justify-content: center; font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="card-stack"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1080"
    >
      <div id="stack" class="clip" data-start="0" data-duration="4"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const view = hyperbits.viewport();
        const stack = document.getElementById("stack");
        const cardWidth = view.vmin * 30;
        const cardHeight = cardWidth * 1.5;
        stack.style.width = cardWidth + "px";
        stack.style.height = cardHeight + "px";
        const count = 8;
        for (let index = 0; index < count; index += 1) {
          const card = document.createElement("div");
          card.className = "card";
          card.style.backgroundColor = index % 2 === 0 ? "#f6a45c" : "#3f2a14";
          card.style.color = index % 2 === 0 ? "#1c140d" : "#fff7ed";
          card.style.zIndex = String(-index);
          stack.append(card);
        }
        const cards = Array.from(stack.children);
        const timeline = gsap.timeline({ paused: true });
        cards.forEach(function (card, index) {
          const angle = (index - (count - 1) / 2) * 8;
          const xOffset = (index - (count - 1) / 2) * 60;
          timeline.fromTo(
            card,
            { y: 800, rotate: 0, x: 0 },
            { y: 0, x: xOffset, rotate: angle, duration: 50 / 30, ease: "power3.out" },
            index * 3 / 30,
          );
        });
        registerTimeline("card-stack", timeline);

      })();
    </script>
  </body>
</html>
