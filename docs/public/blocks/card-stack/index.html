<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Card color","default":"#f6a45c"},{"id":"background","type":"color","label":"Background","default":"#100f0f"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Geist Sans", Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stack {
        position: relative;
        transform-style: preserve-3d;
        z-index: 1;
      }
      .card-wrap {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-style: preserve-3d;
      }
      .card {
        width: 100%;
        height: 100%;
        border-radius: 24px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fcc192;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="card-stack"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="4" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <div id="stack" class="clip" data-start="0" data-duration="4"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const stack = document.getElementById("stack");
        const cardWidth = vmin * 30;
        const cardHeight = cardWidth * 1.5;
        stack.style.width = cardWidth + "px";
        stack.style.height = cardHeight + "px";
        const count = 8;
        const wraps = [];
        for (let index = 0; index < count; index += 1) {
          const wrap = document.createElement("div");
          wrap.className = "card-wrap";
          wrap.style.zIndex = String(-index);
          wrap.setAttribute("data-layout-allow-overlap", "");
          wrap.setAttribute("data-layout-allow-occlusion", "");
          const card = document.createElement("div");
          card.className = "card";
          card.style.backgroundColor = index % 2 === 0 ? vars.color : "#68431e";
          card.style.borderRadius = unit * 24 + "px";
          card.style.borderWidth = unit * 4 + "px";
          card.style.fontSize = cardWidth * 0.4 + "px";
          const angle = (index - (count - 1) / 2) * 8;
          const xOffset = (index - (count - 1) / 2) * 60 * unit;
          card.style.transform = "translateZ(" + index * -10 * unit + "px) translateX(" + xOffset + "px) rotateZ(" + angle + "deg)";
          card.textContent = String(index + 1);
          wrap.append(card);
          stack.append(wrap);
          wraps.push(wrap);
        }
        const timeline = gsap.timeline({ paused: true });
        hyperbits.stagger(wraps, { y: [800 * unit, 0], duration: 50 / 30, stagger: 3 / 30, ease: "spring", at: 0 }, timeline);
        timeline.to({}, { duration: 4 }, 0);
        registerTimeline("card-stack", timeline);

      })();
    </script>
  </body>
</html>
