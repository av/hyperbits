<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Card color","default":"#38bdf8"},{"id":"background","type":"color","label":"Background","default":"#020617"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #020617;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #020617;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      #world {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
      }
      .col {
        position: absolute;
        top: 0;
        height: 100%;
        overflow: hidden;
      }
      .track {
        display: flex;
        flex-direction: column;
        width: 100%;
      }
      .card {
        width: 100%;
        flex: 0 0 auto;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f8fafc;
        font-weight: 700;
        font-size: 4vmin;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="scrolling-columns"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#020617"></div>
      <div id="world" class="clip" data-start="0" data-duration="10"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const world = document.getElementById("world");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        bg.style.setProperty("--knob-color", vars.color);
        world.style.setProperty("--knob-color", vars.color);
        const columnCount = 4;
        const palette = ["#1e3a8a", "#1d4ed8", "#0f766e", "#9a3412", "#6d28d9", "#be123c", "#0369a1"];
        const speeds = [0.42, 0.68, 0.33, 0.55];
        const columns = [];
        const cardHeight = view.height / 3;
        const cardsPerColumn = 18;
        for (let col = 0; col < columnCount; col += 1) {
          const left = Math.round((col * view.width) / columnCount);
          const next = Math.round(((col + 1) * view.width) / columnCount);
          const column = document.createElement("div");
          column.className = "col";
          column.style.left = left + "px";
          column.style.width = next - left + "px";
          column.style.backgroundColor = vars.background;
          const track = document.createElement("div");
          track.className = "track";
          for (let cardIndex = 0; cardIndex < cardsPerColumn; cardIndex += 1) {
            const card = document.createElement("div");
            card.className = "card";
            card.setAttribute("data-layout-allow-overlap", "");
            card.setAttribute("data-layout-allow-occlusion", "");
            card.setAttribute("data-layout-allow-overflow", "");
            card.style.height = cardHeight + "px";
            card.style.fontSize = view.vmin * 4 + "px";
            card.style.backgroundColor = palette[hyperbits.randomInt("c-" + col + "-" + cardIndex, 0, palette.length - 1)];
            card.style.color = "#f8fafc";
            card.style.textShadow = "0 2px 10px rgba(0,0,0,0.65)";
            card.style.boxShadow = "inset 0 0 0 " + Math.max(2, view.vmin * 0.25) + "px " + vars.color;
            card.textContent = String(hyperbits.randomInt("n-" + col + "-" + cardIndex, 1, 9));
            track.append(card);
          }
          column.append(track);
          world.append(column);
          columns.push({ track: track, speed: speeds[col] });
        }
        const proxy = { t: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, {
          t: 10,
          duration: 10,
          ease: "none",
          onUpdate: function () {
            columns.forEach(function (column) {
              column.track.style.transform = "translateY(" + -proxy.t * column.speed * view.height * 0.55 + "px)";
            });
          },
        }, 0);
        registerTimeline("scrolling-columns", timeline);

      })();
    </script>
  </body>
</html>
