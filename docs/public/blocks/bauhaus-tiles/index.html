<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#f2f0e5"},{"id":"foreground","type":"color","label":"Foreground","default":"#100f0f"},{"id":"accent","type":"color","label":"Accent","default":"#9d8af0"},{"id":"beat","type":"number","label":"Beat hold (0-1)","default":0.45}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="./hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #f2f0e5;
        --fg: #100f0f;
        --accent: #9d8af0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #f2f0e5;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="bauhaus-tiles"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#f2f0e5"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mix(from, to, amount) {
          return from.map((value, index) => Math.round(value + (to[index] - value) * amount));
        }
        const background = channels(vars.background);
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const muted = mix(accent, background, 0.55);
        const hold = Math.min(Math.max(Number(vars.beat) || 0.45, 0), 0.9);
        const ease = hyperbits.Easing.easeInOutCubic;
        const unit = view.vmin;
        function beatState(phase) {
          const beat = phase * 4;
          const whole = Math.floor(beat);
          const local = Math.min(Math.max((beat - whole) / (1 - hold), 0), 1);
          return { whole, eased: ease(local) };
        }
        function pose(values, state, shift) {
          const from = values[(((state.whole + shift) % 4) + 4) % 4];
          const to = values[(((state.whole + shift + 1) % 4) + 4) % 4];
          return from + (to - from) * state.eased;
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const state = beatState(phase);
          const turns = state.whole + state.eased;
          context.fillStyle = rgba(muted, 1);
          const quarter = unit * pose([34, 28, 38, 30], state, 0);
          context.beginPath();
          context.moveTo(0, view.height);
          context.arc(0, view.height, quarter, -Math.PI / 2, 0);
          context.closePath();
          context.fill();
          const circleX = view.width * pose([0.3, 0.35, 0.31, 0.25], state, 0);
          const circleY = view.height * pose([0.44, 0.5, 0.58, 0.5], state, 0);
          context.fillStyle = rgba(accent, 1);
          context.beginPath();
          context.arc(circleX, circleY, unit * 24, 0, turn);
          context.fill();
          context.strokeStyle = rgba(foreground, 1);
          context.lineWidth = unit * 0.8;
          context.beginPath();
          context.arc(circleX + unit * pose([20, 14, -18, -12], state, 1), circleY - unit * pose([18, 22, 16, 12], state, 2), unit * 9, 0, turn);
          context.stroke();
          context.save();
          context.translate(view.width * 0.63, view.height * 0.64);
          context.rotate((Math.PI / 2) * turns);
          context.fillStyle = rgba(foreground, 1);
          context.beginPath();
          context.arc(0, 0, unit * 17, 0, Math.PI);
          context.closePath();
          context.fill();
          context.restore();
          context.fillStyle = rgba(foreground, 1);
          for (let bar = 0; bar < 3; bar += 1) {
            const length = view.width * 0.38 * pose([1, 0.35, 0.7, 0.2], state, bar);
            context.fillRect(view.width * 0.95 - length, view.height * (0.14 + bar * 0.075), length, unit * 3.2);
          }
          context.save();
          context.translate(view.width * 0.8, view.height * 0.72);
          context.rotate(((turn / 3) * turns));
          context.fillStyle = rgba(accent, 1);
          context.beginPath();
          for (let corner = 0; corner < 3; corner += 1) {
            const angle = (turn * corner) / 3 - Math.PI / 2;
            if (corner === 0) context.moveTo(Math.cos(angle) * unit * 13, Math.sin(angle) * unit * 13);
            else context.lineTo(Math.cos(angle) * unit * 13, Math.sin(angle) * unit * 13);
          }
          context.closePath();
          context.fill();
          context.restore();
          for (let dot = 0; dot < 16; dot += 1) {
            const dotX = view.width * 0.08 + (dot % 4) * unit * 4.2;
            const dotY = view.height * 0.12 + Math.floor(dot / 4) * unit * 4.2;
            const grow = pose([1, 0.35, 1, 0.6], state, (dot % 4) + Math.floor(dot / 4));
            context.fillStyle = rgba(dot === 5 ? accent : foreground, 1);
            context.beginPath();
            context.arc(dotX, dotY, unit * 1.3 * grow, 0, turn);
            context.fill();
          }
          const startX = view.width * 0.46;
          const startY = view.height * 1.02;
          const endX = view.width * 0.98;
          const endY = view.height * 0.02;
          context.strokeStyle = rgba(foreground, 1);
          context.lineWidth = unit * 0.35;
          context.beginPath();
          context.moveTo(startX, startY);
          context.lineTo(endX, endY);
          context.stroke();
          const ride = pose([0.2, 0.5, 0.82, 0.5], state, 0);
          context.fillStyle = rgba(accent, 1);
          context.save();
          context.translate(startX + (endX - startX) * ride, startY + (endY - startY) * ride);
          context.rotate(Math.atan2(endY - startY, endX - startX));
          context.fillRect(-unit * 2.5, -unit * 2.5, unit * 5, unit * 5);
          context.restore();
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("bauhaus-tiles", timeline);

      })();
    </script>
  </body>
</html>
