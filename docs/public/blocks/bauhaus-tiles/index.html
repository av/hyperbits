<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#f2f0e5"},{"id":"foreground","type":"color","label":"Foreground","default":"#100f0f"},{"id":"accent","type":"color","label":"Accent","default":"#9d8af0"},{"id":"size","type":"number","label":"Motif size (vmin)","default":9}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #f2f0e5;
        --fg: #100f0f;
        --accent: #9d8af0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #f2f0e5;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="bauhaus-tiles"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#f2f0e5"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mix(from, to, amount) {
          return from.map((value, index) => Math.round(value + (to[index] - value) * amount));
        }
        const background = channels(vars.background);
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const tones = [mix(accent, background, 0.55), mix(accent, background, 0.75), mix(foreground, background, 0.8), mix(accent, background, 0.3)];
        const size = view.vmin * Math.max(3, Number(vars.size) || 9);
        const period = 5;
        const rows = Math.ceil(view.height / size) + 1;
        const motifs = ["quarter", "half", "circle", "triangle", "bar", "dot"];
        const pattern = [];
        for (let row = 0; row < rows; row += 1) {
          const line = [];
          for (let cell = 0; cell < period; cell += 1) {
            const key = "frieze-" + row + "-" + cell;
            line.push({ motif: hyperbits.pick(key + "-m", motifs), tone: hyperbits.pick(key + "-t", [0, 0, 1, 2, 3]), turn: hyperbits.randomInt(key + "-r", 0, 3) });
          }
          pattern.push(line);
        }
        function motif(kind, tone, quarter) {
          const half = size / 2;
          context.save();
          context.rotate((Math.PI / 2) * quarter);
          context.fillStyle = rgba(tones[tone], 1);
          context.beginPath();
          if (kind === "quarter") {
            context.moveTo(-half, -half);
            context.arc(-half, -half, size * 0.9, 0, Math.PI / 2);
          } else if (kind === "half") {
            context.arc(0, half, half * 0.9, Math.PI, turn);
          } else if (kind === "circle") {
            context.arc(0, 0, half * 0.62, 0, turn);
          } else if (kind === "triangle") {
            context.moveTo(-half * 0.8, half * 0.8);
            context.lineTo(half * 0.8, half * 0.8);
            context.lineTo(-half * 0.8, -half * 0.8);
          } else if (kind === "bar") {
            context.rect(-half * 0.85, -half * 0.18, size * 0.85, half * 0.36);
          } else {
            context.arc(0, 0, half * 0.2, 0, turn);
          }
          context.closePath();
          context.fill();
          context.restore();
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const cells = Math.ceil(view.width / size) + 2;
          for (let row = 0; row < rows; row += 1) {
            const direction = row % 2 === 0 ? 1 : -1;
            const offset = direction * phase * period * size;
            const first = Math.floor(-offset / size) - 1;
            for (let index = first; index < first + cells; index += 1) {
              const entry = pattern[row][((index % period) + period) % period];
              context.save();
              context.translate(index * size + offset + size / 2, row * size + size / 2);
              motif(entry.motif, entry.tone, entry.turn);
              context.restore();
            }
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("bauhaus-tiles", timeline);

      })();
    </script>
  </body>
</html>
