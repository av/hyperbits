<!doctype html>
<html lang="en" data-composition-variables='[{"id":"caption","type":"string","label":"Caption","default":"RENDERED IN TWELVE GLYPHS"},{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Bright glyphs","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#ec8b49"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Mono";
        font-weight: 500;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-500-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist Mono";
        font-weight: 700;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="./hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ec8b49;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #caption {
        position: absolute;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-weight: 500;
        letter-spacing: 0.3em;
        color: #f2f0e5;
        white-space: nowrap;
        left: 0;
        right: 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="ascii-torus"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="8" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="8"></canvas>
      <div id="caption" class="clip" data-start="0" data-duration="8"></div>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + Math.round(rgb[0]) + ", " + Math.round(rgb[1]) + ", " + Math.round(rgb[2]) + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mixRgb(from, to, amount) {
          return [from[0] + (to[0] - from[0]) * amount, from[1] + (to[1] - from[1]) * amount, from[2] + (to[2] - from[2]) * amount];
        }
        function progressOf(time, start, length) {
          return Math.min(Math.max((time - start) / length, 0), 1);
        }

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const caption = document.getElementById("caption");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const duration = 8;
        const back = channels(vars.background);
        const fore = channels(vars.foreground);
        const accent = channels(vars.accent);
        const ramp = ".,-~:;=!*#$@";
        const noiseGlyphs = "01<>/|+%&?";
        const fontSize = view.vmin * 1.55;
        const cellWidth = fontSize * 0.62;
        const cellHeight = fontSize * 1.08;
        const columns = Math.floor(view.width / cellWidth);
        const rows = Math.floor(view.height / cellHeight);
        const offsetX = (view.width - columns * cellWidth) / 2;
        const offsetY = (view.height - rows * cellHeight) / 2;
        const depth = new Float32Array(columns * rows);
        const shade = new Float32Array(columns * rows);
        const thetaSteps = 180;
        const phiSteps = 560;
        const thetaCos = new Float32Array(thetaSteps);
        const thetaSin = new Float32Array(thetaSteps);
        const phiCos = new Float32Array(phiSteps);
        const phiSin = new Float32Array(phiSteps);
        for (let index = 0; index < thetaSteps; index += 1) {
          thetaCos[index] = Math.cos((index / thetaSteps) * Math.PI * 2);
          thetaSin[index] = Math.sin((index / thetaSteps) * Math.PI * 2);
        }
        for (let index = 0; index < phiSteps; index += 1) {
          phiCos[index] = Math.cos((index / phiSteps) * Math.PI * 2);
          phiSin[index] = Math.sin((index / phiSteps) * Math.PI * 2);
        }
        const tones = [
          rgba(mixRgb(back, accent, 0.28), 1),
          rgba(mixRgb(back, accent, 0.55), 1),
          rgba(accent, 1),
          rgba(mixRgb(accent, fore, 0.55), 1),
          rgba(fore, 1),
        ];
        const dust = rgba(mixRgb(back, fore, 0.09), 1);
        function hash(first, second) {
          let value = Math.imul(first ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(second + 0x632be5ab, 0xc2b2ae35);
          value ^= value >>> 15;
          value = Math.imul(value, 0x27d4eb2f);
          value ^= value >>> 13;
          return (value >>> 0) / 4294967296;
        }
        function draw(time) {
          if (!context || typeof context.stroke !== "function") return;
          depth.fill(0);
          shade.fill(-1);
          const grow = hyperbits.Easing.easeOutCubic(progressOf(time, 0.15, 1.6));
          const spinA = 0.9 + time * 0.62;
          const spinB = 0.4 + time * 0.38;
          const cosA = Math.cos(spinA);
          const sinA = Math.sin(spinA);
          const cosB = Math.cos(spinB);
          const sinB = Math.sin(spinB);
          const tube = 1;
          const ring = 2.15;
          const distance = 9;
          const scale = (view.height * 0.37 * distance * grow) / (tube + ring);
          const lightX = -0.38;
          const lightY = 0.62;
          const lightZ = -0.69;
          for (let thetaIndex = 0; thetaIndex < thetaSteps; thetaIndex += 1) {
            const ct = thetaCos[thetaIndex];
            const st = thetaSin[thetaIndex];
            const circleX = ring + tube * ct;
            const circleY = tube * st;
            for (let phiIndex = 0; phiIndex < phiSteps; phiIndex += 1) {
              const cp = phiCos[phiIndex];
              const sp = phiSin[phiIndex];
              const pointX = circleX * (cosB * cp + sinA * sinB * sp) - circleY * cosA * sinB;
              const pointY = circleX * (sinB * cp - sinA * cosB * sp) + circleY * cosA * cosB;
              const pointZ = distance + cosA * circleX * sp + circleY * sinA;
              const inverse = 1 / pointZ;
              const column = Math.floor(columns / 2 + (scale * inverse * pointX) / cellWidth);
              const row = Math.floor(rows / 2 - (scale * inverse * pointY) / cellHeight);
              if (column < 0 || column >= columns || row < 0 || row >= rows) continue;
              const normalX = ct * (cosB * cp + sinA * sinB * sp) - st * cosA * sinB;
              const normalY = ct * (sinB * cp - sinA * cosB * sp) + st * cosA * cosB;
              const normalZ = cosA * ct * sp + st * sinA;
              const index = row * columns + column;
              if (inverse > depth[index]) {
                depth[index] = inverse;
                shade[index] = normalX * lightX + normalY * lightY + normalZ * lightZ;
              }
            }
          }
          context.clearRect(0, 0, view.width, view.height);
          context.textBaseline = "top";
          context.font = "500 " + fontSize + "px 'Geist Mono', ui-monospace, monospace";
          context.fillStyle = dust;
          for (let row = 0; row < rows; row += 2) {
            for (let column = row % 4 === 0 ? 0 : 2; column < columns; column += 4) {
              if (shade[row * columns + column] < 0 || depth[row * columns + column] === 0) context.fillText("\u00b7", offsetX + column * cellWidth, offsetY + row * cellHeight);
            }
          }
          const settle = progressOf(time, 0.3, 2.2);
          const tick = Math.floor(time * 18);
          const buckets = [[], [], [], [], []];
          for (let row = 0; row < rows; row += 1) {
            for (let column = 0; column < columns; column += 1) {
              const index = row * columns + column;
              if (depth[index] === 0) continue;
              const light = Math.max(0, shade[index]) ** 1.35;
              let glyph = ramp[Math.min(ramp.length - 1, Math.floor(light * ramp.length))];
              if (hash(index, tick) > settle * 1.15) glyph = noiseGlyphs[Math.floor(hash(index + 7, tick) * noiseGlyphs.length)];
              const bucket = Math.min(4, Math.floor(light * 5.2));
              buckets[bucket].push(glyph, offsetX + column * cellWidth, offsetY + row * cellHeight);
            }
          }
          context.font = "700 " + fontSize + "px 'Geist Mono', ui-monospace, monospace";
          for (let bucket = 0; bucket < buckets.length; bucket += 1) {
            const list = buckets[bucket];
            context.fillStyle = tones[bucket];
            for (let index = 0; index < list.length; index += 3) context.fillText(list[index], list[index + 1], list[index + 2]);
          }
        }
        caption.textContent = String(vars.caption);
        caption.style.fontSize = view.vmin * 1.8 + "px";
        caption.style.bottom = view.vmin * 5 + "px";
        caption.style.color = vars.foreground;
        const legend = document.createElement("div");
        legend.style.position = "absolute";
        legend.style.left = "50%";
        legend.style.transform = "translateX(-50%)";
        legend.style.top = view.vmin * 5 + "px";
        legend.style.display = "flex";
        legend.style.gap = view.vmin * 1.6 + "px";
        legend.style.fontFamily = "'Geist Mono', ui-monospace, monospace";
        legend.style.fontWeight = "700";
        legend.style.fontSize = view.vmin * 2.2 + "px";
        const legendCells = Array.from(ramp).map((glyph, index) => {
          const cell = document.createElement("span");
          cell.textContent = glyph;
          const amount = index / (ramp.length - 1);
          cell.style.color = rgba(amount < 0.6 ? mixRgb(mixRgb(back, accent, 0.6), accent, amount / 0.6) : mixRgb(accent, fore, (amount - 0.6) / 0.4), 1);
          legend.append(cell);
          return cell;
        });
        root.append(legend);
        legend.className = "clip";
        legend.setAttribute("data-start", "0");
        legend.setAttribute("data-duration", String(duration));
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: duration, duration: duration, ease: "none", onUpdate: () => draw(proxy.time) }, 0);
        timeline.fromTo(legendCells, { opacity: 0, y: -view.vmin * 1.5 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.05, ease: "power3.out" }, 0.4);
        timeline.fromTo(caption, { opacity: 0, y: view.vmin * 1.5 }, { opacity: 0.7, y: 0, duration: 1.2, ease: "power3.out" }, 0.9);
        draw(0);
        registerTimeline("ascii-torus", timeline);
      })();
    </script>
  </body>
</html>
