<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Flake color","default":"#ffffff"},{"id":"background","type":"color","label":"Background","default":"#01050e"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #01050e;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #01050e;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="particles-snow"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#01050e"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;width:100%;height:100%;z-index:1"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const vmax = view.vmax;
        bg.style.backgroundColor = vars.background;
        const canvas = document.getElementById("stage");
        canvas.setAttribute("data-color", vars.color);
        canvas.width = view.width;
        canvas.height = view.height;
        const variants = [
          { size: vmin * 1, color: vars.color + "e6" },
          { size: vmin * 2, color: "rgba(224, 231, 255, 0.9)" },
          { size: vmin * 4, color: "rgba(199, 210, 254, 0.3)" },
        ];
        const variantOf = function (particle) {
          return variants[Math.floor(particle.seed * variants.length)];
        };
        const simulator = hyperbits.createParticles({
          fps: 30,
          spawners: [{
            id: "spawner-0",
            rate: 1,
            startFrame: 200,
            position: { x: view.width / 2, y: -200 * (view.height / 1080) },
            area: { width: view.width, height: 0 },
            lifespan: 200,
          }],
          behaviors: [
            { id: "gravity", handler: hyperbits.createGravity({ y: 0.1 }) },
            { id: "wiggle", handler: hyperbits.createWiggle(1, 0.5) },
            { id: "wind", handler: function (particle) { particle.velocity.x += 0.01; } },
            { id: "fade", handler: function (particle, age) { particle.opacity = Math.min(1, Math.max(0, age / particle.lifespan)); } },
          ],
        });
        const timeline = gsap.timeline({ paused: true });
        hyperbits.bind(timeline, canvas, simulator, {
          shape: "glow",
          size: function (particle) { return variantOf(particle).size * 0.7 * Math.SQRT2; },
          color: function (particle) { return variantOf(particle).color; },
          offset: function (particle) { const size = variantOf(particle).size; return { x: size / 2, y: size / 2 }; },
        });
        timeline.to({}, { duration: 10 }, 0);
        registerTimeline("particles-snow", timeline);

      })();
    </script>
  </body>
</html>
