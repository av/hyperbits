<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Flake color","default":"#e0e7ff"},{"id":"background","type":"color","label":"Background","default":"#01050e"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #01050e;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #01050e;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="particles-snow"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#01050e"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;width:100%;height:100%;z-index:1"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const simulator = hyperbits.createParticles({
          fps: 30,
          spawners: [{
            id: "sky",
            rate: 2.6,
            startFrame: 90,
            position: { x: view.width / 2, y: -view.vmin * 1.2 },
            area: { width: view.width, height: 0 },
            velocity: { x: 0.35, y: 1.6, varianceX: 0.9, varianceY: 0.8 },
            lifespan: 200,
            lifespanVariance: 40,
            max: 320,
          }],
          behaviors: [
            { id: "gravity", handler: hyperbits.createGravity({ y: 0.08 }) },
            { id: "wiggle", handler: hyperbits.createWiggle(1, 0.5) },
            { id: "wind", handler: function (particle) { particle.velocity.x += 0.01; } },
            { id: "fade", handler: hyperbits.createOpacityOverLife([0, 1, 1, 0]) },
          ],
        });
        const timeline = gsap.timeline({ paused: true });
        hyperbits.bind(timeline, canvas, simulator, {
          color: vars.color,
          size: view.vmin * 1.2,
          glow: 1.4,
          shape: "circle",
        });
        timeline.to({}, { duration: 10 }, 0);
        registerTimeline("particles-snow", timeline);

      })();
    </script>
  </body>
</html>
