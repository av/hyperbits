<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#f2f0e5"},{"id":"foreground","type":"color","label":"Foreground","default":"#100f0f"},{"id":"accent","type":"color","label":"Accent","default":"#ef5da8"},{"id":"dots","type":"number","label":"Florets per flower","default":90}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #f2f0e5;
        --fg: #100f0f;
        --accent: #ef5da8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #f2f0e5;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="phyllotaxis-bloom"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#f2f0e5"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mix(from, to, amount) {
          return from.map((value, index) => Math.round(value + (to[index] - value) * amount));
        }
        const background = channels(vars.background);
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const petal = mix(accent, background, 0.45);
        const petalLight = mix(accent, background, 0.65);
        const seedTone = mix(foreground, background, 0.55);
        const florets = Math.max(20, Math.round(Number(vars.dots) || 90));
        const golden = Math.PI * (3 - Math.sqrt(5));
        const ease = hyperbits.Easing.easeInOutSine;
        const cellX = view.vmin * 20;
        const cellY = view.vmin * 17;
        const radius = view.vmin * 7.2;
        const flowers = [];
        for (let row = -1; row * cellY < view.height + cellY; row += 1) {
          for (let column = -1; column * cellX < view.width + cellX; column += 1) {
            flowers.push({ centerX: column * cellX + (row % 2 === 0 ? 0 : cellX / 2), centerY: row * cellY });
          }
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const spread = radius / Math.sqrt(florets);
          const seeds = Math.round(florets * 0.3);
          for (const flower of flowers) {
            const lag = flower.centerX / view.width + flower.centerY / view.height * 0.5;
            const open = ease(0.5 + 0.5 * Math.sin(turn * (phase - lag)));
            for (let index = florets - 1; index >= 0; index -= 1) {
              const distance = spread * Math.sqrt(index + 0.5);
              const angle = index * golden;
              const floretX = flower.centerX + Math.cos(angle) * distance;
              const floretY = flower.centerY + Math.sin(angle) * distance;
              if (index < seeds) {
                context.fillStyle = rgba(seedTone, 0.7);
                context.beginPath();
                context.arc(floretX, floretY, spread * 0.38, 0, turn);
                context.fill();
                continue;
              }
              const length = spread * (1 + 1.6 * open);
              context.save();
              context.translate(floretX, floretY);
              context.rotate(angle);
              context.fillStyle = rgba(index % 3 === 0 ? petalLight : petal, 1);
              context.beginPath();
              context.ellipse(length * 0.5, 0, length * 0.5, spread * 0.55, 0, 0, turn);
              context.fill();
              context.restore();
            }
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("phyllotaxis-bloom", timeline);

      })();
    </script>
  </body>
</html>
