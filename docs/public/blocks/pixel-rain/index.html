<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#ef5da8"},{"id":"columns","type":"number","label":"Columns","default":96},{"id":"seed","type":"number","label":"Seed","default":2}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ef5da8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="pixel-rain"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mix(from, to, amount) {
          return from.map((value, index) => Math.round(value + (to[index] - value) * amount));
        }
        const background = channels(vars.background);
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const water = mix(accent, background, 0.8);
        const columns = Math.max(16, Math.round(Number(vars.columns) || 96));
        const seed = Number(vars.seed) || 0;
        const cell = view.width / columns;
        const rows = Math.ceil(view.height / cell);
        const surface = Math.round(rows * 0.8);
        const block = cell * 0.86;
        const drops = [...Array(Math.round(columns * 1.5)).keys()].map((index) => {
          const key = "drop-" + seed + "-" + index;
          return {
            column: hyperbits.randomInt(key + "-c", 0, columns - 1),
            start: hyperbits.randomInt(key + "-s", -16, -2),
            offset: hyperbits.random(key + "-o"),
            laps: hyperbits.pick(key + "-l", [1, 2, 2, 3]),
            bright: hyperbits.random(key + "-b") > 0.7,
          };
        });
        function pixel(column, row, color, alpha) {
          if (row < 0 || row >= rows || alpha <= 0.01) return;
          const wrapped = ((column % columns) + columns) % columns;
          context.fillStyle = rgba(color, alpha);
          context.fillRect(wrapped * cell + (cell - block) / 2, row * cell + (cell - block) / 2, block, block);
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          for (let row = surface; row < rows; row += 1) {
            for (let column = 0; column < columns; column += 1) {
              const shimmer = 0.5 + 0.5 * Math.sin(turn * (phase * 2 + column * 0.11 + (row - surface) * 0.35));
              pixel(column, row, water, (0.2 + 0.45 * shimmer) * (1 - 0.6 * (row - surface) / (rows - surface)));
            }
          }
          for (const drop of drops) {
            const progress = (((drop.offset + phase * drop.laps) % 1) + 1) % 1;
            const color = drop.bright ? accent : foreground;
            if (progress < 0.62) {
              const fall = Math.pow(progress / 0.62, 2);
              const row = Math.floor(drop.start + (surface - drop.start) * fall);
              const drift = Math.floor((row - drop.start) * 0.35);
              pixel(drop.column + drift, row, color, 1);
              pixel(drop.column + drift, row - 1, color, 0.6);
              pixel(drop.column + drift - 1, row - 2, color, 0.3);
            } else {
              const splash = (progress - 0.62) / 0.38;
              const drift = Math.floor((surface - drop.start) * 0.35);
              const reach = Math.floor(splash * 7);
              const alpha = Math.pow(1 - splash, 1.5);
              pixel(drop.column + drift - reach, surface, color, alpha);
              pixel(drop.column + drift + reach, surface, color, alpha);
              if (splash < 0.35) pixel(drop.column + drift, surface - 1 - Math.floor(splash * 6), color, 1 - splash / 0.35);
              pixel(drop.column + drift - Math.floor(reach / 2), surface + 1, accent, alpha * 0.6);
              pixel(drop.column + drift + Math.floor(reach / 2), surface + 1, accent, alpha * 0.6);
            }
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("pixel-rain", timeline);

      })();
    </script>
  </body>
</html>
