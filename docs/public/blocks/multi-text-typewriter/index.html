<!doctype html>
<html lang="en" data-composition-variables='[{"id":"lines","type":"string","label":"Lines (pipe separated)","default":"First sentence.|Second longer sentence.|Looping..."}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0f172a;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #line {
        color: #f8fafc;
        font-family: ui-monospace, monospace;
        font-weight: 700;
        display: flex;
        align-items: baseline;
      }
      #cursor {
        width: 0.08em;
        background-color: #f8fafc;
        margin-left: 0.06em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="multi-text-typewriter"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="line" class="clip" data-start="0" data-duration="10">
        <span id="typed"></span><span id="cursor">&nbsp;</span>
      </div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const view = hyperbits.viewport();
        const typed = document.getElementById("typed");
        const line = document.getElementById("line");
        const cursor = document.getElementById("cursor");
        line.style.fontSize = view.vmin * 7 + "px";
        cursor.style.height = view.vmin * 7 + "px";
        const sentences = String(vars.lines).split("|");
        const typeSpeed = 3 / 30;
        const deleteSpeed = 1 / 30;
        const pauseAfterType = 40 / 30;
        const pauseAfterDelete = 20 / 30;
        function textAt(time) {
          let cursorTime = time;
          let sentenceIndex = 0;
          while (sentenceIndex < 40) {
            const sentence = sentences[sentenceIndex % sentences.length];
            const typeDur = sentence.length * typeSpeed;
            if (cursorTime < typeDur) return sentence.slice(0, Math.max(0, Math.floor(cursorTime / typeSpeed)));
            cursorTime -= typeDur;
            if (cursorTime < pauseAfterType) return sentence;
            cursorTime -= pauseAfterType;
            const deleteDur = sentence.length * deleteSpeed;
            if (cursorTime < deleteDur) {
              const remain = sentence.length - Math.floor(cursorTime / deleteSpeed);
              return sentence.slice(0, Math.max(0, remain));
            }
            cursorTime -= deleteDur;
            if (cursorTime < pauseAfterDelete) return "";
            cursorTime -= pauseAfterDelete;
            sentenceIndex += 1;
          }
          return "";
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, {
          time: 10,
          duration: 10,
          ease: "none",
          onUpdate: function () { typed.textContent = textAt(proxy.time); },
        }, 0);
        timeline.fromTo(cursor, { opacity: 1 }, { opacity: 0, duration: 0.4, repeat: 24, yoyo: true, ease: "none" }, 0);
        registerTimeline("multi-text-typewriter", timeline);

      })();
    </script>
  </body>
</html>
