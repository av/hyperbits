<!doctype html>
<html lang="en" data-composition-variables='[{"id":"words","type":"string","label":"Words (comma separated)","default":"INITIALIZING,LOADING ASSETS,SYSTEM ONLINE,WELCOME USER"},{"id":"color","type":"color","label":"Text color","default":"#4ade80"},{"id":"background","type":"color","label":"Background","default":"#020617"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #020617;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #020617;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #title {
        color: #4ade80;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-weight: 700;
        letter-spacing: 0.14em;
        font-size: 10vmin;
        position: relative;
        z-index: 1;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="glitch-cycle"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="8" style="position:absolute;inset:0;background-color:#020617"></div>
      <h1 id="title" class="clip" data-start="0" data-duration="8">INITIALIZING</h1>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const title = document.getElementById("title");
        const view = hyperbits.viewport(root);
        const words = String(vars.words).split(",").map(function (part) { return part.trim(); }).filter(Boolean);
        bg.style.backgroundColor = vars.background;
        title.style.color = vars.color;
        title.setAttribute("data-color", vars.color);
        title.style.fontSize = view.vmin * 10 + "px";
        title.setAttribute("aria-label", vars.words);
        const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$";
        const itemDuration = 2;
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        function renderCycle() {
          const time = proxy.time;
          const index = Math.min(Math.max(words.length - 1, 0), Math.floor(time / itemDuration));
          const local = time - index * itemDuration;
          const target = words[index] || "";
          const glitchWindow = 0.35;
          if (local < glitchWindow) {
            const mix = local / glitchWindow;
            let output = "";
            for (let charIndex = 0; charIndex < target.length; charIndex += 1) {
              if (hyperbits.random("cycle-" + index + "-" + charIndex + "-" + Math.floor(mix * 12)) < mix) {
                output += target[charIndex];
              } else {
                output += glyphs[hyperbits.randomInt("g-" + index + "-" + charIndex + "-" + Math.floor(local * 20), 0, glyphs.length - 1)];
              }
            }
            title.textContent = output;
          } else {
            title.textContent = target;
          }
        }
        timeline.to(proxy, { time: 8, duration: 8, ease: "none", onUpdate: renderCycle }, 0);
        registerTimeline("glitch-cycle", timeline);

      })();
    </script>
  </body>
</html>
