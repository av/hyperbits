<!doctype html>
<html lang="en" data-composition-variables='[{"id":"headline","type":"string","label":"Headline","default":"DEPTH"},{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Face","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Extrusion","default":"#ec8b49"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 900;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-900-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="./hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ec8b49;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #scene {
        position: absolute;
        inset: 0;
        perspective: 2200px;
      }
      #word {
        position: absolute;
        left: 50%;
        top: 50%;
        display: flex;
        transform-style: preserve-3d;
      }
      .letter {
        position: relative;
        transform-style: preserve-3d;
      }
      .layer {
        position: absolute;
        left: 0;
        top: 0;
        font-family: "Geist Sans", ui-sans-serif, system-ui, sans-serif;
        font-weight: 900;
        line-height: 1;
        white-space: pre;
      }
      .ghost {
        visibility: hidden;
        font-family: "Geist Sans", ui-sans-serif, system-ui, sans-serif;
        font-weight: 900;
        line-height: 1;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="extruded-type"
      data-start="0"
      data-duration="7"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="7" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <div id="scene" class="clip" data-start="0" data-duration="7"><div id="word"></div></div>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + Math.round(rgb[0]) + ", " + Math.round(rgb[1]) + ", " + Math.round(rgb[2]) + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mixRgb(from, to, amount) {
          return [from[0] + (to[0] - from[0]) * amount, from[1] + (to[1] - from[1]) * amount, from[2] + (to[2] - from[2]) * amount];
        }

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const word = document.getElementById("word");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        const duration = 7;
        const back = channels(vars.background);
        const fore = channels(vars.foreground);
        const accent = channels(vars.accent);
        const text = String(vars.headline).slice(0, 14);
        const fontSize = Math.min(view.vmin * 30, (view.width * 0.8) / Math.max(1, text.length * 0.68));
        const layers = 28;
        const depth = fontSize * 0.32;
        word.setAttribute("aria-label", text);
        const letters = Array.from(text).map((character) => {
          const letter = document.createElement("div");
          letter.className = "letter";
          const ghost = document.createElement("span");
          ghost.className = "ghost";
          ghost.textContent = character;
          ghost.style.fontSize = fontSize + "px";
          letter.append(ghost);
          for (let layer = layers; layer >= 0; layer -= 1) {
            const node = document.createElement("span");
            node.className = "layer";
            node.textContent = character;
            node.style.fontSize = fontSize + "px";
            const amount = layer / layers;
            const color = layer === 0 ? fore : mixRgb(mixRgb(accent, fore, 0.18), mixRgb(accent, back, 0.72), amount);
            node.style.color = rgba(color, 1);
            node.style.transform = "translateZ(" + -amount * depth + "px)";
            letter.append(node);
          }
          word.append(letter);
          return letter;
        });
        word.style.transform = "translate(-50%, -50%)";
        const shadow = document.createElement("div");
        shadow.style.position = "absolute";
        shadow.style.left = "50%";
        const shadowWidth = fontSize * Math.max(1, text.length) * 0.71;
        shadow.style.top = view.height / 2 + fontSize * 0.73 + "px";
        shadow.style.width = shadowWidth + "px";
        shadow.style.height = view.vmin * 8 + "px";
        shadow.style.marginLeft = -shadowWidth / 2 + "px";
        shadow.style.borderRadius = "50%";
        shadow.style.background = "radial-gradient(closest-side, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0))";
        document.getElementById("scene").style.perspective = view.vmin * 204 + "px";
        document.getElementById("scene").prepend(shadow);
        const proxy = { time: 0 };
        function render() {
          const time = proxy.time;
          letters.forEach((letter, index) => {
            const start = 0.25 + index * 0.11;
            const raw = Math.min(1, Math.max(0, (time - start) / 0.9));
            const eased = 1 - Math.pow(1 - raw, 3) * Math.cos(raw * Math.PI * 1.1);
            const flip = (1 - eased) * 100;
            letter.style.transform = "translateY(" + (1 - Math.min(1, raw * 1.6)) * fontSize * 0.5 + "px) rotateX(" + flip + "deg)";
            letter.style.transformOrigin = "50% 100% " + -depth / 2 + "px";
            letter.style.opacity = String(Math.min(1, raw * 4));
          });
          const settle = hyperbits.Easing.easeInOutSine(Math.min(1, Math.max(0, (time - 1.2) / 5.8)));
          const yaw = -28 + settle * 50 + Math.sin(time * 0.7) * 3;
          const pitch = 14 - settle * 6;
          word.style.transform = "translate(-50%, -50%) rotateX(" + pitch + "deg) rotateY(" + yaw + "deg)";
          shadow.style.opacity = String(Math.min(1, time / 1.2) * 0.9);
          shadow.style.transform = "scaleX(" + (0.8 + 0.2 * Math.cos((yaw * Math.PI) / 180)) + ")";
        }
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: duration, duration: duration, ease: "none", onUpdate: render }, 0);
        render();
        registerTimeline("extruded-type", timeline);
      })();
    </script>
  </body>
</html>
