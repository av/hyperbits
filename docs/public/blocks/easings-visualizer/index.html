<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #09090b;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #09090b;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #09090b;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { display: flex; align-items: center; justify-content: center; background-color: #09090b; }
      #board { display: flex; flex-direction: column; width: 70%; }
      .row { display: flex; align-items: center; }
      .label { color: #cbd5e1; font-weight: 600; width: 18%; }
      .track { flex: 1; height: 8px; background-color: #1e293b; border-radius: 99px; position: relative; }
      .dot { position: absolute; top: 50%; width: 28px; height: 28px; margin-top: -14px; border-radius: 8px; background-color: #38bdf8; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="easings-visualizer"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <div id="board" class="clip" data-start="0" data-duration="3"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const view = hyperbits.viewport();
        const board = document.getElementById("board");
        board.style.gap = view.vmin * 3.2 + "px";
        board.style.fontSize = view.vmin * 2.2 + "px";
        const easings = ["none", "power1.out", "power2.out", "power3.inOut", "back.out", "elastic.out"];
        const dots = [];
        for (const easing of easings) {
          const row = document.createElement("div");
          row.className = "row";
          row.style.gap = view.vmin * 2 + "px";
          const label = document.createElement("div");
          label.className = "label";
          label.textContent = easing;
          const track = document.createElement("div");
          track.className = "track";
          const dot = document.createElement("div");
          dot.className = "dot";
          track.append(dot);
          row.append(label, track);
          board.append(row);
          dots.push({ dot: dot, track: track, easing: easing });
        }
        const timeline = gsap.timeline({ paused: true });
        dots.forEach(function (item) {
          const travel = function () { return item.track.clientWidth - 28; };
          timeline.fromTo(item.dot, { x: 0 }, { x: travel, duration: 2.2, ease: item.easing }, 0.2);
        });
        registerTimeline("easings-visualizer", timeline);

      })();
    </script>
  </body>
</html>
