<!doctype html>
<html lang="en" data-composition-variables='[{"id":"name","type":"string","label":"Name","default":"Ada Lovelace"},{"id":"title","type":"string","label":"Title","default":"Analytical Engine Programmer"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0f172a;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { background-color: #0f172a; }
      #card {
        position: absolute; display: flex; align-items: stretch; overflow: hidden;
      }
      #bar { background-color: #38bdf8; transform-origin: center top; }
      #copy { background-color: #111827; color: #f8fafc; display: flex; flex-direction: column; justify-content: center; }
      #name { font-weight: 800; }
      #role { color: #cbd5e1; font-weight: 500; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="lower-third"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="card" class="clip" data-start="0" data-duration="5" data-layout-allow-caption-zone>
        <div id="bar"></div>
        <div id="copy">
          <div id="name">Ada Lovelace</div>
          <div id="role">Analytical Engine Programmer</div>
        </div>
      </div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const view = hyperbits.viewport();
        const card = document.getElementById("card");
        const bar = document.getElementById("bar");
        const copy = document.getElementById("copy");
        const nameEl = document.getElementById("name");
        const roleEl = document.getElementById("role");
        nameEl.textContent = vars.name;
        roleEl.textContent = vars.title;
        card.style.left = view.vw * 6 + "px";
        card.style.bottom = view.vh * 10 + "px";
        const barWidth = view.vmin * 1.6;
        const cardHeight = view.vmin * 18;
        bar.style.width = barWidth + "px";
        bar.style.minHeight = cardHeight + "px";
        bar.style.borderRadius = barWidth + "px";
        copy.style.padding = view.vmin * 2 + "px " + view.vmin * 3.5 + "px";
        copy.style.minHeight = cardHeight + "px";
        nameEl.style.fontSize = view.vmin * 4.2 + "px";
        roleEl.style.fontSize = view.vmin * 2.3 + "px";
        const timeline = gsap.timeline({ paused: true });
        timeline.fromTo(bar, { scaleY: 0 }, { scaleY: 1, duration: 0.55, ease: "power3.out" }, 0.1);
        timeline.fromTo(copy, { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.25);
        timeline.to(copy, { x: -40, opacity: 0, duration: 0.45, ease: "power2.in" }, 4.2);
        timeline.to(bar, { scaleY: 0, duration: 0.4, ease: "power2.in" }, 4.35);
        registerTimeline("lower-third", timeline);

      })();
    </script>
  </body>
</html>
