<!doctype html>
<html lang="en" data-composition-variables='[{"id":"headline","type":"string","label":"Headline","default":"Ship the frame"},{"id":"subline","type":"string","label":"Subline","default":"ORDERED DITHER / 3 INKS / 1 BIT PER INK"},{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Highlight ink","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent ink","default":"#ec8b49"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 800;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-800-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist Mono";
        font-weight: 500;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-500-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="./hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ec8b49;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #subline {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-weight: 500;
        letter-spacing: 0.24em;
        white-space: nowrap;
        color: #f2f0e5;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="dither-type"
      data-start="0"
      data-duration="7.5"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="7.5" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="7.5"></canvas>
      <div id="subline" class="clip" data-start="0" data-duration="7.5"></div>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const subline = document.getElementById("subline");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        canvas.setAttribute("aria-label", String(vars.headline));
        const context = canvas.getContext("2d");
        const duration = 7.5;
        const back = channels(vars.background);
        const fore = channels(vars.foreground);
        const accent = channels(vars.accent);
        const pixel = Math.max(2, Math.round(view.vmin * 0.4));
        const bufferWidth = Math.ceil(view.width / pixel);
        const bufferHeight = Math.ceil(view.height / pixel);
        const bayer = [0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26, 12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22, 3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25, 15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21].map((value) => (value + 0.5) / 64);
        const headline = String(vars.headline);
        const font = "800 FONTSIZEpx 'Geist Sans', ui-sans-serif, system-ui, sans-serif";
        let masks = null;
        let maskFontReady = false;
        let offscreen = null;
        let offscreenContext = null;
        let image = null;
        let words = null;
        const palette = new Uint32Array(3);
        function pack(rgb) {
          return (255 << 24) | (Math.round(rgb[2]) << 16) | (Math.round(rgb[1]) << 8) | Math.round(rgb[0]);
        }
        function buildMasks() {
          const scratch = document.createElement("canvas");
          scratch.width = bufferWidth;
          scratch.height = bufferHeight;
          const scratchContext = scratch.getContext("2d", { willReadFrequently: true });
          let size = (view.vmin * 15) / pixel;
          scratchContext.font = font.replace("FONTSIZE", String(size));
          const measured = scratchContext.measureText(headline).width;
          if (measured > bufferWidth * 0.86) size *= (bufferWidth * 0.86) / measured;
          const fontString = font.replace("FONTSIZE", String(size));
          scratchContext.font = fontString;
          scratchContext.textAlign = "center";
          scratchContext.textBaseline = "middle";
          scratchContext.fillStyle = "#ffffff";
          scratchContext.fillText(headline, bufferWidth / 2, bufferHeight * 0.46);
          const text = scratchContext.getImageData(0, 0, bufferWidth, bufferHeight).data;
          scratchContext.clearRect(0, 0, bufferWidth, bufferHeight);
          scratchContext.filter = "blur(" + size * 0.32 + "px)";
          scratchContext.fillText(headline, bufferWidth / 2, bufferHeight * 0.46);
          scratchContext.filter = "none";
          const glow = scratchContext.getImageData(0, 0, bufferWidth, bufferHeight).data;
          const textMask = new Float32Array(bufferWidth * bufferHeight);
          const glowMask = new Float32Array(bufferWidth * bufferHeight);
          for (let index = 0; index < textMask.length; index += 1) {
            textMask[index] = text[index * 4 + 3] / 255;
            glowMask[index] = Math.min(1, (glow[index * 4 + 3] / 255) * 1.8);
          }
          maskFontReady = !document.fonts || document.fonts.check(fontString);
          return { textMask, glowMask };
        }
        function draw(time) {
          if (!context || typeof context.stroke !== "function") return;
          if (!offscreen) {
            offscreen = document.createElement("canvas");
            offscreen.width = bufferWidth;
            offscreen.height = bufferHeight;
            offscreenContext = offscreen.getContext("2d");
            image = offscreenContext.createImageData(bufferWidth, bufferHeight);
            words = new Uint32Array(image.data.buffer);
            palette[0] = pack(back);
            palette[1] = pack(accent);
            palette[2] = pack(fore);
          }
          if (!masks || !maskFontReady) masks = buildMasks();
          const { textMask, glowMask } = masks;
          const lightX = bufferWidth * (0.5 + 0.16 * Math.cos(time * 0.55 + 2.2));
          const lightY = bufferHeight * (0.47 + 0.1 * Math.sin(time * 0.7));
          const lightRadius = bufferHeight * 0.48;
          const lightPower = 0.24 * smoothstep(0, 1.4, time) * (1 - smoothstep(6.4, 7.3, time));
          const dissolve = smoothstep(5.9, 7.1, time);
          for (let row = 0; row < bufferHeight; row += 1) {
            const rowOffset = row * bufferWidth;
            const bayerRow = (row & 7) * 8;
            const dy = (row - lightY) / lightRadius;
            for (let column = 0; column < bufferWidth; column += 1) {
              const index = rowOffset + column;
              const dx = (column - lightX) / lightRadius;
              const distance = dx * dx + dy * dy;
              let level = distance < 1 ? lightPower * (1 - distance) * (1 - distance) : 0;
              const sweep = (time - 0.7) * 1.25 - (column / bufferWidth) * 1.3 + (row / bufferHeight) * 0.15;
              const reveal = Math.min(1, Math.max(0, sweep));
              const glowReveal = Math.min(1, Math.max(0, sweep + 0.35));
              const glow = glowMask[index] * 0.52 * glowReveal * (1 - glowReveal * 0.25);
              const text = textMask[index] * reveal;
              if (glow > level) level = glow;
              if (text > level) level = text;
              level *= 1 - dissolve;
              const threshold = bayer[bayerRow + (column & 7)];
              if (level <= 0.5) words[index] = level * 2 > threshold ? palette[1] : palette[0];
              else words[index] = (level - 0.5) * 2 > threshold ? palette[2] : palette[1];
            }
          }
          offscreenContext.putImageData(image, 0, 0);
          context.clearRect(0, 0, view.width, view.height);
          context.imageSmoothingEnabled = false;
          context.drawImage(offscreen, 0, 0, bufferWidth * pixel, bufferHeight * pixel);
        }
        subline.textContent = String(vars.subline);
        subline.style.fontSize = view.vmin * 2.2 + "px";
        subline.style.top = view.height * 0.66 + "px";
        subline.style.color = vars.foreground;
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: duration, duration: duration, ease: "none", onUpdate: () => draw(proxy.time) }, 0);
        timeline.fromTo(subline, { opacity: 0, y: view.vmin * 1.5 }, { opacity: 0.7, y: 0, duration: 1.2, ease: "power3.out" }, 2.2);
        timeline.to(subline, { opacity: 0, duration: 0.5, ease: "power2.in" }, 5.9);
        if (document.fonts && document.fonts.load) {
          document.fonts.load(font.replace("FONTSIZE", "64")).then(() => {
            masks = null;
            draw(proxy.time);
          });
        }
        draw(0);
        registerTimeline("dither-type", timeline);
      })();
    </script>
  </body>
</html>
