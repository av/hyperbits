<!doctype html>
<html lang="en" data-composition-variables='[{"id":"text","type":"string","label":"Text","default":"SYSTEM ONLINE"},{"id":"color","type":"color","label":"Text color","default":"#4ade80"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #020617;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #020617;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #020617;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #020617;
      }
      #title {
        color: #4ade80;
        font-family: ui-monospace, monospace;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="glitch-in"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <h1 id="title" class="clip" data-start="0" data-duration="3">SYSTEM ONLINE</h1>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const view = hyperbits.viewport();
        const title = document.getElementById("title");
        const finalText = vars.text;
        title.style.color = vars.color;
        title.style.fontSize = view.vmin * 7 + "px";
        const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&";
        const proxy = { progress: 0 };
        const timeline = gsap.timeline({ paused: true });
        function renderGlitch() {
          const visible = Math.floor(proxy.progress * finalText.length);
          let output = "";
          for (let index = 0; index < finalText.length; index += 1) {
            if (index < visible) {
              output += finalText[index];
            } else {
              const pick = hyperbits.randomInt("glitch-" + index + "-" + visible, 0, glyphs.length - 1);
              output += glyphs[pick];
            }
          }
          title.textContent = output;
        }
        timeline.fromTo(
          proxy,
          { progress: 0 },
          { progress: 1, duration: 1.5, ease: "none", onUpdate: renderGlitch },
          0,
        );
        timeline.fromTo(title, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0);
        registerTimeline("glitch-in", timeline);

      })();
    </script>
  </body>
</html>
