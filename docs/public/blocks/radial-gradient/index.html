<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color1Start","type":"color","label":"Gradient 1 Start","default":"#FDB813"},{"id":"color1End","type":"color","label":"Gradient 1 End","default":"#78C0E0"},{"id":"color2Start","type":"color","label":"Gradient 2 Start","default":"#F5576C"},{"id":"color2End","type":"color","label":"Gradient 2 End","default":"#2F2044"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #FDB813;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #FDB813;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="radial-gradient"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="3" style="position:absolute;inset:0;background-color:#FDB813"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const bg = document.getElementById("bg");
        const from = "radial-gradient(circle at 20% 20%, " + vars.color1Start + ", " + vars.color1End + ")";
        const to = "radial-gradient(circle at 80% 80%, " + vars.color2Start + ", " + vars.color2End + ")";
        const proxy = hyperbits.gradientProxy(bg, [from, to]);
        const apply = function () {
          proxy.apply();
          bg.style.backgroundColor = vars.color1Start;
          bg.style.setProperty("--knob-color", vars.color1Start);
        };
        const timeline = gsap.timeline({ paused: true });
        timeline.fromTo(proxy.proxy, { progress: 0 }, { progress: 1, duration: 3, ease: "none", onUpdate: apply }, 0);
        timeline.fromTo(bg, { x: 0 }, { x: 0.5, duration: 3, ease: "none" }, 0);
        registerTimeline("radial-gradient", timeline);
        apply();

      })();
    </script>
  </body>
</html>
