<!doctype html>
<html lang="en" data-composition-variables='[{"id":"rules","type":"string","label":"Rules, comma separated","default":"30,90,110,45"},{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Cells","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Newest cells","default":"#ec8b49"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Mono";
        font-weight: 500;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-500-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="./hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ec8b49;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="rule-cascade"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="10"></canvas>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + Math.round(rgb[0]) + ", " + Math.round(rgb[1]) + ", " + Math.round(rgb[2]) + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mixRgb(from, to, amount) {
          return [from[0] + (to[0] - from[0]) * amount, from[1] + (to[1] - from[1]) * amount, from[2] + (to[2] - from[2]) * amount];
        }

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const duration = 10;
        const back = channels(vars.background);
        const fore = channels(vars.foreground);
        const accent = channels(vars.accent);
        const rules = String(vars.rules).split(",").map((value) => Math.max(0, Math.min(255, Math.round(Number(value) || 0))));
        if (rules.length === 0) rules.push(30);
        canvas.setAttribute("aria-label", "Rules " + String(vars.rules));
        const cell = view.vmin * 1.25;
        const columns = Math.ceil(view.width / cell);
        const visibleRows = Math.ceil(view.height / cell) + 2;
        const speed = (26 * visibleRows) / 82;
        const totalGenerations = Math.ceil(duration * speed) + 2;
        const switchEvery = Math.ceil(totalGenerations / rules.length);
        const history = [];
        let row = new Uint8Array(columns);
        row[Math.floor(columns / 2)] = 1;
        for (let index = 0; index < 5; index += 1) row[Math.floor(hyperbits.random("cascade-seed-" + index) * columns)] = 1;
        history.push(row);
        for (let generation = 1; generation < totalGenerations; generation += 1) {
          const rule = rules[Math.min(rules.length - 1, Math.floor(generation / switchEvery))];
          const next = new Uint8Array(columns);
          for (let column = 0; column < columns; column += 1) {
            const left = row[(column - 1 + columns) % columns];
            const middle = row[column];
            const right = row[(column + 1) % columns];
            next[column] = (rule >> ((left << 2) | (middle << 1) | right)) & 1;
          }
          if (generation % switchEvery === 0 && next.every((value) => value === 0)) next[Math.floor(columns / 2)] = 1;
          history.push(next);
          row = next;
        }
        function draw(time) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const exact = time * speed;
          const newest = Math.min(totalGenerations - 1, Math.floor(exact));
          const fraction = exact - Math.floor(exact);
          const bottom = view.height - cell * 2;
          const size = cell * 0.78;
          const corner = cell * 0.18;
          for (let age = 0; age < visibleRows; age += 1) {
            const generation = newest - age;
            if (generation < 0) break;
            const rowY = bottom - (age + fraction) * cell;
            if (rowY < -cell) break;
            const cells = history[generation];
            const heat = Math.max(0, 1 - (age + fraction) / 10);
            const fade = Math.max(0, 1 - (age / visibleRows) * 0.85);
            const color = heat > 0 ? mixRgb(mixRgb(back, fore, 0.55 * fade), accent, heat) : mixRgb(back, fore, 0.55 * fade);
            context.fillStyle = rgba(color, 1);
            context.beginPath();
            for (let column = 0; column < columns; column += 1) {
              if (!cells[column]) continue;
              context.roundRect(column * cell + (cell - size) / 2, rowY + (cell - size) / 2, size, size, corner);
            }
            context.fill();
          }
          const rule = rules[Math.min(rules.length - 1, Math.floor(newest / switchEvery))];
          const panelX = view.vmin * 6;
          const panelY = view.vmin * 6;
          const box = view.vmin * 1.6;
          const gap = view.vmin * 0.35;
          const group = box * 3 + gap * 2;
          const panelWidth = group * 8 + view.vmin * 1.8 * 7 + view.vmin * 4;
          context.fillStyle = rgba(back, 0.88);
          context.beginPath();
          context.roundRect(panelX - view.vmin * 2, panelY - view.vmin * 2, panelWidth, view.vmin * 15, view.vmin * 1.2);
          context.fill();
          context.font = "500 " + view.vmin * 2.4 + "px 'Geist Mono', ui-monospace, monospace";
          context.textBaseline = "top";
          context.fillStyle = rgba(accent, 1);
          context.fillText("RULE " + String(rule).padStart(3, "0"), panelX, panelY);
          context.fillStyle = rgba(mixRgb(back, fore, 0.5), 1);
          context.fillText("GEN " + String(newest).padStart(4, "0"), panelX + view.vmin * 16, panelY);
          const tableY = panelY + view.vmin * 5;
          for (let pattern = 7; pattern >= 0; pattern -= 1) {
            const groupX = panelX + (7 - pattern) * (group + view.vmin * 1.8);
            for (let bit = 0; bit < 3; bit += 1) {
              const on = (pattern >> (2 - bit)) & 1;
              context.fillStyle = on ? rgba(fore, 0.9) : rgba(mixRgb(back, fore, 0.15), 1);
              context.fillRect(groupX + bit * (box + gap), tableY, box, box);
            }
            const out = (rule >> pattern) & 1;
            context.fillStyle = out ? rgba(accent, 1) : rgba(mixRgb(back, fore, 0.15), 1);
            context.fillRect(groupX + box + gap, tableY + box + gap, box, box);
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: duration, duration: duration, ease: "none", onUpdate: () => draw(proxy.time) }, 0);
        draw(0);
        registerTimeline("rule-cascade", timeline);
      })();
    </script>
  </body>
</html>
