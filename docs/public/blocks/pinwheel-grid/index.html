<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#9d8af0"},{"id":"pinwheels","type":"number","label":"Pinwheels per row","default":14},{"id":"seed","type":"number","label":"Seed","default":5}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #9d8af0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="pinwheel-grid"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mix(from, to, amount) {
          return from.map((value, index) => Math.round(value + (to[index] - value) * amount));
        }
        const background = channels(vars.background);
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const perRow = Math.max(2, Math.round(Number(vars.pinwheels) || 14));
        const seed = Number(vars.seed) || 0;
        const plants = [];
        for (let row = 0; row < 6; row += 1) {
          const depth = 1 - row / 6;
          const count = Math.round(perRow * (0.85 + row * 0.06));
          for (let index = 0; index < count; index += 1) {
            const key = "meadow-" + seed + "-" + row + "-" + index;
            plants.push({
              depth,
              baseX: view.width * ((index + hyperbits.randomFloat(key + "-x", 0.2, 0.8)) / count),
              baseY: view.height * (1.04 - 0.165 * row),
              height: view.vmin * (7 + 6 * depth) * hyperbits.randomFloat(key + "-h", 0.8, 1.2),
              radius: view.vmin * (2.4 + 1.6 * depth),
              tone: mix(hyperbits.random(key + "-t") > 0.75 ? foreground : accent, background, 0.4 + 0.15 * (1 - depth)),
              fold: mix(accent, background, 0.7 + 0.1 * (1 - depth)),
              spin: hyperbits.pick(key + "-s", [1, 1, -1]),
            });
          }
        }
        plants.sort((left, right) => left.depth - right.depth);
        function wheel(radius, tone, fold) {
          for (let blade = 0; blade < 4; blade += 1) {
            context.fillStyle = rgba(tone, 1);
            context.beginPath();
            context.moveTo(0, 0);
            context.lineTo(radius, 0);
            context.lineTo(radius, -radius);
            context.closePath();
            context.fill();
            context.fillStyle = rgba(fold, 1);
            context.beginPath();
            context.moveTo(0, 0);
            context.lineTo(radius, -radius);
            context.lineTo(radius * 0.25, -radius * 0.55);
            context.closePath();
            context.fill();
            context.rotate(Math.PI / 2);
          }
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          for (const plant of plants) {
            const gust = Math.pow(0.5 + 0.5 * Math.cos(turn * (phase - plant.baseX / view.width)), 3);
            const tipX = plant.baseX + view.vmin * (0.6 + 2.4 * gust) * plant.depth;
            const tipY = plant.baseY - plant.height;
            context.strokeStyle = rgba(foreground, 0.12 + 0.18 * plant.depth);
            context.lineWidth = view.vmin * (0.1 + 0.18 * plant.depth);
            context.beginPath();
            context.moveTo(plant.baseX, plant.baseY);
            context.quadraticCurveTo(plant.baseX, plant.baseY - plant.height * 0.55, tipX, tipY);
            context.stroke();
            context.save();
            context.translate(tipX, tipY);
            context.rotate(plant.spin * (turn * phase + 0.8 * Math.sin(turn * (phase - plant.baseX / view.width))));
            wheel(plant.radius, plant.tone, plant.fold);
            context.restore();
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("pinwheel-grid", timeline);

      })();
    </script>
  </body>
</html>
