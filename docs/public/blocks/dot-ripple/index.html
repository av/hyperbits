<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#ef5da8"},{"id":"wavelength","type":"number","label":"Wavelength (vmin)","default":12}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ef5da8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="dot-ripple"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const wavelength = view.vmin * Math.max(3, Number(vars.wavelength) || 12);
        const centerX = view.width * 0.5;
        const centerY = view.height * 0.58;
        const radius = view.vmin * 62;
        const pitch = view.vmin * 2.6;
        const tilt = 1.0;
        const lift = view.vmin * 5.5;
        const dots = [];
        for (let ring = 1; ring * pitch <= radius; ring += 1) {
          const count = Math.round((turn * ring * pitch) / pitch);
          for (let index = 0; index < count; index += 1) {
            const angle = (turn * index) / count;
            dots.push({ flatX: Math.cos(angle) * ring * pitch, flatY: Math.sin(angle) * ring * pitch, share: (ring * pitch) / radius });
          }
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const strikeX = radius * 0.32 * Math.cos(turn * phase);
          const strikeY = radius * 0.32 * Math.sin(turn * phase);
          const projected = dots.map((dot) => {
            const distance = Math.hypot(dot.flatX - strikeX, dot.flatY - strikeY);
            const height = Math.sin(turn * (distance / wavelength - phase * 5)) * Math.exp(-distance / (radius * 0.75)) * (1 - Math.pow(dot.share, 6));
            return {
              pointX: centerX + dot.flatX,
              pointY: centerY + dot.flatY * Math.cos(tilt) - height * lift,
              height,
              back: dot.flatY,
            };
          });
          projected.sort((left, right) => left.back - right.back);
          for (const point of projected) {
            const crest = Math.max(0, point.height);
            context.fillStyle = rgba(crest > 0.35 ? accent : foreground, crest > 0.35 ? 0.6 + 0.4 * crest : 0.28 + 0.4 * (point.height + 1) / 2);
            context.beginPath();
            context.arc(point.pointX, point.pointY, view.vmin * (0.22 + 0.38 * (point.height + 1) / 2), 0, turn);
            context.fill();
          }
          context.strokeStyle = rgba(foreground, 0.5);
          context.lineWidth = view.vmin * 0.25;
          context.beginPath();
          context.ellipse(centerX, centerY, radius + pitch, (radius + pitch) * Math.cos(tilt), 0, 0, turn);
          context.stroke();
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("dot-ripple", timeline);

      })();
    </script>
  </body>
</html>
