<!doctype html>
<html lang="en" data-composition-variables='[{"id":"caption","type":"string","label":"Caption","default":"SYSTEM 09 / OUTER RING"},{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Highlight ink","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent ink","default":"#ec8b49"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Mono";
        font-weight: 500;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-500-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="./hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ec8b49;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .hud {
        position: absolute;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: #f2f0e5;
        white-space: nowrap;
      }
      .corner {
        position: absolute;
        border-color: #ec8b49;
        border-style: solid;
        border-width: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="dither-orb"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="10"></canvas>
      <div id="hud" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0"></div>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function smoothstep(edge0, edge1, value) {
          const amount = Math.min(Math.max((value - edge0) / (edge1 - edge0), 0), 1);
          return amount * amount * (3 - 2 * amount);
        }
        function progressOf(time, start, length) {
          return Math.min(Math.max((time - start) / length, 0), 1);
        }

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const hud = document.getElementById("hud");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const duration = 10;
        const ink = { back: channels(vars.background), fore: channels(vars.foreground), accent: channels(vars.accent) };
        const pixel = Math.max(2, Math.round(view.vmin * 0.45));
        const bufferWidth = Math.ceil(view.width / pixel);
        const bufferHeight = Math.ceil(view.height / pixel);
        const bayer = [0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26, 12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22, 3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25, 15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21].map((value) => (value + 0.5) / 64);
        const stars = [];
        for (let index = 0; index < 260; index += 1) {
          stars.push({
            column: Math.floor(hyperbits.randomFloat("orb-star-x-" + index, 0, bufferWidth)),
            row: Math.floor(hyperbits.randomFloat("orb-star-y-" + index, 0, bufferHeight)),
            level: hyperbits.randomFloat("orb-star-l-" + index, 0.2, 1),
            phase: hyperbits.randomFloat("orb-star-p-" + index, 0, Math.PI * 2),
            speed: hyperbits.randomFloat("orb-star-s-" + index, 1, 3),
          });
        }
        const centerX = bufferWidth * 0.6;
        const centerY = bufferHeight * 0.52;
        const radius = bufferHeight * 0.3;
        const ringInner = 1.38;
        const ringOuter = 2.25;
        const tilt = -0.32;
        const ringPitch = 0.3;
        const normal = [-Math.sin(tilt) * Math.cos(ringPitch), Math.cos(tilt) * Math.cos(ringPitch), Math.sin(ringPitch)];
        function ringDensity(distance) {
          if (distance < ringInner || distance > ringOuter) return 0;
          const span = (distance - ringInner) / (ringOuter - ringInner);
          const gap = span > 0.56 && span < 0.62 ? 0.08 : 1;
          const grooves = 0.62 + 0.38 * Math.sin(span * 61) * Math.sin(span * 17 + 1.3);
          return gap * grooves * Math.min(1, span * 7) * Math.min(1, (1 - span) * 9);
        }
        let offscreen = null;
        let offscreenContext = null;
        let image = null;
        let words = null;
        const palette = new Uint32Array(3);
        function pack(rgb) {
          return (255 << 24) | (Math.round(rgb[2]) << 16) | (Math.round(rgb[1]) << 8) | Math.round(rgb[0]);
        }
        function tone(level, column, row) {
          const threshold = bayer[(row & 7) * 8 + (column & 7)];
          if (level <= 0.5) return level * 2 > threshold ? 1 : 0;
          return (level - 0.5) * 2 > threshold ? 2 : 1;
        }
        function draw(time) {
          if (!context || typeof context.stroke !== "function") return;
          if (!offscreen) {
            offscreen = document.createElement("canvas");
            offscreen.width = bufferWidth;
            offscreen.height = bufferHeight;
            offscreenContext = offscreen.getContext("2d");
            image = offscreenContext.createImageData(bufferWidth, bufferHeight);
            words = new Uint32Array(image.data.buffer);
            palette[0] = pack(ink.back);
            palette[1] = pack(ink.accent);
            palette[2] = pack(ink.fore);
          }
          const swing = hyperbits.Easing.easeInOutSine(progressOf(time, 0.4, 8.2));
          const lightAngle = 2.75 - swing * 3.55;
          const light = [Math.sin(lightAngle) * 0.94, -0.34, Math.cos(lightAngle) * 0.94];
          const lightLength = Math.hypot(light[0], light[1], light[2]);
          light[0] /= lightLength;
          light[1] /= lightLength;
          light[2] /= lightLength;
          const spin = time * 0.22;
          const reveal = smoothstep(0, 1.6, time);
          const lightDotNormal = light[0] * normal[0] + light[1] * normal[1] + light[2] * normal[2];
          words.fill(palette[0]);
          for (const star of stars) {
            const twinkle = star.level * (0.55 + 0.45 * Math.sin(time * star.speed + star.phase));
            const level = twinkle * 0.9;
            const index = star.row * bufferWidth + star.column;
            if (level > 0.75) words[index] = palette[2];
            else if (level > 0.3) words[index] = palette[1];
          }
          const reach = Math.ceil(radius * ringOuter * 1.05);
          const left = Math.max(0, Math.floor(centerX - reach));
          const right = Math.min(bufferWidth, Math.ceil(centerX + reach));
          const top = Math.max(0, Math.floor(centerY - reach));
          const bottom = Math.min(bufferHeight, Math.ceil(centerY + reach));
          for (let row = top; row < bottom; row += 1) {
            const unitY = (row + 0.5 - centerY) / radius;
            for (let column = left; column < right; column += 1) {
              const unitX = (column + 0.5 - centerX) / radius;
              const planar = unitX * unitX + unitY * unitY;
              let level = -1;
              let depth = -Infinity;
              if (planar < 1) {
                const unitZ = Math.sqrt(1 - planar);
                depth = unitZ;
                const turnedX = unitX * Math.cos(tilt) - unitY * Math.sin(tilt);
                const turnedY = unitX * Math.sin(tilt) + unitY * Math.cos(tilt);
                const latitude = Math.asin(Math.max(-1, Math.min(1, turnedY)));
                const longitude = Math.atan2(turnedX, unitZ) + spin;
                const bands = 0.78 + 0.16 * Math.sin(latitude * 11 + 0.9 * Math.sin(longitude * 2 + latitude * 4)) + 0.06 * Math.sin(latitude * 29 + longitude);
                const stormX = Math.sin(longitude - 0.6);
                const storm = Math.exp(-((latitude - 0.38) * (latitude - 0.38)) * 90) * Math.max(0, stormX) ** 12;
                let lambert = Math.max(0, unitX * light[0] + unitY * light[1] + unitZ * light[2]);
                const shadowStep = lightDotNormal !== 0 ? -(unitX * normal[0] + unitY * normal[1] + unitZ * normal[2]) / lightDotNormal : -1;
                if (shadowStep > 0) {
                  const hitX = unitX + light[0] * shadowStep;
                  const hitY = unitY + light[1] * shadowStep;
                  const hitZ = unitZ + light[2] * shadowStep;
                  lambert *= 1 - ringDensity(Math.hypot(hitX, hitY, hitZ)) * 0.85;
                }
                const halfZ = light[2] + 1;
                const halfLength = Math.hypot(light[0], light[1], halfZ);
                const specular = Math.max(0, (unitX * light[0] + unitY * light[1] + unitZ * halfZ) / halfLength) ** 40;
                const rim = (1 - unitZ) ** 3 * 0.18 * Math.max(0, lambert * 2 + 0.2);
                level = Math.min(1, lambert * bands * (0.92 - storm * 0.5) + specular * 0.5 + rim + 0.012);
              }
              const ringZ = -(unitX * normal[0] + unitY * normal[1]) / normal[2];
              const ringDistance = Math.hypot(unitX, unitY, ringZ);
              const density = ringDensity(ringDistance);
              if (density > 0 && ringZ > depth) {
                const closest = -(unitX * light[0] + unitY * light[1] + ringZ * light[2]);
                let lit = 1;
                if (closest > 0) {
                  const passX = unitX + light[0] * closest;
                  const passY = unitY + light[1] * closest;
                  const passZ = ringZ + light[2] * closest;
                  if (passX * passX + passY * passY + passZ * passZ < 1) lit = 0.06;
                }
                const ringLevel = density * (0.2 + 0.7 * Math.abs(lightDotNormal)) * lit;
                level = level < 0 ? ringLevel : level * (1 - Math.min(1, density * 1.1)) + ringLevel * Math.min(1, density * 1.1);
              } else if (level < 0) {
                const edge = Math.sqrt(planar) - 1;
                if (edge > 0 && edge < 0.35) {
                  const facing = Math.max(0, (unitX * light[0] + unitY * light[1]) / Math.sqrt(planar));
                  level = Math.exp(-edge * 14) * 0.3 * facing * facing;
                }
              }
              if (level > 0) {
                const wipe = smoothstep(-0.2, 0.15, reveal * 2.6 - 1.2 - unitY * 0.6 + unitX * 0.1);
                const inkIndex = tone(level * wipe, column, row);
                if (inkIndex > 0) words[row * bufferWidth + column] = palette[inkIndex];
                else if (planar < 1 || density > 0) words[row * bufferWidth + column] = palette[0];
              }
            }
          }
          offscreenContext.putImageData(image, 0, 0);
          context.clearRect(0, 0, view.width, view.height);
          context.imageSmoothingEnabled = false;
          context.drawImage(offscreen, 0, 0, bufferWidth * pixel, bufferHeight * pixel);
        }
        const fontSize = view.vmin * 1.7;
        const margin = view.vmin * 5;
        function addHud(text, styles) {
          const node = document.createElement("div");
          node.className = "hud";
          node.textContent = text;
          node.style.fontSize = fontSize + "px";
          Object.assign(node.style, styles);
          hud.append(node);
          return node;
        }
        const caption = addHud(String(vars.caption), { left: margin + "px", top: margin + "px", color: vars.accent });
        caption.setAttribute("aria-label", String(vars.caption));
        const mode = addHud("BAYER 8x8 / 3 INKS", { left: margin + "px", top: margin + fontSize * 1.8 + "px", opacity: "0.55", color: vars.foreground });
        const phaseLabel = addHud("PHASE 000%", { left: margin + "px", bottom: margin + fontSize * 1.8 + "px", color: vars.foreground });
        const lightLabel = addHud("LIGHT 000 DEG", { left: margin + "px", bottom: margin + "px", color: vars.foreground, opacity: "0.55" });
        const frameLabel = addHud("T+00.00", { right: margin + "px", bottom: margin + "px", color: vars.accent });
        const cornerSize = view.vmin * 3;
        const cornerWeight = Math.max(1, view.vmin * 0.22);
        const corners = [
          { left: margin * 0.5, top: margin * 0.5, borderLeftWidth: cornerWeight, borderTopWidth: cornerWeight },
          { right: margin * 0.5, top: margin * 0.5, borderRightWidth: cornerWeight, borderTopWidth: cornerWeight },
          { left: margin * 0.5, bottom: margin * 0.5, borderLeftWidth: cornerWeight, borderBottomWidth: cornerWeight },
          { right: margin * 0.5, bottom: margin * 0.5, borderRightWidth: cornerWeight, borderBottomWidth: cornerWeight },
        ].map((spec) => {
          const node = document.createElement("div");
          node.className = "corner";
          node.style.width = cornerSize + "px";
          node.style.height = cornerSize + "px";
          node.style.borderColor = vars.accent;
          for (const [key, value] of Object.entries(spec)) node.style[key] = value + "px";
          hud.append(node);
          return node;
        });
        const proxy = { time: 0 };
        function render() {
          const swing = hyperbits.Easing.easeInOutSine(progressOf(proxy.time, 0.4, 8.2));
          phaseLabel.textContent = "PHASE " + String(Math.round(swing * 100)).padStart(3, "0") + "%";
          lightLabel.textContent = "LIGHT " + String(Math.round(((2.75 - swing * 3.55) * 180) / Math.PI + 360) % 360).padStart(3, "0") + " DEG";
          frameLabel.textContent = "T+" + proxy.time.toFixed(2).padStart(5, "0");
          draw(proxy.time);
        }
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: duration, duration: duration, ease: "none", onUpdate: render }, 0);
        timeline.fromTo(corners, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.6, stagger: 0.08, ease: "power3.out" }, 0.1);
        timeline.fromTo([caption, mode], { opacity: 0, x: -view.vmin * 2 }, { opacity: (index) => (index === 0 ? 1 : 0.55), x: 0, duration: 0.6, stagger: 0.12, ease: "power3.out" }, 0.5);
        timeline.fromTo([phaseLabel, lightLabel, frameLabel], { opacity: 0, y: view.vmin * 1.5 }, { opacity: (index) => (index === 1 ? 0.55 : 1), y: 0, duration: 0.6, stagger: 0.1, ease: "power3.out" }, 0.8);
        timeline.to(hud, { opacity: 0, duration: 0.5, ease: "power2.in" }, duration - 0.5);
        render();
        registerTimeline("dither-orb", timeline);
      })();
    </script>
  </body>
</html>
