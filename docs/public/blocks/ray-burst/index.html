<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#f2f0e5"},{"id":"foreground","type":"color","label":"Foreground","default":"#100f0f"},{"id":"accent","type":"color","label":"Accent","default":"#f2652a"},{"id":"rays","type":"number","label":"Wedges","default":32}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #f2f0e5;
        --fg: #100f0f;
        --accent: #f2652a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #f2f0e5;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="ray-burst"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#f2f0e5"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mix(from, to, amount) {
          return from.map((value, index) => Math.round(value + (to[index] - value) * amount));
        }
        const background = channels(vars.background);
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const pale = mix(background, accent, 0.18);
        const wedges = Math.max(4, Math.round((Number(vars.rays) || 32) / 2) * 2);
        const originX = view.width * 0.5;
        const originY = view.height * 1.04;
        const reach = Math.hypot(view.width, view.height);
        const sunRadius = view.vmin * 30;
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const width = turn / wedges;
          const rotation = phase * width * 2;
          for (let wedge = 0; wedge < wedges; wedge += 1) {
            const start = Math.PI + wedge * width + rotation;
            context.fillStyle = rgba(wedge % 2 === 0 ? pale : background, 1);
            context.beginPath();
            context.moveTo(originX, originY);
            context.arc(originX, originY, reach, start, start + width);
            context.closePath();
            context.fill();
          }
          context.lineWidth = view.vmin * 0.22;
          const spacing = view.vmin * 9;
          const drift = (phase * 3) % 1;
          for (let ring = 0; ring < 12; ring += 1) {
            const radius = sunRadius + (ring + drift) * spacing;
            context.strokeStyle = rgba(foreground, 0.55 * (1 - (ring + drift) / 12));
            context.beginPath();
            context.arc(originX, originY, radius, Math.PI, turn);
            context.stroke();
          }
          context.save();
          context.beginPath();
          context.arc(originX, originY, sunRadius, Math.PI, turn);
          context.closePath();
          context.clip();
          context.fillStyle = rgba(accent, 1);
          context.fillRect(originX - sunRadius, originY - sunRadius, sunRadius * 2, sunRadius);
          context.fillStyle = rgba(background, 1);
          const band = sunRadius / 7;
          const slide = (phase * 2) % 1;
          for (let stripe = -1; stripe < 8; stripe += 1) {
            const level = (stripe + slide) / 7;
            const thickness = band * Math.max(0, 0.6 * level - 0.05);
            context.fillRect(originX - sunRadius, originY - sunRadius + (stripe + slide) * band, sunRadius * 2, thickness);
          }
          context.restore();
          context.fillStyle = rgba(foreground, 1);
          context.fillRect(0, view.height - view.vmin * 1.2, view.width, view.vmin * 1.2);
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("ray-burst", timeline);

      })();
    </script>
  </body>
</html>
