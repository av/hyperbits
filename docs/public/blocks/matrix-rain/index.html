<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Color","default":"#00FF41"},{"id":"background","type":"color","label":"Background","default":"#000000"},{"id":"fontSize","type":"number","label":"Font size","default":36},{"id":"speed","type":"number","label":"Speed","default":1},{"id":"density","type":"number","label":"Density","default":1}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #000000;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #000000;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #rain {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="matrix-rain"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#000000"></div>
      <canvas id="rain" class="clip" data-start="0" data-duration="10"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("rain");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.setAttribute("data-color", vars.color);
        canvas.width = view.width;
        canvas.height = view.height;
        let context = null;
        try {
          context = canvas.getContext("2d");
        } catch (err) {
          context = null;
        }
        const fontSize = Math.max(Number(vars.fontSize) || 36, view.vmin * 3.2);
        const columns = Math.max(1, Math.floor((view.width / fontSize) * Number(vars.density || 1)));
        const glyphs = "アイウエオカキクケコｱｲｳｴｵ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const drops = [];
        for (let index = 0; index < columns; index += 1) {
          drops.push({
            y: hyperbits.randomFloat("drop-y-" + index, -20, view.height / fontSize),
            speed: hyperbits.randomFloat("drop-s-" + index, 0.4, 1.4) * Number(vars.speed || 1),
            length: hyperbits.randomInt("drop-l-" + index, 8, 22),
          });
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        function draw() {
          if (!context) return;
          context.clearRect(0, 0, canvas.width, canvas.height);
          context.font = fontSize + "px ui-monospace, monospace";
          for (let index = 0; index < drops.length; index += 1) {
            const drop = drops[index];
            const head = (drop.y + proxy.time * drop.speed * 18) % (view.height / fontSize + drop.length);
            for (let trail = 0; trail < drop.length; trail += 1) {
              const glyph = glyphs[hyperbits.randomInt("g-" + index + "-" + trail, 0, glyphs.length - 1)];
              const alpha = 1 - trail / drop.length;
              context.fillStyle = trail === 0 ? "#e7ffe7" : vars.color;
              context.globalAlpha = Math.max(0.12, alpha);
              context.fillText(glyph, index * fontSize, (head - trail) * fontSize);
            }
          }
          context.globalAlpha = 1;
        }
        timeline.to(proxy, { time: 10, duration: 10, ease: "none", onUpdate: draw }, 0);
        registerTimeline("matrix-rain", timeline);

      })();
    </script>
  </body>
</html>
