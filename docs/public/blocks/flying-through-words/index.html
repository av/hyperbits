<!doctype html>
<html lang="en" data-composition-variables='[{"id":"words","type":"string","label":"Words","default":"SEEK,FRAME,MOTION,SCALE,DEPTH,LIGHT,TIME,SPACE"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #000000;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #000000;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #000000;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { background-color: #000000; }
      .word { color: #e2e8f0; font-weight: 800; letter-spacing: 0.08em; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="flying-through-words"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >

    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const view = hyperbits.viewport();
        const root = document.getElementById("root");
        const words = String(vars.words).split(",").map(function (part) { return part.trim(); });
        const elements = [];
        for (let index = 0; index < 24; index += 1) {
          const node = document.createElement("div");
          node.className = "word";
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          node.textContent = words[index % words.length];
          node.style.fontSize = view.vmin * hyperbits.randomFloat("fs-" + index, 3, 8) + "px";
          elements.push({
            element: node,
            x: hyperbits.randomFloat("x-" + index, -view.vmin * 40, view.vmin * 40),
            y: hyperbits.randomFloat("y-" + index, -view.vmin * 24, view.vmin * 24),
            z: hyperbits.randomFloat("z-" + index, -view.vmin * 10, view.vmin * 220),
          });
        }
        const scene = hyperbits.createScene3D(root, {
          perspective: 900,
          transitionDuration: 2,
          steps: [
            { id: "start", z: 0, duration: 1 },
            { id: "fly", z: view.vmin * 180, duration: 9 },
          ],
          elements: elements,
        });
        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        timeline.to({}, { duration: 10 }, 0);
        registerTimeline("flying-through-words", timeline);

      })();
    </script>
  </body>
</html>
