<!doctype html>
<html lang="en" data-composition-variables='[{"id":"words","type":"string","label":"Words (comma separated)","default":"GPT,Claude,PaLM,Gemini,LLaMA,Mistral,Mixtral,Falcon,BLOOM,Kimi,MiniMax,Qwen"},{"id":"color","type":"color","label":"Word color","default":"#fcc192"},{"id":"background","type":"color","label":"Background","default":"#100f0f"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Geist Sans", Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #space {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
      }
      .fly {
        position: absolute;
        left: 0;
        top: 0;
      }
      .word {
        display: inline-block;
        text-align: center;
        font-weight: 700;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="flying-through-words"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <div id="space" class="clip" data-start="0" data-duration="10"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
                const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const space = document.getElementById("space");
        space.style.perspective = (view.width < 500 ? 1000 : 5000) + "px";
        const words = String(vars.words).split(",").map(function (part) { return part.trim(); }).filter(Boolean);
        space.setAttribute("aria-label", vars.words);
        space.style.color = vars.color;
        const simulator = hyperbits.createParticles({
          fps: 30,
          spawners: [{
            id: "spawner-0",
            rate: 0.2,
            area: { width: view.width, height: view.height, depth: -vmin * 50 },
            position: { x: view.width / 2, y: view.height / 2 },
            lifespan: 100,
            velocity: { x: 0, y: 0, z: vmin * 10, varianceZ: vmin * 10 },
          }],
        });
        const nodes = new Map();
        function nodeFor(particle) {
          let node = nodes.get(particle.id);
          if (node) return node;
          node = document.createElement("div");
          node.className = "fly";
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          node.setAttribute("data-layout-allow-overflow", "");
          const word = document.createElement("span");
          word.className = "word";
          word.textContent = words[Math.floor(particle.seed * words.length)];
          word.style.fontSize = vmin * 10 + "px";
          word.style.color = vars.color;
          node.append(word);
          space.append(node);
          nodes.set(particle.id, { node: node, word: word });
          return nodes.get(particle.id);
        }
        const proxy = { time: 0 };
        function render() {
          const frame = Math.round(proxy.time * 30);
          const active = simulator.stateAt(frame / 30);
          const seen = new Set();
          for (const particle of active) {
            const entry = nodeFor(particle);
            seen.add(particle.id);
            const age = frame - particle.birthFrame;
            const progress = Math.min(1, Math.max(0, age / particle.lifespan));
            entry.node.style.display = "block";
            entry.node.style.transform = "translate3d(" + particle.position.x + "px, " + particle.position.y + "px, " + particle.position.z + "px) rotate(" + particle.rotation + "deg) scale(" + particle.scale + ")";
            entry.node.style.opacity = String(particle.opacity);
            entry.word.style.opacity = String(hyperbits.interpolateKeyframes([0, 1, 0.5, 0.2, 0], progress));
          }
          nodes.forEach(function (entry, id) {
            if (!seen.has(id)) entry.node.style.display = "none";
          });
        }
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: 10, duration: 10, ease: "none", onUpdate: render }, 0);
        render();
        registerTimeline("flying-through-words", timeline);

      })();
    </script>
  </body>
</html>
