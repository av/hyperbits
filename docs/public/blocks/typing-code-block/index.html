<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0b1220;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0b1220;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #0b1220;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { display: flex; align-items: center; justify-content: center; background-color: #0b1220; }
      #panel {
        background-color: #111827; border: 1px solid #1f2937; border-radius: 24px;
        min-height: 54%; width: 70%;
      }
      .hyperbits-code { margin: 0; color: #e5e7eb; white-space: pre-wrap; }
      .token.keyword { color: #c084fc; }
      .token.function { color: #38bdf8; }
      .token.string { color: #86efac; }
      #caret { display: inline-block; width: 0.08em; background-color: #e5e7eb; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="typing-code-block"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="panel" class="clip" data-start="0" data-duration="6"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const view = hyperbits.viewport();
        const panel = document.getElementById("panel");
        panel.style.padding = view.vmin * 4 + "px";
        const fullCode = "const App = () => {\n    const [count, setCount] = useState(0);\n    useEffect(() => {\n        document.title = `Count: ${count}`;\n    }, [count]);\n    return (\n        <button onClick={() => setCount(c => c + 1)}>\n             Clicked {count} times\n        </button>\n    );\n};";
        const proxy = { chars: 0 };
        const timeline = gsap.timeline({ paused: true });
        function render() {
          const slice = fullCode.slice(0, Math.floor(proxy.chars));
          panel.innerHTML = "";
          hyperbits.createCodeBlock(panel, { code: slice, language: "javascript", showLineNumbers: false });
          const pre = panel.querySelector("pre");
          if (pre) pre.style.fontSize = view.width * 0.022 + "px";
        }
        timeline.fromTo(proxy, { chars: 0 }, { chars: fullCode.length, duration: 5.2, ease: "none", onUpdate: render }, 0.2);
        timeline.fromTo("#caret", { opacity: 1 }, { opacity: 0, duration: 0.4, repeat: 14, yoyo: true }, 0);
        registerTimeline("typing-code-block", timeline);

      })();
    </script>
  </body>
</html>
