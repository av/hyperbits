<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Cell color","default":"#ec8b49"},{"id":"background","type":"color","label":"Background","default":"#09090b"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #09090b;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background-color: #09090b;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Geist Sans", Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e4e4e7;
        overflow: hidden;
      }
      #grid {
        display: grid;
        position: relative;
        z-index: 1;
      }
      .cell {
        width: 100%;
        height: 100%;
        corner-shape: squircle;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.8);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="grid-stagger"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="3" style="position:absolute;inset:0;background-color:#09090b"></div>
      <div id="grid" class="clip" data-start="0" data-duration="3"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const grid = document.getElementById("grid");
        const cols = 4;
        const rows = 4;
        const gap = 20 * unit;
        const padding = 60 * unit;
        const availableWidth = view.width - padding * 2 - gap * (cols - 1);
        const availableHeight = view.height - padding * 2 - gap * (rows - 1);
        const itemSize = Math.min(availableWidth / cols, availableHeight / rows);
        grid.style.gridTemplateColumns = "repeat(" + cols + ", " + itemSize + "px)";
        grid.style.gridTemplateRows = "repeat(" + rows + ", " + itemSize + "px)";
        grid.style.gap = gap + "px";
        for (let index = 0; index < cols * rows; index += 1) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.textContent = String(index + 1);
          cell.style.backgroundColor = vars.color;
          cell.style.borderRadius = itemSize + "px";
          cell.style.fontSize = itemSize * 0.3 + "px";
          grid.append(cell);
        }
        const timeline = gsap.timeline({ paused: true });
        hyperbits.stagger(grid.children, { scale: [0, 1], opacity: [0, 1], duration: 45 / 30, stagger: 3 / 30, staggerDirection: "center", ease: "spring", at: 0 }, timeline);
        timeline.to({}, { duration: 3 }, 0);
        registerTimeline("grid-stagger", timeline);

      })();
    </script>
  </body>
</html>
