<!doctype html>
<html lang="en" data-composition-variables='[{"id":"cells","type":"number","label":"Cells across","default":32},{"id":"background","type":"color","label":"Dark cells","default":"#100f0f"},{"id":"foreground","type":"color","label":"Light cells","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#ec8b49"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="./hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ec8b49;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="op-art-lens"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="10"></canvas>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + Math.round(rgb[0]) + ", " + Math.round(rgb[1]) + ", " + Math.round(rgb[2]) + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mixRgb(from, to, amount) {
          return [from[0] + (to[0] - from[0]) * amount, from[1] + (to[1] - from[1]) * amount, from[2] + (to[2] - from[2]) * amount];
        }

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const duration = 10;
        const back = channels(vars.background);
        const fore = channels(vars.foreground);
        const accent = channels(vars.accent);
        const across = Math.max(8, Math.round(Number(vars.cells) || 32));
        const cell = view.width / across;
        const down = Math.ceil(view.height / cell) + 1;
        const subdivisions = 4;
        function lensesAt(time) {
          const turn = Math.PI * 2;
          const phase = time / duration;
          return [
            { x: view.width * (0.5 + 0.28 * Math.cos(phase * turn)), y: view.height * (0.5 + 0.22 * Math.sin(phase * turn * 2)), radius: view.vmin * 28, strength: 0.55 * smoothstep(0, 1.5, time) },
            { x: view.width * (0.5 - 0.3 * Math.cos(phase * turn + 1)), y: view.height * (0.5 - 0.25 * Math.sin(phase * turn + 1)), radius: view.vmin * 18, strength: -0.35 * smoothstep(0.5, 2, time) },
          ];
        }
        function warp(pointX, pointY, lenses) {
          let outX = pointX;
          let outY = pointY;
          for (const lens of lenses) {
            const dx = pointX - lens.x;
            const dy = pointY - lens.y;
            const falloff = Math.exp(-(dx * dx + dy * dy) / (lens.radius * lens.radius));
            outX += dx * lens.strength * falloff;
            outY += dy * lens.strength * falloff;
          }
          return [outX, outY];
        }
        function draw(time) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const lenses = lensesAt(time);
          const columns = across + 1;
          const points = [];
          for (let row = 0; row <= down * subdivisions; row += 1) {
            const line = [];
            for (let column = 0; column <= columns * subdivisions; column += 1) line.push(warp((column / subdivisions) * cell - cell * 0.5, (row / subdivisions) * cell - cell * 0.5, lenses));
            points.push(line);
          }
          const band = (time / duration) * (across + down + 12) - 6;
          for (let row = 0; row < down; row += 1) {
            for (let column = 0; column < columns; column += 1) {
              const dark = (row + column) % 2 === 0;
              const diagonal = Math.abs(column - row * 0.6 - band);
              const lit = diagonal < 1.2 ? 1 : 0;
              if (dark && lit <= 0) continue;
              const color = dark ? mixRgb(back, accent, lit * 0.4) : mixRgb(fore, accent, lit);
              context.fillStyle = rgba(color, 1);
              context.beginPath();
              const top = row * subdivisions;
              const left = column * subdivisions;
              for (let step = 0; step <= subdivisions; step += 1) {
                const point = points[top][left + step];
                if (step === 0) context.moveTo(point[0], point[1]);
                else context.lineTo(point[0], point[1]);
              }
              for (let step = 1; step <= subdivisions; step += 1) {
                const point = points[top + step][left + subdivisions];
                context.lineTo(point[0], point[1]);
              }
              for (let step = subdivisions - 1; step >= 0; step -= 1) {
                const point = points[top + subdivisions][left + step];
                context.lineTo(point[0], point[1]);
              }
              for (let step = subdivisions - 1; step > 0; step -= 1) {
                const point = points[top + step][left];
                context.lineTo(point[0], point[1]);
              }
              context.closePath();
              context.fill();
            }
          }
          for (const lens of lenses) {
            if (lens.strength <= 0) continue;
            const shade = context.createRadialGradient(lens.x, lens.y, 0, lens.x, lens.y, lens.radius * 1.7);
            const depth = 0.4 * (lens.strength / 0.55);
            shade.addColorStop(0, rgba(back, 0));
            shade.addColorStop(0.5, rgba(back, 0));
            shade.addColorStop(0.72, rgba(back, depth));
            shade.addColorStop(1, rgba(back, 0));
            context.fillStyle = shade;
            context.fillRect(0, 0, view.width, view.height);
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: duration, duration: duration, ease: "none", onUpdate: () => draw(proxy.time) }, 0);
        draw(0);
        registerTimeline("op-art-lens", timeline);
      })();
    </script>
  </body>
</html>
