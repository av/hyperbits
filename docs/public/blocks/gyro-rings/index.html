<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#4fb6ec"},{"id":"rings","type":"number","label":"Orbits","default":7},{"id":"seed","type":"number","label":"Seed","default":3}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #4fb6ec;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="gyro-rings"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const count = Math.max(1, Math.round(Number(vars.rings) || 7));
        const seed = Number(vars.seed) || 0;
        const centerX = view.width * 0.38;
        const centerY = view.height * 0.56;
        const squash = 0.34;
        const tilt = -0.2;
        const orbits = [...Array(count).keys()].map((index) => {
          const key = "orrery-" + seed + "-" + index;
          return {
            radius: view.vmin * (14 + index * 13 + hyperbits.randomFloat(key + "-r", -2, 2)),
            start: hyperbits.randomFloat(key + "-a", 0, turn),
            laps: Math.max(1, count - index - Math.floor(index / 2)),
            size: view.vmin * hyperbits.randomFloat(key + "-s", 0.7, 2.2),
            lit: index % 3 === 1,
          };
        });
        function place(orbit, angle) {
          const flatX = Math.cos(angle) * orbit.radius;
          const flatY = Math.sin(angle) * orbit.radius * squash;
          return {
            pointX: centerX + flatX * Math.cos(tilt) - flatY * Math.sin(tilt),
            pointY: centerY + flatX * Math.sin(tilt) + flatY * Math.cos(tilt),
            front: Math.sin(angle),
          };
        }
        function drawPlanet(orbit, angle) {
          const spot = place(orbit, angle);
          const color = orbit.lit ? accent : foreground;
          for (let step = 1; step <= 24; step += 1) {
            const from = place(orbit, angle - step * 0.03);
            const to = place(orbit, angle - (step - 1) * 0.03);
            context.strokeStyle = rgba(color, 0.5 * (1 - step / 24));
            context.lineWidth = orbit.size * 0.9;
            context.beginPath();
            context.moveTo(from.pointX, from.pointY);
            context.lineTo(to.pointX, to.pointY);
            context.stroke();
          }
          context.fillStyle = rgba(color, 1);
          context.beginPath();
          context.arc(spot.pointX, spot.pointY, orbit.size * (1 + 0.25 * spot.front), 0, turn);
          context.fill();
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          context.lineCap = "round";
          const angles = orbits.map((orbit) => orbit.start + turn * phase * orbit.laps);
          for (const orbit of orbits) {
            context.strokeStyle = rgba(foreground, 0.18);
            context.lineWidth = view.vmin * 0.12;
            context.beginPath();
            context.ellipse(centerX, centerY, orbit.radius, orbit.radius * squash, tilt, 0, turn);
            context.stroke();
          }
          orbits.forEach((orbit, index) => {
            if (place(orbit, angles[index]).front < 0) drawPlanet(orbit, angles[index]);
          });
          const halo = context.createRadialGradient(centerX, centerY, 0, centerX, centerY, view.vmin * 20);
          halo.addColorStop(0, rgba(accent, 0.55));
          halo.addColorStop(1, rgba(accent, 0));
          context.fillStyle = halo;
          context.fillRect(centerX - view.vmin * 20, centerY - view.vmin * 20, view.vmin * 40, view.vmin * 40);
          context.fillStyle = rgba(accent, 1);
          context.beginPath();
          context.arc(centerX, centerY, view.vmin * (5.5 + 0.4 * Math.sin(turn * phase * 3)), 0, turn);
          context.fill();
          orbits.forEach((orbit, index) => {
            if (place(orbit, angles[index]).front >= 0) drawPlanet(orbit, angles[index]);
          });
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("gyro-rings", timeline);

      })();
    </script>
  </body>
</html>
