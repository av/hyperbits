<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#4fb6ec"},{"id":"rings","type":"number","label":"Rings","default":6},{"id":"seed","type":"number","label":"Seed","default":3}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #4fb6ec;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="gyro-rings"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const count = Math.max(1, Math.round(Number(vars.rings) || 6));
        const seed = Number(vars.seed) || 0;
        const centerX = view.width / 2;
        const centerY = view.height / 2;
        const unit = view.vmin * 36;
        const camera = 3.2;
        const segments = 160;
        const rings = Array.from({ length: count }, (_, ring) => {
          const key = "gyro-" + seed + "-" + ring;
          return {
            radius: 0.62 + (ring / Math.max(count - 1, 1)) * 0.5,
            tiltX: hyperbits.randomFloat(key + "-tx", 0, turn),
            tiltY: hyperbits.randomFloat(key + "-ty", 0, turn),
            spinX: hyperbits.pick(key + "-sx", [-1, 1]),
            spinY: hyperbits.pick(key + "-sy", [-1, 0, 1]),
            bead: hyperbits.randomFloat(key + "-b", 0, 1),
            beadLaps: hyperbits.pick(key + "-bl", [1, 2, -1, -2]),
            bright: ring === count - 1,
          };
        });
        function project(ring, angle, phase) {
          const rotateX = ring.tiltX + turn * phase * ring.spinX;
          const rotateY = ring.tiltY + turn * phase * ring.spinY;
          const baseX = Math.cos(angle) * ring.radius;
          const baseY = Math.sin(angle) * ring.radius;
          const tiltedY = baseY * Math.cos(rotateX);
          const tiltedZ = baseY * Math.sin(rotateX);
          const finalX = baseX * Math.cos(rotateY) + tiltedZ * Math.sin(rotateY);
          const finalZ = -baseX * Math.sin(rotateY) + tiltedZ * Math.cos(rotateY);
          const scale = camera / (camera + finalZ);
          return { screenX: centerX + finalX * unit * scale, screenY: centerY + tiltedY * unit * scale, depth: finalZ, scale };
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const halo = context.createRadialGradient(centerX, centerY, 0, centerX, centerY, view.vmin * 48);
          halo.addColorStop(0, rgba(accent, 0.18));
          halo.addColorStop(1, rgba(accent, 0));
          context.fillStyle = halo;
          context.fillRect(0, 0, view.width, view.height);
          context.strokeStyle = rgba(foreground, 0.08);
          context.lineWidth = view.vmin * 0.08;
          context.setLineDash([view.vmin * 0.4, view.vmin * 1.2]);
          context.lineDashOffset = -phase * view.vmin * 1.6 * 24;
          context.beginPath();
          context.arc(centerX, centerY, unit * 1.42, 0, turn);
          context.stroke();
          context.setLineDash([]);
          context.lineCap = "round";
          for (const ring of rings) {
            const color = ring.bright ? foreground : accent;
            let previous = project(ring, 0, phase);
            for (let segment = 1; segment <= segments; segment += 1) {
              const point = project(ring, (turn * segment) / segments, phase);
              const facing = 0.5 - (previous.depth + point.depth) / (4 * ring.radius);
              context.strokeStyle = rgba(color, 0.18 + 0.82 * facing);
              context.lineWidth = view.vmin * (0.12 + 0.22 * facing) * point.scale;
              context.beginPath();
              context.moveTo(previous.screenX, previous.screenY);
              context.lineTo(point.screenX, point.screenY);
              context.stroke();
              previous = point;
            }
            const bead = project(ring, turn * (ring.bead + phase * ring.beadLaps), phase);
            const beadRadius = view.vmin * 0.75 * bead.scale;
            const glow = context.createRadialGradient(bead.screenX, bead.screenY, 0, bead.screenX, bead.screenY, beadRadius * 5);
            glow.addColorStop(0, rgba(color, 0.55));
            glow.addColorStop(1, rgba(color, 0));
            context.fillStyle = glow;
            context.fillRect(bead.screenX - beadRadius * 5, bead.screenY - beadRadius * 5, beadRadius * 10, beadRadius * 10);
            context.fillStyle = rgba(foreground, 1);
            context.beginPath();
            context.arc(bead.screenX, bead.screenY, beadRadius, 0, turn);
            context.fill();
          }
          context.fillStyle = rgba(foreground, 1);
          context.beginPath();
          context.arc(centerX, centerY, view.vmin * 0.9, 0, turn);
          context.fill();
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("gyro-rings", timeline);

      })();
    </script>
  </body>
</html>
