<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#f2652a"},{"id":"lines","type":"number","label":"Stripes","default":18}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #f2652a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="wave-stack"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mix(from, to, amount) {
          return from.map((value, index) => Math.round(value + (to[index] - value) * amount));
        }
        const background = channels(vars.background);
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const shade = mix(accent, background, 0.45);
        const backFace = mix(foreground, accent, 0.35);
        const stripes = Math.max(2, Math.round(Number(vars.lines) || 18));
        const slices = 120;
        const ribbonWidth = view.vh * 34;
        function frame(progress, phase) {
          const centerY = view.height * (0.72 - 0.44 * progress) + view.vh * 9 * Math.sin(turn * (progress * 1.2 - phase));
          const twist = turn * (progress * 0.85 - phase) ;
          return { centerY, twist };
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const columns = [];
          for (let slice = 0; slice <= slices; slice += 1) {
            const progress = slice / slices;
            const sliceX = -view.vw * 4 + progress * view.vw * 108;
            columns.push({ sliceX, ...frame(progress, phase) });
          }
          for (let slice = 0; slice < slices; slice += 1) {
            const left = columns[slice];
            const right = columns[slice + 1];
            const facing = Math.cos(left.twist);
            const light = 0.5 + 0.5 * Math.sin(left.twist);
            for (let stripe = 0; stripe < stripes; stripe += 1) {
              const top = -0.5 + stripe / stripes;
              const bottom = top + 1 / stripes;
              const leftTop = left.centerY + top * ribbonWidth * Math.cos(left.twist);
              const leftBottom = left.centerY + bottom * ribbonWidth * Math.cos(left.twist);
              const rightTop = right.centerY + top * ribbonWidth * Math.cos(right.twist);
              const rightBottom = right.centerY + bottom * ribbonWidth * Math.cos(right.twist);
              const even = stripe % 2 === 0;
              const tone = facing >= 0 ? (even ? accent : shade) : (even ? backFace : mix(backFace, background, 0.35));
              context.fillStyle = rgba(mix(tone, background, 0.35 * (1 - light)), 1);
              context.beginPath();
              context.moveTo(left.sliceX, leftTop);
              context.lineTo(right.sliceX + 0.6, rightTop);
              context.lineTo(right.sliceX + 0.6, rightBottom);
              context.lineTo(left.sliceX, leftBottom);
              context.closePath();
              context.fill();
            }
          }
          context.strokeStyle = rgba(foreground, 0.9);
          context.lineWidth = view.vmin * 0.22;
          for (const edge of [-0.5, 0.5]) {
            context.beginPath();
            columns.forEach((column, index) => {
              const edgeY = column.centerY + edge * ribbonWidth * Math.cos(column.twist);
              if (index === 0) context.moveTo(column.sliceX, edgeY);
              else context.lineTo(column.sliceX, edgeY);
            });
            context.stroke();
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("wave-stack", timeline);

      })();
    </script>
  </body>
</html>
