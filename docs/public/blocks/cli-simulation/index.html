<!doctype html>
<html lang="en" data-composition-variables='[{"id":"command","type":"string","label":"Command","default":"npm install remotion-bits"},{"id":"color","type":"color","label":"Command color","default":"#ce9178"},{"id":"background","type":"color","label":"Background","default":"#1e1e1e"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #1e1e1e;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #1e1e1e;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #term {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        color: #d4d4d4;
        font-weight: 700;
        line-height: 1.5;
      }
      #column {
        display: flex;
        flex-direction: column;
        width: 100%;
      }
      #prompt {
        display: flex;
      }
      #arrow {
        color: #4ec9b0;
      }
      #tilde {
        color: #569cd6;
      }
      #typed {
        color: #ce9178;
      }
      #cursor {
        display: inline-block;
      }
      #output {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="cli-simulation"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="15" style="position:absolute;inset:0;background-color:#1e1e1e"></div>
      <div id="term" class="clip" data-start="0" data-duration="15">
        <div id="column">
          <div id="prompt"><span id="arrow">➜</span><span id="tilde">~</span><span id="command"><span id="typed"></span><span id="cursor">|</span></span></div>
          <div id="output"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const term = document.getElementById("term");
        const column = document.getElementById("column");
        const arrow = document.getElementById("arrow");
        const tilde = document.getElementById("tilde");
        const commandEl = document.getElementById("command");
        const typed = document.getElementById("typed");
        const cursor = document.getElementById("cursor");
        const output = document.getElementById("output");
        const command = String(vars.command);
        commandEl.setAttribute("aria-label", command);
        typed.style.color = vars.color;
        term.style.padding = vmin * 10 + "px";
        term.style.fontSize = vmin * 3 + "px";
        column.style.gap = vmin + "px";
        arrow.style.marginRight = vmin * 1.5 + "px";
        tilde.style.marginRight = vmin * 1.5 + "px";
        const commandSpeed = 3;
        const commandTotal = command.length * commandSpeed + 30;
        const logs = ["✔ Package found\n", "✔ Dependencies resolved\n", "✔ Installing...\n", "Done in 1.4s"];
        const outputDelay = 90;
        const outputSpeed = 0.5;
        const pauseAfterType = 20;
        const events = [{ frame: 0, text: "" }];
        let floatFrame = 0;
        let current = "";
        function push() { events.push({ frame: Math.round(floatFrame), text: current }); }
        logs.forEach(function (str) {
          for (let index = 0; index < str.length; index += 1) {
            floatFrame += outputSpeed;
            current += str[index];
            push();
          }
          floatFrame += pauseAfterType;
          push();
        });
        const proxy = { time: 0 };
        function render() {
          const frame = Math.round(proxy.time * 30);
          const visible = Math.min(command.length, Math.floor(frame / commandSpeed));
          typed.textContent = command.slice(0, visible);
          const complete = frame > commandTotal;
          cursor.style.opacity = !complete && frame % 30 < 15 ? "1" : "0";
          const relative = frame - outputDelay;
          let text = "";
          if (relative >= 0) {
            let active = 0;
            for (let index = 0; index < events.length; index += 1) {
              if (events[index].frame <= relative) active = index; else break;
            }
            text = events[active].text;
          }
          output.textContent = text;
        }
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: 15, duration: 15, ease: "none", onUpdate: render }, 0);
        render();
        registerTimeline("cli-simulation", timeline);

      })();
    </script>
  </body>
</html>
