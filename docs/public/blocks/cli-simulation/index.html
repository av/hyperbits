<!doctype html>
<html lang="en" data-composition-variables='[{"id":"command","type":"string","label":"Command","default":"npm install hyperbits"},{"id":"color","type":"color","label":"Accent","default":"#4ec9b0"},{"id":"background","type":"color","label":"Background","default":"#0b1220"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0b1220;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0b1220;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #d4d4d4;
      }
      #term {
        width: 70%;
        height: 70%;
        background-color: #1e1e1e;
        border: 1px solid #334155;
        border-radius: 18px;
        padding: 4.5vmin 4vmin;
        font-size: 3.5vmin;
        line-height: 1.55;
        position: relative;
        z-index: 1;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
      }
      .row {
        display: block;
        white-space: pre;
      }
      .ok {
        color: #4ec9b0;
      }
      .path {
        color: #569cd6;
      }
      .cmd {
        color: #ce9178;
      }
      .out {
        color: #d4d4d4;
        white-space: pre;
        display: block;
      }
      #cursor {
        display: inline-block;
        width: 0.55em;
        height: 1em;
        margin-left: 0.12em;
        background-color: #d4d4d4;
        vertical-align: -0.12em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="cli-simulation"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="15" style="position:absolute;inset:0;background-color:#0b1220"></div>
      <div id="term" class="clip" data-start="0" data-duration="15">
        <div class="row">
          <span id="prompt" class="ok">$</span>
          <span class="path"> ~ </span>
          <span id="typed" class="cmd"></span><span id="cursor"></span>
        </div>
        <div id="output"></div>
      </div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const term = document.getElementById("term");
        const promptEl = document.getElementById("prompt");
        const typed = document.getElementById("typed");
        const cursor = document.getElementById("cursor");
        const outputEl = document.getElementById("output");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        promptEl.style.color = vars.color;
        promptEl.setAttribute("data-color", vars.color);
        cursor.style.backgroundColor = vars.color;
        term.style.fontSize = view.vmin * 3.5 + "px";
        const command = String(vars.command);
        typed.textContent = command;
        const commandWriter = hyperbits.typewriter(typed, { duration: 3.2, delay: 0.2 });
        const logs = ["Package found", "Dependencies resolved", "Installing...", "Done in 1.4s"];
        const outputLines = [];
        for (let index = 0; index < logs.length; index += 1) {
          const line = document.createElement("div");
          line.className = "out";
          line.textContent = logs[index];
          line.style.opacity = "0";
          if (index === logs.length - 1) line.style.color = vars.color;
          outputEl.append(line);
          outputLines.push(line);
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, {
          time: 15,
          duration: 15,
          ease: "none",
          onUpdate: function () {
            commandWriter.apply(proxy.time);
          },
        }, 0);
        timeline.fromTo(cursor, { opacity: 1 }, { opacity: 0, duration: 0.4, repeat: 8, yoyo: true, ease: "none" }, 0);
        timeline.to(cursor, { opacity: 0, duration: 0.01 }, 3.5);
        for (let index = 0; index < outputLines.length; index += 1) {
          timeline.fromTo(
            outputLines[index],
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
            3.6 + index * 0.7,
          );
        }
        registerTimeline("cli-simulation", timeline);

      })();
    </script>
  </body>
</html>
