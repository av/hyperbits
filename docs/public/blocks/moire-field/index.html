<!doctype html>
<html lang="en" data-composition-variables='[{"id":"spacing","type":"number","label":"Ring spacing (vmin)","default":1.6},{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Highlight","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Ink","default":"#ec8b49"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="./hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ec8b49;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="moire-field"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="10"></canvas>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + Math.round(rgb[0]) + ", " + Math.round(rgb[1]) + ", " + Math.round(rgb[2]) + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mixRgb(from, to, amount) {
          return [from[0] + (to[0] - from[0]) * amount, from[1] + (to[1] - from[1]) * amount, from[2] + (to[2] - from[2]) * amount];
        }

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const duration = 10;
        const back = channels(vars.background);
        const fore = channels(vars.foreground);
        const accent = channels(vars.accent);
        const spacing = view.vmin * Math.max(0.6, Number(vars.spacing) || 1.6);
        const reach = Math.hypot(view.width, view.height) * 1.1;
        let mask = null;
        let maskContext = null;
        function rings(target, centerX, centerY) {
          target.beginPath();
          for (let radius = spacing; radius < reach; radius += spacing * 2) {
            target.moveTo(centerX + radius + spacing, centerY);
            target.arc(centerX, centerY, radius + spacing, 0, Math.PI * 2);
            target.moveTo(centerX + radius, centerY);
            target.arc(centerX, centerY, radius, 0, Math.PI * 2, true);
          }
          target.fill();
        }
        function draw(time) {
          if (!context || typeof context.stroke !== "function") return;
          if (!mask) {
            mask = document.createElement("canvas");
            mask.width = view.width;
            mask.height = view.height;
            maskContext = mask.getContext("2d");
          }
          const turn = Math.PI * 2;
          const apart = 0.5 + 0.5 * Math.sin((time / duration) * turn - Math.PI / 2);
          const offset = view.vmin * (2 + 22 * apart);
          const angle = time * 0.35;
          const firstX = view.width / 2 + Math.cos(angle) * offset;
          const firstY = view.height / 2 + Math.sin(angle) * offset * 0.7;
          const secondX = view.width / 2 - Math.cos(angle) * offset;
          const secondY = view.height / 2 - Math.sin(angle) * offset * 0.7;
          maskContext.globalCompositeOperation = "source-over";
          maskContext.clearRect(0, 0, view.width, view.height);
          maskContext.fillStyle = "#000000";
          rings(maskContext, firstX, firstY);
          maskContext.globalCompositeOperation = "xor";
          rings(maskContext, secondX, secondY);
          maskContext.globalCompositeOperation = "source-in";
          const paint = maskContext.createRadialGradient(view.width / 2, view.height / 2, 0, view.width / 2, view.height / 2, Math.max(view.width, view.height) * 0.6);
          paint.addColorStop(0, rgba(mixRgb(accent, fore, 0.55), 1));
          paint.addColorStop(0.45, rgba(accent, 1));
          paint.addColorStop(1, rgba(mixRgb(accent, back, 0.75), 1));
          maskContext.fillStyle = paint;
          maskContext.fillRect(0, 0, view.width, view.height);
          context.clearRect(0, 0, view.width, view.height);
          const fade = Math.min(1, time / 0.8);
          context.globalAlpha = fade;
          context.drawImage(mask, 0, 0);
          context.globalAlpha = 1;
          const vignette = context.createRadialGradient(view.width / 2, view.height / 2, Math.min(view.width, view.height) * 0.3, view.width / 2, view.height / 2, Math.max(view.width, view.height) * 0.65);
          vignette.addColorStop(0, rgba(back, 0));
          vignette.addColorStop(1, rgba(back, 0.85));
          context.fillStyle = vignette;
          context.fillRect(0, 0, view.width, view.height);
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: duration, duration: duration, ease: "none", onUpdate: () => draw(proxy.time) }, 0);
        draw(0);
        registerTimeline("moire-field", timeline);
      })();
    </script>
  </body>
</html>
