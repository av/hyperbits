<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Accent","default":"#fcc192"},{"id":"background","type":"color","label":"Background","default":"#100f0f"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-700-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist Mono";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Geist Sans", Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .step {
        font-weight: 700;
        filter: blur(20px);
      }
      .panel {
        background: rgba(0, 0, 0, 0.15);
      }
      .panel h2 {
        color: #fcc192;
        margin: 0.83em 0;
      }
      .panel pre {
        font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
        margin: 0;
        line-height: 1.6;
      }
      .el {
        position: absolute;
        transform-style: preserve-3d;
      }
      .cube {
        transform-style: preserve-3d;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="transform3d-showcase"
      data-start="0"
      data-duration="16.667"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="16.667" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <div id="scene"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const sceneEl = document.getElementById("scene");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const fontSize = vmin * 4;
        const Transform3D = hyperbits.Transform3D;
        const accent = vars.color;
        function toProps(transform) {
          const euler = transform.toEuler("XYZ");
          return {
            x: transform.position.x,
            y: transform.position.y,
            z: transform.position.z,
            rotateX: (euler.x * 180) / Math.PI,
            rotateY: (euler.y * 180) / Math.PI,
            rotateZ: (euler.z * 180) / Math.PI,
            rotateOrder: "xyz",
            scaleX: transform.scale.x,
            scaleY: transform.scale.y,
            scaleZ: transform.scale.z,
          };
        }
        function stepNode() {
          const node = document.createElement("div");
          node.className = "step";
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          return node;
        }
        function panel(title, code, options) {
          const node = document.createElement("div");
          node.className = "panel";
          node.style.padding = vmin * 3 + "px";
          node.style.borderRadius = vmin + "px";
          node.style.border = vmin * 0.3 + "px solid #1c1b1a";
          if (options && options.width) node.style.width = options.width + "px";
          if (options && options.transform) node.style.transform = options.transform;
          const heading = document.createElement("h2");
          heading.textContent = title;
          heading.style.fontSize = fontSize + "px";
          heading.style.color = accent;
          if (options && options.headingMargin) heading.style.margin = "0 0 " + vmin * 2 + "px";
          const pre = document.createElement("pre");
          pre.textContent = code;
          pre.style.fontSize = fontSize * 0.6 + "px";
          pre.style.color = options && options.codeColor ? options.codeColor : accent;
          node.append(heading, pre);
          return node;
        }
        function box(size, border) {
          const node = document.createElement("div");
          node.style.width = size + "px";
          node.style.height = size + "px";
          node.style.border = border + "px solid " + accent;
          return node;
        }
        const baseTransform = Transform3D.identity().translate(0, vmin * -10, 0).rotateZ(Math.PI / 8);
        const cubeSize = vmin * 8;
        const orbitSize = vmin * 5;

        const intro = stepNode();
        const introBox = document.createElement("div");
        introBox.style.fontSize = fontSize * 1.5 + "px";
        introBox.style.color = accent;
        introBox.style.textAlign = "center";
        introBox.style.padding = vmin * 2 + "px " + vmin * 4 + "px";
        introBox.style.borderRadius = vmin + "px";
        introBox.style.width = view.width * 0.8 + "px";
        const introTitle = document.createElement("h1");
        introTitle.textContent = "Transform3D API";
        introTitle.style.margin = "0";
        introTitle.style.fontSize = fontSize * 1.5 + "px";
        const introCopy = document.createElement("p");
        introCopy.textContent = "Chainable \u2022 Matrix-based \u2022 Quaternion SLERP";
        introCopy.style.margin = vmin * 2 + "px 0 0";
        introCopy.style.fontSize = fontSize + "px";
        introCopy.style.opacity = "0.8";
        introBox.append(introTitle, introCopy);
        intro.append(introBox);

        const chainable = stepNode();
        chainable.append(panel("Chainable Transforms", "Transform3D.identity()\n  .translate(x, y, z)\n  .rotateZ(Math.PI / 8)\n  .scaleBy(1.5, 1.5, 1.5)", { width: vmin * 45, transform: "translateX(-50%)", headingMargin: true }));
        const chainCube = box(cubeSize, vmin);
        chainCube.className = "cube";
        chainable.append(chainCube);
        const chainableBase = Transform3D.identity().translate(vmin * 40, -vmin * 35, 0);
        const chainKeys = [
          chainableBase,
          chainableBase.translate(vmin * 20, 0, 0).rotateZ(90),
          chainableBase.translate(vmin * 20, vmin * 20, 0).scaleBy(0.5),
          chainableBase.translate(0, vmin * 20, 0).rotateY(180),
          chainableBase,
        ];

        const relative = stepNode();
        relative.style.perspective = "1000px";
        relative.append(panel("Relative Positioning", "// Satellites orbit parent\nconst orbit = Transform3D.identity()\n  .translate(x, y, z)\n  .rotateY(angle)", { transform: "translateY(-50%)", headingMargin: true, codeColor: "#ec8b49" }));
        const relativeTransform = Transform3D.identity().translate(vmin * 25, vmin * -7, 0).rotateX(-5);
        const relativeCss = relativeTransform.toCSSMatrix3D();
        const centralWrap = document.createElement("div");
        centralWrap.className = "el";
        centralWrap.style.transform = relativeCss;
        centralWrap.append(box(cubeSize, vmin));
        relative.append(centralWrap);
        const satellites = [0, 0.33, 0.66].map(function () {
          const wrap = document.createElement("div");
          wrap.className = "el";
          wrap.style.transform = relativeCss;
          const orb = box(orbitSize, vmin);
          orb.style.position = "absolute";
          orb.style.borderRadius = "50%";
          wrap.append(orb);
          relative.append(wrap);
          return orb;
        });

        const interpolation = stepNode();
        const interpPanel = panel("Smooth Interpolation", "// Quaternion SLERP - no gimbal lock!\ninterpolateTransform(\n  from, to, progress, easing\n)", { codeColor: "#ec8b49" });
        const interpCopy = document.createElement("p");
        interpCopy.innerHTML = "\u2713 Natural rotation paths<br />\u2713 No gimbal lock artifacts<br />\u2713 Single matrix operation";
        interpCopy.style.fontSize = fontSize * 0.7 + "px";
        interpCopy.style.color = "#343331";
        interpCopy.style.margin = vmin * 2 + "px 0 0";
        interpPanel.append(interpCopy);
        interpolation.append(interpPanel);

        const composition = stepNode();
        composition.append(panel("Transform Composition", "// Combine transforms\nconst combined = parent\n  .multiply(child)\n  \n// Apply to points\nconst worldPos = transform\n  .apply(localPos)", { width: vmin * 80, transform: "translateY(-20%)", headingMargin: true, codeColor: "#ec8b49" }));
        const outerEl = document.createElement("div");
        outerEl.className = "el";
        outerEl.style.transform = Transform3D.fromEuler(0, 0, 0, new hyperbits.Vec3(vmin * -10, 0, 0), 1.5).toCSSMatrix3D();
        composition.append(outerEl);
        const nested = [];
        let parent = outerEl;
        for (let level = 0; level < 4; level += 1) {
          const node = document.createElement("div");
          node.className = "el cube";
          node.style.width = cubeSize + "px";
          node.style.height = cubeSize + "px";
          node.style.border = vmin * 0.3 + "px solid " + accent;
          parent.append(node);
          nested.push(node);
          parent = node;
        }

        const outro = stepNode();

        const steps = [
          Object.assign({ id: "intro", duration: 80 / 30, element: intro }, toProps(baseTransform)),
          Object.assign({ id: "chainable", duration: 120 / 30, element: chainable }, toProps(baseTransform.translate(vmin * 100, 0, 0).rotateY(-15))),
          Object.assign({ id: "relative", duration: 80 / 30, element: relative }, toProps(Transform3D.identity().translate(vmin * 200, vmin * 20, vmin * -50).rotateX(10).scaleBy(0.5, 0.5, 0.5))),
          { id: "interpolation", duration: 80 / 30, element: interpolation, x: vmin * 300, y: vmin * -20, z: vmin * 30, rotateY: 25 },
          { id: "composition", duration: 80 / 30, element: composition, x: vmin * 400, y: 0, z: 0, rotateY: -10 },
          { id: "outro", duration: 80 / 30, element: outro, x: vmin * 400, y: vmin * 200, z: 0, rotateY: -10 },
        ];
        const scene = hyperbits.createScene3D(sceneEl, {
          perspective: 1200,
          transitionDuration: 2,
          stepDuration: 80 / 30,
          easing: "easeInOutCubic",
          steps: steps,
        });
        sceneEl.style.position = "absolute";
        sceneEl.style.inset = "0";
        sceneEl.style.zIndex = "1";
        const ease = hyperbits.Easing.easeInOutCubic;
        const proxy = { time: 0 };
        function render() {
          const time = proxy.time;
          const frame = time * 30;
          const state = scene.stateAt(time);
          state.steps.forEach(function (step, index) {
            let blur = 20;
            if (index < state.activeStepIndex) {
              blur = hyperbits.interpolateKeyframes([0, 20], Math.min(1, Math.max(0, (time - step.exitTime) / 1)));
            } else if (index === state.activeStepIndex) {
              blur = hyperbits.interpolateKeyframes([20, 0], Math.min(1, Math.max(0, (time - step.enterTime) / 1)));
            }
            step.element.style.filter = blur > 0 ? "blur(" + blur * unit + "px)" : "none";
          });
          const chainStart = state.steps[1].enterTime + 40 / 30;
          const chainProgress = Math.min(1, Math.max(0, (time - chainStart) / (80 / 30)));
          const segments = chainKeys.length - 1;
          const scaled = chainProgress * segments;
          const segment = Math.min(segments - 1, Math.floor(scaled));
          const local = chainProgress >= 1 ? 1 : ease(scaled - segment);
          chainCube.style.transform = chainKeys[segment].lerp(chainKeys[segment + 1], local).toCSSMatrix3D();
          const orbitProgress = (Math.round(frame) % 100) / 100;
          satellites.forEach(function (orb, index) {
            const angle = (orbitProgress + [0, 0.33, 0.66][index]) * Math.PI * 2;
            const distance = vmin * 40;
            const orbit = Transform3D.identity().translate(Math.cos(angle) * distance, vmin * 5, Math.sin(angle) * distance).rotateY(angle + Math.PI / 2);
            orb.style.transform = orbit.toCSSMatrix3D();
          });
          const nestedTransform = Transform3D.identity().translate(vmin * 10, 0, 0).rotateX(Math.round(frame) * 0.05).scaleBy(1.1);
          const nestedCss = nestedTransform.toCSSMatrix3D();
          nested.forEach(function (node) { node.style.transform = nestedCss; });
        }
        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        timeline.to(proxy, { time: 16.667, duration: 16.667, ease: "none", onUpdate: render }, 0);
        render();
        registerTimeline("transform3d-showcase", timeline);

      })();
    </script>
  </body>
</html>
