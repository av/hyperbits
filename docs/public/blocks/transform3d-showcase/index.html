<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Accent","default":"#38bdf8"},{"id":"background","type":"color","label":"Background","default":"#020617"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #020617;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #020617;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .panel[data-step-active="false"] {
        opacity: 0;
      }
      .panel[data-step-active="true"] {
        opacity: 1;
      }
      .panel {
        width: 70vmin;
        min-height: 36vmin;
        border-radius: 2vmin;
        padding: 3.2vmin 3.6vmin;
        background-color: rgba(15, 23, 42, 0.72);
        border: 0.28vmin solid rgba(248, 250, 252, 0.16);
        color: #f8fafc;
        box-sizing: border-box;
      }
      .panel h1 {
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 1.05;
        font-size: 8vmin;
      }
      .panel p {
        margin-top: 0.4em;
        font-size: 3.2vmin;
        color: #cbd5e1;
        font-weight: 600;
      }
      .cube {
        width: 12vmin;
        height: 12vmin;
        border: 0.45vmin solid #38bdf8;
        margin-top: 2.4vmin;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="transform3d-showcase"
      data-start="0"
      data-duration="16.67"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="16.67" style="position:absolute;inset:0;background-color:#020617"></div>
      <div id="scene"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const sceneEl = document.getElementById("scene");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        bg.setAttribute("data-color", vars.color);

        function panel(title, body) {
          const node = document.createElement("div");
          node.className = "panel";
          node.style.width = view.vmin * 70 + "px";
          node.style.borderColor = vars.color;
          const heading = document.createElement("h1");
          heading.textContent = title;
          heading.style.fontSize = view.vmin * 8 + "px";
          heading.style.color = vars.color;
          const copy = document.createElement("p");
          copy.textContent = body;
          copy.style.fontSize = view.vmin * 3.2 + "px";
          const cube = document.createElement("div");
          cube.className = "cube";
          cube.style.width = view.vmin * 12 + "px";
          cube.style.height = view.vmin * 12 + "px";
          cube.style.borderColor = vars.color;
          node.append(heading, copy, cube);
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          return { node: node, cube: cube };
        }

        const intro = panel("Transform3D", "Chainable matrix motion");
        const chain = panel("Translate", "Move in x y z");
        const orbit = panel("Rotate", "Quaternion slerp");
        const compose = panel("Compose", "Parent times child");
        const hold = 16.67 / 4;

        const scene = hyperbits.createScene3D(sceneEl, {
          perspective: 1200,
          transitionDuration: 2.2,
          easing: "easeInOutCubic",
          steps: [
            { id: "intro", x: 0, y: -view.vmin * 4, z: 0, rotateY: -8, duration: hold, element: intro.node },
            { id: "chain", x: view.vmin * 70, y: 0, z: view.vmin * 12, rotateY: -16, duration: hold, element: chain.node },
            { id: "orbit", x: view.vmin * 140, y: view.vmin * 6, z: view.vmin * 8, rotateY: 14, duration: hold, element: orbit.node },
            { id: "compose", x: view.vmin * 210, y: 0, z: view.vmin * 16, rotateY: -10, duration: hold, element: compose.node },
          ],
        });
        sceneEl.style.position = "absolute";
        sceneEl.style.inset = "0";
        sceneEl.style.zIndex = "1";

        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        [intro, chain, orbit, compose].forEach(function (item) {
          timeline.to(item.cube, { rotateY: 180, rotateX: 90, duration: 4.1, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
        });
        timeline.to({}, { duration: 16.67 }, 0);
        registerTimeline("transform3d-showcase", timeline);

      })();
    </script>
  </body>
</html>
