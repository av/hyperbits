<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#f2652a"},{"id":"streaks","type":"number","label":"Trails","default":20},{"id":"seed","type":"number","label":"Seed","default":9}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #f2652a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="speed-streaks"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mix(from, to, amount) {
          return from.map((value, index) => Math.round(value + (to[index] - value) * amount));
        }
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const warm = mix(accent, foreground, 0.4);
        const count = Math.max(1, Math.round(Number(vars.streaks) || 20));
        const seed = Number(vars.seed) || 0;
        const columns = Math.ceil(Math.sqrt(count * (view.width / view.height)));
        const rows = Math.ceil(count / columns);
        const tones = [accent, warm, accent, foreground];
        const trails = [...Array(count).keys()].map((index) => {
          const key = "trail-" + seed + "-" + index;
          return {
            homeX: ((index % columns) + 0.5) / columns,
            homeY: (Math.floor(index / columns) + 0.5) / rows,
            rateY: hyperbits.pick(key + "-fy", [1, 2]),
            shiftX: hyperbits.random(key + "-sx"),
            shiftY: hyperbits.random(key + "-sy"),
            reachX: hyperbits.randomFloat(key + "-ax", 0.6, 0.9) / columns,
            reachY: hyperbits.randomFloat(key + "-ay", 0.5, 0.8) / rows,
            width: view.vmin * hyperbits.randomFloat(key + "-w", 0.18, 0.4),
            length: hyperbits.randomFloat(key + "-l", 0.3, 0.5),
            color: tones[index % tones.length],
          };
        });
        function position(trail, time) {
          return [
            view.width * (trail.homeX + trail.reachX * Math.sin(turn * (time + trail.shiftX))),
            view.height * (trail.homeY + trail.reachY * Math.sin(turn * (time * trail.rateY + trail.shiftY))),
          ];
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          context.lineCap = "round";
          const pieces = 60;
          for (const trail of trails) {
            let previous = position(trail, phase - trail.length);
            for (let piece = 1; piece <= pieces; piece += 1) {
              const share = piece / pieces;
              const current = position(trail, phase - trail.length * (1 - share));
              context.strokeStyle = rgba(trail.color, 0.45 * Math.pow(share, 1.6));
              context.lineWidth = trail.width;
              context.beginPath();
              context.moveTo(previous[0], previous[1]);
              context.lineTo(current[0], current[1]);
              context.stroke();
              previous = current;
            }
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("speed-streaks", timeline);

      })();
    </script>
  </body>
</html>
