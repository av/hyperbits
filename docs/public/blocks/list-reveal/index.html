<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Accent","default":"#38bdf8"},{"id":"background","type":"color","label":"Background","default":"#09090b"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #09090b;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background-color: #09090b;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #list {
        display: flex;
        flex-direction: column;
        width: 72%;
        gap: 2.4vmin;
        position: relative;
        z-index: 1;
      }
      .item {
        background-color: #27272a;
        border-radius: 1.4vmin;
        display: flex;
        align-items: center;
        color: #f4f4f5;
        font-weight: 500;
        font-size: 3.2vmin;
        height: 10vmin;
        padding: 0 3vmin;
        gap: 2vmin;
      }
      .accent {
        width: 0.8vmin;
        height: 46%;
        border-radius: 99px;
        background-color: #38bdf8;
        flex-shrink: 0;
      }
      .dot {
        border-radius: 50%;
        background-color: #38bdf8;
        margin-left: auto;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="list-reveal"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="3" style="position:absolute;inset:0;background-color:#09090b"></div>
      <div id="list" class="clip" data-start="0" data-duration="3"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const list = document.getElementById("list");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        const items = [
          { title: "Dashboard", path: "M3 13h8V3H3v10zm10 8h8V3h-8v18zM3 21h8v-6H3v6z" },
          { title: "Analytics", path: "M3 17l6-6 4 4 8-8" },
          { title: "Settings", path: "M12 8a4 4 0 100 8 4 4 0 000-8z" },
          { title: "Profile", path: "M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6z" },
          { title: "Messages", path: "M4 4h16v12H7l-3 3V4z" },
          { title: "Notifications", path: "M12 22a2 2 0 002-2H10a2 2 0 002 2zm6-6V11a6 6 0 10-12 0v5L4 18v1h16v-1l-2-2z" },
        ];
        const itemWidth = view.width * 0.72;
        const itemHeight = view.vmin * 10;
        const iconSize = view.vmin * 3.6;
        list.style.width = itemWidth + "px";
        list.style.gap = view.vmin * 2.4 + "px";
        for (const item of items) {
          const row = document.createElement("div");
          row.className = "item";
          row.style.height = itemHeight + "px";
          row.style.padding = "0 " + view.vmin * 3 + "px";
          row.style.gap = view.vmin * 2 + "px";
          row.style.fontSize = view.vmin * 3.2 + "px";
          row.style.borderRadius = view.vmin * 1.4 + "px";
          const accent = document.createElement("div");
          accent.className = "accent";
          accent.style.width = view.vmin * 0.8 + "px";
          accent.style.backgroundColor = vars.color;
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("width", String(iconSize));
          svg.setAttribute("height", String(iconSize));
          svg.setAttribute("viewBox", "0 0 24 24");
          svg.setAttribute("fill", vars.color);
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", item.path);
          svg.append(path);
          const title = document.createElement("div");
          title.textContent = item.title;
          title.style.flex = "1";
          const dot = document.createElement("div");
          dot.className = "dot";
          dot.style.width = view.vmin * 1.2 + "px";
          dot.style.height = view.vmin * 1.2 + "px";
          dot.style.backgroundColor = vars.color;
          row.append(accent, svg, title, dot);
          list.append(row);
        }
        const timeline = gsap.timeline({ paused: true });
        hyperbits.stagger(list.children, { y: [view.vmin * 5, 0], opacity: [0, 1], scale: [0.9, 1], duration: 40 / 30, stagger: 3 / 30, ease: "easeOutCubic" }, timeline);
        registerTimeline("list-reveal", timeline);

      })();
    </script>
  </body>
</html>
