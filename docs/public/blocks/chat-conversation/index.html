<!doctype html>
<html lang="en" data-composition-variables='[{"id":"message","type":"string","label":"First message","default":"Did the render finish?"},{"id":"color","type":"color","label":"My bubble","default":"#2563eb"},{"id":"background","type":"color","label":"Background","default":"#0b1220"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0b1220;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0b1220;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #thread {
        display: flex;
        flex-direction: column;
        width: 60%;
        gap: 2.2vmin;
        font-size: 3.2vmin;
        position: relative;
        z-index: 1;
      }
      .bubble {
        max-width: 78%;
        padding: 2.2vmin 2.8vmin;
        border-radius: 2.4vmin;
        font-weight: 500;
        line-height: 1.35;
      }
      .me {
        align-self: flex-end;
        background-color: #2563eb;
        color: #eff6ff;
        border-bottom-right-radius: 0.5vmin;
      }
      .them {
        align-self: flex-start;
        background-color: #1f2937;
        color: #e5e7eb;
        border-bottom-left-radius: 0.5vmin;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="chat-conversation"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="5" style="position:absolute;inset:0;background-color:#0b1220"></div>
      <div id="thread" class="clip" data-start="0" data-duration="5"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const thread = document.getElementById("thread");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        thread.style.width = view.width * 0.6 + "px";
        thread.style.gap = view.vmin * 2.2 + "px";
        thread.style.fontSize = view.vmin * 4.2 + "px";
        const messages = [
          { who: "them", text: vars.message },
          { who: "me", text: "Just exported the 1080p master." },
          { who: "them", text: "How is the motion on the lower third?" },
          { who: "me", text: "Seek-safe now. Try scrubbing it." },
          { who: "them", text: "Nice. Ship it." },
        ];
        for (const message of messages) {
          const bubble = document.createElement("div");
          bubble.className = "bubble " + message.who;
          bubble.textContent = message.text;
          bubble.style.padding = view.vmin * 2.2 + "px " + view.vmin * 2.8 + "px";
          bubble.style.borderRadius = view.vmin * 2.4 + "px";
          if (message.who === "me") {
            bubble.style.backgroundColor = vars.color;
            bubble.style.borderBottomRightRadius = view.vmin * 0.5 + "px";
          } else {
            bubble.style.borderBottomLeftRadius = view.vmin * 0.5 + "px";
          }
          thread.append(bubble);
        }
        const timeline = gsap.timeline({ paused: true });
        hyperbits.stagger(thread.children, { opacity: [0, 1], y: [view.vmin * 2.4, 0], duration: 0.45, stagger: 0.55, ease: "power2.out" }, timeline);
        registerTimeline("chat-conversation", timeline);

      })();
    </script>
  </body>
</html>
