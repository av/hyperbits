<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0b1220;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0b1220;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #0b1220;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { display: flex; align-items: center; justify-content: center; background-color: #0b1220; }
      #thread { display: flex; flex-direction: column; }
      .bubble { max-width: 70%; padding: 0.7em 1em; border-radius: 1.2em; font-weight: 500; }
      .me { align-self: flex-end; background-color: #2563eb; color: #eff6ff; border-bottom-right-radius: 0.3em; }
      .them { align-self: flex-start; background-color: #1f2937; color: #e5e7eb; border-bottom-left-radius: 0.3em; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="chat-conversation"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="thread" class="clip" data-start="0" data-duration="5"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const view = hyperbits.viewport();
        const thread = document.getElementById("thread");
        thread.style.width = view.vw * 42 + "px";
        thread.style.gap = view.vmin * 1.8 + "px";
        thread.style.fontSize = view.vmin * 2.6 + "px";
        const messages = [
          { who: "them", text: "Did the render finish?" },
          { who: "me", text: "Just exported the 1080p master." },
          { who: "them", text: "How is the motion on the lower third?" },
          { who: "me", text: "Seek-safe now. Try scrubbing it." },
          { who: "them", text: "Nice. Ship it." },
        ];
        for (const message of messages) {
          const bubble = document.createElement("div");
          bubble.className = "bubble " + message.who;
          bubble.textContent = message.text;
          thread.append(bubble);
        }
        const timeline = gsap.timeline({ paused: true });
        hyperbits.stagger(thread.children, { opacity: [0, 1], y: [24, 0], duration: 0.45, stagger: 0.55, ease: "power2.out" }, timeline);
        registerTimeline("chat-conversation", timeline);

      })();
    </script>
  </body>
</html>
