<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Accent","default":"#38bdf8"},{"id":"background","type":"color","label":"Background","default":"#020617"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #020617;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #020617;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .word {
        color: #f8fafc;
        font-weight: 800;
        letter-spacing: -0.05em;
        white-space: nowrap;
        line-height: 1;
        font-size: 10vmin;
        text-align: center;
      }
      .word[data-step-active="false"] {
        opacity: 0;
      }
      .word[data-step-active="true"] {
        opacity: 1;
      }
      .plane {
        width: 18vmin;
        height: 18vmin;
        border-radius: 1.4vmin;
        border: 0.28vmin solid rgba(248, 250, 252, 0.18);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="3d-elements"
      data-start="0"
      data-duration="6.67"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="6.67" style="position:absolute;inset:0;background-color:#020617"></div>
      <div id="scene"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const sceneEl = document.getElementById("scene");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        bg.setAttribute("data-color", vars.color);

        const words = ["Fly", "Your", "Camera", "Through", "Space"];
        const steps = words.map(function (word, index) {
          const node = document.createElement("h1");
          node.className = "word";
          node.textContent = word;
          node.style.fontSize = view.vmin * 10 + "px";
          node.style.color = vars.color;
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          return {
            id: "step-" + index,
            x: (index - 2) * view.vmin * 36,
            y: (index % 2 === 0 ? -1 : 1) * view.vmin * 6,
            z: index * view.vmin * 18,
            rotateY: (index - 2) * 10,
            duration: 6.67 / words.length,
            element: node,
          };
        });

        const palette = [vars.color, "#f472b6", "#f59e0b", "#34d399", "#a78bfa", "#fb7185"];
        const planeSize = view.vmin * 18;
        const elements = [];
        for (let index = 0; index < 8; index += 1) {
          const plane = document.createElement("div");
          plane.className = "plane";
          plane.style.width = planeSize + "px";
          plane.style.height = planeSize + "px";
          plane.style.backgroundColor = palette[index % palette.length];
          plane.style.opacity = "0.55";
          plane.setAttribute("data-layout-allow-overlap", "");
          plane.setAttribute("data-layout-allow-occlusion", "");
          elements.push({
            element: plane,
            centered: true,
            x: hyperbits.randomFloat("el-x-" + index, -view.vmin * 48, view.vmin * 48),
            y: hyperbits.randomFloat("el-y-" + index, -view.vmin * 28, view.vmin * 28),
            z: hyperbits.randomFloat("el-z-" + index, -view.vmin * 20, view.vmin * 90),
            rotateY: hyperbits.randomFloat("el-ry-" + index, -24, 24),
            rotateX: hyperbits.randomFloat("el-rx-" + index, -16, 16),
          });
        }

        const scene = hyperbits.createScene3D(sceneEl, {
          perspective: 1000,
          transitionDuration: 1.05,
          easing: "easeInOutCubic",
          steps: steps,
          elements: elements,
        });
        sceneEl.style.position = "absolute";
        sceneEl.style.inset = "0";
        sceneEl.style.zIndex = "1";

        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        timeline.to({}, { duration: 6.67 }, 0);
        registerTimeline("3d-elements", timeline);

      })();
    </script>
  </body>
</html>
