<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#9d8af0"},{"id":"rings","type":"number","label":"Bands","default":11},{"id":"seed","type":"number","label":"Seed","default":6}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #9d8af0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="truchet-weave"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const rings = Math.max(2, Math.round(Number(vars.rings) || 11));
        const seed = Number(vars.seed) || 0;
        const sectors = 120;
        const centerX = view.width * 1.9;
        const centerY = view.height * 3.2;
        const corners = [[0, 0], [view.width, 0], [0, view.height], [view.width, view.height]];
        const distances = corners.map(([cornerX, cornerY]) => Math.hypot(cornerX - centerX, cornerY - centerY));
        const angles = corners.map(([cornerX, cornerY]) => Math.atan2(cornerY - centerY, cornerX - centerX));
        const inner = Math.min(...distances) - view.vmin * 4;
        const outer = Math.max(...distances) + view.vmin * 4;
        const band = (outer - inner) / rings;
        const width = turn / sectors;
        const fromAngle = Math.min(...angles) - width * 4;
        const toAngle = Math.max(...angles) + width * 4;
        const slots = 6;
        const flips = [];
        for (let ring = 0; ring < rings; ring += 1) {
          for (let slot = 0; slot < slots; slot += 1) {
            flips.push(hyperbits.random("arcs-" + seed + "-" + ring + "-" + slot) > 0.5);
          }
        }
        function polar(distance, angle) {
          return [centerX + Math.cos(angle) * distance, centerY + Math.sin(angle) * distance];
        }
        function curve(fromDistance, startAngle, cornerDistance, cornerAngle, toDistance, endAngle) {
          const [startX, startY] = polar(fromDistance, startAngle);
          const [controlX, controlY] = polar(cornerDistance, cornerAngle);
          const [endX, endY] = polar(toDistance, endAngle);
          context.moveTo(startX, startY);
          context.quadraticCurveTo(controlX, controlY, endX, endY);
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          context.lineCap = "round";
          for (let ring = 0; ring < rings; ring += 1) {
            const direction = ring % 2 === 0 ? 1 : -1;
            const offset = direction * width * slots * phase;
            const low = inner + ring * band;
            const high = low + band;
            const middle = (low + high) / 2;
            context.strokeStyle = rgba(ring % 4 === 1 ? accent : foreground, ring % 4 === 1 ? 0.4 : 0.2);
            context.lineWidth = Math.min(band * 0.05, view.vmin * 0.6);
            context.beginPath();
            const firstSector = Math.floor((fromAngle - offset) / width);
            const lastSector = Math.ceil((toAngle - offset) / width);
            for (let sector = firstSector; sector <= lastSector; sector += 1) {
              const start = sector * width + offset;
              const end = start + width;
              const center = start + width / 2;
              const slot = ((sector % slots) + slots) % slots;
              if (flips[ring * slots + slot]) {
                curve(low, center, low, start, middle, start);
                curve(high, center, high, end, middle, end);
              } else {
                curve(low, center, low, end, middle, end);
                curve(high, center, high, start, middle, start);
              }
            }
            context.stroke();
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("truchet-weave", timeline);

      })();
    </script>
  </body>
</html>
