<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Accent","default":"#38bdf8"},{"id":"background","type":"color","label":"Background","default":"#0b1220"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0b1220;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0b1220;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .card {
        width: 32vmin;
        height: 42vmin;
        position: relative;
        transform-style: preserve-3d;
        background-color: transparent;
      }
      .card-face {
        position: absolute;
        inset: 0;
        border-radius: 2.2vmin;
        display: flex;
        align-items: flex-end;
        color: #f8fafc;
        font-weight: 800;
        padding: 2.2vmin;
        box-sizing: border-box;
        letter-spacing: -0.04em;
        font-size: 6vmin;
        border: 0.28vmin solid rgba(248, 250, 252, 0.16);
        box-shadow: 0 1.6vmin 4vmin rgba(0, 0, 0, 0.45);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .card-face-back {
        transform: rotateY(180deg);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="carousel"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#0b1220"></div>
      <div id="scene"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const sceneEl = document.getElementById("scene");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        bg.setAttribute("data-color", vars.color);

        const labels = ["North", "Atlas", "Signal", "Harbor", "Nova", "Prism"];
        const colors = [vars.color, "#0f766e", "#9a3412", "#6d28d9", "#be123c", "#0369a1"];
        const radius = view.vmin * 48;
        const cardW = view.vmin * 32;
        const cardH = view.vmin * 42;

        const elements = labels.map(function (label, index) {
          const card = document.createElement("div");
          card.className = "card";
          card.style.width = cardW + "px";
          card.style.height = cardH + "px";
          card.style.transformStyle = "preserve-3d";
          card.setAttribute("data-layout-allow-overlap", "");
          card.setAttribute("data-layout-allow-occlusion", "");

          const front = document.createElement("div");
          front.className = "card-face card-face-front";
          front.textContent = label;
          front.style.backgroundColor = colors[index];
          front.style.fontSize = view.vmin * 6 + "px";
          front.style.borderColor = vars.color;
          front.style.backfaceVisibility = "hidden";

          const back = document.createElement("div");
          back.className = "card-face card-face-back";
          back.style.backgroundColor = colors[index];
          back.style.borderColor = vars.color;
          back.style.backfaceVisibility = "hidden";
          back.style.transform = "rotateY(180deg)";

          card.append(front, back);
          const angle = (index / labels.length) * Math.PI * 2;
          return {
            element: card,
            centered: true,
            x: Math.sin(angle) * radius,
            z: Math.cos(angle) * radius,
            rotateY: (index / labels.length) * 360,
          };
        });

        const steps = labels.map(function (_label, index) {
          return {
            id: "c" + index,
            rotateY: -(index / labels.length) * 360,
            rotateX: 8,
            z: view.vmin * 8,
            duration: 10 / labels.length,
          };
        });

        const scene = hyperbits.createScene3D(sceneEl, {
          perspective: 1400,
          transitionDuration: 1.45,
          easing: "easeInOutCubic",
          steps: steps,
          elements: elements,
        });
        sceneEl.style.position = "absolute";
        sceneEl.style.inset = "0";
        sceneEl.style.zIndex = "1";

        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        timeline.to({}, { duration: 10 }, 0);
        registerTimeline("carousel", timeline);

      })();
    </script>
  </body>
</html>
