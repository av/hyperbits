<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Card color","default":"#fcc192"},{"id":"background","type":"color","label":"Background","default":"#111111"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #111111;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #111111;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Geist Sans", Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .card {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="carousel"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#111111"></div>
      <div id="scene"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const sceneEl = document.getElementById("scene");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const radius = vmin * 60;
        const count = 8;
        const cardWidth = vmin * 40;
        const cardHeight = vmin * 40;
        const rotationSpeed = 360 / (30 * 10);
        const elements = [];
        for (let index = 0; index < count; index += 1) {
          const card = document.createElement("div");
          card.className = "card";
          card.style.width = cardWidth + "px";
          card.style.height = cardHeight + "px";
          card.style.backgroundColor = vars.color;
          card.style.borderRadius = vmin + "px";
          card.style.fontSize = vmin * 4 + "px";
          card.style.boxShadow = "0 " + vmin + "px " + vmin * 10 + "px rgba(0, 0, 0, 0.5)";
          card.textContent = String(index + 1);
          card.setAttribute("data-layout-allow-overlap", "");
          card.setAttribute("data-layout-allow-occlusion", "");
          elements.push({ element: card, centered: true, x: 0, y: 0, z: 0, rotateY: 0, index: index });
        }
        function placeCards(time) {
          const frame = time * 30;
          const baseRotation = frame * rotationSpeed;
          for (const item of elements) {
            const angle = item.index * (360 / count) + baseRotation;
            const angleRad = (angle * Math.PI) / 180;
            item.x = Math.sin(angleRad) * radius;
            item.z = Math.cos(angleRad) * radius;
            item.rotateY = angle;
          }
        }
        placeCards(0);
        const scene = hyperbits.createScene3D(sceneEl, {
          perspective: 1000,
          transitionDuration: 1,
          stepDuration: 1,
          easing: "easeInOutCubic",
          steps: [
            { id: "0", duration: 1 },
            { id: "1", z: -vmin * 100, rotateZ: 180, duration: 1 },
            { id: "3", duration: 8 },
          ],
          elements: elements,
        });
        sceneEl.style.position = "absolute";
        sceneEl.style.inset = "0";
        sceneEl.style.zIndex = "1";
        const timeline = gsap.timeline({ paused: true });
        const previousUpdate = timeline.eventCallback("onUpdate");
        timeline.eventCallback("onUpdate", function () {
          if (typeof previousUpdate === "function") previousUpdate.call(timeline);
          placeCards(timeline.time());
        });
        scene.bind(timeline);
        timeline.to({}, { duration: 10 }, 0);
        registerTimeline("carousel", timeline);

      })();
    </script>
  </body>
</html>
