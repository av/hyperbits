<!doctype html>
<html lang="en" data-composition-variables='[{"id":"title","type":"string","label":"Drawing title","default":"FLANGE COUPLING"},{"id":"part","type":"string","label":"Part number","default":"HB-0907"},{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Line ink","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Dimension ink","default":"#ec8b49"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Mono";
        font-weight: 500;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-500-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist Mono";
        font-weight: 700;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="./hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ec8b49;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #sheet {
        position: absolute;
        inset: 0;
      }
      #sheet text {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="blueprint-draw"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <svg id="sheet" class="clip" data-start="0" data-duration="10" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }
        

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const sheet = document.getElementById("sheet");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        sheet.setAttribute("width", String(view.width));
        sheet.setAttribute("height", String(view.height));
        sheet.setAttribute("viewBox", "0 0 " + view.width + " " + view.height);
        const duration = 10;
        const portrait = view.height > view.width * 1.1;
        const wide = view.width > view.height * 1.4;
        const unit = wide || portrait ? view.vmin : Math.min(view.vmin, (view.width * 0.9) / 108);
        const ink = vars.foreground;
        const accent = vars.accent;
        const svgNs = "http://www.w3.org/2000/svg";
        const weight = { thick: unit * 0.26, thin: unit * 0.13, hair: unit * 0.08 };
        function element(name, attributes, parent) {
          const node = document.createElementNS(svgNs, name);
          for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, String(value));
          (parent || sheet).append(node);
          return node;
        }
        const groups = {};
        for (const name of ["grid", "center", "outline", "section", "hatch", "hidden", "dims", "notes", "block", "stamp"]) groups[name] = element("g", { "data-layer": name });
        const drawn = [];
        function stroke(node, options) {
          node.setAttribute("fill", "none");
          node.setAttribute("stroke", options.color || ink);
          node.setAttribute("stroke-width", options.width || weight.thin);
          node.setAttribute("stroke-linecap", "round");
          if (options.dash) node.setAttribute("stroke-dasharray", options.dash);
          else {
            node.setAttribute("pathLength", "1");
            node.setAttribute("stroke-dasharray", "1 1");
            node.setAttribute("stroke-dashoffset", "1");
            drawn.push({ node, at: options.at, length: options.length || 0.6 });
          }
          return node;
        }
        const fades = [];
        function fade(node, at, length) {
          node.setAttribute("opacity", "0");
          fades.push({ node, at, length: length || 0.4 });
          return node;
        }
        for (let gridX = 0; gridX <= view.width; gridX += unit * 2) {
          const major = Math.round(gridX / (unit * 2)) % 5 === 0;
          element("line", { x1: gridX, y1: 0, x2: gridX, y2: view.height, stroke: ink, "stroke-opacity": major ? 0.08 : 0.035, "stroke-width": weight.hair }, groups.grid);
        }
        for (let gridY = 0; gridY <= view.height; gridY += unit * 2) {
          const major = Math.round(gridY / (unit * 2)) % 5 === 0;
          element("line", { x1: 0, y1: gridY, x2: view.width, y2: gridY, stroke: ink, "stroke-opacity": major ? 0.08 : 0.035, "stroke-width": weight.hair }, groups.grid);
        }
        fade(groups.grid, 0, 0.8);
        const frontX = wide ? view.width * 0.3 : portrait ? view.width * 0.5 : view.width / 2 - unit * 22.6;
        const frontY = view.height * (portrait ? 0.21 : 0.47);
        const outer = unit * 25;
        const bore = unit * 7.5;
        const boltCircle = unit * 17;
        const hole = unit * 2.3;
        const centerDash = unit * 2.6 + " " + unit * 0.8 + " " + unit * 0.4 + " " + unit * 0.8;
        fade(stroke(element("line", { x1: frontX - outer * 1.25, y1: frontY, x2: frontX + outer * 1.25, y2: frontY }, groups.center), { dash: centerDash, color: accent, width: weight.hair }), 0.5, 0.5);
        fade(stroke(element("line", { x1: frontX, y1: frontY - outer * 1.25, x2: frontX, y2: frontY + outer * 1.25 }, groups.center), { dash: centerDash, color: accent, width: weight.hair }), 0.6, 0.5);
        fade(stroke(element("circle", { cx: frontX, cy: frontY, r: boltCircle }, groups.center), { dash: centerDash, color: accent, width: weight.hair }), 1.6, 0.5);
        stroke(element("circle", { cx: frontX, cy: frontY, r: outer }, groups.outline), { width: weight.thick, at: 0.9, length: 0.9 });
        stroke(element("circle", { cx: frontX, cy: frontY, r: outer * 0.62 }, groups.outline), { width: weight.thin, at: 1.2, length: 0.6 });
        const keyWidth = unit * 2.4;
        const keyDepth = unit * 1.6;
        const keyHalf = Math.asin(keyWidth / 2 / bore);
        const boreStart = -Math.PI / 2 + keyHalf;
        const boreEnd = -Math.PI / 2 - keyHalf + Math.PI * 2;
        const borePath = "M " + (frontX + Math.cos(boreStart) * bore) + " " + (frontY + Math.sin(boreStart) * bore) + " A " + bore + " " + bore + " 0 1 1 " + (frontX + Math.cos(boreEnd) * bore) + " " + (frontY + Math.sin(boreEnd) * bore) + " L " + (frontX - keyWidth / 2) + " " + (frontY - bore - keyDepth) + " L " + (frontX + keyWidth / 2) + " " + (frontY - bore - keyDepth) + " Z";
        stroke(element("path", { d: borePath }, groups.outline), { width: weight.thick, at: 1.3, length: 0.7 });
        for (let index = 0; index < 6; index += 1) {
          const angle = (index / 6) * Math.PI * 2 + Math.PI / 6;
          const holeX = frontX + Math.cos(angle) * boltCircle;
          const holeY = frontY + Math.sin(angle) * boltCircle;
          stroke(element("circle", { cx: holeX, cy: holeY, r: hole }, groups.outline), { width: weight.thin, at: 1.9 + index * 0.08, length: 0.35 });
          fade(stroke(element("line", { x1: holeX - hole * 1.6, y1: holeY, x2: holeX + hole * 1.6, y2: holeY }, groups.center), { dash: unit * 0.7 + " " + unit * 0.4, color: accent, width: weight.hair }), 2 + index * 0.08, 0.3);
        }
        const sideX = wide ? view.width * 0.64 : portrait ? view.width / 2 - unit * 12 : frontX + unit * 48;
        const sideY = portrait ? view.height * 0.62 : frontY;
        const flangeThickness = unit * 7;
        const hubLength = unit * 9;
        const hubRadius = outer * 0.62;
        const profile = [
          [sideX, sideY - outer],
          [sideX + flangeThickness, sideY - outer],
          [sideX + flangeThickness, sideY - hubRadius],
          [sideX + flangeThickness + hubLength, sideY - hubRadius],
          [sideX + flangeThickness + hubLength, sideY + hubRadius],
          [sideX + flangeThickness, sideY + hubRadius],
          [sideX + flangeThickness, sideY + outer],
          [sideX, sideY + outer],
        ];
        stroke(element("path", { d: "M " + profile.map((point) => point.join(" ")).join(" L ") + " Z" }, groups.section), { width: weight.thick, at: 2.5, length: 1.1 });
        const sectionLength = flangeThickness + hubLength;
        fade(stroke(element("line", { x1: sideX - unit * 4, y1: sideY, x2: sideX + sectionLength + unit * 4, y2: sideY }, groups.center), { dash: centerDash, color: accent, width: weight.hair }), 2.6, 0.4);
        const clip = element("clipPath", { id: "section-clip" }, sheet);
        element("path", { d: "M " + profile.map((point) => point.join(" ")).join(" L ") + " Z" }, clip);
        const mask = element("mask", { id: "bore-mask" }, sheet);
        element("rect", { x: 0, y: 0, width: view.width, height: view.height, fill: "#ffffff" }, mask);
        element("rect", { x: sideX - 1, y: sideY - bore, width: sectionLength + 2, height: bore * 2, fill: "#000000" }, mask);
        const hatchGroup = element("g", { "clip-path": "url(#section-clip)", mask: "url(#bore-mask)" }, groups.hatch);
        for (let offset = -outer * 2; offset < sectionLength + outer * 2; offset += unit * 1.3) {
          element("line", { x1: sideX + offset, y1: sideY + outer, x2: sideX + offset + outer * 2, y2: sideY - outer, stroke: ink, "stroke-opacity": 0.45, "stroke-width": weight.hair }, hatchGroup);
        }
        fade(groups.hatch, 3.4, 0.8);
        for (const edgeY of [sideY - bore, sideY + bore]) stroke(element("line", { x1: sideX, y1: edgeY, x2: sideX + sectionLength, y2: edgeY }, groups.section), { width: weight.thick, at: 3.1, length: 0.5 });
        const hiddenDash = unit * 1 + " " + unit * 0.6;
        for (const edgeY of [sideY - boltCircle - hole, sideY - boltCircle + hole, sideY + boltCircle - hole, sideY + boltCircle + hole]) fade(stroke(element("line", { x1: sideX, y1: edgeY, x2: sideX + flangeThickness, y2: edgeY }, groups.hidden), { dash: hiddenDash, width: weight.thin }), 3.3, 0.4);
        function arrowHead(tipX, tipY, angle, parent) {
          const size = unit * 1.2;
          const spread = 0.32;
          return element("path", { d: "M " + tipX + " " + tipY + " L " + (tipX - Math.cos(angle - spread) * size) + " " + (tipY - Math.sin(angle - spread) * size) + " L " + (tipX - Math.cos(angle + spread) * size) + " " + (tipY - Math.sin(angle + spread) * size) + " Z", fill: accent }, parent);
        }
        function label(text, labelX, labelY, options) {
          const node = element("text", { x: labelX, y: labelY, fill: options && options.color ? options.color : accent, "font-size": (options && options.size) || unit * 1.9, "text-anchor": (options && options.anchor) || "middle", "dominant-baseline": "middle" }, (options && options.parent) || groups.dims);
          node.textContent = text;
          if (options && options.rotate) node.setAttribute("transform", "rotate(" + options.rotate + " " + labelX + " " + labelY + ")");
          return node;
        }
        function dimension(fromX, fromY, toX, toY, text, at, offsetText) {
          const group = element("g", {}, groups.dims);
          const angle = Math.atan2(toY - fromY, toX - fromX);
          stroke(element("line", { x1: fromX, y1: fromY, x2: toX, y2: toY }, group), { color: accent, width: weight.hair, at, length: 0.5 });
          const heads = element("g", {}, group);
          arrowHead(toX, toY, angle, heads);
          arrowHead(fromX, fromY, angle + Math.PI, heads);
          fade(heads, at + 0.35, 0.2);
          const middleX = (fromX + toX) / 2 + (offsetText ? offsetText[0] : 0);
          const middleY = (fromY + toY) / 2 + (offsetText ? offsetText[1] : 0);
          const node = label(text, middleX, middleY, { parent: group });
          node.setAttribute("stroke", vars.background);
          node.setAttribute("stroke-width", String(unit * 0.9));
          node.setAttribute("paint-order", "stroke");
          fade(node, at + 0.4, 0.3);
        }
        const diagonal = Math.PI / 4;
        dimension(frontX - Math.cos(diagonal) * outer, frontY + Math.sin(diagonal) * outer, frontX + Math.cos(diagonal) * outer, frontY - Math.sin(diagonal) * outer, "\u00d8 104", 4.1, [outer * 0.42, -outer * 0.42]);
        dimension(frontX - bore, frontY, frontX + bore, frontY, "\u00d8 30", 4.4, [0, -unit * 2.6]);
        const extensionTop = sideY - outer - unit * 6;
        for (const extensionX of [sideX, sideX + flangeThickness, sideX + sectionLength]) {
          stroke(element("line", { x1: extensionX, y1: extensionX === sideX + sectionLength ? sideY - hubRadius - unit : sideY - outer - unit, x2: extensionX, y2: extensionTop - unit * 1.5 }, groups.dims), { color: accent, width: weight.hair, at: 4.6, length: 0.4 });
        }
        dimension(sideX, extensionTop, sideX + flangeThickness, extensionTop, "14", 4.9, [0, -unit * 2.6]);
        dimension(sideX + flangeThickness, extensionTop, sideX + sectionLength, extensionTop, "18", 5.1, [0, -unit * 2.6]);
        const extensionRight = sideX + sectionLength + unit * 7;
        stroke(element("line", { x1: sideX + flangeThickness + unit, y1: sideY + outer, x2: extensionRight + unit * 1.5, y2: sideY + outer }, groups.dims), { color: accent, width: weight.hair, at: 5.2, length: 0.4 });
        stroke(element("line", { x1: sideX + sectionLength + unit, y1: sideY - outer, x2: extensionRight + unit * 1.5, y2: sideY - outer }, groups.dims), { color: accent, width: weight.hair, at: 5.2, length: 0.4 });
        dimension(extensionRight, sideY - outer, extensionRight, sideY + outer, "104", 5.4, [unit * 3.4, 0]);
        const holeAngle = Math.PI / 6 - Math.PI / 3;
        const holeX = frontX + Math.cos(holeAngle) * boltCircle;
        const holeY = frontY + Math.sin(holeAngle) * boltCircle;
        const leaderEndX = frontX + outer + unit * 6;
        const leaderEndY = frontY - outer - unit * 2;
        stroke(element("path", { d: "M " + (holeX + hole * 0.7) + " " + (holeY - hole * 0.7) + " L " + (leaderEndX - unit * 3) + " " + leaderEndY + " L " + (leaderEndX + unit * 12) + " " + leaderEndY }, groups.dims), { color: accent, width: weight.hair, at: 5.7, length: 0.5 });
        fade(label("6x \u00d8 9 EQ SP", leaderEndX + unit * 4.5, leaderEndY - unit * 1.6), 6.1, 0.3);
        fade(label("SECTION A-A", sideX + sectionLength / 2, sideY + outer + unit * 5, { color: ink, size: unit * 2 }), 3.6, 0.4);
        fade(label("FRONT", frontX, frontY + outer * 1.25 + unit * 3, { color: ink, size: unit * 2 }), 3.6, 0.4);
        const blockWidth = unit * 56;
        const blockHeight = unit * 12;
        const blockX = view.width - blockWidth - unit * 4;
        const blockY = view.height - blockHeight - unit * 4;
        stroke(element("rect", { x: blockX, y: blockY, width: blockWidth, height: blockHeight }, groups.block), { width: weight.thin, at: 6.3, length: 0.6 });
        stroke(element("line", { x1: blockX, y1: blockY + blockHeight * 0.55, x2: blockX + blockWidth, y2: blockY + blockHeight * 0.55 }, groups.block), { width: weight.hair, at: 6.6, length: 0.4 });
        for (const fraction of [0.25, 0.5, 0.75]) stroke(element("line", { x1: blockX + blockWidth * fraction, y1: blockY + blockHeight * 0.55, x2: blockX + blockWidth * fraction, y2: blockY + blockHeight }, groups.block), { width: weight.hair, at: 6.7, length: 0.3 });
        const titleNode = label(String(vars.title), blockX + unit * 2, blockY + blockHeight * 0.28, { color: ink, size: unit * 3.2, anchor: "start", parent: groups.block });
        titleNode.setAttribute("font-weight", "700");
        fade(titleNode, 6.8, 0.4);
        const fields = [["PART", String(vars.part)], ["SCALE", "1:2"], ["DRAWN", "HB"], ["SHEET", "1/1"]];
        fields.forEach(([name, value], index) => {
          fade(label(name, blockX + blockWidth * (index * 0.25) + unit * 1.4, blockY + blockHeight * 0.68, { color: accent, size: unit * 1.3, anchor: "start", parent: groups.block }), 7 + index * 0.1, 0.3);
          fade(label(value, blockX + blockWidth * (index * 0.25) + unit * 1.4, blockY + blockHeight * 0.86, { color: ink, size: unit * 2, anchor: "start", parent: groups.block }), 7.05 + index * 0.1, 0.3);
        });
        const stampX = blockX + blockWidth * 0.78;
        const stampY = blockY - unit * 8;
        const stamp = element("g", { transform: "rotate(-8 " + stampX + " " + stampY + ")" }, groups.stamp);
        element("rect", { x: stampX - unit * 11, y: stampY - unit * 3.2, width: unit * 22, height: unit * 6.4, rx: unit * 1, fill: "none", stroke: accent, "stroke-width": weight.thick * 1.2 }, stamp);
        const stampText = element("text", { x: stampX, y: stampY, fill: accent, "font-size": unit * 3.4, "text-anchor": "middle", "dominant-baseline": "middle", "font-weight": "700", "letter-spacing": unit * 0.5 }, stamp);
        stampText.textContent = "APPROVED";
        sheet.setAttribute("aria-label", String(vars.title) + " " + String(vars.part));
        const timeline = gsap.timeline({ paused: true });
        for (const item of drawn) timeline.fromTo(item.node, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: item.length, ease: "power2.inOut" }, item.at);
        for (const item of fades) timeline.fromTo(item.node, { opacity: 0 }, { opacity: 1, duration: item.length, ease: "power1.out" }, item.at);
        timeline.fromTo(stamp, { opacity: 0, scale: 1.6, transformOrigin: "50% 50%" }, { opacity: 0.92, scale: 1, duration: 0.35, ease: "power4.in" }, 7.8);
        timeline.to({}, { duration: duration }, 0);
        registerTimeline("blueprint-draw", timeline);
      })();
    </script>
  </body>
</html>
