<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0b1220;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0b1220;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #0b1220;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { display: flex; align-items: center; justify-content: center; background-color: #0b1220; }
      #panel {
        background-color: #111827; border: 1px solid #1f2937; border-radius: 24px; overflow: hidden;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
      .hyperbits-code { margin: 0; background: #111827; color: #e5e7eb; }
      .hyperbits-code-line { display: block; }
      .hyperbits-code-gutter { display: inline-block; width: 3em; color: #64748b; }
      .token.keyword { color: #c084fc; }
      .token.function { color: #38bdf8; }
      .token.string { color: #86efac; }
      .token.boolean { color: #fbbf24; }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="basic-code-block"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div id="panel" class="clip" data-start="0" data-duration="4"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const view = hyperbits.viewport();
        const panel = document.getElementById("panel");
        panel.style.padding = view.vmin * 4 + "px " + view.vmin * 5 + "px";
        panel.style.width = view.vw * 62 + "px";
        const code = "function hello() {\n  console.log(\"Hello World\");\n  return true;\n}";
        const block = hyperbits.createCodeBlock(panel, { code: code, language: "javascript", showLineNumbers: true });
        block.style.fontSize = view.width * 0.025 + "px";
        block.style.lineHeight = "1.55";
        const lines = hyperbits.codeLines(block);
        const caret = document.createElement("span");
        caret.id = "caret";
        caret.textContent = " ";
        caret.style.display = "inline-block";
        caret.style.width = "0.08em";
        caret.style.height = "1em";
        caret.style.backgroundColor = "#e5e7eb";
        caret.style.marginLeft = "0.12em";
        const lastLine = lines[lines.length - 1];
        if (lastLine) lastLine.append(caret);
        const timeline = gsap.timeline({ paused: true });
        hyperbits.stagger(lines, { opacity: [0, 1], y: [16, 0], duration: 0.9, stagger: 0.55, ease: "power2.out" }, timeline);
        timeline.to(panel, { y: 10, duration: 4, ease: "sine.inOut" }, 0);
        registerTimeline("basic-code-block", timeline);

      })();
    </script>
  </body>
</html>
