<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Function color","default":"#dcdcaa"},{"id":"background","type":"color","label":"Background","default":"#100f0f"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Mono";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #panel {
        position: relative;
        z-index: 1;
      }
      .hyperbits-code {
        color: #9cdcfe;
        font-family: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
        font-weight: 700;
        font-variant-ligatures: none;
        line-height: 1.5;
      }
      .hyperbits-code-line {
        position: relative;
        width: 100%;
      }
      .hyperbits-code-gutter {
        display: inline-block;
        width: 2.5em;
        text-align: right;
        padding-right: 1em;
        opacity: 0.5;
        color: #666666;
        flex-shrink: 0;
      }
      .token.keyword,
      .token.builtin {
        color: #569cd6;
      }
      .token.function {
        color: #dcdcaa;
      }
      .token.string,
      .token.attr-value {
        color: #ce9178;
      }
      .token.punctuation,
      .token.operator {
        color: #d4d4d4;
      }
      .token.number {
        color: #b5cea8;
      }
      .token.comment {
        color: #6a9955;
      }
      .token.class-name {
        color: #4ec9b0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="basic-code-block"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="4" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <div id="panel" class="clip" data-start="0" data-duration="4"></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const unit = view.height / 1080;
        bg.style.backgroundColor = vars.background;
        const panel = document.getElementById("panel");
        const fontSize = view.width * 0.025;
        panel.style.fontSize = fontSize + "px";
        panel.style.padding = fontSize + "px";
        const code = "function hello() {\n  console.log(\"Hello World\");\n  return true;\n}";
        const block = hyperbits.createCodeBlock(panel, { code: code, language: "typescript", showLineNumbers: true });
        block.style.fontSize = fontSize + "px";
        hyperbits.codeLines(block).forEach(function (line) {
          line.style.display = "flex";
          const content = line.querySelector(".hyperbits-code-content");
          content.style.display = "block";
          content.style.width = "100%";
        });
        const functions = panel.querySelectorAll(".token.function");
        for (let index = 0; index < functions.length; index += 1) {
          functions[index].style.color = vars.color;
        }
        const lines = hyperbits.codeLines(block);
        const timeline = gsap.timeline({ paused: true });
        lines.forEach(function (line, index) {
          timeline.fromTo(line, { opacity: 0, y: unit * 10 }, { opacity: 1, y: 0, duration: 1, ease: "none" }, (index * 5) / 30);
        });
        timeline.to({}, { duration: 4 }, 0);
        registerTimeline("basic-code-block", timeline);

      })();
    </script>
  </body>
</html>
