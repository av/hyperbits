<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#4fb6ec"},{"id":"sides","type":"number","label":"Polygon sides","default":4},{"id":"twist","type":"number","label":"Twist per layer (degrees)","default":7}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #4fb6ec;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="zoom-polygons"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        const background = channels(vars.background);
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const sides = Math.max(3, Math.round(Number(vars.sides) || 4));
        const twist = ((Number(vars.twist) || 0) * Math.PI) / 180;
        const centerX = view.width / 2;
        const centerY = view.height / 2;
        const ratio = 0.84;
        const layersPerLoop = 8;
        const base = view.vmin * 40;
        const largest = Math.log((Math.hypot(view.width, view.height) * 1.6) / base) / Math.log(ratio);
        const smallest = Math.log((view.vmin * 0.2) / base) / Math.log(ratio);
        function polygon(radius, angle) {
          context.beginPath();
          for (let corner = 0; corner <= sides; corner += 1) {
            const theta = angle + (turn * corner) / sides - Math.PI / 2;
            const pointX = centerX + Math.cos(theta) * radius;
            const pointY = centerY + Math.sin(theta) * radius;
            if (corner === 0) context.moveTo(pointX, pointY);
            else context.lineTo(pointX, pointY);
          }
          context.closePath();
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const zoom = phase * layersPerLoop;
          const first = Math.ceil(largest + zoom);
          const last = Math.floor(smallest + zoom);
          context.lineJoin = "round";
          for (let layer = first; layer <= last; layer += 1) {
            const level = layer - zoom;
            const radius = base * Math.pow(ratio, level);
            const angle = level * twist;
            const depth = Math.min(Math.max((level - largest) / (smallest - largest), 0), 1);
            polygon(radius, angle);
            context.fillStyle = layer % 2 === 0 ? rgba(accent, 1) : rgba(background, 1);
            context.fill();
            context.strokeStyle = rgba(foreground, 0.35 * (1 - depth));
            context.lineWidth = Math.max(view.vmin * 0.05, radius * 0.006);
            context.stroke();
          }
          const shade = context.createRadialGradient(centerX, centerY, 0, centerX, centerY, view.vmin * 30);
          shade.addColorStop(0, rgba(background, 0.92));
          shade.addColorStop(0.35, rgba(background, 0.45));
          shade.addColorStop(1, rgba(background, 0));
          context.fillStyle = shade;
          context.fillRect(0, 0, view.width, view.height);
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("zoom-polygons", timeline);

      })();
    </script>
  </body>
</html>
