<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Foreground","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Accent","default":"#4fb6ec"},{"id":"sides","type":"number","label":"Polygon sides","default":6},{"id":"twist","type":"number","label":"Card tilt (degrees)","default":8}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #4fb6ec;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="zoom-polygons"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mix(from, to, amount) {
          return from.map((value, index) => Math.round(value + (to[index] - value) * amount));
        }
        const background = channels(vars.background);
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const panel = mix(background, accent, 0.12);
        const sides = Math.max(3, Math.round(Number(vars.sides) || 6));
        const tilt = ((Number(vars.twist) || 0) * Math.PI) / 180;
        const ease = hyperbits.Easing.easeInOutCubic;
        const cards = 12;
        const stepsPerLoop = 6;
        const focal = view.vmin * 90;
        function polygon(centerX, centerY, radius, angle) {
          context.beginPath();
          for (let corner = 0; corner <= sides; corner += 1) {
            const theta = angle + (turn * corner) / sides - Math.PI / 2;
            const pointX = centerX + Math.cos(theta) * radius;
            const pointY = centerY + Math.sin(theta) * radius;
            if (corner === 0) context.moveTo(pointX, pointY);
            else context.lineTo(pointX, pointY);
          }
          context.closePath();
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const beat = phase * stepsPerLoop;
          const whole = Math.floor(beat);
          const step = whole + ease(Math.min(Math.max((beat - whole) / 0.55, 0), 1));
          const order = [];
          for (let card = 0; card < cards; card += 1) {
            order.push({ card, slot: card - (step % cards) });
          }
          for (const entry of order) {
            if (entry.slot < -1) entry.slot += cards;
          }
          order.sort((left, right) => right.slot - left.slot);
          for (const { card, slot } of order) {
            const depth = 1.2 + slot * 0.9;
            if (depth <= 0.35) continue;
            const scale = focal / (focal + depth * view.vmin * 40);
            const centerX = view.width * (0.22 + slot * 0.085);
            const centerY = view.height * (0.62 - slot * 0.035);
            const radius = view.vmin * 30 * scale;
            const fade = Math.min(1, (slot + 1) * 1.2, (cards - 1 - slot) * 0.5);
            if (fade <= 0) continue;
            const spin = (turn / sides) * (card + step);
            polygon(centerX, centerY, radius, tilt);
            context.fillStyle = rgba(panel, 0.92 * fade);
            context.fill();
            context.strokeStyle = rgba(foreground, 0.85 * fade);
            context.lineWidth = Math.max(view.vmin * 0.1, radius * 0.02);
            context.stroke();
            polygon(centerX, centerY, radius * 0.55, spin);
            context.strokeStyle = rgba(card % 3 === 0 ? accent : foreground, (card % 3 === 0 ? 1 : 0.5) * fade);
            context.lineWidth = Math.max(view.vmin * 0.12, radius * (card % 3 === 0 ? 0.06 : 0.025));
            context.stroke();
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("zoom-polygons", timeline);

      })();
    </script>
  </body>
</html>
