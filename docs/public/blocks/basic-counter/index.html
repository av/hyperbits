<!doctype html>
<html lang="en" data-composition-variables='[{"id":"prefix","type":"string","label":"Prefix","default":"width: "},{"id":"postfix","type":"string","label":"Postfix","default":"px"},{"id":"color","type":"color","label":"Text color","default":"#fcc192"},{"id":"background","type":"color","label":"Background","default":"#100f0f"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 700;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: "Geist Sans", Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #counter {
        display: inline-flex;
        align-items: center;
        color: #fcc192;
        font-weight: 700;
        font-size: 5vw;
        white-space: pre;
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="basic-counter"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="4" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <div id="counter" class="clip" data-start="0" data-duration="4"><span id="prefix">width: </span><span id="value">0</span><span id="postfix">px</span></div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        bg.style.backgroundColor = vars.background;
        const counterEl = document.getElementById("counter");
        const valueEl = document.getElementById("value");
        document.getElementById("prefix").textContent = vars.prefix;
        document.getElementById("postfix").textContent = vars.postfix;
        counterEl.style.color = vars.color;
        counterEl.style.fontSize = view.vw * 5 + "px";
        counterEl.style.width = 300 * (view.width / 1920) + "px";
        const counter = hyperbits.createCounter(valueEl, { decimals: 0 });
        const proxy = { progress: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, {
          progress: 1,
          duration: 4,
          ease: "none",
          onUpdate: function () {
            counter.proxy.value = hyperbits.interpolateKeyframes([0, 10, 10, 50, 10], proxy.progress);
            counter.apply();
          },
        }, 0);
        registerTimeline("basic-counter", timeline);

      })();
    </script>
  </body>
</html>
