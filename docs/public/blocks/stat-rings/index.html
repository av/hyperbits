<!doctype html>
<html lang="en" data-composition-variables='[{"id":"title","type":"string","label":"Title","default":"Service health"},{"id":"color","type":"color","label":"Ring color","default":"#38bdf8"},{"id":"background","type":"color","label":"Background","default":"#0b1220"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #0b1220;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #0b1220;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #f8fafc;
      }
      #stage {
        width: 80%;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        z-index: 1;
      }
      #heading {
        font-weight: 700;
        font-size: 4vmin;
        margin-bottom: 6vmin;
        color: #f8fafc;
      }
      #row {
        display: flex;
        width: 100%;
        justify-content: space-around;
      }
      .stat {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .ring-wrap {
        position: relative;
      }
      .value {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .label {
        color: #94a3b8;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="stat-rings"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="4" style="position:absolute;inset:0;background-color:#0b1220"></div>
      <div id="stage" class="clip" data-start="0" data-duration="4">
        <h1 id="heading">Service health</h1>
        <div id="row"></div>
      </div>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const heading = document.getElementById("heading");
        const row = document.getElementById("row");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        heading.textContent = vars.title;
        heading.style.color = vars.color;
        heading.setAttribute("data-color", vars.color);
        heading.style.fontSize = view.vmin * 4 + "px";
        heading.style.marginBottom = view.vmin * 6 + "px";
        row.style.gap = view.vmin * 8 + "px";
        const stats = [
          { label: "Uptime", value: 99.9, decimals: 1 },
          { label: "Test coverage", value: 87, decimals: 0 },
          { label: "Cache hits", value: 64, decimals: 0 },
        ];
        const ringSize = view.vmin * 30;
        const strokeWidth = view.vmin * 2.4;
        const radius = (ringSize - strokeWidth) / 2;
        const circumference = 2 * Math.PI * radius;
        const rings = [];
        stats.forEach(function (stat) {
          const card = document.createElement("div");
          card.className = "stat";
          const wrap = document.createElement("div");
          wrap.className = "ring-wrap";
          wrap.style.width = ringSize + "px";
          wrap.style.height = ringSize + "px";
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("width", String(ringSize));
          svg.setAttribute("height", String(ringSize));
          svg.setAttribute("viewBox", "0 0 " + ringSize + " " + ringSize);
          function circle(color, dash) {
            const node = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            node.setAttribute("cx", String(ringSize / 2));
            node.setAttribute("cy", String(ringSize / 2));
            node.setAttribute("r", String(radius));
            node.setAttribute("fill", "none");
            node.setAttribute("stroke", color);
            node.setAttribute("stroke-width", String(strokeWidth));
            node.setAttribute("stroke-linecap", "round");
            node.setAttribute("transform", "rotate(-90 " + ringSize / 2 + " " + ringSize / 2 + ")");
            node.setAttribute("stroke-dasharray", String(circumference));
            node.setAttribute("stroke-dashoffset", String(dash));
            svg.append(node);
            return node;
          }
          circle("#1e293b", 0);
          const arc = circle(vars.color, circumference);
          const valueEl = document.createElement("div");
          valueEl.className = "value";
          valueEl.style.fontSize = view.vmin * 5 + "px";
          valueEl.style.color = vars.color;
          const counter = hyperbits.createCounter(valueEl, { decimals: stat.decimals, postfix: "%" });
          wrap.append(svg, valueEl);
          const label = document.createElement("div");
          label.className = "label";
          label.textContent = stat.label;
          label.style.fontSize = view.vmin * 2.4 + "px";
          label.style.marginTop = view.vmin * 2 + "px";
          card.append(wrap, label);
          row.append(card);
          rings.push({ arc: arc, counter: counter, value: stat.value });
        });
        const timeline = gsap.timeline({ paused: true });
        hyperbits.stagger(row.children, { opacity: [0, 1], scale: [0.6, 1], duration: 1, stagger: 12 / 30, delay: 5 / 30, ease: "spring" }, timeline);
        timeline.fromTo(heading, { opacity: 0, y: view.vmin * 2 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0);
        rings.forEach(function (item, index) {
          const delay = (20 + index * 12) / 30;
          const proxy = { progress: 0 };
          timeline.fromTo(
            proxy,
            { progress: 0 },
            {
              progress: item.value / 100,
              duration: 2,
              ease: "power2.out",
              onUpdate: function () {
                item.arc.setAttribute("stroke-dashoffset", String(circumference * (1 - proxy.progress)));
                item.counter.proxy.value = proxy.progress * 100;
                item.counter.apply();
              },
            },
            delay,
          );
        });
        registerTimeline("stat-rings", timeline);

      })();
    </script>
  </body>
</html>
