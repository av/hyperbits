<!doctype html>
<html lang="en" data-composition-variables='[{"id":"background","type":"color","label":"Background","default":"#f2f0e5"},{"id":"foreground","type":"color","label":"Foreground","default":"#100f0f"},{"id":"accent","type":"color","label":"Accent","default":"#9d8af0"},{"id":"sway","type":"number","label":"Sway (degrees)","default":4}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #f2f0e5;
        --fg: #100f0f;
        --accent: #9d8af0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #f2f0e5;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="floating-shapes"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="12" style="position:absolute;inset:0;background-color:#f2f0e5"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="12"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const loop = 12;
        const turn = Math.PI * 2;
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mix(from, to, amount) {
          return from.map((value, index) => Math.round(value + (to[index] - value) * amount));
        }
        const background = channels(vars.background);
        const foreground = channels(vars.foreground);
        const accent = channels(vars.accent);
        const tones = [mix(accent, background, 0.4), mix(accent, background, 0.65), mix(foreground, background, 0.75)];
        const sway = ((Number(vars.sway) || 4) * Math.PI) / 180;
        const unit = view.vmin;
        const kinds = ["circle", "triangle", "square", "ring", "diamond", "half"];
        const strands = [...Array(11).keys()].map((index) => {
          const key = "garland-" + index;
          const pieces = hyperbits.randomInt(key + "-n", 3, 6);
          return {
            anchorX: view.width * ((index + 0.5) / 11 + hyperbits.randomFloat(key + "-x", -0.015, 0.015)),
            rate: hyperbits.pick(key + "-r", [1, 1, 2]),
            shift: hyperbits.random(key + "-s"),
            pieces: [...Array(pieces).keys()].map((piece) => ({
              gap: unit * hyperbits.randomFloat(key + "-g" + piece, 10, 17),
              kind: hyperbits.pick(key + "-k" + piece, kinds),
              size: unit * hyperbits.randomFloat(key + "-z" + piece, 2.4, 4.4),
              tone: tones[(index + piece) % tones.length],
              spin: hyperbits.pick(key + "-t" + piece, [-1, 1]),
            })),
          };
        });
        function shape(kind, size) {
          context.beginPath();
          if (kind === "circle") context.arc(0, size, size, 0, turn);
          else if (kind === "ring") {
            context.arc(0, size, size, 0, turn);
            context.arc(0, size, size * 0.55, 0, turn, true);
          } else if (kind === "triangle") {
            context.moveTo(0, 0);
            context.lineTo(size, size * 1.7);
            context.lineTo(-size, size * 1.7);
          } else if (kind === "square") context.rect(-size * 0.85, 0, size * 1.7, size * 1.7);
          else if (kind === "half") context.arc(0, 0, size * 1.1, 0, Math.PI);
          else {
            context.moveTo(0, 0);
            context.lineTo(size * 0.8, size);
            context.lineTo(0, size * 2);
            context.lineTo(-size * 0.8, size);
          }
          context.closePath();
          context.fill("evenodd");
        }
        function draw(phase) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          for (const strand of strands) {
            const angle = sway * Math.sin(turn * (phase * strand.rate + strand.shift));
            context.save();
            context.translate(strand.anchorX, -unit);
            context.rotate(angle);
            let depth = 0;
            for (const piece of strand.pieces) {
              depth += piece.gap;
              context.strokeStyle = rgba(foreground, 0.18);
              context.lineWidth = unit * 0.12;
              context.beginPath();
              context.moveTo(0, depth - piece.gap);
              context.lineTo(0, depth);
              context.stroke();
              context.save();
              context.translate(0, depth);
              context.rotate(0.25 * Math.sin(turn * (phase * 2 * piece.spin + strand.shift + depth / view.height)));
              context.fillStyle = rgba(piece.tone, 1);
              shape(piece.kind, piece.size);
              context.restore();
              depth += piece.size * 2;
            }
            context.restore();
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: loop, duration: loop, ease: "none", onUpdate: () => draw((proxy.time % loop) / loop) }, 0);
        draw(0);
        registerTimeline("floating-shapes", timeline);

      })();
    </script>
  </body>
</html>
