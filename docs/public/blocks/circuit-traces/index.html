<!doctype html>
<html lang="en" data-composition-variables='[{"id":"chip","type":"string","label":"Chip label","default":"HB-09"},{"id":"seed","type":"number","label":"Seed","default":9},{"id":"background","type":"color","label":"Board","default":"#100f0f"},{"id":"foreground","type":"color","label":"Packets","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Copper","default":"#ec8b49"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Mono";
        font-weight: 500;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-500-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist Mono";
        font-weight: 700;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-700-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="./hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ec8b49;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="circuit-traces"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="10"></canvas>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + Math.round(rgb[0]) + ", " + Math.round(rgb[1]) + ", " + Math.round(rgb[2]) + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mixRgb(from, to, amount) {
          return [from[0] + (to[0] - from[0]) * amount, from[1] + (to[1] - from[1]) * amount, from[2] + (to[2] - from[2]) * amount];
        }
        function progressOf(time, start, length) {
          return Math.min(Math.max((time - start) / length, 0), 1);
        }

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        canvas.setAttribute("aria-label", String(vars.chip));
        const context = canvas.getContext("2d");
        const duration = 10;
        const seed = Math.round(Number(vars.seed) || 0);
        const back = channels(vars.background);
        const fore = channels(vars.foreground);
        const accent = channels(vars.accent);
        const chipSize = view.vmin * 20;
        const centerX = view.width / 2;
        const centerY = view.height / 2;
        const pinsPerSide = 9;
        const pitch = chipSize / (pinsPerSide + 1);
        const traces = [];
        const directions = [
          { outX: 0, outY: -1, alongX: 1, alongY: 0 },
          { outX: 1, outY: 0, alongX: 0, alongY: 1 },
          { outX: 0, outY: 1, alongX: -1, alongY: 0 },
          { outX: -1, outY: 0, alongX: 0, alongY: -1 },
        ];
        directions.forEach((direction, side) => {
          for (let pin = 0; pin < pinsPerSide; pin += 1) {
            const offset = (pin - (pinsPerSide - 1) / 2) * pitch;
            const key = "trace-" + seed + "-" + side + "-" + pin;
            const startX = centerX + direction.outX * (chipSize / 2 + view.vmin * 1.6) + direction.alongX * offset;
            const startY = centerY + direction.outY * (chipSize / 2 + view.vmin * 1.6) + direction.alongY * offset;
            const spread = 1.6 + hyperbits.randomFloat(key + "-s", 0, 0.5);
            const first = view.vmin * (3 + Math.abs(pin - (pinsPerSide - 1) / 2) * 0.2);
            const lateral = offset * spread;
            const points = [[startX, startY]];
            const bendX = startX + direction.outX * first;
            const bendY = startY + direction.outY * first;
            points.push([bendX, bendY]);
            const diagonalX = bendX + direction.outX * Math.abs(lateral) + direction.alongX * lateral;
            const diagonalY = bendY + direction.outY * Math.abs(lateral) + direction.alongY * lateral;
            points.push([diagonalX, diagonalY]);
            const runLength = view.vmin * hyperbits.randomFloat(key + "-r", 6, 16);
            const runX = diagonalX + direction.outX * runLength;
            const runY = diagonalY + direction.outY * runLength;
            points.push([runX, runY]);
            const turn = hyperbits.pick(key + "-t", [-1, 0, 1]);
            const jogLength = view.vmin * hyperbits.randomFloat(key + "-j", 3, 8);
            const jogX = runX + direction.outX * jogLength + direction.alongX * jogLength * turn * 0.9;
            const jogY = runY + direction.outY * jogLength + direction.alongY * jogLength * turn * 0.9;
            points.push([jogX, jogY]);
            const far = Math.max(view.width, view.height);
            points.push([jogX + direction.outX * far, jogY + direction.outY * far]);
            const lengths = [0];
            for (let index = 1; index < points.length; index += 1) lengths.push(lengths[index - 1] + Math.hypot(points[index][0] - points[index - 1][0], points[index][1] - points[index - 1][1]));
            traces.push({
              points,
              lengths,
              total: lengths[lengths.length - 1],
              delay: 0.4 + Math.abs(pin - (pinsPerSide - 1) / 2) * 0.06 + side * 0.08,
              via: hyperbits.random(key + "-v") < 0.45,
              packetOffset: hyperbits.random(key + "-p"),
              packetSpeed: hyperbits.randomFloat(key + "-ps", 0.35, 0.7),
              inbound: hyperbits.random(key + "-in") < 0.35,
            });
          }
        });
        function pointAlong(trace, distance) {
          const clamped = Math.max(0, Math.min(trace.total, distance));
          for (let index = 1; index < trace.lengths.length; index += 1) {
            if (trace.lengths[index] >= clamped) {
              const span = trace.lengths[index] - trace.lengths[index - 1] || 1;
              const amount = (clamped - trace.lengths[index - 1]) / span;
              return [trace.points[index - 1][0] + (trace.points[index][0] - trace.points[index - 1][0]) * amount, trace.points[index - 1][1] + (trace.points[index][1] - trace.points[index - 1][1]) * amount];
            }
          }
          return trace.points[trace.points.length - 1];
        }
        function pathTo(trace, distance) {
          context.beginPath();
          context.moveTo(trace.points[0][0], trace.points[0][1]);
          for (let index = 1; index < trace.points.length; index += 1) {
            if (trace.lengths[index] >= distance) {
              const point = pointAlong(trace, distance);
              context.lineTo(point[0], point[1]);
              return;
            }
            context.lineTo(trace.points[index][0], trace.points[index][1]);
          }
        }
        const visibleReach = Math.hypot(view.width, view.height) * 0.6;
        function draw(time) {
          if (!context || typeof context.stroke !== "function") return;
          context.clearRect(0, 0, view.width, view.height);
          const copper = mixRgb(back, accent, 0.42);
          context.lineCap = "round";
          context.lineJoin = "round";
          for (const trace of traces) {
            const grow = hyperbits.Easing.easeInOutCubic(Math.min(1, Math.max(0, (time - trace.delay) / 2.2)));
            if (grow <= 0) continue;
            pathTo(trace, grow * visibleReach);
            context.strokeStyle = rgba(copper, 1);
            context.lineWidth = view.vmin * 0.42;
            context.stroke();
            if (trace.via && grow * visibleReach > trace.lengths[3]) {
              const [viaX, viaY] = trace.points[3];
              context.fillStyle = rgba(copper, 1);
              context.beginPath();
              context.arc(viaX, viaY, view.vmin * 0.75, 0, Math.PI * 2);
              context.fill();
              context.fillStyle = rgba(back, 1);
              context.beginPath();
              context.arc(viaX, viaY, view.vmin * 0.32, 0, Math.PI * 2);
              context.fill();
            }
          }
          for (const trace of traces) {
            const active = time - trace.delay - 1.6;
            if (active <= 0) continue;
            const travel = ((active * trace.packetSpeed + trace.packetOffset) % 1.15) * visibleReach;
            const head = trace.inbound ? visibleReach - travel : travel;
            const tailLength = view.vmin * 9;
            const tail = trace.inbound ? head + tailLength : head - tailLength;
            const [headX, headY] = pointAlong(trace, head);
            const [tailX, tailY] = pointAlong(trace, tail);
            if (Math.hypot(headX - tailX, headY - tailY) < 1) continue;
            const gradient = context.createLinearGradient(tailX, tailY, headX, headY);
            gradient.addColorStop(0, rgba(accent, 0));
            gradient.addColorStop(1, rgba(mixRgb(accent, fore, 0.6), 1));
            context.strokeStyle = gradient;
            context.lineWidth = view.vmin * 0.5;
            context.beginPath();
            const from = Math.min(head, tail);
            const to = Math.max(head, tail);
            const steps = 8;
            for (let step = 0; step <= steps; step += 1) {
              const point = pointAlong(trace, from + ((to - from) * step) / steps);
              if (step === 0) context.moveTo(point[0], point[1]);
              else context.lineTo(point[0], point[1]);
            }
            context.stroke();
            context.fillStyle = rgba(fore, 1);
            context.beginPath();
            context.arc(headX, headY, view.vmin * 0.38, 0, Math.PI * 2);
            context.fill();
          }
          const appear = hyperbits.Easing.easeOutCubic(progressOf(time, 0, 0.6));
          const pulse = 0.55 + 0.45 * Math.sin(time * 2.4);
          const glow = context.createRadialGradient(centerX, centerY, chipSize * 0.2, centerX, centerY, chipSize * 1.4);
          glow.addColorStop(0, rgba(accent, 0.22 * pulse * appear));
          glow.addColorStop(1, rgba(accent, 0));
          context.fillStyle = glow;
          context.fillRect(0, 0, view.width, view.height);
          for (const direction of directions) {
            for (let pin = 0; pin < pinsPerSide; pin += 1) {
              const offset = (pin - (pinsPerSide - 1) / 2) * pitch;
              const pinX = centerX + direction.outX * (chipSize / 2 + view.vmin * 0.8) + direction.alongX * offset;
              const pinY = centerY + direction.outY * (chipSize / 2 + view.vmin * 0.8) + direction.alongY * offset;
              const pinLong = view.vmin * 1.8;
              const pinShort = pitch * 0.4;
              context.fillStyle = rgba(mixRgb(back, fore, 0.55), appear);
              context.fillRect(pinX - (direction.outX ? pinLong : pinShort) / 2, pinY - (direction.outY ? pinLong : pinShort) / 2, direction.outX ? pinLong : pinShort, direction.outY ? pinLong : pinShort);
            }
          }
          const size = chipSize * (0.9 + 0.1 * appear);
          context.fillStyle = rgba(mixRgb(back, fore, 0.08), appear);
          context.beginPath();
          context.roundRect(centerX - size / 2, centerY - size / 2, size, size, view.vmin * 0.8);
          context.fill();
          context.strokeStyle = rgba(mixRgb(back, fore, 0.2), appear);
          context.lineWidth = view.vmin * 0.15;
          context.stroke();
          context.fillStyle = rgba(mixRgb(back, fore, 0.3), appear);
          context.beginPath();
          context.arc(centerX - size * 0.36, centerY - size * 0.36, view.vmin * 0.6, 0, Math.PI * 2);
          context.fill();
          context.textAlign = "center";
          context.textBaseline = "middle";
          context.fillStyle = rgba(fore, appear);
          context.font = "700 " + view.vmin * 3.4 + "px 'Geist Mono', ui-monospace, monospace";
          context.fillText(String(vars.chip), centerX, centerY - view.vmin * 1.2);
          context.fillStyle = rgba(accent, appear * (0.6 + 0.4 * pulse));
          context.font = "500 " + view.vmin * 1.5 + "px 'Geist Mono', ui-monospace, monospace";
          context.fillText("2026 / 7NM", centerX, centerY + view.vmin * 2.6);
          context.textAlign = "left";
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: duration, duration: duration, ease: "none", onUpdate: () => draw(proxy.time) }, 0);
        draw(0);
        registerTimeline("circuit-traces", timeline);
      })();
    </script>
  </body>
</html>
