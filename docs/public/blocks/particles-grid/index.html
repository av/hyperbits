<!doctype html>
<html lang="en" data-composition-variables='[{"id":"color","type":"color","label":"Cell color","default":"#ffffff"},{"id":"background","type":"color","label":"Background","default":"#100f0f"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #fcc192;
        --primary: #ec8b49;
        --surface-dark: #1c1b1a;
        --surface-light: #343331;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="particles-grid"
      data-start="0"
      data-duration="6.667"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="6.667" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="6.667" style="position:absolute;inset:0;width:100%;height:100%;z-index:1"></canvas>
    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const view = hyperbits.viewport(root);
        const vmin = view.vmin;
        const vmax = view.vmax;
        bg.style.backgroundColor = vars.background;
        const canvas = document.getElementById("stage");
        canvas.setAttribute("data-color", vars.color);
        canvas.width = view.width;
        canvas.height = view.height;
        const gridSize = Math.floor(view.width * 0.05);
        const jumpInterval = 30;
        const snapToGrid = function (particle, age) {
          particle.position.x = Math.floor(particle.position.x / gridSize) * gridSize;
          particle.position.y = Math.floor(particle.position.y / gridSize) * gridSize;
          if (age % jumpInterval === 0 && age > 0) {
            const step = Math.floor(age / jumpInterval);
            const dir = (particle.seed + step) % 4;
            if (dir === 0) particle.position.x += gridSize;
            if (dir === 1) particle.position.x -= gridSize;
            if (dir === 2) particle.position.y += gridSize;
            if (dir === 3) particle.position.y -= gridSize;
          }
        };
        const fadeIn = function (particle, age) {
          particle.opacity = Math.min(1, Math.max(0, age / 10));
        };
        const shapes = ["square", "circle", "diamond"];
        const alphas = [(0x22 / 255) * 0.8, (0x5f / 255) * 0.8, (0x5f / 255) * 0.8];
        const simulator = hyperbits.createParticles({
          fps: 30,
          spawners: [{
            id: "spawner-0",
            rate: 1,
            max: 50,
            position: { x: view.width / 2, y: view.height / 2 },
            area: { width: view.width * 0.52, height: view.height * 0.74 },
            lifespan: 150,
          }],
          behaviors: [
            { id: "snap", handler: snapToGrid },
            { id: "fade", handler: fadeIn },
          ],
        });
        const red = parseInt(vars.color.slice(1, 3), 16);
        const green = parseInt(vars.color.slice(3, 5), 16);
        const blue = parseInt(vars.color.slice(5, 7), 16);
        const timeline = gsap.timeline({ paused: true });
        hyperbits.bind(timeline, canvas, simulator, {
          size: gridSize,
          shape: function (particle) { return shapes[Math.floor(particle.seed * shapes.length)]; },
          color: function (particle) {
            const alpha = alphas[Math.floor(particle.seed * shapes.length)];
            return "rgba(" + red + ", " + green + ", " + blue + ", " + alpha + ")";
          },
          offset: { x: gridSize / 2, y: gridSize / 2 },
        });
        timeline.to({}, { duration: 6.667 }, 0);
        registerTimeline("particles-grid", timeline);

      })();
    </script>
  </body>
</html>
