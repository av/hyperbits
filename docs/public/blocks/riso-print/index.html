<!doctype html>
<html lang="en" data-composition-variables='[{"id":"headline","type":"string","label":"Headline","default":"Make it move"},{"id":"caption","type":"string","label":"Caption","default":"TWO INK RISO / ISSUE 09 / 2026"},{"id":"background","type":"color","label":"Paper","default":"#f2f0e5"},{"id":"foreground","type":"color","label":"Black ink","default":"#100f0f"},{"id":"accent","type":"color","label":"Spot ink","default":"#ec8b49"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        font-weight: 900;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5/files/geist-sans-latin-900-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: "Geist Mono";
        font-weight: 500;
        font-display: block;
        src: url(https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/files/geist-mono-latin-500-normal.woff2) format("woff2");
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="./hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --paper: #f2f0e5;
        --ink: #100f0f;
        --accent: #ec8b49;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #f2f0e5;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="riso-print"
      data-start="0"
      data-duration="7"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="7" style="position:absolute;inset:0;background-color:#f2f0e5"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="7"></canvas>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function rgba(rgb, alpha) {
          return "rgba(" + Math.round(rgb[0]) + ", " + Math.round(rgb[1]) + ", " + Math.round(rgb[2]) + ", " + Math.min(Math.max(alpha, 0), 1) + ")";
        }
        function mixRgb(from, to, amount) {
          return [from[0] + (to[0] - from[0]) * amount, from[1] + (to[1] - from[1]) * amount, from[2] + (to[2] - from[2]) * amount];
        }
        function progressOf(time, start, length) {
          return Math.min(Math.max((time - start) / length, 0), 1);
        }

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        canvas.setAttribute("aria-label", String(vars.headline) + " " + String(vars.caption));
        const context = canvas.getContext("2d");
        const duration = 7;
        const paper = channels(vars.background);
        const ink = channels(vars.foreground);
        const accent = channels(vars.accent);
        const headline = String(vars.headline);
        let grainA = null;
        let grainB = null;
        let paperTexture = null;
        function hash(first, second) {
          let value = Math.imul(first ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(second + 0x632be5ab, 0xc2b2ae35);
          value ^= value >>> 15;
          value = Math.imul(value, 0x27d4eb2f);
          value ^= value >>> 13;
          return (value >>> 0) / 4294967296;
        }
        function makeGrain(salt, density) {
          const scale = 2;
          const grain = document.createElement("canvas");
          grain.width = Math.ceil(view.width / scale);
          grain.height = Math.ceil(view.height / scale);
          const grainContext = grain.getContext("2d");
          const image = grainContext.createImageData(grain.width, grain.height);
          for (let index = 0; index < grain.width * grain.height; index += 1) {
            const column = index % grain.width;
            const row = Math.floor(index / grain.width);
            const clump = 0.5 * hash(Math.floor(column / 6) * 7919 + Math.floor(row / 6), salt + 3) + 0.5 * hash(column * 31 + row * 17, salt);
            image.data[index * 4 + 3] = clump < density ? 255 : Math.round(255 * Math.max(0, 1 - (clump - density) * 9));
          }
          grainContext.putImageData(image, 0, 0);
          return grain;
        }
        function makePaper() {
          const texture = document.createElement("canvas");
          texture.width = Math.ceil(view.width / 2);
          texture.height = Math.ceil(view.height / 2);
          const textureContext = texture.getContext("2d");
          const image = textureContext.createImageData(texture.width, texture.height);
          for (let index = 0; index < texture.width * texture.height; index += 1) {
            const column = index % texture.width;
            const row = Math.floor(index / texture.width);
            const fiber = hash(Math.floor(column / 3) + row * 131, 77) * 0.6 + hash(column * 13 + row * 7, 78) * 0.4;
            image.data[index * 4] = ink[0];
            image.data[index * 4 + 1] = ink[1];
            image.data[index * 4 + 2] = ink[2];
            image.data[index * 4 + 3] = Math.round(fiber * 14);
          }
          textureContext.putImageData(image, 0, 0);
          return texture;
        }
        function fitFont(text, maxWidth, size, weight) {
          context.font = weight + " " + size + "px 'Geist Sans', ui-sans-serif, system-ui, sans-serif";
          const width = context.measureText(text).width;
          return width > maxWidth ? (size * maxWidth) / width : size;
        }
        function bakeInk(color, grain, painter) {
          const baked = document.createElement("canvas");
          baked.width = view.width;
          baked.height = view.height;
          const bakedContext = baked.getContext("2d");
          bakedContext.fillStyle = rgba(color, 1);
          painter(bakedContext);
          bakedContext.globalCompositeOperation = "destination-in";
          bakedContext.drawImage(grain, 0, 0, view.width, view.height);
          return baked;
        }
        function printInk(baked, options) {
          context.save();
          if (options.clipWidth !== undefined) {
            context.beginPath();
            context.rect(0, 0, options.clipWidth, view.height);
            context.clip();
          }
          const pivotX = options.pivotX ?? view.width / 2;
          const pivotY = options.pivotY ?? view.height / 2;
          context.translate(pivotX + (options.offsetX || 0), pivotY + (options.offsetY || 0));
          context.rotate(options.rotation || 0);
          context.scale(options.scale || 1, options.scale || 1);
          context.translate(-pivotX, -pivotY);
          context.globalCompositeOperation = "multiply";
          context.globalAlpha = options.alpha;
          context.drawImage(baked, 0, 0);
          context.restore();
        }
        const sunX = view.width * 0.68;
        const sunY = view.height * 0.44;
        const sunRadius = view.vmin * 30;
        const left = view.vmin * 8;
        const words = headline.split(/\s+/);
        const lines = words.length > 2 ? [words.slice(0, Math.ceil(words.length / 2)).join(" "), words.slice(Math.ceil(words.length / 2)).join(" ")] : words;
        let inks = null;
        let inksReady = false;
        function bakeAll() {
          const size = Math.min(...lines.map((line) => fitFont(line, view.width * 0.84, view.vmin * 21, 900)));
          const font = "900 " + size + "px 'Geist Sans', ui-sans-serif, system-ui, sans-serif";
          const captionFont = "500 " + view.vmin * 2.2 + "px 'Geist Mono', ui-monospace, monospace";
          const baseline = view.height * 0.5 + size * 0.2;
          function headlinePainter(target) {
            target.font = font;
            target.textBaseline = "alphabetic";
            lines.forEach((line, index) => target.fillText(line, left, baseline + index * size * 0.9 - (lines.length - 1) * size * 0.25));
          }
          inksReady = !document.fonts || (document.fonts.check(font) && document.fonts.check(captionFont));
          return {
            sun: bakeInk(accent, grainA, (target) => {
              const pitch = view.vmin * 1.5;
              for (let gridY = sunY - sunRadius; gridY < sunY + sunRadius; gridY += pitch) {
                for (let gridX = sunX - sunRadius; gridX < sunX + sunRadius; gridX += pitch) {
                  if (Math.hypot(gridX - sunX, gridY - sunY) > sunRadius) continue;
                  const tone = 0.25 + 0.75 * (1 - (gridY - (sunY - sunRadius)) / (sunRadius * 2));
                  target.beginPath();
                  target.arc(gridX + ((Math.round(gridY / pitch) % 2) * pitch) / 2, gridY, pitch * 0.62 * Math.sqrt(Math.max(0.05, tone)), 0, Math.PI * 2);
                  target.fill();
                }
              }
            }),
            spot: bakeInk(accent, grainA, headlinePainter),
            black: bakeInk(ink, grainB, headlinePainter),
            caption: bakeInk(ink, grainB, (target) => {
              target.font = captionFont;
              target.fillText(String(vars.caption), left, view.height - view.vmin * 9);
              target.fillRect(left, view.height - view.vmin * 14, view.width * 0.3, view.vmin * 0.5);
            }),
          };
        }
        function draw(time) {
          if (!context || typeof context.stroke !== "function") return;
          if (!grainA) {
            grainA = makeGrain(11, 0.78);
            grainB = makeGrain(29, 0.84);
            paperTexture = makePaper();
          }
          if (!inks || !inksReady) inks = bakeAll();
          context.clearRect(0, 0, view.width, view.height);
          context.fillStyle = rgba(paper, 1);
          context.fillRect(0, 0, view.width, view.height);
          context.drawImage(paperTexture, 0, 0, view.width, view.height);
          const stamp = progressOf(time, 0.25, 0.35);
          if (stamp > 0) printInk(inks.sun, { pivotX: sunX, pivotY: sunY, scale: 1 + (1 - hyperbits.Easing.easeOutCubic(stamp)) * 0.08, alpha: stamp });
          const slideA = hyperbits.Easing.easeOutCubic(progressOf(time, 0.8, 1.3));
          const slideB = hyperbits.Easing.easeOutCubic(progressOf(time, 1.25, 1.3));
          const settle = view.vmin * 0.45;
          if (slideA > 0) printInk(inks.spot, { offsetX: -view.vmin * 22 * (1 - slideA) - settle, offsetY: view.vmin * 4 * (1 - slideA) + settle * 0.6, rotation: -0.03 * (1 - slideA), alpha: Math.min(1, slideA * 3) });
          if (slideB > 0) printInk(inks.black, { offsetX: view.vmin * 22 * (1 - slideB) + settle, offsetY: -view.vmin * 3 * (1 - slideB), rotation: 0.025 * (1 - slideB), alpha: Math.min(1, slideB * 3) * 0.92 });
          const captionIn = progressOf(time, 2.4, 0.5);
          if (captionIn > 0) printInk(inks.caption, { clipWidth: left + (view.width * 0.5 - left) * captionIn, alpha: 1 });
          const marks = progressOf(time, 2.8, 0.8);
          if (marks > 0) {
            const markRadius = view.vmin * 1.6;
            const inset = view.vmin * 3.5;
            for (const [markX, markY] of [[inset, inset], [view.width - inset, inset], [inset, view.height - inset], [view.width - inset, view.height - inset]]) {
              for (const [color, shift] of [[accent, view.vmin * 0.3], [ink, 0]]) {
                context.strokeStyle = rgba(color, 0.85);
                context.lineWidth = Math.max(1, view.vmin * 0.14);
                context.beginPath();
                context.arc(markX + shift, markY - shift * 0.5, markRadius * marks, 0, Math.PI * 2);
                context.moveTo(markX + shift - markRadius * 1.6 * marks, markY - shift * 0.5);
                context.lineTo(markX + shift + markRadius * 1.6 * marks, markY - shift * 0.5);
                context.moveTo(markX + shift, markY - shift * 0.5 - markRadius * 1.6 * marks);
                context.lineTo(markX + shift, markY - shift * 0.5 + markRadius * 1.6 * marks);
                context.stroke();
              }
            }
            const swatch = view.vmin * 2.2;
            [accent, ink, mixRgb(accent, ink, 0.55)].forEach((color, index) => {
              context.fillStyle = rgba(color, marks);
              context.fillRect(view.width - view.vmin * 9 - index * swatch * 1.3, view.height - view.vmin * 10.6, swatch, swatch);
            });
          }
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: duration, duration: duration, ease: "none", onUpdate: () => draw(proxy.time) }, 0);
        if (document.fonts && document.fonts.load) {
          Promise.all([document.fonts.load("900 64px 'Geist Sans'"), document.fonts.load("500 16px 'Geist Mono'")]).then(() => {
            inks = null;
            draw(proxy.time);
          });
        }
        draw(0);
        registerTimeline("riso-print", timeline);
      })();
    </script>
  </body>
</html>
