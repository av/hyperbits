<!doctype html>
<html lang="en" data-composition-variables='[{"id":"blobs","type":"number","label":"Blobs","default":7},{"id":"seed","type":"number","label":"Seed","default":2},{"id":"background","type":"color","label":"Background","default":"#100f0f"},{"id":"foreground","type":"color","label":"Hot ink","default":"#f2f0e5"},{"id":"accent","type":"color","label":"Lava ink","default":"#ec8b49"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="./hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #100f0f;
        --fg: #f2f0e5;
        --accent: #ec8b49;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #100f0f;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="lava-dither"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="10" style="position:absolute;inset:0;background-color:#100f0f"></div>
      <canvas id="stage" class="clip" data-start="0" data-duration="10"></canvas>
    </div>
    <script>
      (function () {
        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }
        function channels(color) {
          const parts = hyperbits.mixOklch(String(color), String(color), 0, "rgb(0, 0, 0)").match(/[0-9.]+/g) || [0, 0, 0];
          return parts.slice(0, 3).map(Number);
        }
        function smoothstep(edge0, edge1, value) {
          const amount = Math.min(Math.max((value - edge0) / (edge1 - edge0), 0), 1);
          return amount * amount * (3 - 2 * amount);
        }

        const vars = bitVars();
        const root = document.getElementById("root");
        const bg = document.getElementById("bg");
        const canvas = document.getElementById("stage");
        const view = hyperbits.viewport(root);
        bg.style.backgroundColor = vars.background;
        canvas.width = view.width;
        canvas.height = view.height;
        const context = canvas.getContext("2d");
        const duration = 10;
        const seed = Math.round(Number(vars.seed) || 0);
        const back = channels(vars.background);
        const fore = channels(vars.foreground);
        const accent = channels(vars.accent);
        const pixel = Math.max(2, Math.round(view.vmin * 0.5));
        const bufferWidth = Math.ceil(view.width / pixel);
        const bufferHeight = Math.ceil(view.height / pixel);
        const count = Math.max(2, Math.min(14, Math.round(Number(vars.blobs) || 7)));
        const blobs = [];
        for (let index = 0; index < count; index += 1) {
          const key = "lava-" + seed + "-" + index;
          blobs.push({
            homeX: hyperbits.randomFloat(key + "-x", 0.15, 0.85),
            homeY: hyperbits.randomFloat(key + "-y", 0.2, 0.8),
            swingX: hyperbits.randomFloat(key + "-sx", 0.06, 0.2),
            swingY: hyperbits.randomFloat(key + "-sy", 0.12, 0.3),
            speedX: hyperbits.randomFloat(key + "-vx", 0.2, 0.5),
            speedY: hyperbits.randomFloat(key + "-vy", 0.25, 0.6),
            phase: hyperbits.randomFloat(key + "-p", 0, Math.PI * 2),
            radius: hyperbits.randomFloat(key + "-r", 0.09, 0.17),
          });
        }
        let offscreen = null;
        let offscreenContext = null;
        let image = null;
        let words = null;
        let field = null;
        const palette = new Uint32Array(3);
        function pack(rgb) {
          return (255 << 24) | (Math.round(rgb[2]) << 16) | (Math.round(rgb[1]) << 8) | Math.round(rgb[0]);
        }
        function draw(time) {
          if (!context || typeof context.stroke !== "function") return;
          if (!offscreen) {
            offscreen = document.createElement("canvas");
            offscreen.width = bufferWidth;
            offscreen.height = bufferHeight;
            offscreenContext = offscreen.getContext("2d");
            image = offscreenContext.createImageData(bufferWidth, bufferHeight);
            words = new Uint32Array(image.data.buffer);
            field = new Float32Array(bufferWidth * bufferHeight);
            palette[0] = pack(back);
            palette[1] = pack(accent);
            palette[2] = pack(fore);
          }
          const intro = smoothstep(0, 1.2, time);
          const centers = blobs.map((blob) => ({
            x: (blob.homeX + Math.sin(time * blob.speedX + blob.phase) * blob.swingX) * bufferWidth,
            y: (blob.homeY + Math.sin(time * blob.speedY + blob.phase * 1.7) * blob.swingY) * bufferHeight,
            radius: blob.radius * Math.sqrt(bufferWidth * bufferHeight) * 0.75 * (0.4 + 0.6 * intro),
          }));
          for (let row = 0; row < bufferHeight; row += 1) {
            const heat = Math.max(0, row / bufferHeight - 0.45) * 0.26;
            for (let column = 0; column < bufferWidth; column += 1) {
              let sum = 0;
              for (const center of centers) {
                const dx = column - center.x;
                const dy = row - center.y;
                sum += (center.radius * center.radius) / (dx * dx + dy * dy + 1);
              }
              const edge = smoothstep(0.55, 1.35, sum);
              const core = smoothstep(1.8, 4.2, sum);
              field[row * bufferWidth + column] = Math.min(1, edge * 0.5 + core * 0.5 + heat * intro + sum * 0.03);
            }
          }
          for (let row = 0; row < bufferHeight; row += 1) {
            const reverse = row % 2 === 1;
            for (let step = 0; step < bufferWidth; step += 1) {
              const column = reverse ? bufferWidth - 1 - step : step;
              const index = row * bufferWidth + column;
              const value = field[index];
              const level = value < 0.25 ? 0 : value < 0.75 ? 1 : 2;
              const error = value - level * 0.5;
              words[index] = palette[level];
              const forward = reverse ? -1 : 1;
              if (column + forward >= 0 && column + forward < bufferWidth) field[index + forward] += (error * 7) / 16;
              if (row + 1 < bufferHeight) {
                if (column - forward >= 0 && column - forward < bufferWidth) field[index + bufferWidth - forward] += (error * 3) / 16;
                field[index + bufferWidth] += (error * 5) / 16;
                if (column + forward >= 0 && column + forward < bufferWidth) field[index + bufferWidth + forward] += error / 16;
              }
            }
          }
          offscreenContext.putImageData(image, 0, 0);
          context.clearRect(0, 0, view.width, view.height);
          context.imageSmoothingEnabled = false;
          context.drawImage(offscreen, 0, 0, bufferWidth * pixel, bufferHeight * pixel);
        }
        const proxy = { time: 0 };
        const timeline = gsap.timeline({ paused: true });
        timeline.to(proxy, { time: duration, duration: duration, ease: "none", onUpdate: () => draw(proxy.time) }, 0);
        draw(0);
        registerTimeline("lava-dither", timeline);
      })();
    </script>
  </body>
</html>
