<!doctype html>
<html lang="en" data-composition-variables='[]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-src="https://unpkg.com/hyperbits/dist/hyperbits.iife.js" data-hyperbits-local="../../../dist/hyperbits.iife.js"></script>
    <style>
      :root {
        --bg: #020617;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #f59e0b;
        --danger: #f43f5e;
        --ok: #34d399;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #020617;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #020617;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #root { background-color: #020617; }
      .face {
        width: 320px; height: 320px; display: flex; align-items: center; justify-content: center;
        color: #f8fafc; font-weight: 800; border: 2px solid rgba(248,250,252,0.2);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="clip"
      data-composition-id="cube-navigation"
      data-start="0"
      data-duration="16"
      data-width="1920"
      data-height="1080"
    >

    </div>
    <script>
      (function () {

        function bitVars() {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            return window.__hyperframes.getVariables();
          }
          const raw = document.documentElement.getAttribute("data-composition-variables") || "[]";
          const decls = JSON.parse(raw);
          const values = {};
          for (const entry of decls) values[entry.id] = entry.default;
          return values;
        }
        function registerTimeline(compositionId, timeline) {
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = timeline;
          timeline.seek(0);
        }


        const view = hyperbits.viewport();
        const root = document.getElementById("root");
        const size = view.vmin * 28;
        const half = size / 2;
        const faces = [
          { name: "Front", color: "#1d4ed8", x: 0, y: 0, z: half, rotateY: 0 },
          { name: "Right", color: "#0f766e", x: half, y: 0, z: 0, rotateY: 90 },
          { name: "Back", color: "#9a3412", x: 0, y: 0, z: -half, rotateY: 180 },
          { name: "Left", color: "#6d28d9", x: -half, y: 0, z: 0, rotateY: -90 },
          { name: "Top", color: "#be123c", x: 0, y: -half, z: 0, rotateX: 90 },
          { name: "Bottom", color: "#0369a1", x: 0, y: half, z: 0, rotateX: -90 },
        ];
        const elements = faces.map(function (face) {
          const node = document.createElement("div");
          node.className = "face";
          node.setAttribute("data-layout-allow-overlap", "");
          node.setAttribute("data-layout-allow-occlusion", "");
          node.textContent = face.name;
          node.style.width = size + "px";
          node.style.height = size + "px";
          node.style.backgroundColor = face.color;
          node.style.fontSize = view.vmin * 4 + "px";
          return { element: node, x: face.x, y: face.y, z: face.z, rotateX: face.rotateX || 0, rotateY: face.rotateY || 0 };
        });
        const scene = hyperbits.createScene3D(root, {
          perspective: 1600,
          transitionDuration: 0.9,
          stepDuration: 16 / 6,
          steps: [
            { id: "front", rotateY: 0, z: view.vmin * 10 },
            { id: "right", rotateY: -90, z: view.vmin * 10 },
            { id: "back", rotateY: -180, z: view.vmin * 10 },
            { id: "left", rotateY: -270, z: view.vmin * 10 },
            { id: "top", rotateX: -90, z: view.vmin * 10 },
            { id: "bottom", rotateX: 90, z: view.vmin * 10 },
          ],
          elements: elements,
        });
        const timeline = gsap.timeline({ paused: true });
        scene.bind(timeline);
        timeline.to({}, { duration: 16 }, 0);
        registerTimeline("cube-navigation", timeline);

      })();
    </script>
  </body>
</html>
